: voce superiore suonata, resto dell'accordo muto; poi il contrario."}, "2": {"rep2": "PESO a p: ogni accordo dal tasto con un piccolo impulso e rilascio; il portato è una caduta corta, non uno staccato.", "rep3": "Sinistra sola, CIECO sui salti; poi insieme, destra pp."}}, "rep4_verifica": "Tutte le note di ogni accordo scendono insieme a p; portato uguale sulle crome; la destra non copre la sinistra pur stando nel suo registro.", "note": "Ricordi p. 1, sistema 1 batt. 1 – sistema 1 batt. 4.\nA matita leggo «1» sopra la destra di b. 3: diteggiatura, alta sicurezza."}, {"id": "nabucco-sinfonia-5-8", "brano": "nabucco", "battute": "5-8", "titolo": "Sinfonia · Corale: accento di b. 6 e cambio di chiave verso l'ff", "priorita": 7, "famiglia": "nabucco-fam-corale", "nodo_motorio": "Come 1-4 (b. 5 come b. 1). A b. 6 accordo accentato della destra con la sinistra al grave accentato, poi crome legate; b. 8 minima e pausa, con la destra che passa in chiave di violino per l'ff di b. 9.", "andate": {"1": {"rep2": "BLOC CIECO sulle forme di 5-7.", "rep3": "PESO sull'accento di b. 6: impulso e rilascio subito, le crome legate dopo pp."}, "2": {"rep2": "DIN dentro la mano: voce superiore suonata, resto pp.", "rep3": "CHUNK a ritroso: b. 8 più l'accordo ff di b. 9; durante la pausa la mano è già sulla posizione in chiave di violino."}}, "rep4_verifica": "L'accento di b. 6 non indurisce il suono che segue; l'ff di b. 9 arriva pronto, senza ritardo dopo la pausa.", "note": "Ricordi p. 1, sistema 1 batt. 5 – sistema 2 batt. 1.\nA matita leggo «3» e «1» sopra la destra di b. 6: diteggiature, alta sicurezza."}, {"id": "nabucco-sinfonia-9-13", "brano": "nabucco", "battute": "9-13", "titolo": "Sinfonia · ff: accordi e volate parallele a due mani, corona", "priorita": 6, "famiglia": "nabucco-fam-volate", "nodo_motorio": "Accordi pieni ff in entrambe le mani (9, 11); da un accordo parte una volata ascendente rapida a due mani in parallelo, poi una discesa in semicrome (10, 12); b. 13 discesa a due mani verso la corona. Il passaggio accordo → volata è un cambio di motore: braccio per l'accordo, dita per la volata.", "andate": {"1": {"rep2": "BLOC: la volata divisa in posizioni di mano, ogni posizione come accordo a mani unite; poi CIECO.", "rep3": "RIT sulla volata: fermata sulla prima nota dopo l'accordo, il resto di scatto fino all'arrivo."}, "2": {"rep2": "NODO dove le due mani passano il pollice in punti diversi.", "rep3": "CHUNK: accordo più volata fino alla prima nota della discesa, stop; poi discesa più corona."}}, "rep4_verifica": "Accordi ff dal tasto, senza durezza; volata uguale e insieme nelle due mani, senza accelerare in cima; corona a mano rilasciata.", "note": "Ricordi p. 1, sistema 2 batt. 2 – sistema 2 batt. 6.\nLe volate di 10 e 12 sono stampate piccole e fitte: descrivo la figura, non ogni nota."}, {"id": "nabucco-sinfonia-14-16", "brano": "nabucco", "battute": "14-16", "titolo": "Sinfonia · Corale p, ripresa", "priorita": 7, "famiglia": "nabucco-fam-corale", "nodo_motorio": "Come 1-3 (14 come 5, 15 con l'accento di 6, 16 come 7), poi l'aggancio al p di b. 17.", "andate": {"1": {"rep2": "BLOC CIECO sulle forme.", "rep3": "DIN dentro la mano: voce superiore suonata, resto muto; poi il contrario."}, "2": {"rep2": "PESO a p, rilascio a fondo tasto.", "rep3": "CHUNK a ritroso: b. 16 più il primo quarto di b. 17 (cambio di chiave della destra)."}}, "rep4_verifica": "Come 1-4; dal corale al tremolo di b. 17 senza buco.", "note": "Ricordi p. 1, sistema 3 batt. 1 – sistema 3 batt. 3."}, {"id": "nabucco-sinfonia-17-20", "brano": "nabucco", "battute": "17-20", "titolo": "Sinfonia · Tremolo d'ottava della destra p, linea cromatica della sinistra", "priorita": 6, "famiglia": "nabucco-fam-tremolo-ottava", "nodo_motorio": "Destra: ottava La ripetuta in valori rapidi (la leggo come tremolo misurato tra le due note), p e poi crescendo poco a poco. Sinistra: linea legata cromatica in semiminime e crome. Il rischio è irrigidire la destra per tenere il p e legare male la sinistra mentre la destra lavora.", "andate": {"1": {"rep2": "ROT sulla destra: due battute di sola rotazione, due di sole dita, poi la miscela minima.", "rep3": "Sinistra sola legata senza pedale; poi insieme, destra pp."}, "2": {"rep2": "ACC sulla destra: accento ogni 3 note, poi ogni 4, il resto pp.", "rep3": "DIN: sinistra mp, destra pp. Il crescendo solo in Rep 4."}}, "rep4_verifica": "Tremolo uniforme senza ronzio; il crescendo viene dall'ampiezza della rotazione, non dalla pressione; la linea della sinistra legata sopra il fondo.", "note": "Ricordi p. 1, sistema 3 batt. 4 – sistema 4 batt. 1.\nIl segno di tremolo è piccolo nella scansione. Se a 17-24 la destra ha crome ribattute e non un tremolo, sostituisci ROT con STAC pp."}, {"id": "nabucco-sinfonia-21-24", "brano": "nabucco", "battute": "21-24", "titolo": "Sinfonia · Tremolo della destra, crome della sinistra mf, dim.", "priorita": 6, "famiglia": "nabucco-fam-tremolo-ottava", "nodo_motorio": "Come 17-20; la sinistra passa a crome legate con alterazioni fitte e sale al mf (b. 23), poi dim. (b. 24) prima della pausa dell'Allegro.", "andate": {"1": {"rep2": "ROT sulla destra, come 17-20.", "rep3": "Sinistra sola: le crome di 23-24 con la diteggiatura che userai, STAC pp, poi legate."}, "2": {"rep2": "ACC sulla destra: accento ogni 3 note, il resto pp.", "rep3": "CLIC: un clic per battuta."}}, "rep4_verifica": "Il mf della sinistra non trascina la destra; dim. di b. 24 netto; tremolo regolare fino all'ultima nota.", "note": "Ricordi p. 1, sistema 4 batt. 2 – sistema 4 batt. 5."}, {"id": "nabucco-sinfonia-25-30", "brano": "nabucco", "battute": "25-30", "titolo": "Sinfonia · Allegro, p assai staccato e sotto voce", "priorita": 7, "famiglia": "nabucco-fam-staccato-crome", "nodo_motorio": "Bicordi e note singole staccate a crome nelle due mani, in moto parallelo, con pause e alterazioni cromatiche; la sinistra entra con acciaccature nel grave (25-26). Il compito è leggerezza e simultaneità a p.", "andate": {"1": {"rep2": "STAC pp: ogni bicordo dal tasto, le due note insieme.", "rep3": "BLOC: le note di ogni quarto come un solo accordo, mani unite, CIECO."}, "2": {"rep2": "DIN: sinistra mp, destra pp; poi il contrario.", "rep3": "CLIC sul levare (2ª croma)."}}, "rep4_verifica": "Staccato corto e uguale, sotto voce; bicordi sempre a due suoni simultanei; acciaccature attaccate alla nota reale.", "note": "Ricordi p. 2, sistema 1 batt. 1 – sistema 2 batt. 1.\nA b. 30 hai scritto «5 3» sopra la destra e «1 2» sotto il bicordo: diteggiature, media sicurezza."}, {"id": "nabucco-sinfonia-31-36", "brano": "nabucco", "battute": "31-36", "titolo": "Sinfonia · Allegro: staccato con accordi più fitti", "priorita": 7, "famiglia": "nabucco-fam-staccato-crome", "nodo_motorio": "Come 25-30, con bicordi e accordi di tre note e alterazioni (♭, ♮) a quasi ogni quarto; la sinistra passa ad accordi di tre note.", "andate": {"1": {"rep2": "STAC pp, le note di ogni accordo insieme.", "rep3": "BLOC CIECO, mani unite."}, "2": {"rep2": "ACC sulla 2ª croma di ogni coppia, il resto pp.", "rep3": "CHUNK: un quarto più la prima nota del seguente, stop con la mano già sull'accordo seguente."}}, "rep4_verifica": "Come 25-30; nessun accordo incompleto dove cambiano le alterazioni.", "note": "Ricordi p. 2, sistema 2 batt. 2 – sistema 3 batt. 2.\nA b. 31 c'è un tratto a matita sulla sinistra che sembra una cancellatura."}, {"id": "nabucco-sinfonia-37-41", "brano": "nabucco", "battute": "37-41", "titolo": "Sinfonia · ff improvviso, salita pp, ripresa", "priorita": 5, "famiglia": "nabucco-fam-accordi-ff-allegro", "nodo_motorio": "37-38: accordi pieni ff della destra in crome, sinistra in ottave con salto all'ottava grave. 39: accordo e piccola salita pp. 40: staccato p come 33. 41: di nuovo ff. Il problema è cambiare dinamica senza preparazione.", "andate": {"1": {"rep2": "PESO a mp sugli accordi di 37-38: un impulso per gruppo, il resto di rimbalzo.", "rep3": "Sinistra sola: CIECO shift–touch–play sul salto all'ottava grave."}, "2": {"rep2": "BLOC sulle forme di 37-38 a tempo di quarti, CIECO.", "rep3": "CHUNK: b. 38 più la salita di b. 39, stop sulla prima nota pp."}}, "rep4_verifica": "ff pieno senza colpi; il pp di 39 arriva subito, senza assestamento; l'ff di 41 parte dal tasto.", "note": "Ricordi p. 2, sistema 3 batt. 3 – sistema 4 batt. 2."}, {"id": "nabucco-sinfonia-42-46", "brano": "nabucco", "battute": "42-46", "titolo": "Sinfonia · Accordi e ottave accentati", "priorita": 5, "famiglia": "nabucco-fam-accordi-ff-allegro", "nodo_motorio": "Accordi accentati della destra sui quarti; sinistra in ottave accentate che si muovono per semitono, con salti all'ottava grave (44, 46).", "andate": {"1": {"rep2": "PESO a mp: un impulso per accento, rilascio subito.", "rep3": "Sinistra sola: CIECO shift–touch–play sui salti all'ottava grave."}, "2": {"rep2": "DIN dentro la mano (sinistra): solo pollici, poi solo mignoli.", "rep3": "MUTA: destra suona, sinistra fantasma; poi il contrario."}}, "rep4_verifica": "Accenti uguali, senza spinta di spalla; ottave complete; salti al grave a tempo.", "note": "Ricordi p. 2, sistema 4 batt. 3 – sistema 5 batt. 2."}, {"id": "nabucco-sinfonia-47-51", "brano": "nabucco", "battute": "47-51", "titolo": "Sinfonia · ff, accordi lunghi e corona", "priorita": 5, "famiglia": "nabucco-fam-accordi-ff-allegro", "nodo_motorio": "47-48 ff: accordi della destra nell'acuto (minime e crome), sinistra in ottave e accordi accentati. 49: accordo e pausa. 50-51: sinistra sola con accordi lunghi accentati fino alla corona.", "andate": {"1": {"rep2": "PESO a mp: impulso e rilascio sulle minime; durante la nota lunga il polso si muove.", "rep3": "BLOC CIECO sulle forme di 47-48."}, "2": {"rep2": "Sinistra sola 49-51: PESO sugli accordi lunghi, polso mobile mentre li tieni.", "rep3": "MENT, poi la ripetizione reale."}}, "rep4_verifica": "ff di caduta, nessuna tensione tenuta sulle note lunghe; pause contate; corona sul silenzio.", "note": "Ricordi p. 2, sistema 5 batt. 3 – sistema 5 batt. 7."}, {"id": "nabucco-sinfonia-52-54", "brano": "nabucco", "battute": "52-54", "titolo": "Sinfonia · Andante come prima: accordi staccati p", "priorita": 7, "famiglia": "nabucco-fam-corale", "nodo_motorio": "Tre battute di accordi staccati p a due mani con cromatismi; a 53-54 legature di valore e una voce interna legata. Poi il cambio a 3/8.", "andate": {"1": {"rep2": "DIN dentro la mano: voce superiore suonata, resto muto.", "rep3": "STAC pp dal tasto."}, "2": {"rep2": "BLOC CIECO.", "rep3": "CHUNK a ritroso: b. 54 più l'attacco dell'Andantino (b. 55)."}}, "rep4_verifica": "Accordi insieme a p; le note legate restano tenute; il cambio di tempo verso l'Andantino senza buco.", "note": "Ricordi p. 2, sistema 6 batt. 1 – sistema 6 batt. 3."}, {"id": "nabucco-sinfonia-55-60", "brano": "nabucco", "battute": "55-60", "titolo": "Sinfonia · Andantino 3/8: corone e canto sopra accordi staccati", "priorita": 7, "famiglia": "nabucco-fam-canto-andantino", "nodo_motorio": "b. 55 corone sulle pause e prime note; da b. 56 la destra canta con ritmi puntati e terzine di semicrome, legato e «con espress.», sopra coppie di accordi staccati della sinistra (due crome e pausa). Il compito è legare il canto senza pedale e tenere l'accompagnamento sotto.", "andate": {"1": {"rep2": "Destra sola, legato senza pedale, CIECO.", "rep3": "DIN: destra mp, sinistra pp."}, "2": {"rep2": "Sinistra sola: STAC pp, accordi dal tasto con le note insieme.", "rep3": "MUTA: destra suona, sinistra fantasma; poi il contrario."}}, "rep4_verifica": "Canto legato sopra un accompagnamento leggero; terzine di semicrome non affrettate; dopo le corone di b. 55 la pulsazione è già pronta.", "note": "Ricordi p. 2, sistema 6 batt. 4 – p. 3, sistema 1 batt. 4."}, {"id": "nabucco-sinfonia-61-64", "brano": "nabucco", "battute": "61-64", "titolo": "Sinfonia · Canto con voce interna in terzine", "priorita": 7, "famiglia": "nabucco-fam-canto-andantino", "nodo_motorio": "Il canto continua; a 62-63 la destra tiene la nota del canto mentre una voce interna fa terzine di semicrome cromatiche nella stessa mano; b. 64 accordo e ripresa.", "andate": {"1": {"rep2": "DIN dentro la mano: canto tenuto e suonato, terzine interne mute; poi terzine pp e canto muto.", "rep3": "Voce interna sola, ACC: accento sulla 2ª nota di ogni terzina, poi sulla 3ª, pp."}, "2": {"rep2": "STAC pp sulle terzine interne, canto tenuto legato.", "rep3": "DIN: destra mp, sinistra pp."}}, "rep4_verifica": "Il canto resta tenuto e sopra; terzine interne uguali e leggere, senza accento sul cromatismo.", "note": "Ricordi p. 3, sistema 1 batt. 5 – sistema 2 batt. 2.\nLeggo 62-63 come canto più voce interna nella stessa mano dalla direzione dei gambi; se la voce interna va alla sinistra, il vincolo vale per la sinistra."}, {"id": "nabucco-sinfonia-65-68", "brano": "nabucco", "battute": "65-68", "titolo": "Sinfonia · Canto con terzine e salita all'acuto", "priorita": 7, "famiglia": "nabucco-fam-canto-andantino", "nodo_motorio": "Canto con terzine di semicrome (66) e salita in semicrome fino all'acuto (68), sopra accordi staccati.", "andate": {"1": {"rep2": "Destra sola: ACC sulle terzine, accento sulla 2ª nota, poi sulla 3ª, pp.", "rep3": "Destra sola: RIT sulla salita di 68, coppie lungo-corto, poi corto-lungo."}, "2": {"rep2": "DIN: destra mp, sinistra pp.", "rep3": "CHUNK a ritroso: b. 68 più il primo quarto di b. 69."}}, "rep4_verifica": "Terzine e salita senza affrettare; il canto arriva in cima a b. 68 senza durezza.", "note": "Ricordi p. 3, sistema 2 batt. 3 – sistema 2 batt. 6."}, {"id": "nabucco-sinfonia-69-71", "brano": "nabucco", "battute": "69-71", "titolo": "Sinfonia · Appoggiature, scala in terzine di biscrome a due mani, attacco ff", "priorita": 6, "famiglia": "nabucco-fam-volate", "nodo_motorio": "b. 69: coppie legate (appoggiature) della destra sopra accordi staccati. b. 70: scala ascendente rapida in terzine di biscrome a due mani, in parallelo, verso l'ff marcato di b. 71 (lettera A). Sopra e sotto la scala hai scritto diteggiature a matita.", "andate": {"1": {"rep2": "NODO sulla scala di 70: fermati dove una mano passa il pollice e l'altra no.", "rep3": "RIT sulla scala: fermata sulla 1ª nota di ogni terzina, le altre di scatto."}, "2": {"rep2": "PESO sulle coppie di 69: caduta sulla prima nota, rilascio sulla seconda; sinistra pp.", "rep3": "CHUNK a ritroso: scala di 70 più l'accordo ff di 71."}}, "rep4_verifica": "Coppie di 69 con la seconda nota più leggera; scala uguale e a mani insieme; ff di 71 dal tasto e a tempo.", "note": "Ricordi p. 3, sistema 3 batt. 1 – sistema 3 batt. 3.\nMatita a b. 70: leggo «1 3 1» sotto la destra e due «3» sotto la sinistra, con incertezza."}, {"id": "nabucco-sinfonia-72-76", "brano": "nabucco", "battute": "72-76", "titolo": "Sinfonia · ff marcato all'ottava alta, arpeggi spezzati della sinistra", "priorita": 6, "famiglia": "nabucco-fam-arpeggi-andantino", "nodo_motorio": "Destra all'ottava sopra (8va): accordi marcati con ritmi puntati e terzine di semicrome. Sinistra: sei semicrome per battuta in arpeggio spezzato legato su circa un'ottava e mezza, con la nota grave sul battere. b. 76: pp subito.", "andate": {"1": {"rep2": "Sinistra sola: BLOC, ogni battuta come una o due posizioni a blocco; poi CIECO.", "rep3": "Sinistra sola: ACC sulla 2ª semicroma di ogni coppia, poi sulla 3ª di ogni gruppo di tre; pp."}, "2": {"rep2": "Destra sola: PESO a mp sugli accordi marcati, impulso e rilascio; terzine di scatto.", "rep3": "MUTA: sinistra suona, destra fantasma; poi il contrario."}}, "rep4_verifica": "Arpeggio della sinistra uguale e legato sotto l'ff, senza accento sul pollice; accordi della destra marcati ma non duri; il pp di 76 arriva subito.", "note": "Ricordi p. 3, sistema 3 batt. 4 – sistema 4 batt. 3."}, {"id": "nabucco-sinfonia-77-81", "brano": "nabucco", "battute": "77-81", "titolo": "Sinfonia · pp e di nuovo ff marcato sugli arpeggi", "priorita": 6, "famiglia": "nabucco-fam-arpeggi-andantino", "nodo_motorio": "Come 72-76: pp (77-78) con coppie di accordi della destra legate, ff marcato a 79-81 sopra lo stesso arpeggio della sinistra.", "andate": {"1": {"rep2": "Sinistra sola: CHUNK, una battuta più la prima nota della seguente, stop con la mano già sulla posizione.", "rep3": "DIN: nel pp sinistra p e destra pp; nell'ff il contrario."}, "2": {"rep2": "Destra sola: BLOC sulle forme d'accordo, CIECO.", "rep3": "CLIC: un clic per battuta."}}, "rep4_verifica": "Il cambio pp–ff non sposta la pulsazione; la sinistra resta uguale in tutte e due le dinamiche.", "note": "Ricordi p. 3, sistema 4 batt. 4 – sistema 5 batt. 3."}, {"id": "nabucco-sinfonia-82-85", "brano": "nabucco", "battute": "82-85", "titolo": "Sinfonia · Fine dell'ff, pp, «leggermente»", "priorita": 6, "famiglia": "nabucco-fam-arpeggi-andantino", "nodo_motorio": "Fine dell'ff (82), pp (83), poi «leggermente» (84-85): stessi arpeggi della sinistra sotto accordi leggeri della destra.", "andate": {"1": {"rep2": "Sinistra sola: STAC pp, poi legato.", "rep3": "DIN dentro la mano (destra): voce superiore suonata, resto pp."}, "2": {"rep2": "ACC nella sinistra sulla 2ª semicroma di ogni coppia.", "rep3": "MUTA: destra suona, sinistra fantasma."}}, "rep4_verifica": "«leggermente» davvero: l'arpeggio sotto il p senza culmini; accordi della destra con le note insieme.", "note": "Ricordi p. 3, sistema 5 batt. 4 – sistema 6 batt. 2."}, {"id": "nabucco-sinfonia-86-89", "brano": "nabucco", "battute": "86-89", "titolo": "Sinfonia · Volata in terzine di biscrome, doppie note cromatiche in crescendo", "priorita": 6, "famiglia": "nabucco-fam-volate", "nodo_motorio": "b. 86: salita rapida della destra in terzine di biscrome (la sinistra ha una figura simile in chiave di violino). b. 87: crome staccate. 88-89: doppie note cromatiche della destra in semicrome, p cres., verso la lettera B (b. 90).", "andate": {"1": {"rep2": "Destra sola su 88-89: STAC pp, ogni doppia nota con le due note insieme.", "rep3": "RIT sulla volata di 86: fermata sulla 1ª nota di ogni terzina."}, "2": {"rep2": "Destra sola: DOPPIE su 88-89.", "rep3": "CHUNK a ritroso: b. 89 più l'attacco di b. 90."}}, "rep4_verifica": "Volata uguale; doppie note a due suoni sempre simultanei; crescendo di peso, non di velocità.", "note": "Ricordi p. 3, sistema 6 batt. 3 – p. 4, sistema 1 batt. 1.\nSopra e sotto b. 86 ci sono segni a matita che non leggo (forse diteggiature)."}, {"id": "nabucco-sinfonia-90-93", "brano": "nabucco", "battute": "90-93", "titolo": "Sinfonia · B, legg.: accordi ribattuti a semicrome con il canto sotto", "priorita": 3, "famiglia": "nabucco-fam-ribattuti-canto", "nodo_motorio": "Tre strati: in alto accordi di tre note staccati a semicrome nella destra (ribattuti); sotto, il canto, nella destra e, dove è scritto m.s., preso dalla sinistra; in basso, basso e accordi della sinistra a semicrome con pause. Ogni mano fa due cose. Da b. 93 «marc. il canto».", "andate": {"1": {"rep2": "Destra sola: ribattuti dalla metà corsa del tasto, senza staccare le dita, pp; il canto tenuto.", "rep3": "DIN dentro la mano: canto suonato e ribattuti muti; poi ribattuti pp e canto muto."}, "2": {"rep2": "Sinistra sola: le note del canto prese con m.s. suonate mp, basso e accordi pp; CIECO sullo spostamento verso il rigo superiore.", "rep3": "Scheletro: basso e canto soli; poi i ribattuti pp sopra."}, "3": {"rep2": "ROT sui ribattuti della destra: sola rotazione, poi sole dita, poi la miscela minima.", "rep3": "CHUNK: una croma più il primo accordo della seguente, a tempo pieno."}, "4": {"rep2": "MUTA: sinistra suona, destra fantasma; poi il contrario.", "rep3": "CLIC sul levare."}}, "rep4_verifica": "Il canto si sente sopra due fondi leggeri; ribattuti uguali, corti e pp; lo scambio m.s. non si sente.", "note": "Ricordi p. 4, sistema 1 batt. 2 – sistema 2 batt. 1."}, {"id": "nabucco-sinfonia-94-97", "brano": "nabucco", "battute": "94-97", "titolo": "Sinfonia · Canto alla destra (m.d.), cromatismi, ribattuti soli", "priorita": 3, "famiglia": "nabucco-fam-ribattuti-canto", "nodo_motorio": "Come 90-93: la destra riprende il canto in legato sotto i ribattuti (m.d., b. 94); cromatismi fitti a 95; b. 96 chiusa e pause; b. 97 solo i ribattuti della destra sopra un accordo.", "andate": {"1": {"rep2": "DIN dentro la mano: canto suonato, ribattuti muti; poi il contrario.", "rep3": "Ribattuti dalla metà corsa del tasto pp, canto mf."}, "2": {"rep2": "BLOC sui cromatismi di 95: ogni posizione della destra come accordo, CIECO.", "rep3": "Scheletro: basso e canto; poi completo."}}, "rep4_verifica": "Canto marcato senza indurire i ribattuti; a 96-97 pause contate e ribattuti soli ancora pp.", "note": "Ricordi p. 4, sistema 2 batt. 2 – sistema 3 batt. 1."}, {"id": "nabucco-sinfonia-98-101", "brano": "nabucco", "battute": "98-101", "titolo": "Sinfonia · Ribattuti sopra la linea cromatica della sinistra", "priorita": 3, "famiglia": "nabucco-fam-ribattuti-canto", "nodo_motorio": "Ribattuti della destra sopra una linea cromatica della sinistra in semicrome, a coppie ascendenti (98-99), con il canto legato nella destra; b. 100 chiusa, b. 101 ribattuti soli.", "andate": {"1": {"rep2": "Sinistra sola: STAC pp sulla linea cromatica, poi legato.", "rep3": "DIN dentro la mano (destra): canto suonato, ribattuti pp."}, "2": {"rep2": "Sinistra sola: ACC sulla 2ª nota di ogni coppia.", "rep3": "MUTA: sinistra suona, destra fantasma."}}, "rep4_verifica": "Linea cromatica della sinistra uguale sotto il canto; ribattuti sempre pp.", "note": "Ricordi p. 4, sistema 3 batt. 2 – sistema 4 batt. 1."}, {"id": "nabucco-sinfonia-102-104", "brano": "nabucco", "battute": "102-104", "titolo": "Sinfonia · Ribattuti e linea cromatica, poi «p e cres.»", "priorita": 3, "famiglia": "nabucco-fam-ribattuti-canto", "nodo_motorio": "Come 98-100 (102-103); a b. 104 «p e cres.»: i ribattuti partono con una salita dal registro medio, la sinistra fa basso e note ribattute.", "andate": {"1": {"rep2": "Sinistra sola: ACC sulla 2ª nota di ogni coppia, pp.", "rep3": "Destra sola: ribattuti dalla metà corsa; la salita di 104 con RIT, fermata sulla 1ª nota."}, "2": {"rep2": "Scheletro: basso e canto.", "rep3": "CHUNK a ritroso: b. 104 più il primo quarto di b. 105."}}, "rep4_verifica": "Il crescendo parte da un p vero; ribattuti senza indurire.", "note": "Ricordi p. 4, sistema 4 batt. 2 – sistema 4 batt. 4."}, {"id": "nabucco-sinfonia-105-108", "brano": "nabucco", "battute": "105-108", "titolo": "Sinfonia · a poco a poco cresc.: ribattuti pieni e corona", "priorita": 3, "famiglia": "nabucco-fam-ribattuti-canto", "nodo_motorio": "Accordi ribattuti di quattro note della destra a semicrome, sinistra con basso e accordi e piccoli salti, a poco a poco crescendo; b. 108 accordo arpeggiato a due mani con corona e pedale.", "andate": {"1": {"rep2": "PESO a mp: un impulso per croma, i ribattuti seguenti di rimbalzo dalla metà corsa del tasto.", "rep3": "BLOC: un accordo per croma, CIECO."}, "2": {"rep2": "Sinistra sola: CIECO shift–touch–play sui salti.", "rep3": "MENT del crescendo 105-107 e della corona, poi la ripetizione reale."}}, "rep4_verifica": "Crescendo di peso, ribattuti completi fino a b. 107; l'avambraccio è morbido sulla corona di b. 108.", "note": "Ricordi p. 4, sistema 5 batt. 1 – sistema 5 batt. 4."}, {"id": "nabucco-sinfonia-109-114", "brano": "nabucco", "battute": "109-114", "titolo": "Sinfonia · Allegro: accordi staccati in semiminime, p", "priorita": 7, "famiglia": "nabucco-fam-staccato-semiminime", "nodo_motorio": "Accordi staccati di due-tre note in semiminime a due mani, p; la sinistra salta all'ottava grave a battute alterne (109, 111). Mani in moto parallelo, forme che cambiano a ogni quarto.", "andate": {"1": {"rep2": "STAC pp: ogni accordo dal tasto, le note insieme.", "rep3": "Sinistra sola: CIECO shift–touch–play sul salto all'ottava grave."}, "2": {"rep2": "BLOC CIECO, mani unite.", "rep3": "CLIC: un clic per battuta."}}, "rep4_verifica": "Accordi corti e completi; salto al grave a tempo; p uniforme.", "note": "Ricordi p. 4, sistema 5 batt. 5 – sistema 6 batt. 4."}, {"id": "nabucco-sinfonia-115-120", "brano": "nabucco", "battute": "115-120", "titolo": "Sinfonia · Accordi staccati con terze e seste", "priorita": 7, "famiglia": "nabucco-fam-staccato-semiminime", "nodo_motorio": "Come 109-114: accordi staccati con terze e seste, minime e pause; salto all'ottava grave a b. 117.", "andate": {"1": {"rep2": "DIN: sinistra mp, destra pp.", "rep3": "STAC pp."}, "2": {"rep2": "BLOC CIECO.", "rep3": "CLIC sul levare (2° quarto)."}}, "rep4_verifica": "Come 109-114; le minime tenute per tutto il valore.", "note": "Ricordi p. 4, sistema 6 batt. 5 – p. 5, sistema 1 batt. 2."}, {"id": "nabucco-sinfonia-121-126", "brano": "nabucco", "battute": "121-126", "titolo": "Sinfonia · Accordi staccati con alterazioni", "priorita": 7, "famiglia": "nabucco-fam-staccato-semiminime", "nodo_motorio": "Accordi staccati più fitti, con alterazioni (♯, ♮) e la sinistra a tre note; pause a metà battuta.", "andate": {"1": {"rep2": "BLOC CIECO, mani unite.", "rep3": "STAC pp."}, "2": {"rep2": "DIN dentro la mano: voce superiore suonata, resto pp.", "rep3": "CHUNK: due quarti più il primo accordo seguente."}}, "rep4_verifica": "Nessun accordo incompleto ai cambi di alterazione; staccato uguale nelle due mani.", "note": "Ricordi p. 5, sistema 1 batt. 3 – sistema 1 batt. 8."}, {"id": "nabucco-sinfonia-127-131", "brano": "nabucco", "battute": "127-131", "titolo": "Sinfonia · cres.: accordi più pieni e accordi lunghi", "priorita": 7, "famiglia": "nabucco-fam-staccato-semiminime", "nodo_motorio": "b. 127 cres.: accordi staccati più pieni; 128-131 accordi lunghi e semiminime con cromatismi, verso il rinforzando di b. 132.", "andate": {"1": {"rep2": "PESO a mp: un impulso per battuta.", "rep3": "BLOC CIECO."}, "2": {"rep2": "DIN dentro la mano: voce superiore suonata, resto pp.", "rep3": "CHUNK a ritroso: b. 131 più il primo quarto di b. 132."}}, "rep4_verifica": "Crescendo di peso, senza accelerare; accordi lunghi tenuti senza tensione.", "note": "Ricordi p. 5, sistema 1 batt. 9 – sistema 2 batt. 4."}, {"id": "nabucco-sinfonia-132-135", "brano": "nabucco", "battute": "132-135", "titolo": "Sinfonia · rinf.: ottave a salti della sinistra, accordi della destra con acciaccature", "priorita": 4, "famiglia": "nabucco-fam-ottave-sx-rinf", "nodo_motorio": "Sinistra: crome a coppie dalla nota grave alla nota un'ottava sopra, a ogni quarto. Destra: note e accordi con acciaccatura che salgono di registro. Rinforzando fino al cambio d'armatura (b. 136).", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play tra la nota grave e quella alta.", "rep3": "Sinistra sola: PESO, un impulso sulla nota grave, quella alta di rimbalzo."}, "2": {"rep2": "Destra sola: acciaccatura e nota reale in un solo gesto; CIECO sui cambi di registro.", "rep3": "MUTA: sinistra suona, destra fantasma; poi il contrario."}}, "rep4_verifica": "Coppie della sinistra uguali, nessuna nota alta accorciata; rinforzando di peso; l'ff di b. 136 arriva pronto.", "note": "Ricordi p. 5, sistema 2 batt. 5 – sistema 2 batt. 8."}, {"id": "nabucco-sinfonia-136-139", "brano": "nabucco", "battute": "136-139", "titolo": "Sinfonia · C, ff: tema con basso e accordi della sinistra", "priorita": 4, "famiglia": "nabucco-fam-tema-ff", "nodo_motorio": "Destra: accordo pieno accentato (minima puntata) e poi crome del tema; sinistra: basso accentato nel grave e salto agli accordi (croma e semiminime) a ogni battuta, quindi un salto grande per battuta. A b. 139 salti in entrambe le mani.", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play dal basso all'accordo.", "rep3": "Destra sola: PESO a mp sull'accordo accentato, crome del tema leggere."}, "2": {"rep2": "BLOC: per ogni battuta due eventi (basso e accordo nella sinistra, accordo e prima croma nella destra), CIECO.", "rep3": "MENT, poi la ripetizione reale."}}, "rep4_verifica": "Bassi presi dal tasto e a tempo; accordi completi; il tema delle crome sopra l'accompagnamento, ff senza durezza.", "note": "Ricordi p. 5, sistema 3 batt. 1 – sistema 3 batt. 4."}, {"id": "nabucco-sinfonia-140-143", "brano": "nabucco", "battute": "140-143", "titolo": "Sinfonia · Tema ff con acciaccature", "priorita": 4, "famiglia": "nabucco-fam-tema-ff", "nodo_motorio": "Come 136-139; a 142-143 acciaccature prima delle note acute della destra e accordi accentati della sinistra.", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play dal basso all'accordo.", "rep3": "Destra sola: acciaccatura e nota acuta in un solo gesto, CIECO."}, "2": {"rep2": "DIN: sinistra f, destra pp; poi il contrario.", "rep3": "CHUNK: una battuta più il basso della seguente."}}, "rep4_verifica": "Acciaccature attaccate alla loro nota; bassi a tempo; nessun accento della destra dopo il salto della sinistra.", "note": "Ricordi p. 5, sistema 3 batt. 5 – sistema 4 batt. 2."}, {"id": "nabucco-sinfonia-144-148", "brano": "nabucco", "battute": "144-148", "titolo": "Sinfonia · Tema con accenti su ogni quarto", "priorita": 4, "famiglia": "nabucco-fam-tema-ff", "nodo_motorio": "Tema della destra con accenti sui quarti e note ribattute; la sinistra alterna basso e accordi accentati; 146-148 terze e accordi in crome nella destra.", "andate": {"1": {"rep2": "PESO a mp: un impulso per accento, rilascio subito.", "rep3": "Sinistra sola: BLOC (basso e accordo insieme), poi CIECO."}, "2": {"rep2": "DIN dentro la mano (destra): voce superiore suonata, resto pp.", "rep3": "MUTA: destra suona, sinistra fantasma; poi il contrario."}}, "rep4_verifica": "Accenti uguali e di caduta; crome di 146-148 uguali; bassi senza ritardo.", "note": "Ricordi p. 5, sistema 4 batt. 3 – sistema 4 batt. 7."}, {"id": "nabucco-sinfonia-149-153", "brano": "nabucco", "battute": "149-153", "titolo": "Sinfonia · Coppie accentate, accordi arpeggiati, salita verso il pp", "priorita": 4, "famiglia": "nabucco-fam-tema-ff", "nodo_motorio": "Coppie legate accentate della destr ", "note": "Ricordi p. 140, sistema 2 batt. 2 – sistema 3 batt. 1."}, {"id": "nabucco-concertato-9-12", "brano": "nabucco", "battute": "9-12", "titolo": "Concertato · Rullo a due mani, acciaccature della sinistra, f>p", "priorita": 2, "famiglia": "nabucco-fam-conc-acciaccature", "nodo_motorio": "b. 9: rullo accentato a due mani (accordo della destra, basso della sinistra), poi pause. 10-11: la sinistra suona un basso e poi note con acciaccatura in terzine, un salto a ogni tempo; la destra coppie di accordi. b. 12 tutta forza: accordo f e subito p. Voce: Nabucco, «le folgori intorno... di lutto e squallor».", "andate": {"1": {"rep2": "Sinistra sola 10-11: acciaccatura e nota in un solo gesto; CIECO shift–touch–play dal basso.", "rep3": "Canto parlato sul ritmo, con tutto il piano."}, "2": {"rep2": "PESO sull'accento di b. 9 e sul f di b. 12, rilascio subito.", "rep3": "Canto + sinistra, destra MUTA."}}, "rep4_verifica": "Acciaccature leggere e attaccate alla loro nota; dopo le pause di b. 9 la voce entra a tempo; f>p di b. 12 netto nel piano.", "note": "Ricordi p. 140, sistema 3 batt. 2 – sistema 4 batt. 2."}, {"id": "nabucco-concertato-13-16", "brano": "nabucco", "battute": "13-16", "titolo": "Concertato · [32] Ingresso di Abigaille", "priorita": 2, "famiglia": "nabucco-fam-conc-rullo", "nodo_motorio": "Piano come 1-5: rullo della sinistra, terzine della destra, accordi in terzine della sinistra (14-16). Voce: la linea guida passa ad Abigaille («cupo»), da cantare un'ottava sotto; Nabucco continua in controcanto.", "andate": {"1": {"rep2": "Destra sola: terzine portato pp dalla metà corsa.", "rep3": "Prima nota di Abigaille presa dal piano, poi canto + sinistra, destra MUTA."}, "2": {"rep2": "Sinistra sola: ROT sul rullo.", "rep3": "Canto con tutto, piano pp."}}, "rep4_verifica": "Il cambio di personaggio a b. 13 non sposta l'intonazione; voce sopra un piano pp.", "note": "Ricordi p. 140, sistema 4 batt. 3 – p. 141, sistema 1 batt. 3."}, {"id": "nabucco-concertato-17-20", "brano": "nabucco", "battute": "17-20", "titolo": "Concertato · Abigaille, rullo accentato a due mani", "priorita": 2, "famiglia": "nabucco-fam-conc-rullo", "nodo_motorio": "Come 5-9: terzine della destra, rullo della sinistra, coppie di accordi (19), rullo accentato a due mani (20). Voce: Abigaille, «già piomba il terror».", "andate": {"1": {"rep2": "Destra sola: ACC sulle terzine, accento sulla 2ª, poi sulla 3ª, pp.", "rep3": "Canto + destra, sinistra MUTA."}, "2": {"rep2": "PESO sul rullo accentato di b. 20, rilascio subito.", "rep3": "Canto con tutto, piano pp."}}, "rep4_verifica": "Come 5-8; l'accento di b. 20 è del piano, la voce non lo imita.", "note": "Ricordi p. 141, sistema 1 batt. 4 – sistema 2 batt. 3.\nGemello di 5-8: in circuiti diversi finché uno non è in drop-out."}, {"id": "nabucco-concertato-21-23", "brano": "nabucco", "battute": "21-23", "titolo": "Concertato · Acciaccature della sinistra, tutta forza", "priorita": 2, "famiglia": "nabucco-fam-conc-acciaccature", "nodo_motorio": "21-22: la sinistra con basso e note con acciaccatura in terzine (un salto a ogni tempo), la destra coppie di accordi. b. 23 tutta forza: accordo accentato, poi terzine di accordi e basso con pause. Voce: Abigaille («apprestan un giorno di lutto e squallor»), Ismaele entra in levare.", "andate": {"1": {"rep2": "Sinistra sola: acciaccatura e nota in un solo gesto; CIECO shift–touch–play dal basso.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "PESO sull'accordo di b. 23, terzine seguenti di rimbalzo.", "rep3": "Canto parlato con tutto, poi cantato."}}, "rep4_verifica": "Come 9-12; il tutta forza di 23 pieno ma non duro; la voce lo sostiene senza spingere.", "note": "Ricordi p. 141, sistema 3 batt. 1 – p. 142, sistema 1 batt. 1.\nGemello di 9-12."}, {"id": "nabucco-concertato-24-28", "brano": "nabucco", "battute": "24-28", "titolo": "Concertato · Ingresso di Ismaele: basso–accordo in terzine della sinistra", "priorita": 2, "famiglia": "nabucco-fam-conc-terzine-sx", "nodo_motorio": "Sinistra: basso e due accordi in terzine di crome a ogni tempo (salto continuo). Destra: pause, poi terzine di accordi pp (b. 25), accordi lunghi (26-27). Voce: linea guida a Ismaele (tenore), alla tua altezza.", "andate": {"1": {"rep2": "Sinistra sola: BLOC (basso e accordo insieme), poi CIECO shift–touch–play sul salto.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "Sinistra sola: ACC sulla 2ª croma di ogni terzina, poi sulla 3ª; basso pp.", "rep3": "Canto con tutto, piano pp."}}, "rep4_verifica": "Terzine della sinistra uguali, basso senza accento; voce legata sopra.", "note": "Ricordi p. 142, sistema 1 batt. 2 – sistema 2 batt. 3."}, {"id": "nabucco-concertato-29-32", "brano": "nabucco", "battute": "29-32", "titolo": "Concertato · Ismaele: terzine accentate, rullo, semicrome", "priorita": 2, "famiglia": "nabucco-fam-conc-terzine-sx", "nodo_motorio": "Terzine della destra con accenti (29), rullo accentato a due mani (31), terzine e semicrome della destra (32); sinistra basso–accordo in terzine. Voce: Ismaele, «già piomba il terror».", "andate": {"1": {"rep2": "Destra sola: RIT sulle terzine accentate, fermata sulla 1ª nota, le altre di scatto.", "rep3": "Canto parlato con tutto."}, "2": {"rep2": "PESO sul rullo di b. 31, rilascio subito.", "rep3": "Canto + destra, sinistra MUTA."}}, "rep4_verifica": "Accenti netti senza durezza; dopo il rullo la voce riparte a tempo.", "note": "Ricordi p. 142, sistema 2 batt. 4 – sistema 3 batt. 3."}, {"id": "nabucco-concertato-33-36", "brano": "nabucco", "battute": "33-36", "titolo": "Concertato · Ingresso di Fenena e inizio delle sestine", "priorita": 1, "famiglia": "nabucco-fam-conc-sestine-p", "nodo_motorio": "33-34: sinistra in terzine basso–accordo, f e subito p a b. 34. Da b. 35 (numero 33) la sinistra passa a sestine di semicrome in arpeggio staccato con il basso tenuto in croma; la destra canta in terzine e accordi. Voce: Ismaele chiude (34), poi Fenena («cupo»), un'ottava sotto.", "andate": {"1": {"rep2": "Sinistra sola 35-36: BLOC, ogni sestina come posizione a blocco con il basso; poi CIECO.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "Sinistra sola: STAC pp sulle sestine, basso tenuto.", "rep3": "Canto con tutto, piano pp."}, "3": {"rep2": "Sinistra sola: ACC, sestine raggruppate 3+3, poi 2+2+2.", "rep3": "Canto parlato sul ritmo, con tutto."}, "4": {"rep2": "MUTA: destra suona, sinistra fantasma; poi il contrario.", "rep3": "CHUNK: un tempo più la prima nota del seguente, con la voce."}}, "rep4_verifica": "Passaggio da terzine a sestine senza scossa; sestine uguali e staccate sotto; la voce non accelera sopra le sestine.", "note": "Ricordi p. 143, sistema 1 batt. 1 – sistema 2 batt. 1."}, {"id": "nabucco-concertato-37-41", "brano": "nabucco", "battute": "37-41", "titolo": "Concertato · Fenena sopra le sestine", "priorita": 1, "famiglia": "nabucco-fam-conc-sestine-p", "nodo_motorio": "Sestine della sinistra continue (staccato, basso tenuto), destra in terzine di accordi e accordi lunghi; b. 41 coppie di accordi. Voce: Fenena, «sui muti sembianti... già piomba il terror».", "andate": {"1": {"rep2": "Sinistra sola: CHUNK, una sestina più il basso della seguente, stop con la mano già sopra.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "Sinistra sola: ACC 3+3, poi 2+2+2, pp.", "rep3": "Canto con tutto, piano pp."}}, "rep4_verifica": "Sestine sotto senza culmini; voce in tempo sopra; destra pp.", "note": "Ricordi p. 143, sistema 2 batt. 2 – p. 144, sistema 1 batt. 3."}, {"id": "nabucco-concertato-42-45", "brano": "nabucco", "battute": "42-45", "titolo": "Concertato · Rullo ff, sotto voce, f–p–ff verso il tutti", "priorita": 1, "famiglia": "nabucco-fam-conc-sestine-p", "nodo_motorio": "b. 42: rullo accentato a due mani e pause. 43-44: la destra con acciaccatura, terzine e salti all'acuto sopra le sestine (sotto voce). b. 45: accordo arpeggiato f, poi p, poi ff. Voce: Fenena, poi in levare l'ingresso di Zaccaria e del coro (ff).", "andate": {"1": {"rep2": "Destra sola: CIECO shift–touch–play sui salti all'acuto di 43-44.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "PESO sull'accento di b. 42 e sull'accordo di b. 45.", "rep3": "CHUNK a ritroso: b. 45 più il primo tempo di b. 46, con la voce."}}, "rep4_verifica": "Sotto voce davvero; i tre livelli di b. 45 netti; ingresso del tutti a tempo.", "note": "Ricordi p. 144, sistema 2 batt. 1 – p. 145, sistema 1 batt. 1."}, {"id": "nabucco-concertato-46-50", "brano": "nabucco", "battute": "46-50", "titolo": "Concertato · [34] Tutti ff: tema di Zaccaria e coro, sestine larghe", "priorita": 1, "famiglia": "nabucco-fam-conc-tutti", "nodo_motorio": "Destra: tema in ottave e accordi nell'acuto, note lunghe legate. Sinistra: sestine più larghe dal basso grave, ff; b. 49 accordo con rullo. Voce: Zaccaria e bassi del coro, alla tua altezza, ff.", "andate": {"1": {"rep2": "Sinistra sola a mp: BLOC per posizioni, CIECO sul basso grave.", "rep3": "Canto + destra, sinistra MUTA (la destra porta il tema)."}, "2": {"rep2": "Destra sola: DIN dentro la mano, voce superiore f e pollice pp; PESO sulle minime.", "rep3": "Canto con tutto, a mp."}}, "rep4_verifica": "ff del piano pieno ma sotto la voce; sestine uguali anche nel ff; voce sostenuta sulle note lunghe.", "note": "Ricordi p. 145, sistema 1 batt. 2 – p. 146, sistema 1 batt. 3.\nRep 2-3 con voce a mezza voce, come il piano a mp."}, {"id": "nabucco-concertato-51-55", "brano": "nabucco", "battute": "51-55", "titolo": "Concertato · «già piomba il terror», rullo ff, [35] sotto voce", "priorita": 1, "famiglia": "nabucco-fam-conc-tutti", "nodo_motorio": "51-52: destra in ottave con terzine accentate sopra le sestine. b. 53: rullo ff a due mani. 54-55 (numero 35): sotto voce, destra in terzine con salti all'acuto, sinistra sestine p. Voce: Zaccaria e coro.", "andate": {"1": {"rep2": "Destra sola: RIT sulle terzine accentate di b. 52.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "PESO sul rullo di b. 53, poi pp subito.", "rep3": "Canto con tutto."}}, "rep4_verifica": "ff di b. 53 e sotto voce di b. 54 senza tempo perso; voce piano a b. 54.", "note": "Ricordi p. 147, sistema 1 batt. 1 – p. 148, sistema 1 batt. 2."}, {"id": "nabucco-concertato-56-60", "brano": "nabucco", "battute": "56-60", "titolo": "Concertato · Tutta forza, pp, cresc.", "priorita": 1, "famiglia": "nabucco-fam-conc-tutti", "nodo_motorio": "b. 56 ff: accordo della destra in tremolo misurato e sinistra ad accordi spezzati fitti nel grave, poi p. 57-60 pp e cresc.: accordi in terzine della destra sopra le sestine. Voce: tutti «di lutto e squallor», Zaccaria pp su note lunghe.", "andate": {"1": {"rep2": "Sinistra sola b. 56: BLOC sulle posizioni dell'accordo spezzato, poi CIECO.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "Destra sola: ROT sul tremolo di b. 56; terzine pp dalla metà corsa.", "rep3": "Canto con tutto."}}, "rep4_verifica": "ff di 56 e pp di 57 netti; cresc. graduale; note lunghe della voce intonate sull'armonia del piano.", "note": "Ricordi p. 149, sistema 1 batt. 1 – p. 150, sistema 1 batt. 2."}, {"id": "nabucco-concertato-61-63", "brano": "nabucco", "battute": "61-63", "titolo": "Concertato · Finale: «ah!» ff e corona", "priorita": 1, "famiglia": "nabucco-fam-conc-tutti", "nodo_motorio": "b. 61: destra in semicrome alternate (bicordo e nota sotto) in crescendo, sinistra sestine. b. 62 ff: tremolo della destra e accordi spezzati fitti della sinistra nel grave. b. 63: accordo e corona. Voce: tutti «ah!» ff su nota lunga.", "andate": {"1": {"rep2": "Destra sola: ROT sulle semicrome alternate di b. 61.", "rep3": "Canto + sinistra, destra MUTA."}, "2": {"rep2": "Sinistra sola b. 62: BLOC, poi CIECO.", "rep3": "MENT con la voce immaginata, poi reale."}}, "rep4_verifica": "Crescendo di 61 di peso; ff senza durezza; nota lunga della voce tenuta fino alla corona.", "note": "Ricordi p. 151, sistema 1 batt. 1 – sistema 1 batt. 3."}], "priorita": [{"n": 1, }

async function newGo() {
  const B = D.bozza, cfg = B.cfg;
  if (cfg.tipo === 'libera') {
    const brani = B.brani_liberi.filter(id => C.B.has(id));
    if (!brani.length) { toast('Scegli almeno un brano'); return; }
    if (await closeOpenFirst()) startFree(brani);
    return;
  }
  if (cfg.tipo === 'cucitura' || cfg.tipo === 'prova') {
    const z = sezioneCfg(cfg); if (!z) { toast('Nessun brano adatto'); return; }
    const ids = z.list.slice(z.i0, z.i1 + 1).map(f => f.id);
    if (await closeOpenFirst()) startSezione(cfg.tipo, ids, cfg.sb);
    return;
  }
  if (cfg.modo === 'scritti') { B.circuiti = []; save(); go('#select'); return; }
  const prev = (B.circuiti_lib[0] && B.circuiti_lib[0].slot) || [], first = (C.braniVis[0] || C.brani[0] || {}).id;
  B.circuiti_lib = [{ andate: cfg.andate, slot: Array.from({ length: cfg.slot }, (_, i) => prev[i] && C.B.has(prev[i].brano) ? { brano: prev[i].brano, battute: prev[i].battute || '' } : { brano: first, battute: '' }) }];
  save(); go('#composelib');
}
const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };

/* Riprende la composizione di una sessione passata. La libera parte subito; i circuiti passano
   dalla schermata di composizione, così si possono ritoccare prima di iniziare. */
async function repeatSession(ses) {
  if (!canRepeat(ses)) { toast('Questa sessione non si può ripetere'); return; }
  const B = D.bozza;
  if (ses.tipo === 'libera') {
    const brani = (ses.brani || []).filter(id => C.B.has(id));
    if (await closeOpenFirst()) startFree(brani);
    return;
  }
  B.cfg.tipo = 'circuito'; B.cfg.modo = ses.modo === 'libero' ? 'libero' : 'scritti';
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  if (ses.modo === 'libero') {
    B.circuiti_lib = ses.circuiti.map(c => ({ andate: clamp(c.andate_previste || 3, 3, 5), slot: c.slot.filter(x => C.B.has(x.brano)).map(x => ({ brano: x.brano, battute: x.battute || '' })) })).filter(c => c.slot.length);
    B.cfg.slot = clamp(B.circuiti_lib[0].slot.length, 2, 5); B.cfg.andate = B.circuiti_lib[0].andate;
    save(); go('#composelib'); return;
  }
  B.circuiti = ses.circuiti.map(c => ({ andate: clamp(c.andate_previste || 3, 3, 5), slot: c.slot.map(x => x.frammento).filter(id => fr(id)) })).filter(c => c.slot.length);
  B.selezionati = [...new Set(B.circuiti.flatMap(c => c.slot))];
  B.cfg.slot = clamp(B.circuiti[0].slot.length, 2, 5); B.cfg.andate = B.circuiti[0].andate;
  save(); go('#compose');
}

/* ---- sessione libera ---- */
function startFree(brani) {
  if (!brani.length) { toast('Scegli almeno un brano'); return; }
  const now = Date.now();
  D.sessione_aperta = { tipo: 'libera', id: 's' + now.toString(36), data: todayStr(), inizio: new Date(now).toISOString(), brani: [...brani], corrente: brani[0],
    circuiti: [], cur: newCur(), log: [], timer: { sess: 0, slot: 0, since: now, seen: now } };
  save(); navDepth = 0; replaceTo('#run');
}
function freeSeg(S) { // chiude il tratto corrente sul brano attivo
  fold(S.timer);
  const sec = Math.round(S.timer.slot);
  if (sec >= 1 || S.cur.note) S.log.push({ circuito: null, andata: null, etichetta: null, frammento: null, brano: S.corrente, secondi: sec, rep_completate: null, rep1_pulita: null, diagnosi: '', tempo_rep4: null, arresto: false, drop_out: false, note: S.cur.note });
  S.timer.slot = 0; S.cur = newCur();
}
function freeSwitch(id) {
  const S = D.sessione_aperta; if (!S || S.tipo !== 'libera') return;
  if (S.corrente === id) { closeSheet(); return; }
  freeSeg(S); S.corrente = id; if (!S.brani.includes(id)) S.brani.push(id);
  if (!S.timer.since) S.timer.since = Date.now();
  save(); render(); toast('Ora: ' + branoNome(id));
}
function pausedBanner(S) {
  return S.timer.since ? '' : `<button class="pausebar" data-act="pause"><b>Cronometro in pausa</b><span>Tocca qui per riprendere</span></button>`;
}
function renderFree(S) {
  const perB = {}; S.log.forEach(l => { perB[l.brano] = (perB[l.brano] || 0) + (l.secondi || 0); });
  const T = S.timer, running = !!T.since;

function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30); }

    if (a > ci.andate_previste) { c++; a = 1; s = 0; continue; }

/* ---- cronometro dimenticato acceso ---- */
/* Se l'app resta chiusa o in secondo piano a lungo con il cronometro in funzione, al ritorno chiede

const STALE_MS = 15 * 60 * 1000;
function checkStale(from) {
  const S = D.sessione_aperta; if (!S || !S.timer.since || !from) return;
  const gap = Date.now() - Math.max(from, S.timer.since); if (gap < STALE_MS) return;
  const sec = Math.round(gap / 1000), T = S.timer;
  ask({ title: 'Il cronometro è rimasto acceso', text: `L'app è stata chiusa o in secondo piano per ${fmtMinRound(sec)} con il cronometro in funzione. Stavi studiando?`,
    ok: 'Sì, conta tutto il tempo', alt: `No, togli ${fmtMinRound(sec)}`, cancel: 'Decido dopo (per ora resta contato)' }).then(r => {
    if (r !== 'alt' || D.sessione_aperta !== S) return;
    fold(T); T.slot = Math.max(0, T.slot - sec); T.sess = Math.max(0, T.sess - sec); save(); render(); toast(`Tolti ${fmtMinRound(sec)}`);
  });
}

  if (!S) return;
  if (location.hash === '#run' && S.timer.since) requestWake();
  const from = S.timer.hid; delete S.timer.hid;
  checkStale(from);
});

/* ---- vincolo: una sola coppia (Rep 2 e Rep 3) per frammento in tutta la sessione ---- */
const coppie = f => Object.keys((f && f.andate) || {}).sort();
const sigleIn = t => [...new Set(String(t || '').match(C.sigRe) || [])];
/* Coppia predefinita: se oggi il frammento è già stato fatto resta quella; altrimenti la successiva
   rispetto all'ultimo giorno in cui è stato studiato (1, poi 2, poi 3 e 4 se esistono, poi di nuovo 1). */
function coppiaDelGiorno(fid) {
  const keys = coppie(fr(fid)); if (!keys.length) return null;
  let best = null;
  D.sessioni.forEach(s => (s.log || []).forEach(l => { if (l.frammento === fid && l.coppia && keys.includes(l.coppia) && (!best || s.data >= best.data)) best = { data: s.data, k: l.coppia }; }));
  if (!best) return keys[0];
  return best.data === todayStr() ? best.k : keys[(keys.indexOf(best.k) + 1) % keys.length];
}
function vinc(S, fid) {
  if (!S.vincoli) S.vincoli = {};
  if (!S.vincoli[fid]) S.vincoli[fid] = { k: coppiaDelGiorno(fid) };
  return S.vincoli[fid];
}
/* Nome corto di un vincolo del catalogo: le sigle che contiene; se non ne ha, l'inizio del testo
   (seguendo il rimando «come in andata 1» quando il testo è solo quello). */
function vincNome(f, k, rep, giro) {
  const t = String((((f && f.andate) || {})[k] || {})[rep] || '').trim(); if (!t) return '—';
  const s = sigleIn(t); if (s.length) return s.join(' + ');
  const m = t.match(/^come in andata\s*(\d)/i);
  if (m && m[1] !== k && !giro) return vincNome(f, m[1], rep, true);
  const riga = t.split('\n')[0].replace(/^bb?\.\s*\d[^:]{0,30}:\s*/, '');
  return riga.length <= 34 ? riga.replace(/[.:;,]$/, '') : riga.slice(0, 32).replace(/\s+\S*$/, '') + '…';
}
function vincBreve(f, v) {
  return { r2: v.r2 || (v.k ? vincNome(f, v.k, 'rep2') : '—'), r3: v.r3 || (v.k ? vincNome(f, v.k, 'rep3') : '—'), mio: !!(v.r2 || v.r3) };
}
function vincBody(f, v, r) {
  const A = v.k ? f.andate[v.k] : null, cat = A ? (r === 2 ? A.rep2 : A.rep3) : null, mio = r === 2 ? v.r2 : v.r3;
  if (mio) {
    const s = C.S.get(mio) || {};
    return `<span class="vlabel">Vincolo scelto dopo la diagnosi</span><span class="txt"><span class="line"><button type="button" class="sig" data-sigla="${esc(mio)}">${esc(mio)}</button> · ${esc(s.nome || '')}</span></span>${fmtText(s.come_si_fa)}`
      + (cat ? `<details class="sub2"><summary>Vincolo del catalogo, non usato oggi</summary><div>${fmtText(cat)}</div></details>` : '');
  }
  if (!cat) return '<span class="muted">Nessun testo per questo frammento.</span>';
  // Molti testi della coppia 2 rimandano alla 1 («come in andata 1»): con una sola coppia per sessione il testo richiamato va mostrato qui.
  const rich = [...new Set((String(cat).match(/come in andata\s*\d/gi) || []).map(x => x.slice(-1)))].filter(n => n !== v.k && f.andate[n]);
  return fmtText(cat) + rich.map(n => `<span class="vlabel">Andata ${esc(n)}, richiamata dal testo</span>` + fmtText(r === 2 ? f.andate[n].rep2 : f.andate[n].rep3)).join('');
}
/* Che cosa scrivere nel registro per il vincolo usato. */
function vincLog(e, f, v) {
  if (!f || !v) return;
  e.coppia = v.k || null;
  if (v.r2) e.vincolo_rep2 = v.r2; if (v.r3) e.vincolo_rep3 = v.r3; if (v.err) e.errore = v.err;
}
function vincLogTesto(l) {
  const f = fr(l.frammento); if (!l.coppia && !l.vincolo_rep2 && !l.vincolo_rep3) return '';
  const b = vincBreve(f, { k: l.coppia, r2: l.vincolo_rep2, r3: l.vincolo_rep3 });
  const e = l.errore && (M3.errori || []).find(x => x.id === l.errore);
  return (b.mio ? 'scelto dopo la diagnosi' : 'coppia ' + l.coppia) + `: ${b.r2} / ${b.r3}` + (e ? ` (${e.errore.toLowerCase()})` : '');
}
function vincoloSheet(S, fid, after) {
  const f = fr(fid); if (!f) return;
  const v = vinc(S, fid), keys = coppie(f), errs = M3.errori || [];
  let err = v.err || null, r2 = v.r2 || null, r3 = v.r3 || null;
  const done = () => { save(); if (after) after(); else { closeSheet(); render(); } };
  const nome = s => (C.S.get(s) || {}).nome || '';
  openSheet(`<h2>Cambia vincolo</h2>
    <p class="small muted" style="margin-top:-6px">bb. ${esc(f.battute)} · vale per tutte le andate di questa sessione.</p>
    <div class="label">Che errore hai trovato in Rep 1?</div>
    <div class="errs">${errs.map(e => `<button data-err="${esc(e.id)}"><span>${esc(e.errore)}</span><small>${e.sigle.map(esc).join(' · ')}</small></button>`).join('')}</div>
    <div id="vpick"></div>
    ${keys.length > 1 || v.r2 || v.r3 ? `<div class="label" style="margin-top:16px">Oppure una coppia del catalogo</div>` + keys.map(k => { const b = vincBreve(f, { k }); return `<button class="btn two" data-k="${esc(k)}"><b>Coppia dell'andata ${esc(k)}${k === v.k && !v.r2 && !v.r3 ? ' (in uso)' : ''}</b><span>Rep 2: ${esc(b.r2)} · Rep 3: ${esc(b.r3)}</span></button>`; }).join('') : ''}
    <button class="btn" id="vno">Annulla</button>`, sh => {

      pick.innerHTML = `<div class="label" style="margin-top:14px">Sigle adatte</div>${seg('Rep 2', r2, 'r2')}${seg('Rep 3', r3, 'r3')}
        <p class="small muted" style="margin:6px 0 10px">${e.sigle.map(s => `<b>${esc(s)}</b> ${esc(nome(s))}`).join(' · ')}</p>

      $$('[data-w]', pick).forEach(b => b.addEventListener('click', () => { if (b.dataset.w === 'r2') r2 = b.dataset.s; else r3 = b.dataset.s; draw(); }));

      if (!e.sigle.includes(r2)) r2 = e.sigle[0]; if (!e.sigle.includes(r3)) r3 = e.sigle[1] || e.sigle[0];
      draw(); pick.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }));
    $$('[data-k]', sh).forEach(b => b.addEventListener('click', () => { v.k = b.dataset.k; delete v.r2; delete v.r3; delete v.err; done(); }));
    $('#vno', sh).addEventListener('click', () => { if (after) after(); else closeSheet(); });

/* Per ogni vincolo usato: in quanti giorni, e com'era la prima Rep 1 del giorno di studio successivo. */
/* Per ogni vincolo: in quanti giorni è stato usato e, quando c'è, di quanto è cambiato il voto del test
   dal giorno in cui l'hai usato al giorno di studio successivo. */
function vincoliStats(h) {
  const giorni = new Map();
  h.forEach(l => { const g = giorni.get(l.data) || { lab: '', voto: null }; if (!g.lab) g.lab = vincLogTesto(l); if (l.test && typeof l.voto === 'number') g.voto = l.voto; giorni.set(l.data, g); });
  const ds = [...giorni.keys()].sort(), m = new Map();
  ds.forEach((d, i) => {
    const g = giorni.get(d); if (!g.lab) return;
    const x = m.get(g.lab) || { n: 0, tot: 0, delta: 0 }; x.n++;
    const next = i + 1 < ds.length ? giorni.get(ds[i + 1]) : null;
    if (g.voto != null && next && next.voto != null) { x.tot++; x.delta += next.voto - g.voto; }
    m.set(g.lab, x);
  });
  return [...m.entries()];
}

/* ================= CUCITURA E PROVA ================= */
/* Scelta di brano e tratto (dal frammento… al frammento…) per la cucitura e la prova. */
function sezioneCfg(cfg) {
  const min = cfg.tipo === 'cucitura' ? 2 : 1;
  // un brano con più estratti compare una volta per estratto: cucitura e prova restano dentro un estratto
  const brani = C.braniVis.flatMap(b => (sezioniDi(b.id).length ? sezioniDi(b.id) : ['']).map(z => ({ id: b.id, sez: z, nome: b.nome + (z ? ' · ' + z : '') }))).filter(x => listaSezione(cfg.tipo, x.id, x.sez).length >= min);
  if (!brani.length) return null;
  if (!brani.some(x => x.id === cfg.sb && x.sez === (cfg.ssez || ''))) { cfg.sb = brani[0].id; cfg.ssez = brani[0].sez; cfg.sda = cfg.sa = null; }
  const list = listaSezione(cfg.tipo, cfg.sb, cfg.ssez);
  let i0 = list.findIndex(f => f.id === cfg.sda), i1 = list.findIndex(f => f.id === cfg.sa);
  if (i0 < 0) i0 = 0;
  if (i1 < 0) i1 = cfg.tipo === 'cucitura' ? Math.min(list.length - 1, i0 + 2) : list.length - 1;
  if (i1 < i0) i1 = i0;
  if (cfg.tipo === 'cucitura' && i1 === i0) { if (i0 < list.length - 1) i1 = i0 + 1; else i0 = i1 - 1; }
  cfg.sda = list[i0].id; cfg.sa = list[i1].id;
  return { brani, list, i0, i1 };
}
function sezioneHtml(cfg) {
  const z = sezioneCfg(cfg);
  if (!z) return `<div class="empty"><b>Nessun brano adatto</b><span>Servono frammenti del catalogo con le battute.</span></div>`;
  const opt = (f, cur) => `<option value="${esc(f.id)}" ${f.id === cur ? 'selected' : ''}>bb. ${esc(f.battute)}${f.titolo ? ' · ' + esc(f.titolo) : ''}</option>`;
  const n = z.i1 - z.i0 + 1, tutto = z.i0 === 0 && z.i1 === z.list.length - 1;
  return `<section class="card">
    <div class="field"><label for="sb">Brano</label><select class="sel" id="sb" style="width:100%">${z.brani.map((b, i) => `<option value="${i}" ${b.id === cfg.sb && b.sez === (cfg.ssez || '') ? 'selected' : ''}>${esc(b.nome)}</option>`).join('')}</select></div>
    <div class="field"><label for="sda">Dal frammento</label><select class="sel" id="sda" style="width:100%">${z.list.map(f => opt(f, cfg.sda)).join('')}</select></div>
    <div class="field"><label for="sa">Al frammento</label><select class="sel" id="sa" style="width:100%">${z.list.map(f => opt(f, cfg.sa)).join('')}</select></div>
    ${cfg.tipo === 'prova' && !tutto ? `<button class="link" id="stutto">${cfg.ssez ? 'Tutto l\'estratto' : 'Tutto il brano'}</button>` : ''}
    <p class="small muted" style="margin:6px 0 0">${cfg.tipo === 'cucitura' ? `${n} frammenti consecutivi · ${n - 1} ${n - 1 === 1 ? 'giuntura' : 'giunture'}` : `bb. ${primaBattuta(z.list[z.i0])}–${ultimaBattuta(z.list[z.i1])} · ${n} ${n === 1 ? 'frammento' : 'frammenti'}${tutto ? (cfg.ssez ? ' (tutto l\'estratto)' : ' (tutto il brano)') : ''}`}</p>
  </section>`;
}
function sezioneBind() {
  const cfg = D.bozza.cfg, z = sezioneCfg(cfg), set = (k, v) => { cfg[k] = v; save(); render(); };
  ['sda', 'sa'].forEach(id => { const el = $('#' + id); if (el) el.addEventListener('change', () => set(id, el.value)); });

  const t = $('#stutto'); if (t) t.addEventListener('click', () => { const l = listaSezione(cfg.tipo, cfg.sb, cfg.ssez); cfg.sda = l[0].id; cfg.sa = l[l.length - 1].id; save(); render(); });
}
function startSezione(tipo, ids, brano) {
  if (ids.length < (tipo === 'cucitura' ? 2 : 1)) { toast('Scegli almeno due frammenti consecutivi'); return; }
  const now = Date.now(); navDepth = 0;
  D.sessione_aperta = { tipo, id: 's' + now.toString(36), data: todayStr(), inizio: new Date(now).toISOString(), brano, frammenti: ids, circuiti: [],
    pos: { g: 0, r: 1 }, cur: newCur(), log: [], timer: { sess: 0, slot: 0, since: now, seen: now } };

const voceVuota = () => ({ circuito: null, andata: null, etichetta: null, frammento: null, rep_completate: null, rep1_pulita: null, diagnosi: '', tempo_rep4: null, arresto: false, drop_out: false });
function tratto(ids) {
  const a = fr(ids[0]), b = fr(ids[ids.length - 1]); if (!a || !b) return '';
  const sa = sezioneDi(a), sb = sezioneDi(b);
  return sa !== sb ? `${sa} b. ${primaBattuta(a)} – ${sb} b. ${ultimaBattuta(b)}` : `${sa ? sa + ' · ' : ''}bb. ${primaBattuta(a)}–${ultimaBattuta(b)}`;
}

/* ---- cucitura ---- */
function cucFinalize(S, passi) {
  fold(S.timer);
  const g = S.pos.g, e = Object.assign(voceVuota(), { cucitura: true, etichetta: 'G' + (g + 1), da: S.frammenti[g], a: S.frammenti[g + 1], brano: S.brano,

  if (passi || e.secondi >= 5) S.log.push(e);

}

}

function cucBack() {

/* ================= EDITOR: BRANI E FRAMMENTI ================= */
/* I frammenti del catalogo non si cancellano: una modifica è una copia dell'utente con lo stesso id (l'originale
   si può ripristinare), un'eliminazione è un «nascosto». Lo storico resta sempre collegato all'id. */
const eModificato = id => C.userIds.has(id) && C.orig.has(id);

function rimuoviFrammento(id) {

  if (C.orig.has(id) && !D.frammenti_nascosti.includes(id)) D.frammenti_nascosti.push(id);

/* Divide un frammento in due alla battuta indicata: la prima parte tiene l'id (e lo storico), la seconda è nuova.

/* Il frammento che segue nello stesso brano (e nello stesso estratto). */

function chartSvg(points, target, label, tlab) {

    <text x="${L}" y="${H - 6}">${esc(fmtDayMonth(points[0].d))}</text>
    ${points.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtDayMonth(points[points.length - 1].d))}</text>` : ''}

function readJsonFile(input, cb) {
  const file = input.files && input.files[0]; if (!file) return;
  const rd = new FileReader();

  let done = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); done = true; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!done) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

function importCatalog(obj) {
  if (!obj || !Array.isArray(obj.frammenti)) { toast('Il file non contiene «frammenti»'); return; }
  const imp = D.catalogo_importato; let nuovi = 0, agg = 0;
  const known = new Set(C.frammenti.map(f => f.id));
  const up = (arr, items, key) => (items || []).forEach(x => { if (!x || x[key] == null) return; const i = arr.findIndex(y => y[key] === x[key]); if (i >= 0) arr[i] = x; else arr.push(x); });
  obj.frammenti.forEach(f => { if (f && f.id != null) known.has(f.id) ? agg++ : nuovi++; });
  // Nei file di un solo brano priorità, definizioni e fonte sono scritte una volta per tutto il file: le lego al brano.
  const soloBrano = Array.isArray(obj.brani) && obj.brani.length === 1;
  const braniImp = (obj.brani || []).map(b => !b || !soloBrano ? b : Object.assign({}, b, { priorita: b.priorita || obj.priorita, definizioni: b.definizioni || obj.definizioni, fonte: b.fonte || obj.fonte }));
  up(imp.brani, braniImp, 'id'); up(imp.frammenti, obj.frammenti, 'id'); up(imp.famiglie, obj.famiglie, 'id'); up(imp.sigle, obj.sigle, 'sigla');
  save(); buildCat(); toast(`Catalogo importato: ${nuovi} nuovi, ${agg} aggiornati`); render();
}

  editlog: el => editLog(el.dataset.s, +el.dataset.i),
  target: el => targetSheet(el.dataset.id),
  period: el => { histPeriod = el.dataset.v; render(); },
  histall: () => { histAll = true; render(); },
  tema: el => { D.impostazioni.tema = el.dataset.v; save(); applyPrefs(); render(); },
  testo: el => { D.impostazioni.testo = el.dataset.v; save(); applyPrefs(); render(); },
  stile: el => { const y = window.scrollY; D.impostazioni.stile = el.dataset.v; D.impostazioni.stile_scelto = true; save(); applyPrefs(); render(); window.scrollTo(0, y); },
  export: () => exportData(),
  pickfile: el => $('#' + el.dataset.target).click(),
  undoimport: () => undoImport(),
  restorepre2: () => restorePre2(),
  news: () => newsSheet(),
  reset: () => resetSheet()
};
document.addEventListener('click', e => {
  const sig = e.target.closest('.sig'); if (sig) { e.preventDefault(); openPanel(sig.dataset.sigla); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
$('#ov').addEventListener('click', () => closeOverlays());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#ov').classList.contains('on')) closeOverlays(); });

/* ================= AVVIO ================= */
applyPrefs();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { })); }
const bootFrom = D.sessione_aperta ? (D.sessione_aperta.timer.hid || D.sessione_aperta.timer.seen || 0) : 0;
if (D.sessione_aperta) delete D.sessione_aperta.timer.hid;
if (!location.hash && D.sessione_aperta) location.replace('#run');
render();
if (D.impostazioni.visto_versione !== APP_VERSION) {
  const prima = D.impostazioni.visto_versione;   // null alla prima installazione
  D.impostazioni.visto_versione = APP_VERSION; save();
  // le novità si mostrano a chi arriva da un'altra versione (non per le sole correzioni, es. 3.1.0 → 3.1.1)
  const mm = v => String(v).split('.').slice(0, 2).join('.');
  if (arrivaDaV1 || (prima && mm(prima) !== mm(APP_VERSION))) setTimeout(newsSheet, 350);
} else setTimeout(() => checkStale(bootFrom), 400);
</script>
</body>
</html>
