a): RIT a mani unite, fermata sulla 1ª di ogni tempo."}, "2": {"rep2": "Solo b. 24 (2ª volta): NODO sui punti in cui le diteggiature delle due mani cambiano posizione.", "rep3": "CHUNK: un tempo più una nota sulla 2ª volta di b. 24."}}, "rep4_verifica": "Sostituzioni senza buchi nel legato; nella 2ª volta di b. 24 le due mani suonano come una sola."}, {"id": "op 111 secondo movimento-25-28", "brano": "op111-2", "battute": "25-28", "titolo": "Arietta · Var. I, seconda metà: doppie note legate", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-var1-legato", "nodo_motorio": "Doppie note della destra «sempre ligato» con sostituzioni e incroci di dita (5-4, 5-4-5, 3-2, 2-1), sopra le semicrome legate della sinistra; cresc. verso b. 28.", "andate": {"1": {"rep2": "Voce superiore legata, inferiore staccata.", "rep3": "Il contrario."}, "2": {"rep2": "DIN tra le mani: destra mp, sinistra pp.", "rep3": "CIECO sulle sostituzioni della destra."}}, "rep4_verifica": "Legato vero, senza pedale, in tutte e due le voci; il crescendo non indurisce la mano.", "note": "Nota Henle (*) sulla legatura mi–mi a b. 26: segui quella dell'autografo, come stampato."}, {"id": "op 111 secondo movimento-29-32", "brano": "op111-2", "battute": "29-32", "titolo": "Arietta · Var. I: salti della sinistra e sf finale (1ª e 2ª volta)", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-var1-legato", "nodo_motorio": "Sinistra con salti all'ottava grave dentro il legato (b. 30-31) e portato a b. 31; sf a b. 32 a due mani, seguito da semicrome legate.", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play sui bassi gravi.", "rep3": "Destra sola: DIN dentro la mano."}, "2": {"rep2": "PESO sugli sf di b. 32 a due mani, poi pp.", "rep3": "CHUNK a ritroso: b. 32 (2ª volta) più l'attacco della Var. II."}}, "rep4_verifica": "I bassi gravi arrivano a tempo e senza colpo; lo sf parte dal tasto."}, {"id": "op 111 secondo movimento-33-36", "brano": "op111-2", "battute": "33-36", "titolo": "Arietta · Var. II: figure puntate a mani alternate, mano sinistra nel rigo superiore", "priorita": 6, "famiglia": "op 111 secondo movimento-fam-var2-puntate", "nodo_motorio": "Figure puntate a due voci; a b. 34 la voce inferiore del rigo superiore va alla sinistra («mano sinistra»): le mani lavorano nello stesso registro. A b. 36 «sempre ligato».", "andate": {"1": {"rep2": "Ritmo pareggiato: togli il puntato, tutte le note uguali, per controllare note e consegna tra le mani.", "rep3": "MUTA: la sinistra suona la voce che prende nel rigo superiore, la destra fa da fantasma; poi si scambia."}, "2": {"rep2": "DIN: voce superiore mp, voce della sinistra pp.", "rep3": "CLIC sul levare (2ª croma della battuta da 6/16)."}}, "rep4_verifica": "Il puntato è esatto e identico nelle due mani: la nota corta è corta davvero; le due mani non si urtano nello stesso registro.", "note": "A b. 36 leggo a matita una diteggiatura sopra la destra (forse 4-1 e 4-1-2); non sono sicuro dei numeri."}, {"id": "op 111 secondo movimento-37-40", "brano": "op111-2", "battute": "37-40", "titolo": "Arietta · Var. II: cresc. con sinistra a ottave spezzate (1ª e 2ª volta)", "priorita": 6, "famiglia": "op 111 secondo movimento-fam-var2-puntate", "nodo_motorio": "Destra con terze e figure puntate in cresc.; sinistra a ottave spezzate nel grave, per cui a matita leggo 3-5 ripetuto (b. 37).", "andate": {"1": {"rep2": "Sinistra sola: ROT sulle ottave spezzate, con la tua diteggiatura 3-5.", "rep3": "Destra sola: RIT sulle figure puntate, fermata sulla nota lunga e corta di scatto."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma.", "rep3": "CHUNK: un tempo più la prima nota del successivo, a mani unite."}}, "rep4_verifica": "Ottave della sinistra senza accento sul pollice; crescendo regolare fino a b. 40."}, {"id": "op 111 secondo movimento-41-44", "brano": "op111-2", "battute": "41-44", "titolo": "Arietta · Var. II, seconda metà: doppie note e accordi puntati", "priorita": 6, "famiglia": "op 111 secondo movimento-fam-var2-puntate", "nodo_motorio": "Figure puntate parallele nelle due mani (41); sinistra a due voci con basso tenuto (42); successione di accordi con diteggiature 5/2, 4/1, 5/3/2, 5/4/2 (43); accordi ribattuti puntati in cresc. (44).", "andate": {"1": {"rep2": "BLOC su b. 43: ogni accordo a tempo, cambio di posizione senza guardare.", "rep3": "Sinistra sola su 42: basso tenuto, figura pp."}, "2": {"rep2": "Ribattuti di b. 44 da metà corsa del tasto, senza staccare le dita.", "rep3": "MUTA nelle due direzioni."}}, "rep4_verifica": "Le note di ogni accordo insieme; il basso tenuto di 42 resta giù; ribattuti uguali nel cresc.", "note": "Sotto la sinistra di 41-42 leggo a matita 5 e 4; altrove non riesco a leggere le cifre."}, {"id": "op 111 secondo movimento-45-48", "brano": "op111-2", "battute": "45-48", "titolo": "Arietta · Var. II: sinistra nel registro medio e passaggio alla Var. III", "priorita": 6, "famiglia": "op 111 secondo movimento-fam-var2-puntate", "nodo_motorio": "Sinistra nel registro medio con doppie note e figure puntate, destra con terze; sf>p a b. 48 (1ª e 2ª volta). La 2ª volta passa alla Var. III: L'istesso tempo.", "andate": {"1": {"rep2": "Sinistra sola: DOPPIE a pulsazione dimezzata.", "rep3": "DIN: sinistra mp, destra pp."}, "2": {"rep2": "PESO sugli sf>p di b. 48.", "rep3": "CHUNK a ritroso: b. 48 (2ª volta) più il primo tempo di b. 49."}}, "rep4_verifica": "La pulsazione di b. 48 continua identica a b. 49; il f della Var. III arriva senza preparazione visibile.", "note": "Sotto la sinistra di b. 48 leggo a matita una serie di cifre (forse 5-4-3-4…): non sono sicuro."}, {"id": "op 111 secondo movimento-49-50", "brano": "op111-2", "battute": "49-50", "titolo": "Arietta · Var. III: arpeggi della sinistra dal grave e accordi ribattuti", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-arpeggi", "nodo_motorio": "Sinistra: arpeggi di semibiscrome che partono da un basso profondo, due per battuta; salto e arpeggio in un solo gesto. Destra: terze e accordi ribattuti in ritmo puntato, poi una discesa rapida a fine battuta.", "andate": {"1": {"rep2": "BLOC: ogni arpeggio della sinistra come una o due posizioni a blocco; il salto verso il basso CIECO.", "rep3": "CHUNK: arpeggio della sinistra più il primo accordo della destra che segue, a tempo pieno; durante lo stop la mano è già sulla posizione successiva."}, "2": {"rep2": "Destra sola: ribattuti da metà corsa del tasto con DIN dentro la mano (voce superiore mp, resto pp); la discesa con RIT, fermata sulla 1ª nota e il resto di scatto.", "rep3": "MUTA: sinistra suona, destra fantasma; poi si scambia."}}, "rep4_verifica": "Gli arpeggi partono dal basso senza ritardo e arrivano legati all'accordo; f pieno ma non battuto, ogni accordo con caduta e rilascio; la discesa della destra non accelera.", "note": "Sotto la sinistra di b. 49 leggo a matita alcune cifre (forse 4-3-2-1): non sono sicuro."}, {"id": "op 111 secondo movimento-51-52", "brano": "op111-2", "battute": "51-52", "titolo": "Arietta · Var. III: accordi tenuti, discesa della destra sopra ribattuti gravi", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-arpeggi", "nodo_motorio": "b. 51: accordi della destra puntati e legati di valore, con arpeggi della sinistra (1-5). b. 52: discesa cromatica della destra in semibiscrome sopra ottave e accordi ribattuti della sinistra, poi di nuovo accordi e arpeggio.", "andate": {"1": {"rep2": "Destra sola su 52: RIT su gruppi di 4, fermata sulla 1ª e le altre tre di scatto; poi fermata sulla 2ª.", "rep3": "Sinistra sola: arpeggi di 51-52 con CHUNK, partenza CIECO sul basso."}, "2": {"rep2": "ACC sulla 2ª e sulla 4ª nota di ogni gruppo della destra a 52, il resto pp.", "rep3": "CLIC: un solo clic per battuta."}}, "rep4_verifica": "Discesa di 52 regolare, senza accento sul pollice; i ribattuti della sinistra uguali e sotto la destra."}, {"id": "op 111 secondo movimento-53-55", "brano": "op111-2", "battute": "53-55", "titolo": "Arietta · Var. III: sf su ogni gruppo e salti della sinistra", "priorita": 1, "famiglia": null, "nodo_motorio": "Uno sf per gruppo, sulla nota alta della destra (cerchiata a matita); a b. 55 la sinistra salta a ogni gruppo verso un basso grave (cerchiati a matita). Dopo ogni sf la mano deve tornare morbida.", "andate": {"1": {"rep2": "Senza sf, STAC pp su tutto: mappa delle note.", "rep3": "PESO: sf come impulso del braccio sulla sola nota cerchiata, rilascio immediato, il resto pp."}, "2": {"rep2": "Sinistra sola su 55: CIECO shift–touch–play sui bassi cerchiati.", "rep3": "CHUNK: da uno sf al successivo più la nota sf, a tempo pieno."}}, "rep4_verifica": "Gli sf escono dal braccio, non dalla spalla, e non induriscono il suono; la nota dopo lo sf non viene mangiata; i bassi di 55 arrivano a tempo.", "note": "I cerchi a matita li interpreto come note da curare (sf e salti). Se indicano altro, dimmelo."}, {"id": "op 111 secondo movimento-56-57", "brano": "op111-2", "battute": "56-57", "titolo": "Arietta · Var. III: figure puntate in terze (1ª e 2ª volta) e f/p di b. 57", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-terze", "nodo_motorio": "b. 56: figure puntate in terze e seste nella destra, sinistra in moto parallelo, cromatismi; alla 2ª volta la sinistra scende al grave (3, 4) verso il f di 57. b. 57: scala ascendente della sinistra sotto accordi f, poi melodia p della destra sopra accordi ribattuti.", "andate": {"1": {"rep2": "BLOC: ogni posizione di terze come bicordo, mani unite.", "rep3": "RIT nella sola destra: fermata sulla nota lunga di ogni figura puntata, la corta e l'arrivo di scatto."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma; poi si scambia.", "rep3": "CHUNK a ritroso: ultimo tempo di 56 (2ª volta) più l'attacco f di 57; poi fino al p."}}, "rep4_verifica": "Le due note di ogni terza insieme; puntato netto in entrambe le mani; il p di 57 è davvero p subito dopo il f.", "note": "Sotto la sinistra di 56 (1ª volta) e sopra la destra leggo a matita alcune cifre (2-1-2, 3-3, 4-3-1-2?): non sono sicuro."}, {"id": "op 111 secondo movimento-58-59", "brano": "op111-2", "battute": "58-59", "titolo": "Arietta · Var. III: f/p e semibiscrome in cresc. sopra ottave spezzate", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-terze", "nodo_motorio": "b. 58: terze puntate f della destra con arpeggio ascendente della sinistra, poi melodia p in semibiscrome sopra accordi ribattuti. b. 59: figura continua della destra in cresc., ottave spezzate della sinistra con salti.", "andate": {"1": {"rep2": "Sinistra sola: arpeggio di 58 BLOC e CIECO, poi gli accordi ribattuti p da metà corsa.", "rep3": "Destra sola su 59: ACC sulla 2ª e sulla 4ª di ogni gruppo, pollice pp."}, "2": {"rep2": "RIT nella destra di 58 (parte p) e 59.", "rep3": "CLIC sul levare, tutto il frammento."}}, "rep4_verifica": "Il p di 58 arriva subito dopo il f; il cresc. di 59 viene dal peso, non dall'accelerare; ottave spezzate senza buchi."}, {"id": "op 111 secondo movimento-60-61", "brano": "op111-2", "battute": "60-61", "titolo": "Arietta · Var. III: sf sincopati e arpeggio di b. 61 (MAX 67)", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-arpeggi", "nodo_motorio": "b. 60: sf sincopati, destra con ottave e seste spezzate, sinistra con note lunghe e salti sf (a matita 5-3 e 3-2). b. 61: accordi ribattuti della destra (5/4) e discesa in semibiscrome; arpeggio della sinistra dal grave, poi accordi ribattuti legati.", "andate": {"1": {"rep2": "PESO sugli sf della sinistra (60) e sugli accordi di 61: impulso, rilascio, polso mobile.", "rep3": "CHUNK: arpeggio di 61 più il primo accordo ribattuto."}, "2": {"rep2": "Destra sola su 61: DIN dentro la mano sui ribattuti, poi la discesa con RIT.", "rep3": "CIECO shift–touch–play sui salti della sinistra di 60."}}, "rep4_verifica": "Gli sf sincopati di 60 non anticipano il tempo; l'arpeggio di 61 parte senza ritardo; annota il tempo di Rep 4 accanto al tuo MAX 67.", "note": "MAX 67 a matita sopra b. 61."}, {"id": "op 111 secondo movimento-62-63", "brano": "op111-2", "battute": "62-63", "titolo": "Arietta · Var. III: arpeggio a 9 note della sinistra e doppie note «legg.»", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-arpeggi", "nodo_motorio": "b. 62: accordi ribattuti legati della destra con gruppi sf; arpeggio ascendente della sinistra con la tua diteggiatura a matita 4-2-1-3-2-1-4-2-1. b. 63: doppie note cromatiche della destra (3/2, 4/1, 5/2, 4/1-2) con la tua indicazione «legg.», sf sincopati.", "andate": {"1": {"rep2": "Sinistra sola: arpeggio di 62 BLOC per posizioni (4-2-1 / 3-2-1 / 4-2-1), poi CHUNK.", "rep3": "Destra sola su 63: STAC pp sulle doppie note, poi legato."}, "2": {"rep2": "RIT sull'arpeggio di 62: fermata sulla 1ª di ogni posizione, il resto di scatto.", "rep3": "PESO sugli sf, poi MUTA: sinistra suona, destra fantasma."}}, "rep4_verifica": "Arpeggio senza accenti sui passaggi del pollice; il «legg.» di 63 è davvero leggero dopo gli sf; gli sf sono impulsi e non spinte.", "note": "A b. 63 leggo a matita «legg» e un 3; sotto la sinistra 1-4."}, {"id": "op 111 secondo movimento-64", "brano": "op111-2", "battute": "64", "titolo": "Arietta · Var. III, b. 64 (1ª e 2ª volta, MAX 63) e passaggio alla Var. IV", "priorita": 1, "famiglia": "op 111 secondo movimento-fam-var3-terze", "nodo_motorio": "Destra: voce superiore tenuta con il 5 mentre le note sotto cambiano dito (5/1, 5/2, 5/3), poi terze e accordi puntati; sinistra con accordi ribattuti legati e scala. 2ª volta: dim. e discesa della sinistra al grave, poi 9/16 e pp.", "andate": {"1": {"rep2": "Destra sola: DIN dentro la mano, voce del 5 tenuta mp, note interne ribattute pp.", "rep3": "Sinistra sola: accordi ribattuti legati e scala con CHUNK."}, "2": {"rep2": "MUTA nelle due direzioni.", "rep3": "Solo 2ª volta: CHUNK a ritroso fino al primo tempo della Var. IV (b. 65)."}}, "rep4_verifica": "Annota il tempo di Rep 4 accanto al tuo MAX 63; il passaggio a b. 65 non perde la pulsazione e il pp arriva subito.", "note": "MAX 63 a matita sopra la 1ª volta; MAX (senza numero) sopra la 2ª."}, {"id": "op 111 secondo movimento-65-68", "brano": "op111-2", "battute": "65-68", "titolo": "Arietta · Var. IV: tremolo grave pp e accordi dopo la pausa", "priorita": 3, "famiglia": "op 111 secondo movimento-fam-tremolo-grave", "nodo_motorio": "Sinistra: terzine di biscrome tra basso e quinta/ottava (nove note per tempo), pp e continue. Destra: coppie di accordi legati che entrano dopo una pausa (pause cerchiate a matita a b. 65), sempre pp. Levare compreso.", "andate": {"1": {"rep2": "ROT sulla sinistra: due tempi di sola rotazione, uno di sole dita, alternati, pp.", "rep3": "Destra sola: CIECO shift–touch–play sugli accordi; la pausa contata prima di ogni ingresso."}, "2": {"rep2": "ACC nella sinistra: raggruppa la terzina in 2, poi in 4, il resto pp.", "rep3": "MUTA: sinistra suona, destra fantasma che tocca gli accordi senza abbassarli; poi il contrario."}}, "rep4_verifica": "Tremolo pp senza ronzio né buchi, nove note per tempo; gli accordi entrano esattamente dopo la pausa, tutte le note insieme e un poco sopra la sinistra; nessun accento sul basso.", "note": "A b. 66 c'è un'annotazione a matita con una freccia sul primo accordo che non riesco a leggere."}, {"id": "op 111 secondo movimento-69-71", "brano": "op111-2", "battute": "69-71", "titolo": "Arietta · Var. IV: accordi che salgono al registro medio, bassi che cambiano", "priorita": 3, "famiglia": "op 111 secondo movimento-fam-tremolo-grave", "nodo_motorio": "Accordi della destra con alterazioni (mi♭, si♭) e cambi di chiave: salti di registro tra un accordo e l'altro (69-71). Il basso del tremolo cambia nota (70-71).", "andate": {"1": {"rep2": "Destra sola: BLOC, ogni accordo a tempo, cambio di registro CIECO.", "rep3": "Sinistra sola: fermati sulla prima nota di ogni nuovo basso, poi suona fino al cambio successivo."}, "2": {"rep2": "ROT nella sinistra pp, destra MUTA.", "rep3": "CLIC: un solo clic per battuta."}}, "rep4_verifica": "Gli accordi alti hanno lo stesso pp di quelli gravi; il tremolo non si interrompe ai cambi di basso."}, {"id": "op 111 secondo movimento-81-84", "brano": "op111-2", "battute": "81-84", "titolo": "Arietta · Var. IV: ritorno al grave dopo l'acuto, accordi in chiave di basso", "priorita": 3, "famiglia": "op 111 secondo movimento-fam-tremolo-grave", "nodo_motorio": "Come 65-68, con l'arrivo dall'acuto (b. 80) e il tremolo su do; accordi della destra in chiave di basso (4/2, 3/1, 5/3/1), ingresso dopo la pausa.", "andate": {"1": {"rep2": "ROT sulla sinistra, pp.", "rep3": "Destra sola: CIECO sugli accordi, pausa contata."}, "2": {"rep2": "CHUNK a ritroso: ultimo tempo di 80 più il primo di 81, per l'arrivo nel grave.", "rep3": "MUTA nelle due direzioni."}}, "rep4_verifica": "Il pp di 81 arriva subito, senza assestamento; accordi completi e insieme."}, {"id": "op 111 secondo movimento-85-88", "brano": "op111-2", "battute": "85-88", "titolo": "Arietta · Var. IV: basso in movimento e accordi verso l'acuto", "priorita": 3, "famiglia": "op 111 secondo movimento-fam-tremolo-grave", "nodo_motorio": "Il basso del tremolo si muove (85-87); a b. 88 gli accordi della destra salgono verso la chiave di violino e preparano l'acuto di b. 89.", "andate": {"1": {"rep2": "Sinistra sola: fermati sulla prima nota di ogni nuovo basso, poi suona fino al cambio successivo.", "rep3": "Destra sola: BLOC con cambi di registro CIECO."}, "2": {"rep2": "ACC nella sinistra (terzina raggruppata in 2).", "rep3": "CHUNK a ritroso: ultimo tempo di 88 più il primo di 89."}}, "rep4_verifica": "Tremolo continuo sotto i cambi di basso; il passaggio a b. 89 non spezza la pulsazione."}, {"id": "op 111 secondo movimento-72-75", "brano": "op111-2", "battute": "72-75", "titolo": "Arietta · Var. IV: scala a due mani e biscrome leggere nell'acuto", "priorita": 2, "famiglia": "op 111 secondo movimento-fam-biscrome-acuto", "nodo_motorio": "b. 72: scala ascendente a due mani in terzine di biscrome, cresc., con il pollice su ogni terzina; poi subito pp nell'acuto. Da 73: figura della destra in posizione stretta, molti passaggi del pollice (1-3-1-2…), sinistra staccata leggera.", "andate": {"1": {"rep2": "RIT su terzine: fermata sulla 1ª, le altre due e l'arrivo di scatto; poi fermata sulla 2ª.", "rep3": "ACC: accento sulla 2ª nota di ogni terzina, poi sulla 3ª, il resto pp."}, "2": {"rep2": "Destra sola: STAC pp.", "rep3": "CHUNK: un tempo (nove note) più la prima del successivo, a tempo pieno, con la sinistra staccata."}}, "rep4_verifica": "Le nove note di ogni tempo uguali e udibili in pp; il pollice non si sente come accento; la scala di 72 non accelera nel cresc.; sinistra più leggera della destra.", "note": "A b. 75 leggo a matita un 3 (forse 2-3) sopra la destra."}, {"id": "op 111 secondo movimento-76-80", "brano": "op111-2", "battute": "76-80", "titolo": "Arietta · Var. IV: figure larghe della destra, «sempre staccato»", "priorita": 2, "famiglia": "op 111 secondo movimento-fam-biscrome-acuto", "nodo_motorio": "Figure della destra con salti di sesta e ottava dentro il gruppo (78): la mano si apre e si richiude a velocità. Sinistra «sempre staccato» con doppie note; a b. 80 la sinistra scende al grave e si torna al pp di 81.", "andate": {"1": {"rep2": "BLOC: le posizioni della destra di 78 come accordi.", "rep3": "RIT su terzine, fermata sulla 1ª."}, "2": {"rep2": "ACC: raggruppa in 2 la figura scritta in 3.", "rep3": "CHUNK a ritroso: ultimo tempo di 80 più il primo di 81."}}, "rep4_verifica": "Figure larghe senza buchi tra le posizioni; staccato della sinistra uguale e pp.", "note": "A b. 76-77 leggo a matita qualche cifra sopra la destra (2-3-4?, 2-3?): non sono sicuro."}, {"id": "op 111 secondo movimento-89-92", "brano": "op111-2", "battute": "89-92", "titolo": "Arietta · Var. IV: seconda volta nell'acuto, sinistra ribattuta", "priorita": 2, "famiglia": "op 111 secondo movimento-fam-biscrome-acuto", "nodo_motorio": "Come 72-75, con la figura della destra che sale gradualmente; sinistra ribattuta staccata sulla stessa nota (89-90), poi semicrome senza staccato (91) e salto a 92. A b. 91 hai scritto a matita una tua diteggiatura sopra la destra.", "andate": {"1": {"rep2": "RIT su terzine, fermata sulla 1ª, con la tua diteggiatura di 91.", "rep3": "Sinistra sola: ribattuti pp dal tasto, polso fermo."}, "2": {"rep2": "ACC sulla 2ª nota di ogni terzina.", "rep3": "CHUNK: un tempo più una nota, a mani unite."}}, "rep4_verifica": "Ribattuti della sinistra uguali e sotto la destra; figura della destra uguale nella salita.", "note": "Diteggiatura a matita di b. 91: leggo una serie di 3 e 5 (forse 1-5-5-3-5-3-5-3-3…). Controlla che quella che usi sia quella scritta."}, {"id": "op 111 secondo movimento-93-96", "brano": "op111-2", "battute": "93-96", "titolo": "Arietta · Var. IV: cromatismi della destra e accordi della sinistra", "priorita": 2, "famiglia": "op 111 secondo movimento-fam-biscrome-acuto", "nodo_motorio": "Figure cromatiche della destra con diteggiatura 1-3 fitta (93-94, molte alterazioni); a 96 la sinistra passa ad accordi ribattuti. A b. 96 hai scritto a matita 3, 4, 2-4 e una parola che non leggo.", "andate": {"1": {"rep2": "RIT su terzine sulle sole 93-94.", "rep3": "Destra sola: fermati, tenendo il tasto, sulle note in cui passa il pollice; poi suona fino alla successiva."}, "2": {"rep2": "ACC: accento sulla 3ª nota di ogni terzina.", "rep3": "CHUNK, un tempo più una nota."}}, "rep4_verifica": "Cromatismi senza zoppia e senza accento sul pollice; accordi della sinistra con le note insieme."}, {"id": "op 111 secondo movimento-97-99", "brano": "op111-2", "battute": "97-99", "titolo": "Arietta · Var. IV: fine dell'acuto, interruzione e ripresa", "priorita": 2, "famiglia": "op 111 secondo movimento-fam-biscrome-acuto", "nodo_motorio": "Figura della destra sopra terze ribattute della sinistra (97); a 98 la destra si ferma, la sinistra fa accordi e una discesa rapida (1-1-1), poi la destra riparte (4); 99 su terze ribattute della sinistra.", "andate": {"1": {"rep2": "CHUNK sulla ripresa della destra a 98: ultimo tempo prima della pausa più la ripartenza.", "rep3": "Sinistra sola: terze ribattute STAC pp."}, "2": {"rep2": "RIT su terzine.", "rep3": "MENT sul punto di ripartenza di 98, poi la ripetizione reale."}}, "rep4_verifica": "La ripartenza della destra a 98 è a tempo; terze della sinistra uguali."}, {"id": "op 111 secondo movimento-100-102", "brano": "op111-2", "battute": "100-102", "titolo": "Arietta · Transizione: arpeggi spezzati della sinistra sotto accordi lunghi", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Sinistra in arpeggi spezzati di biscrome (diteggiature 2, 5, 3 stampate) in cresc.; destra accordi lunghi di tre note, poi sf a b. 102.", "andate": {"1": {"rep2": "Sinistra sola: BLOC per posizioni, poi ACC sulla 2ª nota di ogni gruppo.", "rep3": "PESO sugli accordi della destra."}, "2": {"rep2": "Sinistra sola: RIT, fermata sulla 1ª di ogni gruppo.", "rep3": "MUTA: sinistra suona, destra fantasma."}}, "rep4_verifica": "Cresc. della sinistra uniforme, senza accenti sul pollice; accordi della destra completi."}, {"id": "op 111 secondo movimento-103-105", "brano": "op111-2", "battute": "103-105", "titolo": "Arietta · Arpeggi passati da sinistra a destra col pedale, verso sf", "priorita": 1, "famiglia": null, "nodo_motorio": "Arpeggi che partono dal grave nella sinistra e proseguono nella destra (cambi di chiave), cresc. fino allo sf; poi figure della destra nell'acuto. A b. 105 due arpeggi della sinistra dal grave profondo (3, 4). Pedale scritto.", "andate": {"1": {"rep2": "BLOC: la porzione della sinistra come accordo, quella della destra come accordo, a tempo.", "rep3": "CHUNK con stop sulla prima nota della destra; quella nota volutamente pp."}, "2": {"rep2": "Sinistra sola su 105: CIECO shift–touch–play sui bassi profondi.", "rep3": "MENT, poi RIT con fermata sulla nota di consegna tra le mani."}}, "rep4_verifica": "Il punto di consegna tra le mani non si sente; lo sf arriva senza ritardo e senza durezza; pedale cambiato dove scritto."}, {"id": "op 111 secondo movimento-106-111", "brano": "op111-2", "battute": "106-111", "titolo": "Arietta · Trillo lungo della destra con melodia sopra", "priorita": 4, "famiglia": "op 111 secondo movimento-fam-trilli-melodia", "nodo_motorio": "Trillo su re con le dita interne (13 stampato, a matita 2-3), f e poi p, per sei battute; da 107 il 4-5 della stessa mano canta la melodia sopra il trillo; la sinistra suona note ribattute nello stesso registro (109-110) e scende al si♭ (53).", "andate": {"1": {"rep2": "TRILL misurato: 2 note per semicroma, poi 3; partenza dalla nota reale.", "rep3": "Melodia sola della destra con il trillo ridotto alla nota tenuta, voce superiore cantabile."}, "2": {"rep2": "TRILL pp con la voce superiore solo appoggiata (muta), poi melodia mp sopra trillo pp.", "rep3": "Insieme, DIN: sinistra pp, melodia mp, trillo pp."}}, "rep4_verifica": "Trillo continuo, uniforme e sotto il canto; non si ferma quando il 4-5 attacca una nota; i ribattuti della sinistra non urtano il trillo.", "note": "Il 13 stampato e il 23 a matita: Rep 2 e Rep 3 sempre con quella che usi a tempo."}, {"id": "op 111 secondo movimento-112-115", "brano": "op111-2", "battute": "112-115", "titolo": "Arietta · Trilli simultanei nelle due mani, poi trillo con melodia", "priorita": 4, "famiglia": "op 111 secondo movimento-fam-trilli-melodia", "nodo_motorio": "Trillo nella destra (5-4) e nella sinistra (1-2) insieme, ciascuno con un'altra voce tenuta (112-113, con ossia); poi il trillo della destra prosegue sotto la melodia (54, 24), p cresc.", "andate": {"1": {"rep2": "TRILL a mani separate, ciascuna con la sua voce tenuta, pp.", "rep3": "Insieme, con i due trilli misurati: 2 note per semicroma in entrambe le mani."}, "2": {"rep2": "Una mano trilla, l'altra MUTA; poi si scambia.", "rep3": "Su 114-115: melodia con trillo ridotto alla nota reale, poi TRILL misurato."}}, "rep4_verifica": "Le voci tenute restano giù per tutta la durata; i due trilli non si sincronizzano a forza ma restano entrambi regolari; il cresc. di 115 è della melodia, non del trillo.", "note": "Ossia di b. 112: scegline una e usala sempre in Rep 2-4.", "trillo_3_5": true}, {"id": "op 111 secondo movimento-116-119", "brano": "op111-2", "battute": "116-119", "titolo": "Arietta · Fine del trillo in mi♭ e melodia a salti", "priorita": 4, "famiglia": "op 111 secondo movimento-fam-trilli-melodia", "nodo_motorio": "Trillo (13) con sf e passaggio a mi♭ maggiore; poi melodia p cresc. con salti ampi (52) e accordi (14, 51, 32), dim.; sinistra a bassi e ottave dopo lo sf>p.", "andate": {"1": {"rep2": "TRILL misurato con sf solo sull'attacco.", "rep3": "Destra sola su 118-119: CIECO shift–touch–play sui salti della melodia."}, "2": {"rep2": "PESO sugli sf della sinistra (116-117).", "rep3": "MENT su 118-119, poi la ripetizione reale."}}, "rep4_verifica": "Chiusa del trillo a tempo; salti della melodia legati all'orecchio, senza buchi."}, {"id": "op 111 secondo movimento-120-123", "brano": "op111-2", "battute": "120-123", "titolo": "Arietta · Episodio in mi♭: accordi ribattuti espressivo", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-ribattuti-canto", "nodo_motorio": "Accordi ribattuti in semicrome della destra con la melodia nella voce superiore (espressivo, p, dim., pp); sinistra con bassi e accordi che entrano in levare dopo una pausa.", "andate": {"1": {"rep2": "Ribattuti da metà corsa del tasto, con DIN dentro la mano: voce superiore mp, resto pp.", "rep3": "Sinistra sola: CIECO shift–touch–play sugli ingressi dopo la pausa."}, "2": {"rep2": "DIN tra le mani: sinistra pp.", "rep3": "CLIC sul levare."}}, "rep4_verifica": "Ribattuti uguali e sotto la melodia; nessun accordo arpeggiato; il pp di 123 senza note che non parlano."}, {"id": "op 111 secondo movimento-124-127", "brano": "op111-2", "battute": "124-127", "titolo": "Arietta · Episodio in mi♭: doppie note legate pp", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-ribattuti-canto", "nodo_motorio": "Come 120-123, con doppie note della destra legate con sostituzioni (3/2, 4/1, 5/3/1, 2/1) in pp.", "andate": {"1": {"rep2": "Voce superiore legata, inferiore staccata.", "rep3": "Il contrario."}, "2": {"rep2": "DIN dentro la mano.", "rep3": "CIECO sulle sostituzioni."}}, "rep4_verifica": "Legato vero in tutte e due le voci senza pedale; sempre pp."}, {"id": "op 111 secondo movimento-128-130", "brano": "op111-2", "battute": "128-130", "titolo": "Arietta · Ribattuti e tremolo della sinistra, arpeggio verso la Var. V", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Accordi della destra con sostituzioni (5/3/1, 3/1, 3/2); a 129 la sinistra fa ribattuti rapidi a terzine, a 130 un tremolo d'ottava e un arpeggio di semibiscrome (5-1-2-4) che porta alla Var. V; cresc.", "andate": {"1": {"rep2": "Sinistra sola: ROT sul tremolo di 130, poi l'arpeggio con CHUNK.", "rep3": "Ribattuti di 129 da metà corsa del tasto."}, "2": {"rep2": "ACC sui ribattuti (raggruppa in 2).", "rep3": "CHUNK a ritroso: arpeggio di 130 più il primo tempo di 131."}}, "rep4_verifica": "Cresc. dal peso; l'arrivo a 131 è a tempo, senza rallentare."}, {"id": "op 111 secondo movimento-131-134", "brano": "op111-2", "battute": "131-134", "titolo": "Arietta · Var. V: tema sopra terzine continue della sinistra", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Destra: tema nella voce superiore tenuta (5, poi sostituzione col 2) sopra semicrome interne portato (1-2-1). Sinistra: terzine di biscrome in figure spezzate larghe, pp-p, uniformi. Sotto la sinistra di 131-133 hai scritto a matita la tua diteggiatura.", "andate": {"1": {"rep2": "Sinistra sola: ACC sulla 2ª nota di ogni terzina, poi sulla 3ª, pp.", "rep3": "Destra sola: DIN dentro la mano, tema mp, semicrome interne pp."}, "2": {"rep2": "Sinistra sola: BLOC per posizioni, CIECO.", "rep3": "MUTA: destra suona, sinistra fantasma; poi il contrario."}}, "rep4_verifica": "La sinistra è un fondo uniforme sotto il tema; il portato delle semicrome interne è leggero; il tema lega con la sostituzione 5-2.", "note": "Matita sotto la sinistra di 131-133: leggo 4, 3/4, 5, 5 e 2, 3-4-5(?). Valgono le tue."}, {"id": "op 111 secondo movimento-135-138", "brano": "op111-2", "battute": "135-138", "titolo": "Arietta · Var. V: f, sf e figure della sinistra più larghe", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Come 131-134, in f (135), sf (136) e p (137); figure della sinistra più larghe, con basso grave e salto (135).", "andate": {"1": {"rep2": "Sinistra sola: RIT su terzine, fermata sulla 1ª.", "rep3": "DIN tra le mani: destra mp, sinistra pp."}, "2": {"rep2": "Sinistra sola: CIECO sui bassi.", "rep3": "PESO sugli sf della destra."}}, "rep4_verifica": "Il f e lo sf vengono dal braccio, la sinistra non si indurisce; il p di 137 arriva subito."}, {"id": "op 111 secondo movimento-139-142", "brano": "op111-2", "battute": "139-142", "titolo": "Arietta · Var. V: cresc. e punto cerchiato della sinistra", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Cresc. su figure della sinistra che cambiano posizione; il gruppo finale di b. 139 è cerchiato a matita; sf>p a 141-142.", "andate": {"1": {"rep2": "Sinistra sola sul gruppo cerchiato di 139: RIT con fermata sulla 1ª e sulla 3ª.", "rep3": "Sinistra sola: CHUNK, un tempo più una nota."}, "2": {"rep2": "ACC nella sinistra.", "rep3": "MUTA: destra suona, sinistra fantasma."}}, "rep4_verifica": "Il gruppo cerchiato di 139 è uguale agli altri; il cresc. non accelera; sf>p netto.", "note": "Interpreto il cerchio di b. 139 come punto in cui ti sporchi. Se indica altro, dimmelo."}, {"id": "op 111 secondo movimento-143-146", "brano": "op111-2", "battute": "143-146", "titolo": "Arietta · Var. V: sinistra nel grave profondo, sf>p", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Sinistra in figure dal registro più grave (143-145), con arpeggio dal basso (145); destra con accordi e cresc.; sf>p a 146. Le cifre romane a matita (VII, V, I) sono analisi armonica, non diteggiature.", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play sui bassi profondi.", "rep3": "Destra sola: DIN dentro la mano."}, "2": {"rep2": "ACC nella sinistra.", "rep3": "PESO sugli sf>p."}}, "rep4_verifica": "Bassi profondi a tempo e senza colpo; il p dopo lo sf arriva subito."}, {"id": "op 111 secondo movimento-147-150", "brano": "op111-2", "battute": "147-150", "titolo": "Arietta · Var. V: sf>p ripetuti e cresc.", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Alternanza sf>p (147-148) su figure della sinistra in cambio continuo di posizione; cresc. a 148-149; a 150 la sinistra sale.", "andate": {"1": {"rep2": "Sinistra sola: RIT su terzine.", "rep3": "PESO sugli sf della destra, sinistra pp."}, "2": {"rep2": "CLIC: un solo clic per battuta.", "rep3": "MUTA nelle due direzioni."}}, "rep4_verifica": "Ogni sf>p ha subito il suo p; la sinistra resta uguale durante gli sf.", "note": "A b. 150 leggo a matita «6?» con una freccia sotto la sinistra: non so cosa indichi."}, {"id": "op 111 secondo movimento-151-154", "brano": "op111-2", "battute": "151-154", "titolo": "Arietta · Var. V: la figura continua passa alla destra", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "sf a 151: la figura continua passa alla destra nell'acuto, mentre la sinistra suona accordi e ottave (54); sf>p a 152-153; a 154 p cresc. e la figura torna alla sinistra.", "andate": {"1": {"rep2": "Destra sola: ACC sulla 2ª nota di ogni terzina, pp.", "rep3": "Sinistra sola: PESO sugli accordi."}, "2": {"rep2": "RIT nella destra.", "rep3": "CHUNK a ritroso: ultimo tempo di 153 più l'ingresso della figura nella sinistra a 154."}}, "rep4_verifica": "Il passaggio della figura da una mano all'altra non si sente; sf>p netti."}, {"id": "op 111 secondo movimento-155-159", "brano": "op111-2", "battute": "155-159", "titolo": "Arietta · Var. V: ribattuti acuti, f e sf sui tempi deboli", "priorita": 5, "famiglia": "op 111 secondo movimento-fam-sx-continua", "nodo_motorio": "Destra con terze e accordi ribattuti nell'acuto con melodia (155-157), f a 158, accordi sf sui tempi deboli a 159; sinistra continua. 159 porta all'arpeggio e al trillo di b. 160.", "andate": {"1": {"rep2": "Ribattuti da metà corsa del tasto, DIN dentro la mano.", "rep3": "Sinistra sola: ACC sulla 2ª nota."}, "2": {"rep2": "PESO sugli sf di 159.", "rep3": "CHUNK a ritroso: ultimo tempo di 159 più l'arpeggio di 160."}}, "rep4_verifica": "Ribattuti uguali e sotto la melodia; gli sf di 159 non anticipano; la sinistra non si ferma."}, {"id": "op 111 secondo movimento-160-164", "brano": "op111-2", "battute": "160-164", "titolo": "Arietta · Coda: ingresso del trillo nell'acuto e canto sotto il trillo", "priorita": 4, "famiglia": "op 111 secondo movimento-fam-trilli-melodia", "nodo_motorio": "Arpeggio della sinistra (5) verso l'acuto; trillo della destra (13), abbellimento (2-1-2) e trillo con 3-5 sf>pp; da 161 trillo con 4-5 nella voce superiore mentre la stessa mano suona il canto sotto; sinistra in biscrome pp (2-4).", "andate": {"1": {"rep2": "TRILL misurato: 2 note per semicroma, poi 3; voce del canto tenuta, pp.", "rep3": "Canto della destra con il trillo ridotto alla nota reale; sinistra MUTA."}, "2": {"rep2": "Una mano con la sua parte, l'altra MUTA; poi si scambia.", "rep3": "CHUNK sull'ingresso: arpeggio di 160 più l'attacco del trillo."}}, "rep4_verifica": "Il trillo non si interrompe quando il canto cambia nota; sf>pp con il pp vero; il canto si sente sotto il trillo.", "note": "Tienili a pp in Rep 2-3: i trilli con 3-5 e 4-5 e voce tenuta sono i più faticosi del movimento.", "trillo_3_5": true}, {"id": "op 111 secondo movimento-165-168", "brano": "op111-2", "battute": "165-168", "titolo": "Arietta · Coda: il trillo passa sotto, melodia sopra", "priorita": 4, "famiglia": "op 111 secondo movimento-fam-trilli-melodia", "nodo_motorio": "Alla fine di 165 il trillo passa alla voce inferiore (13, 24) e la melodia sale sopra (4, 54, 5); sinistra in biscrome con diteggiature 5-2-5-1-2, 1-2, 4-2.", "andate": {"1": {"rep2": "TRILL con 1-3 e 2-4, voce superiore tenuta muta.", "rep3": "Melodia sola con il trillo ridotto alla nota reale."}, "2": {"rep2": "Sinistra sola: ACC sulla 2ª nota.", "rep3": "Insieme, DIN: melodia mp, trillo e sinistra pp."}}, "rep4_verifica": "Cambio di voce del trillo a 165 senza buco; la melodia sopra canta e il trillo resta sotto."}, {"id": "op 111 secondo movimento-169-171", "brano": "op111-2", "battute": "169-171", "titolo": "Arietta · Coda: trillo e figure della sinistra con bassi", "priorita": 4, "famiglia": "op 111 secondo movimento-fam-trilli-melodia", "nodo_motorio": "Trillo della destra (35, 45; poi 23, 12, 13, 25) con la melodia; sinistra in figure larghe in chiave di basso (169) e poi ribattuti con un basso grave a ogni tempo (171).", "andate": {"1": {"rep2": "TRILL misurato con voce tenuta.", "rep3": "Sinistra sola su 171: CIECO shift–touch–play sui bassi."}, "2": {"rep2": "Una mano con la sua parte, l'altra MUTA.", "rep3": "CHUNK a ritroso: ultimo tempo di 171 più il primo di 172."}}, "rep4_verifica": "Il trillo non si ferma quando la sinistra salta; arrivo al pp di 172 senza assestamento.", "trillo_3_5": true}, {"id": "op 111 secondo movimento-172-174", "brano": "op111-2", "battute": "172-174", "titolo": "Arietta · Coda: figure parallele a due mani, pp", "priorita": 2, "famiglia": null, "nodo_motorio": "Figura veloce della destra in pp; la sinistra entra al 2° tempo con una figura parallela, non all'unisono; 173 nell'acuto (8va); a 174 discesa a due mani cresc. (sinistra 1-2-3). Le diteggiature delle due mani non sono speculari. Hai riscritto a matita la diteggiatura della destra (172-173) e cerchiato la fine di 173 nelle due mani.", "andate": {"1": {"rep2": "NODO: fermati sui punti in cui una mano passa il pollice e l'altra no.", "rep3": "MUTA: sinistra suona, destra fantasma; poi il contrario."}, "2": {"rep2": "RIT con fermata sulla 1ª di ogni gruppo di 3.", "rep3": "ALT: un tempo a testa, a tempo, senza perdere la pulsazione (qui su figure parallele, non all'unisono)."}}, "rep4_verifica": "Le due mani suonano come una sola, in pp; la fine di 173 (cerchiata) ha la stessa regolarità del resto; il cresc. di 174 non accelera.", "note": "Matita sopra la destra di 172-173: leggo 1-3-2-1… e 1-3-1-2-1-2-3. Controlla sul tuo spartito: valgono le tue."}, {"id": "op 111 secondo movimento-175-177", "brano": "op111-2", "battute": "175-177", "titolo": "Arietta · Coda: f, sf e accordi finali pp", "priorita": 7, "famiglia": null, "nodo_motorio": "f e sf con salti: figura della destra (4-1, 5-2), ottava grave della sinistra sf; poi accordi a due mani p, dim., pp finale.", "andate": {"1": {"rep2": "CIECO shift–touch–play sui salti di 175.", "rep3": "PESO sugli accordi di 176-177."}, "2": {"rep2": "MENT, poi la ripetizione reale.", "rep3": "DIN dentro la mano sugli accordi finali."}}, "rep4_verifica": "Accordi finali con tutte le note insieme in pp; sf dal tasto."}, {"id": "mephisto-1-16", "brano": "mephisto", "battute": "1-16", "titolo": "Quinte ribattute con acciaccatura: sinistra, poi destra", "priorita": 4, "famiglia": "mephisto-fam-quinte-ribattute", "nodo_motorio": "Tre crome ribattute per battuta per quindici battute: prima una nota, poi la quinta, poi accordi, con l'acciaccatura sul battere accentato. La destra entra a b. 10. Il rischio è tenere l'avambraccio contratto tra un ribattuto e l'altro.", "andate": {"1": {"rep2": "PESO: un impulso sul battere accentato, le altre due crome di rimbalzo dallo stesso gesto, da metà corsa del tasto. Sinistra sola fino a b. 9, poi insieme.", "rep3": "DIN: sinistra mp, destra pp (da b. 10). Acciaccatura e nota reale in un solo gesto, senza colpo di polso separato."}, "2": {"rep2": "ACC: accento sulla 2ª croma di ogni battuta, poi sulla 3ª; il battere pp.", "rep3": "CLIC: un solo clic per battuta, raggruppando a quattro battute come indicano le cifre (1)-(4) stampate."}}, "rep4_verifica": "Ribattuti uguali, nessuna croma che manca. A b. 16 l'avambraccio è morbido come a b. 2. Il crescendo viene dalle note che si aggiungono, non dalla pressione.", "note": "Peters p. 70, sistema 1 batt. 1 – sistema 2 batt. 7.\nLa b. 1 è vuota (cifra 1). Le cifre (1)-(4) indicano l'accentuazione ritmica a gruppi di quattro battute (nota Peters)."}, {"id": "mephisto-17-29", "brano": "mephisto", "battute": "17-29", "titolo": "Accordi arpeggiati sf con caduta sulla nota grave", "priorita": 4, "famiglia": "mephisto-fam-accordi-arpeggiati-sf", "nodo_motorio": "Destra: accordo arpeggiato e accentato, legato a una croma più bassa; da b. 23 la caduta arriva a un bicordo grave. Sinistra: accordo di quinte ribattuto tre volte per battuta, nove battute di fila in f, poi p.", "andate": {"1": {"rep2": "Sinistra sola, PESO: un impulso per battuta e due rimbalzi. Fermati a b. 22 tenendo l'accordo: il polso deve potersi muovere su e giù.", "rep3": "Destra sola, CIECO shift–touch–play sulla caduta dall'accordo alla croma grave: suona l'accordo, sposta, tocca muto, suona."}, "2": {"rep2": "Insieme, DIN: destra f, sinistra pp di rimbalzo.", "rep3": "BLOC: accordo della destra non arpeggiato sul battere e nota d'arrivo sulla 3ª croma, senza guardare. Poi con l'arpeggio rapido."}}, "rep4_verifica": "L'arpeggio dell'accordo è rapido e arriva insieme alla sinistra. La croma d'arrivo è corta ma udibile. A b. 25 la sinistra non ha aumentato la pressione.", "note": "Peters p. 70, sistema 2 batt. 8 – sistema 3 batt. 10."}, {"id": "mephisto-30-34", "brano": "mephisto", "battute": "30-34", "titolo": "Terzine di semicrome a mani parallele verso croma staccata", "priorita": 5, "famiglia": null, "nodo_motorio": "Tre semicrome rapide a mani unite che finiscono su una croma staccata; ogni gruppo parte da una posizione nuova, un grado più su. p leggiero.", "andate": {"1": {"rep2": "BLOC muto: tocca in silenzio le tre note più l'arrivo con entrambe le mani, poi suonale come un unico impulso che finisce sulla croma.", "rep3": "RIT: fermata sulla 1ª nota della terzina, le altre di scatto; poi fermata sulla 2ª."}, "2": {"rep2": "MUTA: sinistra suona, destra fantasma; poi il contrario.", "rep3": "CHUNK: terzina più croma d'arrivo a tempo pieno, stop con le mani già sulla terzina seguente."}}, "rep4_verifica": "Tre note distinte in ogni terzina, mani esattamente insieme, croma d'arrivo corta e a tempo.", "note": "Peters p. 70, sistema 4 batt. 1 – sistema 4 batt. 5."}, {"id": "mephisto-35-49", "brano": "mephisto", "battute": "35-49", "titolo": "Quinte ribattute con acciaccatura (ripresa dell'apertura)", "priorita": 4, "famiglia": "mephisto-fam-quinte-ribattute", "nodo_motorio": "Come 1-16: tre crome ribattute per battuta, prima nota sola, poi quinta, poi accordi con acciaccatura. La destra entra a b. 43. Il rischio è tenere l'avambraccio contratto tra un ribattuto e l'altro.", "andate": {"1": {"rep2": "PESO: un impulso sul battere accentato, le altre due crome di rimbalzo dallo stesso gesto, da metà corsa del tasto. Sinistra sola fino a b. 42, poi insieme.", "rep3": "DIN: sinistra mp, destra pp (da b. 43). Acciaccatura e nota reale in un solo gesto, senza colpo di polso separato."}, "2": {"rep2": "ACC: accento sulla 2ª croma di ogni battuta, poi sulla 3ª; il battere pp.", "rep3": "CLIC: un solo clic per battuta, raggruppando a quattro battute come indicano le cifre (1)-(4) stampate."}}, "rep4_verifica": "Ribattuti uguali, nessuna croma che manca. A b. 49 l'avambraccio è morbido come a b. 35. Il crescendo viene dalle note che si aggiungono, non dalla pressione.", "note": "Peters p. 70 sistema 4 batt. 6 – p. 71 sistema 1 batt. 3.\nRipresa accorciata di 2-16: stesso lavoro. La destra entra a b. 43."}, {"id": "mephisto-50-62", "brano": "mephisto", "battute": "50-62", "titolo": "Accordi arpeggiati sf con caduta sulla nota grave (ripresa)", "priorita": 4, "famiglia": "mephisto-fam-accordi-arpeggiati-sf", "nodo_motorio": "Come 17-29. Destra: accordo arpeggiato e accentato, legato a una croma più bassa, poi caduta sul bicordo grave. Sinistra: accordo ribattuto tre volte per battuta in f, poi p.", "andate": {"1": {"rep2": "Sinistra sola, PESO: un impulso per battuta e due rimbalzi. Fermati a b. 55 tenendo l'accordo: il polso deve potersi muovere su e giù.", "rep3": "Destra sola, CIECO shift–touch–play sulla caduta dall'accordo alla croma grave: suona l'accordo, sposta, tocca muto, suona."}, "2": {"rep2": "Insieme, DIN: destra f, sinistra pp di rimbalzo.", "rep3": "BLOC: accordo della destra non arpeggiato sul battere e nota d'arrivo sulla 3ª croma, senza guardare. Poi con l'arpeggio rapido."}}, "rep4_verifica": "L'arpeggio dell'accordo è rapido e arriva insieme alla sinistra. La croma d'arrivo è corta ma udibile. A b. 58 la sinistra non ha aumentato la pressione.", "note": "Peters p. 71, sistema 1 batt. 4 – sistema 2 batt. 7.\nRipresa di 17-29: stesso lavoro. La b. 62 è vuota (cifra 1)."}, {"id": "mephisto-63-74", "brano": "mephisto", "battute": "63-74", "titolo": "Terzine d'anacrusi, poi ottava e nota interna staccate", "priorita": 6, "famiglia": "mephisto-fam-ottava-nota-interna", "nodo_motorio": "63-66: terzine come a 30-34. Da 67: ottava sul battere e nota interna (dito 2) sulla 3ª croma, staccate, a mani parallele; la posizione sale di un semitono quasi a ogni battuta. L'ottava tende a restare aperta e tesa mentre suona il 2. 73-74: tre crome a zigzag.", "andate": {"1": {"rep2": "BLOC: ottava e nota interna insieme, come accordo di tre suoni, una posizione per battuta, a mani unite e senza guardare.", "rep3": "STAC pp: ogni croma dal tasto. Dopo l'ottava la mano si richiude prima che il 2 suoni."}, "2": {"rep2": "DIN dentro la mano: solo pollici e 2 (senza mignoli), poi solo mignoli e 2.", "rep3": "CHUNK: due battute più l'ottava seguente a tempo pieno, stop con le mani già sulla posizione nuova. Terzine 63-66: RIT con fermata sulla 1ª nota."}}, "rep4_verifica": "Ottave complete (nessun mignolo che manca), nota interna leggera, mani insieme. La mano si richiude tra una battuta e l'altra. p sempre.", "note": "Peters p. 71, sistema 2 batt. 8 – sistema 4 batt. 2."}, {"id": "mephisto-75-86", "brano": "mephisto", "battute": "75-86", "titolo": "Ottava e nota interna staccate, un'ottava sopra, poco a poco crescendo", "priorita": 6, "famiglia": "mephisto-fam-ottava-nota-interna", "nodo_motorio": "Come 67-74, un'ottava sopra: ottava sul battere e nota interna (dito 2) sulla 3ª croma, staccate, a mani parallele, con la posizione che sale per semitoni. 81-82: tre crome a zigzag. Da 83 poco a poco crescendo.", "andate": {"1": {"rep2": "BLOC: ottava e nota interna insieme, come accordo di tre suoni, una posizione per battuta, a mani unite e senza guardare.", "rep3": "STAC pp: ogni croma dal tasto. Dopo l'ottava la mano si richiude prima che il 2 suoni."}, "2": {"rep2": "DIN dentro la mano: solo pollici e 2 (senza mignoli), poi solo mignoli e 2.", "rep3": "CHUNK: due battute più l'ottava seguente a tempo pieno, stop con le mani già sulla posizione nuova. Il crescendo solo in Rep 4."}}, "rep4_verifica": "Ottave complete (nessun mignolo che manca), nota interna leggera, mani insieme. La mano si richiude tra una battuta e l'altra. Il crescendo di 83-86 non apre la mano.", "note": "Peters p. 71, sistema 4 batt. 3 – sistema 5 batt. 5."}, {"id": "mephisto-87-98", "brano": "mephisto", "battute": "87-98", "titolo": "Accordi a ritmo puntato a due mani e richiami marcatissimo", "priorita": 4, "famiglia": null, "nodo_motorio": "87-93: accordi pieni a due mani in ritmo puntato (accordo, pausa, accordo corto, accordo), poi accordi ribattuti in f. 94-98: il richiamo mi–do# marcatissimo della destra alternato alle crome della sinistra.", "andate": {"1": {"rep2": "PESO: accordo lungo con caduta e rilascio immediato; il corto e il successivo di rimbalzo, da metà corsa del tasto.", "rep3": "BLOC muto sulle forme: tocca in silenzio gli accordi di 87-93 uno per battuta, senza guardare; poi suonali una volta per battuta."}, "2": {"rep2": "DIN dentro la mano: voce superiore suonata e resto dell'accordo muto; poi il contrario.", "rep3": "CLIC: un solo clic per battuta; l'accordo corto non anticipa."}}, "rep4_verifica": "Accordi completi e insieme, accordo corto breve ma udibile. In 94-98 mi–do# è un gesto solo caduta–risalita, senza colpo sul do#.", "note": "Peters p. 71, sistema 5 batt. 6 – sistema 6 batt. 9."}, {"id": "mephisto-99-110", "brano": "mephisto", "battute": "99-110", "titolo": "Mi ribattuto con acciaccatura, crescendo pesante e arpeggio di semicrome", "priorita": 4, "famiglia": null, "nodo_motorio": "Destra: nota e poi accordi ribattuti in crescendo per otto battute; da 107 arpeggio di semicrome che sale per tre ottave con passaggi del pollice. Sinistra: ottave e accordi ribattuti «pesante» da b. 104.", "andate": {"1": {"rep2": "Sinistra sola 104-110, PESO: un impulso per battuta e due rimbalzi; il polso si muove mentre ribatti.", "rep3": "Destra sola 107-110, BLOC: ogni posizione dell'arpeggio come accordo, cambio senza guardare. Poi RIT con fermata sulla nota prima di ogni pollice."}, "2": {"rep2": "Insieme 99-106, ACC: accento sulla 2ª croma, poi sulla 3ª.", "rep3": "CHUNK a ritroso sull'arpeggio: ultima battuta più l'arrivo, ultime due, ultime tre. Sinistra come scritta, mp."}}, "rep4_verifica": "Crescendo senza accelerare. Arpeggio regolare ai passaggi del pollice. La sinistra arriva a b. 110 senza aver indurito l'avambraccio.", "note": "Peters p. 72, sistema 1 batt. 1 – sistema 2 batt. 5."}, {"id": "mephisto-111-126", "brano": "mephisto", "battute": "111-126", "titolo": "Tema marcato in registro di tenore, destra «sopra», terze ribattute", "priorita": 4, "famiglia": "mephisto-fam-tema-tenore", "nodo_motorio": "La destra suona il tema nel registro della sinistra e in 115-118 (e 123-126) passa «sopra»: le mani si sovrappongono mentre la sinistra ribatte terze tre volte per battuta. A 119 la sinistra salta sull'accordo sf.", "andate": {"1": {"rep2": "Sinistra sola: terze ribattute STAC pp da metà corsa del tasto; salto sull'accordo sf con CIECO shift–touch–play.", "rep3": "Insieme, sinistra MUTA: tema della destra con le sue articolazioni (legature a due, staccati), sinistra che tocca le terze senza abbassarle."}, "2": {"rep2": "DIN: destra f marcato, sinistra pp. Nei punti «sopra» decidi l'altezza dei polsi (destra alta, sinistra bassa e più dentro i tasti) e non cambiarla.", "rep3": "RIT sulle due semicrome del tema (113-114, 121-122): fermata sulla croma che le precede, semicrome di scatto."}}, "rep4_verifica": "Tema sempre sopra l'accompagnamento. Nessuna collisione tra le mani nei punti «sopra». Terze della sinistra uguali. Accordo sf completo e a tempo.", "note": "Peters p. 72, sistema 2 batt. 6 – sistema 5 batt. 3."}, {"id": "mephisto-127-136", "brano": "mephisto", "battute": "127-136", "titolo": "Tema che sale: acciaccature, accordi arpeggiati e accordo sf grave", "priorita": 4, "famiglia": "mephisto-fam-tema-tenore", "nodo_motorio": "Acciaccatura e nota tenuta ripetute in crescendo sopra accordi ribattuti della sinistra; poi due accordi arpeggiati, l'accordo in ottava alta e il salto di tutte e due le mani sull'accordo sf di b. 136.", "andate": {"1": {"rep2": "CIECO shift–touch–play sugli ultimi quattro accordi (133-136), a mani unite.", "rep3": "Sinistra sola 128-134, PESO: un impulso per battuta e due rimbalzi."}, "2": {"rep2": "MENT su 133-136, poi reale.", "rep3": "BLOC: accordi di 133-136 non arpeggiati, uno per battuta, senza guardare; poi con l'arpeggio rapido."}}, "rep4_verifica": "Crescendo senza irrigidire la sinistra. Accordi arpeggiati che finiscono sul tempo. Accordo di b. 136 pieno e preso dal tasto.", "note": "Peters p. 72, sistema 5 batt. 4 – sistema 6 batt. 6."}, {"id": "mephisto-137-144", "brano": "mephisto", "battute": "137-144", "titolo": "Con brio rapido: acciaccature saltate tra le mani e arpeggio discendente", "priorita": 1, "famiglia": "mephisto-fam-acciaccature-rapido", "nodo_motorio": "Dopo l'accordo ff le due mani si passano quattro acciaccature con nota staccata, ognuna in un registro diverso: quattro salti in due battute. Poi salto all'accordo in ottava alta e arpeggio discendente di semicrome su accordi della sinistra. Tutto due volte.", "andate": {"1": {"rep2": "BLOC: acciaccatura e nota reale come bicordo. Suona i quattro bicordi in crome nell'ordine scritto, mano per mano, senza guardare; poi aggiungi l'accordo di b. 139.", "rep3": "CIECO shift–touch–play su ogni salto: suona un gruppo, sposta di scatto, tocca muto il seguente, controlla, suona."}, "2": {"rep2": "MENT: due battute mentali a tempo con le distanze immaginate, poi reali.", "rep3": "CHUNK: 137-138 più l'accordo di 139 a tempo pieno, stop sull'accordo. Poi arpeggio 139-140 con RIT (fermata sulla 1ª nota di ogni posizione)."}}, "rep4_verifica": "Ogni acciaccatura attaccata alla sua nota, nessun salto corto. Accordo di b. 139 preso dal tasto. Arpeggio regolare fino all'ultima nota.", "note": "Peters p. 73, sistema 1 batt. 1 – sistema 2 batt. 2.\nSopra il rigo c'è una «Leichtere Ausführung» (versione facilitata): ho analizzato il testo principale."}, {"id": "mephisto-145-156", "brano": "mephisto", "battute": "145-156", "titolo": "Sf rinforzando con sinistra a salti; coppie di biscrome scherzando", "priorita": 3, "famiglia": "mephisto-fam-sf-scherzando", "nodo_motorio": "145-148 e 153-156: la destra alterna accordo staccato e figura di due semicrome più croma; la sinistra fa tre crome staccate basso–alto–basso per battuta, con due salti. 149-152: tre coppie legate di biscrome per battuta (4-3, 3-2) sopra crome staccate e accordo della sinistra.", "andate": {"1": {"rep2": "Sinistra sola 145-148, CIECO shift–touch–play: lo sguardo è sul tasto d'arrivo prima che la mano parta.", "rep3": "Destra sola: BLOC (accordo e figura come due blocchi per battuta). Nelle coppie di 149-152 RIT: fermata sulla 1ª biscroma, la 2ª di scatto con rilascio."}, "2": {"rep2": "Insieme, sinistra MUTA: tocca i tre tasti di ogni battuta nel posto giusto mentre la destra suona.", "rep3": "CHUNK: una battuta più il battere seguente a tempo pieno. Nelle coppie ACC sulla 2ª nota di ogni coppia."}}, "rep4_verifica": "Sinistra: tre crome uguali e staccate, senza buco dopo il salto. Coppie di biscrome tutte a due suoni, con la seconda corta. Sf solo sull'accordo.", "note": "Peters p. 73, sistema 2 batt. 3 – sistema 4 batt. 3."}, {"id": "mephisto-157-164", "brano": "mephisto", "battute": "157-164", "titolo": "Scherzando nell'acuto, sinistra ben staccato", "priorita": 6, "famiglia": "mephisto-fam-scherzando-acuto", "nodo_motorio": "Otto battute di coppie legate di biscrome (4-3, 3-2) nell'acuto, poco crescendo. La sinistra alterna crome staccate che salgono e un accordo tenuto, preso con un piccolo salto.", "andate": {"1": {"rep2": "Destra sola, RIT sulle coppie: fermata sulla 1ª nota, 2ª di scatto con rilascio. La mano scorre di lato, dita vicine al tasto.", "rep3": "Sinistra sola, CIECO: crome staccate e accordo."}, "2": {"rep2": "ACC: accento sulla 2ª nota di ogni coppia.", "rep3": "CLIC sul levare (2ª croma), tutto il passaggio."}}, "rep4_verifica": "Tre coppie uguali per battuta, nessuna nota muta. Il poco crescendo non accorcia le pause. Accordi della sinistra insieme.", "note": "Peters p. 73, sistema 4 batt. 4 – sistema 5 batt. 5."}, {"id": "mephisto-165-172", "brano": "mephisto", "battute": "165-172", "titolo": "Un poco accelerando: volata di semicrome su basso e accordi", "priorita": 5, "famiglia": "mephisto-fam-volate-accelerando", "nodo_motorio": "Destra: otto battute di semicrome continue nell'acuto, con cambi di direzione e passaggi del pollice. Sinistra da valzer: basso accentato e due accordi, con un salto per battuta.", "andate": {"1": {"rep2": "Destra sola, RIT su coppie: lungo-corto, poi corto-lungo.", "rep3": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; poi insieme con la sinistra MUTA."}, "2": {"rep2": "ACC: accento sulla 2ª semicroma di ogni coppia, tutto il resto pp.", "rep3": "CHUNK: una battuta più una nota a tempo pieno; poi due battute più una nota. L'accelerando solo in Rep 4."}}, "rep4_verifica": "Semicrome uguali ai cambi di direzione. Il basso della sinistra non accenta la destra. Accelerando graduale su otto battute.", "note": "Peters p. 74, sistema 1 batt. 1 – sistema 2 batt. 2.\nSopra il rigo è stampato un ossia: ho analizzato il testo principale."}, {"id": "mephisto-173-181", "brano": "mephisto", "battute": "173-181", "titolo": "Sempre più crescendo: figure spezzate della destra su accordi ribattuti", "priorita": 5, "famiglia": "mephisto-fam-figure-spezzate", "nodo_motorio": "Destra: semicrome a zigzag tra nota bassa e nota alta (intervalli larghi spezzati), una posizione per battuta. Sinistra: accordo ribattuto tre volte per battuta, in crescendo.", "andate": {"1": {"rep2": "ROT sulla destra: due battute di sola rotazione dell'avambraccio con dita ferme, due di sole dita, poi la miscela minima.", "rep3": "BLOC: le note di ogni battuta come accordo (o due bicordi), cambio di posizione senza guardare. Sinistra PESO: un impulso per battuta."}, "2": {"rep2": "DIN: destra mp, sinistra pp di rimbalzo. ACC sulle note alte, poi sulle basse.", "rep3": "CHUNK: una battuta più una nota, a tempo pieno."}}, "rep4_verifica": "Note alte e basse entrambe udibili. Cambio di posizione senza accento. La sinistra cresce senza premere.", "note": "Peters p. 74, sistema 2 batt. 3 – sistema 3 batt. 4."}, {"id": "mephisto-182-190", "brano": "mephisto", "battute": "182-190", "titolo": "Martellato cromatico a mani alternate, crescendo", "priorita": 5, "famiglia": "mephisto-fam-martellato", "nodo_motorio": "Sinistra in ottave staccate sui tempi, destra sulle semicrome in levare: un solo flusso di semicrome fatto da due mani sfasate, che sale per semitoni fino all'acuto. La b. 190 chiude a ritmo puntato.", "andate": {"1": {"rep2": "Togli lo sfasamento: le due mani insieme, in crome, sulle stesse posizioni; la seconda volta CIECO.", "rep3": "Come scritto, con CLIC sulla 2ª semicroma: senti la destra come battere."}, "2": {"rep2": "MUTA: sinistra suona, destra fantasma; poi il contrario.", "rep3": "PESO: polsi bassi, staccato dal tasto, un impulso per battuta. ACC solo nella sinistra."}}, "rep4_verifica": "Semicrome composte uguali, senza galoppo. Crescendo di peso, non di velocità. Arrivo a b. 190 a tempo.", "note": "Peters p. 74, sistema 3 batt. 5 – sistema 4 batt. 6."}, {"id": "mephisto-191-201", "brano": "mephisto", "battute": "191-201", "titolo": "Arpeggi discendenti ff dall'acuto, sinistra che salta tra ottava e accordi", "priorita": 3, "famiglia": null, "nodo_motorio": "La destra salta sulla nota acuta e scende in arpeggio di semicrome; la sinistra parte dall'ottava grave e salta agli accordi nel registro centrale; in mezzo, ottave ribattute a ritmo puntato a due mani. Da 195 l'arpeggio scende per tre battute fino al grave. 199-201: tre battute di pausa.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play dall'ottava all'accordo.", "rep3": "Destra sola: BLOC sulle posizioni dell'arpeggio, poi RIT con fermata sulla nota prima di ogni cambio di posizione."}, "2": {"rep2": "Solo gli attacchi (prima nota della destra e ottava della sinistra di ogni battuta) a tempo: prima MENT, poi reale.", "rep3": "CHUNK: una battuta più il battere seguente, stop con le mani già sulla battuta dopo. 195-198 a ritroso."}}, "rep4_verifica": "Nota acuta presa dal tasto e non dall'aria. Ottave puntate insieme. Arpeggio 195-197 regolare fino in fondo. Tre battute di pausa contate.", "note": "Peters p. 74, sistema 4 batt. 7 – sistema 5 batt. 7.\nLe battute 199-201 sono stampate come una sola battuta con la cifra 3."}, {"id": "mephisto-202-206", "brano": "mephisto", "battute": "202-206", "titolo": "Glissando e ottave ribattute nell'acuto", "priorita": 2, "famiglia": null, "nodo_motorio": "Glissando a due mani con arrivo sull'ottava ribattuta nell'acuto; la sinistra scende a salti d'ottava. La nota Peters propone: destra glissando, sinistra come scala.", "andate": {"1": {"rep2": "CHUNK a ritroso: ultimo tratto del glissando più l'ottava d'arrivo, a tempo; poi tutto. Mano inclinata, braccio che traina.", "rep3": "203-206: PESO sulle ottave ribattute, un impulso per battuta. Sinistra CIECO sui salti d'ottava."}, "2": {"rep2": "Se scegli la scala nella sinistra: sinistra sola con RIT, fermata prima di ogni pollice.", "rep3": "MENT sull'aggancio tra glissando e ottava, poi reale."}}, "rep4_verifica": "Il glissando finisce esattamente sul battere di 203. Ottave ribattute complete. Nessuna pausa prima del ff di 207.", "note": "Peters p. 75, sistema 1 batt. 1 – sistema 2 batt. 1.\nLa b. 202 è il glissando, stampato come battuta unica."}, {"id": "mephisto-207-222", "brano": "mephisto", "battute": "207-222", "titolo": "Tema marcatissimo in ottave della sinistra sotto accordi ribattuti", "priorita": 2, "famiglia": "mephisto-fam-tema-ottave-sx", "nodo_motorio": "Sedici battute ff: la destra ribatte accordi pieni tre volte per battuta nell'acuto, la sinistra suona il tema in ottave con legature a due e staccati. Tutte e due le braccia lavorano senza sosta: è il punto in cui la rigidità si accumula.", "andate": {"1": {"rep2": "Destra sola a mp, PESO: un impulso sul battere e due rimbalzi. Ogni due battute fermati sull'accordo e muovi il polso su e giù.", "rep3": "Sinistra sola, DIN dentro la mano: solo pollici (legati dove è scritto), poi solo mignoli; poi ottave intere a mp."}, "2": {"rep2": "Insieme a mp, destra ridotta alla sola ottava esterna (senza note interne). ACC sulla 2ª croma, poi sulla 3ª.", "rep3": "Insieme, DIN: sinistra f, destra pp di rimbalzo. CLIC: un solo clic per battuta."}}, "rep4_verifica": "A b. 222 l'avambraccio destro è libero come a b. 207. Tema della sinistra sopra gli accordi, con le legature a due. Nessun accordo incompleto.", "note": "Peters p. 75, sistema 2 batt. 2 – sistema 3 batt. 8.\nSe senti bruciore o indurimento nell'avambraccio, fermati: non completare la Rep."}, {"id": "mephisto-223-232", "brano": "mephisto", "battute": "223-232", "titolo": "Chiusa del tema: ottave legate a due della sinistra, accordi ribattuti", "priorita": 2, "famiglia": "mephisto-fam-tema-ottave-sx", "nodo_motorio": "La sinistra lega ottave a due per sette battute mentre la destra continua gli accordi ribattuti cambiando forma; due accordi isolati chiudono.", "andate": {"1": {"rep2": "Sinistra sola, DIN dentro la mano: pollice legato e mignolo muto, poi il contrario. Ogni coppia è una caduta e una risalita del polso.", "rep3": "Destra sola a mp, PESO: un impulso per battuta e due rimbalzi; stop ogni due battute con polso mobile."}, "2": {"rep2": "Insieme a mp, destra ridotta all'ottava esterna. ACC sulla 2ª croma.", "rep3": "DIN: sinistra f, destra pp di rimbalzo."}}, "rep4_verifica": "Coppie della sinistra legate, con la seconda ottava più leggera. Accordi della destra completi fino alla fine. I due accordi isolati a tempo.", "note": "Peters p. 75, sistema 3 batt. 9 – sistema 4 batt. 9."}, {"id": "mephisto-233-240", "brano": "mephisto", "battute": "233-240", "titolo": "Rapido: acciaccature saltate e arpeggio discendente (ripresa)", "priorita": 1, "famiglia": "mephisto-fam-acciaccature-rapido", "nodo_motorio": "Come 137-144: dopo l'accordo le due mani si passano quattro acciaccature con nota staccata, ognuna in un registro diverso; poi salto all'accordo in ottava alta e arpeggio discendente di semicrome. Tutto due volte.", "andate": {"1": {"rep2": "BLOC: acciaccatura e nota reale come bicordo. Suona i quattro bicordi in crome nell'ordine scritto, mano per mano, senza guardare; poi aggiungi l'accordo di b. 235.", "rep3": "CIECO shift–touch–play su ogni salto: suona un gruppo, sposta di scatto, tocca muto il seguente, controlla, suona."}, "2": {"rep2": "MENT: due battute mentali a tempo con le distanze immaginate, poi reali.", "rep3": "CHUNK: 233-234 più l'accordo di 235 a tempo pieno, stop sull'accordo. Poi arpeggio 235-236 con RIT (fermata sulla 1ª nota di ogni posizione)."}}, "rep4_verifica": "Ogni acciaccatura attaccata alla sua nota, nessun salto corto. Accordo di b. 235 preso dal tasto. Arpeggio regolare fino all'ultima nota.", "note": "Peters p. 75, sistema 5 batt. 1 – sistema 5 batt. 8.\nGemello di 137-144 in un'altra tonalità: stesso lavoro, forme d'accordo diverse."}, {"id": "mephisto-241-252", "brano": "mephisto", "battute": "241-252", "titolo": "Sf rinforzando con sinistra a salti; coppie scherzando (ripresa)", "priorita": 3, "famiglia": "mephisto-fam-sf-scherzando", "nodo_motorio": "Come 145-156. 241-244 e 249-252: accordo staccato e figura di due semicrome più croma nella destra, tre crome staccate basso–alto–basso nella sinistra. 245-248: tre coppie legate di biscrome per battuta (4-3, 3-2).", "andate": {"1": {"rep2": "Sinistra sola 241-244, CIECO shift–touch–play: lo sguardo è sul tasto d'arrivo prima che la mano parta.", "rep3": "Destra sola: BLOC (accordo e figura come due blocchi per battuta). Nelle coppie di 245-248 RIT: fermata sulla 1ª biscroma, la 2ª di scatto con rilascio."}, "2": {"rep2": "Insieme, sinistra MUTA: tocca i tre tasti di ogni battuta nel posto giusto mentre la destra suona.", "rep3": "CHUNK: una battuta più il battere seguente a tempo pieno. Nelle coppie ACC sulla 2ª nota di ogni coppia."}}, "rep4_verifica": "Sinistra: tre crome uguali e staccate, senza buco dopo il salto. Coppie di biscrome tutte a due suoni, con la seconda corta. Sf solo sull'accordo.", "note": "Peters p. 76, sistema 1 batt. 1 – sistema 2 batt. 6.\nGemello di 145-156."}, {"id": "mephisto-253-260", "brano": "mephisto", "battute": "253-260", "titolo": "Scherzando nell'acuto, sinistra staccata (ripresa)", "priorita": 6, "famiglia": "mephisto-fam-scherzando-acuto", "nodo_motorio": "Otto battute di coppie legate di biscrome (4-3, 3-2) nell'acuto, poco crescendo. La sinistra alterna crome staccate che salgono e un accordo tenuto, preso con un piccolo salto.", "andate": {"1": {"rep2": "Destra sola, RIT sulle coppie: fermata sulla 1ª nota, 2ª di scatto con rilascio. La mano scorre di lato, dita vicine al tasto.", "rep3": "Sinistra sola, CIECO: crome staccate e accordo."}, "2": {"rep2": "ACC: accento sulla 2ª nota di ogni coppia.", "rep3": "CLIC sul levare (2ª croma), tutto il passaggio."}}, "rep4_verifica": "Tre coppie uguali per battuta, nessuna nota muta. Il poco crescendo non accorcia le pause. Accordi della sinistra insieme.", "note": "Peters p. 76, sistema 3 batt. 1 – sistema 4 batt. 3.\nGemello di 157-164."}, {"id": "mephisto-261-268", "brano": "mephisto", "battute": "261-268", "titolo": "Un poco accelerando: volata di semicrome (ripresa)", "priorita": 5, "famiglia": "mephisto-fam-volate-accelerando", "nodo_motorio": "Destra: otto battute di semicrome continue nell'acuto, con cambi di direzione e passaggi del pollice. Sinistra da valzer: basso accentato e due accordi, con un salto per battuta.", "andate": {"1": {"rep2": "Destra sola, RIT su coppie: lungo-corto, poi corto-lungo.", "rep3": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; poi insieme con la sinistra MUTA."}, "2": {"rep2": "ACC: accento sulla 2ª semicroma di ogni coppia, tutto il resto pp.", "rep3": "CHUNK: una battuta più una nota a tempo pieno; poi due battute più una nota. L'accelerando solo in Rep 4."}}, "rep4_verifica": "Semicrome uguali ai cambi di direzione. Il basso della sinistra non accenta la destra. Accelerando graduale su otto battute.", "note": "Peters p. 76 sistema 4 batt. 4 – p. 77 sistema 1 batt. 1.\nGemello di 165-172. Anche qui è stampato un ossia: ho analizzato il testo principale."}, {"id": "mephisto-269-273", "brano": "mephisto", "battute": "269-273", "titolo": "Più crescendo: figure spezzate su accordi ribattuti (ripresa breve)", "priorita": 5, "famiglia": "mephisto-fam-figure-spezzate", "nodo_motorio": "Destra: semicrome a zigzag tra nota bassa e nota alta (intervalli larghi spezzati), una posizione per battuta. Sinistra: accordo ribattuto tre volte per battuta, in crescendo.", "andate": {"1": {"rep2": "ROT sulla destra: due battute di sola rotazione dell'avambraccio con dita ferme, due di sole dita, poi la miscela minima.", "rep3": "BLOC: le note di ogni battuta come accordo (o due bicordi), cambio di posizione senza guardare. Sinistra PESO: un impulso per battuta."}, "2": {"rep2": "DIN: destra mp, sinistra pp di rimbalzo. ACC sulle note alte, poi sulle basse.", "rep3": "CHUNK: una battuta più una nota, a tempo pieno."}}, "rep4_verifica": "Note alte e basse entrambe udibili. Cambio di posizione senza accento. La sinistra cresce senza premere.", "note": "Peters p. 77, sistema 1 batt. 2 – sistema 1 batt. 6.\nGemello di 173-181, quattro battute più l'accordo di b. 273."}, {"id": "mephisto-274-281", "brano": "mephisto", "battute": "274-281", "titolo": "Accordi a duine con salti in moto contrario, poi ottave staccate", "priorita": 1, "famiglia": "mephisto-fam-duine-saltate", "nodo_motorio": "274-276: due accordi per battuta in duina. La destra salta dall'accordo acuto a uno più basso, la sinistra dall'ottava grave all'accordo: moto contrario, posizioni nuove a ogni battuta. 277: acciaccature e sf. 278-280: ottave staccate della destra che salgono a salti sopra accordi ribattuti.", "andate": {"1": {"rep2": "CIECO shift–touch–play, una mano per volta e poi unite: suona il primo accordo, sposta, tocca muto il secondo, controlla, suona. Sei accordi in tutto.", "rep3": "BLOC muto: tocca i sei accordi in silenzio a duine, a tempo ridotto, poi suonali. 278-280: ottave con PESO, pollice solo e poi ottava intera."}, "2": {"rep2": "MENT: tre battute mentali a tempo con le distanze immaginate, poi reali.", "rep3": "RIT: fermata sul primo accordo della duina, il secondo e il salto alla battuta seguente di scatto; poi fermata sul secondo."}}, "rep4_verifica": "Sei accordi completi e presi dal tasto. Duine uguali, né terzinate né puntate. Ottave 278-280 staccate senza spinta di spalla. Accordo di 281 a tempo.", "note": "Peters p. 77, sistema 2 batt. 1 – sistema 2 batt. 8."}, {"id": "mephisto-282-296", "brano": "mephisto", "battute": "282-296", "titolo": "Duine, salita in ottave staccate, duine fff", "priorita": 1, "famiglia": "mephisto-fam-duine-saltate", "nodo_motorio": "282-284: duine con salti come a 274. 285: acciaccature e sf. 286-291: ottave staccate della destra che salgono a salti in crescendo (4 sui tasti neri) sopra accordi ribattuti. 292-294: duine fff nell'acuto. 295 pausa, 296 accordo fff.", "andate": {"1": {"rep2": "CIECO shift–touch–play sulle duine (282-284 e 292-294), una mano per volta e poi unite.", "rep3": "286-291: ottave con PESO a mp, un impulso per battuta; pollice solo, poi ottava intera. Sinistra di rimbalzo."}, "2": {"rep2": "MENT sulle due serie di duine, poi reali.", "rep3": "CHUNK: una battuta di ottave più la prima della seguente a tempo pieno, stop con la mano già sulla posizione nuova. Duine: RIT con fermata sul primo accordo."}}, "rep4_verifica": "Accordi delle duine completi, anche a fff. Salita in ottave senza note sporche e senza spalla. Pausa di 295 esatta, accordo di 296 dal tasto.", "note": "Peters p. 77, sistema 3 batt. 1 – sistema 4 batt. 8.\nLa b. 295 è vuota (cifra 1)."}, {"id": "mephisto-297-312", "brano": "mephisto", "battute": "297-312", "titolo": "Tema ff a piene mani: melodia con accordi, sinistra ribattuta", "priorita": 2, "famiglia": null, "nodo_motorio": "Destra a due strati: tema nella voce superiore e crome ribattute nelle dita basse. Sinistra: accordi pieni ribattuti tre volte per battuta, con salto al basso grave ogni otto battute.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: voce superiore suonata e note interne mute; poi il contrario.", "rep3": "Sinistra sola a mp, PESO: un impulso per battuta e due rimbalzi. CIECO sul salto dal basso grave all'accordo."}, "2": {"rep2": "Insieme a mp, sinistra MUTA per quattro battute e suonata per quattro.", "rep3": "RIT sulle due semicrome del tema (299-300, 307-308): fermata sulla croma prima, semicrome di scatto."}}, "rep4_verifica": "Tema sopra tutto. Ribattuti interni uguali. Sinistra libera a b. 312. Salto al basso senza ritardo.", "note": "Peters p. 77 sistema 5 batt. 1 – p. 78 sistema 1 batt. 7."}, {"id": "mephisto-313-328", "brano": "mephisto", "battute": "313-328", "titolo": "Diminuendo: frammenti del tema su accordi ribattuti", "priorita": 7, "famiglia": "mephisto-fam-diminuendo", "nodo_motorio": "Note lunghe e legature della destra sopra accordi ribattuti in diminuendo; la sinistra salta ogni poche battute dal basso agli accordi.", "andate": {"1": {"rep2": "Sinistra sola: ribattuti pp da metà corsa del tasto, senza staccare le dita. CIECO sul salto dal basso.", "rep3": "DIN: destra mf cantata, sinistra ppp."}, "2": {"rep2": "PESO sulle note lunghe della destra: caduta e rilascio, polso mobile durante la nota.", "rep3": "CLIC: un solo clic per battuta, e CIECO."}}, "rep4_verifica": "Ribattuti uguali e sempre più piano, senza note mute. Nessun accento sul basso.", "note": "Peters p. 78, sistema 1 batt. 8 – sistema 3 batt. 5."}, {"id": "mephisto-329-340", "brano": "mephisto", "battute": "329-340", "titolo": "Più diminuendo: mi–re# alternato e note sole", "priorita": 7, "famiglia": "mephisto-fam-diminuendo", "nodo_motorio": "La destra alterna due note legate; la sinistra risponde con un accordo isolato, poi tace. 334-340: destra sola, una nota lunga per battuta.", "andate": {"1": {"rep2": "PESO a pp: ogni nota lunga dal tasto, con rilascio immediato della pressione.", "rep3": "Sinistra sola: accordi isolati con CIECO shift–touch–play."}, "2": {"rep2": "MENT su 334-340 (durate e diminuendo), poi reale.", "rep3": "CLIC: un solo clic per battuta."}}, "rep4_verifica": "Ogni nota parla, anche la più piano. Le battute di pausa hanno la loro durata. Nessun rallentando non scritto.", "note": "Peters p. 78, sistema 3 batt. 6 – sistema 4 batt. 7."}, {"id": "mephisto-341-356", "brano": "mephisto", "battute": "341-356", "titolo": "Un poco meno mosso, espressivo amoroso: melodia sincopata, basso e accordi", "priorita": 7, "famiglia": "mephisto-fam-cantabile-amoroso", "nodo_motorio": "Melodia sincopata a cavallo di battuta: i punti indicano di sollevare la mano, non di ribattere (nota Peters a p. 78). Sinistra: basso tenuto dal pedale e due accordi nel registro centrale, con un salto ogni una o due battute. Una corda.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; accordi pp da metà corsa del tasto.", "rep3": "DIN: destra mf legata, sinistra ppp. Lo stacco dopo ogni nota col punto è un sollevamento del polso: il dito lascia il tasto per ultimo."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma sulle posizioni; poi il contrario.", "rep3": "CLIC: un solo clic per battuta; le sincopi non anticipano."}}, "rep4_verifica": "Nessuna nota ribattuta dove c'è solo il punto. Basso mai accentato. Accordi insieme a pp. Frase lunga quattro battute.", "note": "Peters p. 78, sistema 4 batt. 8 – sistema 6 batt. 3."}, {"id": "mephisto-357-372", "brano": "mephisto", "battute": "357-372", "titolo": "Espressivo amoroso: seconda frase", "priorita": 7, "famiglia": "mephisto-fam-cantabile-amoroso", "nodo_motorio": "Melodia sincopata a cavallo di battuta: i punti indicano di sollevare la mano, non di ribattere (nota Peters a p. 78). Sinistra: basso tenuto dal pedale e due accordi nel registro centrale, con un salto ogni una o due battute. Una corda.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; accordi pp da metà corsa del tasto.", "rep3": "DIN: destra mf legata, sinistra ppp. Lo stacco dopo ogni nota col punto è un sollevamento del polso: il dito lascia il tasto per ultimo."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma sulle posizioni; poi il contrario.", "rep3": "CLIC: un solo clic per battuta; le sincopi non anticipano."}}, "rep4_verifica": "Nessuna nota ribattuta dove c'è solo il punto. Basso mai accentato. Accordi insieme a pp. Frase lunga quattro battute.", "note": "Peters p. 78, sistema 6 batt. 4 – sistema 7 batt. 10."}, {"id": "mephisto-373-388", "brano": "mephisto", "battute": "373-388", "titolo": "Dolce: melodia in ottave e accordi arpeggiati", "priorita": 7, "famiglia": "mephisto-fam-cantabile-amoroso", "nodo_motorio": "Come 341-356, con la destra che da b. 377 canta in ottave e accordi arpeggiati (379, 387). Sinistra: basso tenuto dal pedale e due accordi, con un salto ogni una o due battute.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; accordi pp da metà corsa del tasto.", "rep3": "DIN dentro la mano nelle ottave: voce superiore mf e pollice pp; sinistra ppp."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma sulle posizioni; poi il contrario.", "rep3": "CLIC: un solo clic per battuta; le sincopi non anticipano."}}, "rep4_verifica": "Voce superiore delle ottave in evidenza, pollice leggero. Accordi arpeggiati che finiscono sul tempo. Basso mai accentato.", "note": "Peters p. 79, sistema 1 batt. 1 – sistema 2 batt. 7."}, {"id": "mephisto-389-400", "brano": "mephisto", "battute": "389-400", "titolo": "Dolce appassionato: ottave in levare e ossia in ottave", "priorita": 7, "famiglia": "mephisto-fam-ottave-cantabili", "nodo_motorio": "393-396: ottave della destra sulla 2ª e 3ª croma, legate a due, che scendono per gradi (4 e 5 nella voce superiore). 397-400: con l'ossia che suoni, melodia in ottave legate al posto della fioritura. Il compito è legare ottave a p senza fissare la mano. Sinistra: basso e accordi.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: voce superiore legata con 4-5 e pollice muto; poi pollice solo, leggero.", "rep3": "PESO a pp: ogni coppia di ottave è una caduta e una risalita del polso; tra una coppia e l'altra la mano si richiude."}, "2": {"rep2": "Sinistra sola, CIECO dal basso agli accordi; poi insieme con la sinistra MUTA.", "rep3": "DIN: voce superiore della destra mf, pollice della destra e sinistra pp."}}, "rep4_verifica": "Voce superiore legata davvero, senza pedale. Pollici leggeri. Il polso respira a ogni coppia. Ossia cantato, con l'accento solo dove è scritto.", "note": "Peters p. 79, sistema 2 batt. 8 – sistema 3 batt. 9.\n397-400: analizzato l'ossia (ottave), come mi hai indicato, al posto della fioritura del testo principale. 389-392 sono il collegamento dalla frase precedente."}, {"id": "mephisto-401-416", "brano": "mephisto", "battute": "401-416", "titolo": "Dolce appassionato: ottave in levare, melodia in ottave, ossia", "priorita": 7, "famiglia": "mephisto-fam-ottave-cantabili", "nodo_motorio": "401-404: ottave in levare legate a due, come a 393. 405-408 e 413-416: ossia in ottave. 409-412: melodia in ottave legate. Il compito è legare ottave a p senza fissare la mano. Sinistra: basso e accordi.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: voce superiore legata con 4-5 e pollice muto; poi pollice solo, leggero.", "rep3": "PESO a pp: ogni coppia di ottave è una caduta e una risalita del polso; tra una coppia e l'altra la mano si richiude."}, "2": {"rep2": "Sinistra sola, CIECO dal basso agli accordi; poi insieme con la sinistra MUTA.", "rep3": "DIN: voce superiore della destra mf, pollice della destra e sinistra pp."}}, "rep4_verifica": "Voce superiore legata davvero, senza pedale. Pollici leggeri. Il polso respira a ogni coppia. Ossia cantato, con l'accento solo dove è scritto.", "note": "Peters p. 79, sistema 4 batt. 1 – sistema 5 batt. 8.\n405-408 e 413-416: analizzato l'ossia (ottave) al posto delle fioriture."}, {"id": "mephisto-417-432", "brano": "mephisto", "battute": "417-432", "tito
