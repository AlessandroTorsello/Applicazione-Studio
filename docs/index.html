lo": "Ottave cantabili, più appassionato, ossia", "priorita": 7, "famiglia": "mephisto-fam-ottave-cantabili", "nodo_motorio": "417-420 e 425-428: melodia in ottave legate. 421-424 e 429-432 (più appassionato): ossia in ottave. Il compito è legare ottave senza fissare la mano, anche quando la dinamica cresce. Sinistra: basso e accordi.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: voce superiore legata con 4-5 e pollice muto; poi pollice solo, leggero.", "rep3": "PESO a pp: ogni coppia di ottave è una caduta e una risalita del polso; tra una coppia e l'altra la mano si richiude."}, "2": {"rep2": "Sinistra sola, CIECO dal basso agli accordi; poi insieme con la sinistra MUTA.", "rep3": "DIN: voce superiore della destra mf, pollice della destra e sinistra pp."}}, "rep4_verifica": "Voce superiore legata davvero, senza pedale. Pollici leggeri. Il polso respira a ogni coppia. Ossia cantato, con l'accento solo dove è scritto.", "note": "Peters p. 80, sistema 1 batt. 1 – sistema 2 batt. 8.\n421-424 e 429-432: analizzato l'ossia (ottave) al posto delle fioriture."}, {"id": "mephisto-433-442", "brano": "mephisto", "battute": "433-442", "titolo": "Ottave discendenti a coppie, poco a poco diminuendo", "priorita": 7, "famiglia": "mephisto-fam-ottave-cantabili", "nodo_motorio": "Coppie di ottave legate (semiminima e croma) che scendono per gradi, in diminuendo; nelle ultime due battute un'ottava sola sulla 3ª croma. Sinistra: basso e accordi sempre più radi.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: voce superiore legata con 4-5 e pollice muto; poi pollice solo, leggero.", "rep3": "PESO a pp: ogni coppia di ottave è una caduta e una risalita del polso; tra una coppia e l'altra la mano si richiude."}, "2": {"rep2": "Sinistra sola, CIECO dal basso agli accordi; poi insieme con la sinistra MUTA.", "rep3": "DIN: voce superiore della destra mf, pollice della destra e sinistra pp."}}, "rep4_verifica": "Ogni coppia è caduta e risalita, con la seconda ottava più leggera. Voce superiore legata. Diminuendo senza note mute.", "note": "Peters p. 80, sistema 3 batt. 1 – sistema 3 batt. 10.\nSopra 433-437 è stampato un ossia: non distinguo con sicurezza in che cosa differisce dal testo (sembra la stessa linea senza l'ottava alta)."}, {"id": "mephisto-443-456", "brano": "mephisto", "battute": "443-456", "titolo": "Perdendosi: note lunghe e quattro battute di pausa", "priorita": 7, "famiglia": null, "nodo_motorio": "Ottave e note singole lunghe a pp che si spengono; poi quattro battute di pausa prima del Presto.", "andate": {"1": {"rep2": "PESO a ppp dal tasto: le due note dell'ottava parlano insieme.", "rep3": "DIN dentro la mano: mignolo suonato e pollice muto, poi il contrario."}, "2": {"rep2": "CIECO, tutto il frammento.", "rep3": "MENT: le quattro battute di pausa contate e l'attacco del Presto immaginato; poi reale, con le prime due battute di 457."}}, "rep4_verifica": "Nessuna ottava spaccata. Le quattro battute di pausa hanno la loro durata. Attacco del Presto senza scatto preparatorio.", "note": "Peters p. 80, sistema 4 batt. 1 – sistema 4 batt. 11.\nLe battute 453-456 sono stampate come una sola battuta con la cifra 4."}, {"id": "mephisto-457-472", "brano": "mephisto", "battute": "457-472", "titolo": "Presto ppp: terze con nota oscillante e bicordi staccati", "priorita": 6, "famiglia": "mephisto-fam-presto-pp", "nodo_motorio": "Unità di quattro battute: una di semicrome (destra: terza ribattuta più nota superiore alternata, con 3/1 e 4; sinistra: due note alternate) e tre di bicordi staccati della destra su crome staccate della sinistra. Tutto ppp, mani vicine nell'acuto.", "andate": {"1": {"rep2": "ROT nelle battute di semicrome: sola rotazione, poi sole dita, poi miscela minima; una mano per volta.", "rep3": "STAC pp sui bicordi: dal tasto, le due note insieme, con la diteggiatura stampata."}, "2": {"rep2": "DIN dentro la mano nei bicordi: voce superiore suonata e inferiore muta; poi il contrario.", "rep3": "CLIC sul levare (2ª croma); poi un solo clic per battuta."}}, "rep4_verifica": "Sei semicrome uguali nelle battute di oscillazione, mani insieme. Bicordi a due suoni simultanei. Nessun accento all'inizio di ogni unità.", "note": "Peters p. 80 sistema 5 batt. 1 – p. 81 sistema 2 batt. 1."}, {"id": "mephisto-473-483", "brano": "mephisto", "battute": "473-483", "titolo": "Presto ppp: figure che cambiano registro, pause", "priorita": 6, "famiglia": "mephisto-fam-presto-pp", "nodo_motorio": "473-476 come prima. 477 pausa. 478-481: la figura di semicrome passa da un'ottava all'altra a ogni battuta, con salto di tutte e due le mani. 482-483 pausa.", "andate": {"1": {"rep2": "CIECO shift–touch–play sui cambi di registro di 478-481.", "rep3": "ROT sulle semicrome, una mano per volta."}, "2": {"rep2": "MENT 477-483 con le pause contate, poi reale.", "rep3": "CHUNK: una battuta più la prima nota della seguente a tempo pieno, stop sulla posizione nuova."}}, "rep4_verifica": "Cambio d'ottava senza accento né ritardo. Pause esatte. ppp fino alla fine.", "note": "Peters p. 81, sistema 2 batt. 2 – sistema 3 batt. 3.\nLa b. 477 è vuota (cifra 1); 482-483 sono stampate come una battuta con la cifra 2."}, {"id": "mephisto-484-492", "brano": "mephisto", "battute": "484-492", "titolo": "Poco Allegretto e rubato: ottave in levare, arpeggi, trillo e volata", "priorita": 7, "famiglia": "mephisto-fam-allegretto-rubato", "nodo_motorio": "Ogni battuta: pausa e ottava staccata della destra, con salto da un'ottava all'altra. Sinistra: arpeggio largo di quattro semicrome, in su e in giù a battute alterne. 490: trillo. 491-492: volata leggiero fino all'acuto.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play sulle ottave.", "rep3": "Sinistra sola: BLOC (le quattro note come accordo o due bicordi, secondo l'apertura), poi legato con ROT ai cambi di direzione."}, "2": {"rep2": "TRILL a 4 e poi a 6 note sul trillo di b. 490. Volata 491-492: RIT su coppie.", "rep3": "Insieme, sinistra MUTA; poi DIN: destra mp, sinistra pp."}}, "rep4_verifica": "Ottave prese dal tasto e leggere. Arpeggio della sinistra senza accento sul pollice. Trillo con numero di note fisso. Volata uguale fino all'ultima nota.", "note": "Peters p. 81, sistema 3 batt. 4 – sistema 4 batt. 5.\nLe battute con l'ottava in levare contengono due crome contro quattro semicrome: le leggo come duine e quartine sottintese (nessuna cifra stampata)."}, {"id": "mephisto-493-508", "brano": "mephisto", "battute": "493-508", "titolo": "Poco Allegretto: seconda e terza frase", "priorita": 7, "famiglia": "mephisto-fam-allegretto-rubato", "nodo_motorio": "Due frasi come 484-492: pausa e ottava staccata della destra con salto da un'ottava all'altra, arpeggio largo della sinistra; trilli a 498 e 506, volate leggiero a 499-500 e 507-508.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play sulle ottave.", "rep3": "Sinistra sola: BLOC (le quattro note come accordo o due bicordi, secondo l'apertura), poi legato con ROT ai cambi di direzione."}, "2": {"rep2": "TRILL a 4 e poi a 6 note sui trilli di 498 e 506. Volate 499-500 e 507-508: RIT su coppie.", "rep3": "Insieme, sinistra MUTA; poi DIN: destra mp, sinistra pp."}}, "rep4_verifica": "Ottave prese dal tasto e leggere. Arpeggio della sinistra senza accento sul pollice. Trillo con numero di note fisso. Volata uguale fino all'ultima nota.", "note": "Peters p. 81, sistema 4 batt. 6 – sistema 6 batt. 7."}, {"id": "mephisto-509-524", "brano": "mephisto", "battute": "509-524", "titolo": "Poco Allegretto: quarta frase e ottave un poco crescendo", "priorita": 7, "famiglia": "mephisto-fam-allegretto-rubato", "nodo_motorio": "509-516: frase come 484-492, con trillo a 514 e volata a 515-516 fino all'acuto. 517-524: otto battute di sole ottave in levare, un poco crescendo, sopra gli arpeggi della sinistra.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play sulle ottave.", "rep3": "Sinistra sola: BLOC (le quattro note come accordo o due bicordi, secondo l'apertura), poi legato con ROT ai cambi di direzione."}, "2": {"rep2": "TRILL a 4 e poi a 6 note sul trillo di 514. Volata 515-516: RIT su coppie.", "rep3": "Insieme, sinistra MUTA; poi DIN: destra mp, sinistra pp."}}, "rep4_verifica": "Ottave prese dal tasto e leggere anche nel crescendo. Arpeggio della sinistra senza accento sul pollice. Trillo con numero di note fisso. Volata uguale fino all'ultima nota.", "note": "Peters p. 82, sistema 1 batt. 1 – sistema 3 batt. 1."}, {"id": "mephisto-525", "brano": "mephisto", "battute": "525", "titolo": "Cadenza: salita a due mani con note doppie nella destra", "priorita": 5, "famiglia": null, "nodo_motorio": "Battuta unica senza misura. Le due mani salgono insieme per circa tre ottave: la destra con note doppie diteggiate 5/3 e 5/2 alternate al pollice, la sinistra in note singole con 4-3-2-1. In cima una figura ripetuta porta al Presto.", "andate": {"1": {"rep2": "NODO: fermati sui passaggi del pollice (che nelle due mani non coincidono), verifica che i tasti scendano insieme, poi suona da nodo a nodo.", "rep3": "Destra sola, DIN dentro la mano: voce superiore suonata e pollice muto; poi il contrario."}, "2": {"rep2": "RIT a gruppi di 4: fermata sulla 1ª nota, poi sulla 3ª.", "rep3": "CHUNK a ritroso: ultima posizione più l'attacco del Presto (526), poi le ultime due, le ultime tre."}}, "rep4_verifica": "Mani insieme su ogni nodo. Note doppie a due suoni. Accelerazione senza irrigidire il pollice. Aggancio al Presto senza buco.", "note": "Peters p. 82, sistema 3 batt. 2.\nNon ho potuto verificare le note di questa battuta: la descrizione viene dalle diteggiature e dal profilo."}, {"id": "mephisto-526-541", "brano": "mephisto", "battute": "526-541", "titolo": "Presto pp: terze con nota oscillante e bicordi staccati (ripresa)", "priorita": 6, "famiglia": "mephisto-fam-presto-pp", "nodo_motorio": "Unità di quattro battute: una di semicrome (destra: terza ribattuta più nota superiore alternata, con 3/1 e 4; sinistra: due note alternate) e tre di bicordi staccati della destra su crome staccate della sinistra. Tutto ppp, mani vicine nell'acuto.", "andate": {"1": {"rep2": "ROT nelle battute di semicrome: sola rotazione, poi sole dita, poi miscela minima; una mano per volta.", "rep3": "STAC pp sui bicordi: dal tasto, le due note insieme, con la diteggiatura stampata."}, "2": {"rep2": "DIN dentro la mano nei bicordi: voce superiore suonata e inferiore muta; poi il contrario.", "rep3": "CLIC sul levare (2ª croma); poi un solo clic per battuta."}}, "rep4_verifica": "Sei semicrome uguali nelle battute di oscillazione, mani insieme. Bicordi a due suoni simultanei. Nessun accento all'inizio di ogni unità.", "note": "Peters p. 82, sistema 4 batt. 1 – sistema 5 batt. 8.\nGemello di 457-472 in un'altra tonalità."}, {"id": "mephisto-542-557", "brano": "mephisto", "battute": "542-557", "titolo": "Presto ppp: cambi di registro, pause e accordi poco ritenuto", "priorita": 6, "famiglia": "mephisto-fam-presto-pp", "nodo_motorio": "542-545 come prima. 546 pausa. 547-550: la figura di semicrome cambia ottava a ogni battuta. 551-552 pausa. 553-557: note lunghe e accordi arpeggiati, poco ritenuto.", "andate": {"1": {"rep2": "CIECO shift–touch–play sui cambi di registro di 547-550.", "rep3": "ROT sulle semicrome, una mano per volta."}, "2": {"rep2": "MENT 546-552 con le pause contate, poi reale.", "rep3": "PESO a p sugli accordi arpeggiati di 553-557: tutte le note parlano, rilascio immediato."}}, "rep4_verifica": "Cambio d'ottava senza accento né ritardo. Pause esatte. Accordi arpeggiati morbidi, con la nota superiore chiara.", "note": "Peters p. 82 sistema 6 batt. 1 – p. 83 sistema 1 batt. 7.\nGemello di 473-483, più il collegamento 553-557. La b. 546 è vuota (cifra 1); 551-552 sono stampate come una battuta con la cifra 2."}, {"id": "mephisto-558-573", "brano": "mephisto", "battute": "558-573", "titolo": "Come prima, su tre righi: ribattute con salto nella destra, melodia nella sinistra", "priorita": 3, "famiglia": "mephisto-fam-melodia-sinistra", "nodo_motorio": "Destra (rigo piccolo): tre note ribattute con cambio di dito 3-2-1 e salto verso la nota alta, a ogni battuta su un'altezza diversa. Sinistra da sola su due righi: basso, nota di melodia col punto (stacco della mano) e bicordo d'accompagnamento, cioè due o tre spostamenti per battuta.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play su ogni spostamento; melodia mf, bicordi e basso pp.", "rep3": "Destra sola: STAC pp sulle ribattute con 3-2-1, dal tasto; poi BLOC (nota ribattuta e nota alta come bicordo, uno per battuta, senza guardare)."}, "2": {"rep2": "Insieme, destra MUTA (segue le posizioni senza abbassare i tasti) e sinistra come scritta; poi il contrario.", "rep3": "DIN: melodia della sinistra mf, tutto il resto ppp. CLIC: un solo clic per battuta."}}, "rep4_verifica": "La melodia della sinistra canta sopra le ribattute. Nessun buco dopo gli spostamenti della sinistra. Ribattute della destra uguali, nota alta non accentata.", "note": "Peters p. 83, sistema 1 batt. 8 – sistema 3 batt. 3."}, {"id": "mephisto-574-589", "brano": "mephisto", "battute": "574-589", "titolo": "Tre righi: seconda parte della melodia nella sinistra", "priorita": 3, "famiglia": "mephisto-fam-melodia-sinistra", "nodo_motorio": "Destra (rigo piccolo): tre note ribattute con cambio di dito 3-2-1 e salto verso la nota alta, a ogni battuta su un'altezza diversa. Sinistra da sola su due righi: basso, nota di melodia col punto (stacco della mano) e bicordo d'accompagnamento, cioè due o tre spostamenti per battuta.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play su ogni spostamento; melodia mf, bicordi e basso pp.", "rep3": "Destra sola: STAC pp sulle ribattute con 3-2-1, dal tasto; poi BLOC (nota ribattuta e nota alta come bicordo, uno per battuta, senza guardare)."}, "2": {"rep2": "Insieme, destra MUTA (segue le posizioni senza abbassare i tasti) e sinistra come scritta; poi il contrario.", "rep3": "DIN: melodia della sinistra mf, tutto il resto ppp. CLIC: un solo clic per battuta."}}, "rep4_verifica": "La melodia della sinistra canta sopra le ribattute. Nessun buco dopo gli spostamenti della sinistra. Ribattute della destra uguali, nota alta non accentata.", "note": "Peters p. 83, sistema 3 batt. 4 – sistema 4 batt. 9."}, {"id": "mephisto-590-605", "brano": "mephisto", "battute": "590-605", "titolo": "Tre righi: molto espressivo, con due volate pp della destra", "priorita": 3, "famiglia": "mephisto-fam-melodia-sinistra", "nodo_motorio": "Come 558-573. In più, a 594-597 e 602-605 la destra lascia le ribattute per una volata pp (terzina e discesa cromatica) mentre la sinistra continua basso, melodia e bicordi.", "andate": {"1": {"rep2": "Sinistra sola, CIECO shift–touch–play su ogni spostamento; melodia mf, bicordi e basso pp.", "rep3": "Destra sola: STAC pp sulle ribattute con 3-2-1, dal tasto; poi BLOC (nota ribattuta e nota alta come bicordo, uno per battuta, senza guardare)."}, "2": {"rep2": "Insieme, destra MUTA (segue le posizioni senza abbassare i tasti) e sinistra come scritta; poi il contrario.", "rep3": "Volate 594-597 e 602-605: RIT a gruppi di 4 (fermata sulla 1ª nota, poi sulla 3ª), sinistra MUTA. Poi DIN: melodia della sinistra mf, resto ppp."}}, "rep4_verifica": "La melodia della sinistra canta sopra le ribattute. Volate pp uguali, senza accento all'attacco e senza spostare la sinistra. Nessun buco dopo gli spostamenti.", "note": "Peters p. 83 sistema 5 batt. 1 – p. 84 sistema 1 batt. 8."}, {"id": "mephisto-606-617", "brano": "mephisto", "battute": "606-617", "titolo": "Poco animando: figura «ribattuta più salto» e arpeggio largo della sinistra", "priorita": 3, "famiglia": "mephisto-fam-ribattute-con-salto", "nodo_motorio": "606-609: ancora tre righi. Da 610 la destra ha gruppi di semicrome «nota, ribattuta, salto alla nota alta, ritorno», che cambiano altezza a ogni gruppo. Sinistra: arpeggio largo in crome (610-613), poi crome staccate che salgono dal grave alla chiave di violino (614-617).", "andate": {"1": {"rep2": "Destra sola, ROT: il salto alla nota alta è una rotazione dell'avambraccio verso il mignolo, non un'estensione del dito. Due battute di sola rotazione, due di sole dita.", "rep3": "BLOC: nota ribattuta e nota alta come bicordo, uno per gruppo, senza guardare. Sinistra CIECO sulle posizioni."}, "2": {"rep2": "RIT a gruppi di 4: fermata sulla 1ª nota, poi sulla 3ª (quella alta).", "rep3": "Insieme, sinistra MUTA; poi ACC sulla 2ª semicroma di ogni gruppo."}}, "rep4_verifica": "Le due note ribattute entrambe udibili. Nota alta chiara ma non accentata. Sinistra legata dove è scritto e staccata a 614-617, sempre a tempo.", "note": "Peters p. 84, sistema 2 batt. 1 – sistema 3 batt. 4."}, {"id": "mephisto-618-625", "brano": "mephisto", "battute": "618-625", "titolo": "Figura «ribattuta più salto» (ripetizione)", "priorita": 3, "famiglia": "mephisto-fam-ribattute-con-salto", "nodo_motorio": "Come 610-617: gruppi di semicrome «nota, ribattuta, salto alla nota alta, ritorno» nella destra; arpeggio largo in crome e poi crome staccate che salgono nella sinistra.", "andate": {"1": {"rep2": "Destra sola, ROT: il salto alla nota alta è una rotazione dell'avambraccio verso il mignolo, non un'estensione del dito. Due battute di sola rotazione, due di sole dita.", "rep3": "BLOC: nota ribattuta e nota alta come bicordo, uno per gruppo, senza guardare. Sinistra CIECO sulle posizioni."}, "2": {"rep2": "RIT a gruppi di 4: fermata sulla 1ª nota, poi sulla 3ª (quella alta).", "rep3": "Insieme, sinistra MUTA; poi ACC sulla 2ª semicroma di ogni gruppo."}}, "rep4_verifica": "Le due note ribattute entrambe udibili. Nota alta chiara ma non accentata. Sinistra legata dove è scritto e staccata a 622-625, sempre a tempo.", "note": "Peters p. 84, sistema 3 batt. 5 – sistema 4 batt. 6."}, {"id": "mephisto-626-637", "brano": "mephisto", "battute": "626-637", "titolo": "Più appassionato ma non accelerando: figure con salto, sinistra non legato", "priorita": 3, "famiglia": "mephisto-fam-ribattute-con-salto", "nodo_motorio": "Semicrome continue della destra nell'acuto, sempre a gruppi «nota, ribattuta, salto, ritorno». Sinistra: crome non legate in arpeggio largo che attraversa le due chiavi, con la diteggiatura stampata (3-1, 4-2-1, 2-4-1); accordo arpeggiato a 633.", "andate": {"1": {"rep2": "Destra sola, ROT: il salto alla nota alta è una rotazione dell'avambraccio verso il mignolo, non un'estensione del dito. Due battute di sola rotazione, due di sole dita.", "rep3": "BLOC: nota ribattuta e nota alta come bicordo, uno per gruppo, senza guardare. Sinistra sola CIECO shift–touch–play sulle crome non legate, con la diteggiatura stampata."}, "2": {"rep2": "RIT a gruppi di 4: fermata sulla 1ª nota, poi sulla 3ª (quella alta).", "rep3": "Insieme, sinistra MUTA; poi ACC sulla 2ª semicroma di ogni gruppo."}}, "rep4_verifica": "Le due note ribattute entrambe udibili. Nota alta chiara ma non accentata. Sinistra non legata e a tempo, senza accento dopo gli spostamenti. Più appassionato senza accelerare.", "note": "Peters p. 84, sistema 5 batt. 1 – sistema 6 batt. 6."}, {"id": "mephisto-638-650", "brano": "mephisto", "battute": "638-650", "titolo": "Figure con salto, diminuendo e perdendo fino alla corona", "priorita": 3, "famiglia": "mephisto-fam-ribattute-con-salto", "nodo_motorio": "Come 626-637 per sei battute (accordo arpeggiato a 640). Da 644 la destra resta sola: la figura scende, diminuendo, perdendo, pp ritenuto, fino alla corona.", "andate": {"1": {"rep2": "Destra sola, ROT: il salto alla nota alta è una rotazione dell'avambraccio verso il mignolo, non un'estensione del dito. Due battute di sola rotazione, due di sole dita.", "rep3": "BLOC: nota ribattuta e nota alta come bicordo, uno per gruppo, senza guardare. Sinistra sola CIECO shift–touch–play sulle crome non legate."}, "2": {"rep2": "RIT a gruppi di 4: fermata sulla 1ª nota, poi sulla 3ª (quella alta).", "rep3": "Insieme, sinistra MUTA; poi 644-650 MENT (diminuendo e ritenuto immaginati) e subito reale."}}, "rep4_verifica": "Le due note ribattute udibili fino al pp. Il perdendo non perde note. Ritenuto graduale, corona sul silenzio.", "note": "Peters p. 85, sistema 1 batt. 1 – sistema 2 batt. 7."}, {"id": "mephisto-651-666", "brano": "mephisto", "battute": "651-666", "titolo": "Più mosso: tremolo grave della sinistra pp sotto il tema", "priorita": 4, "famiglia": null, "nodo_motorio": "Sedici battute di tremolo misurato della sinistra nel grave (4-1, sei semicrome per battuta) a pp, sotto il tema della destra in registro di tenore. Il rischio è irrigidire l'avambraccio sinistro per tenere il pp.", "andate": {"1": {"rep2": "ROT: due battute di sola rotazione dell'avambraccio con dita ferme, due di sole dita, alternate; poi la miscela minima. Sinistra sola.", "rep3": "ACC ogni 4 note, poi ogni 3; destra MUTA."}, "2": {"rep2": "CLIC sul levare; sinistra sola e poi insieme.", "rep3": "DIN: destra mp con le sue articolazioni, sinistra ppp. RIT sulle due semicrome del tema."}}, "rep4_verifica": "Sei semicrome per battuta, senza buchi ai cambi di battuta. Il pp viene dall'ampiezza piccola della rotazione, non dalla pressione trattenuta. Tema chiaro sopra.", "note": "Peters p. 85, sistema 3 batt. 1 – sistema 5 batt. 2."}, {"id": "mephisto-667-682", "brano": "mephisto", "battute": "667-682", "titolo": "Volate pp della destra su crome staccate; scala fino al grave", "priorita": 5, "famiglia": null, "nodo_motorio": "667-675: figure d'arpeggio spezzato in semicrome, una posizione per battuta, sopra una croma staccata della sinistra sul battere. 676: scala ascendente. 677-681: discesa di cinque battute fino al grave. 682: collegamento al 2/4.", "andate": {"1": {"rep2": "BLOC sulle figure 668-675: ogni battuta come accordo, senza guardare; poi STAC pp.", "rep3": "RIT su coppie nella scala 676-681: lungo-corto, poi corto-lungo."}, "2": {"rep2": "ACC sulla 2ª semicroma di ogni coppia; sinistra MUTA.", "rep3": "CHUNK a ritroso sulla discesa: ultima battuta più l'arrivo di 682, ultime due, ultime tre."}}, "rep4_verifica": "pp uniforme. Passaggi del pollice inudibili nella discesa. Nessun buco dove la figura cambia rigo. Arrivo a 682 a tempo.", "note": "Peters p. 85 sistema 5 batt. 3 – p. 86 sistema 1 batt. 4.\nNon ho potuto verificare se le ultime battute della discesa (680-681, in chiave di basso) passano alla sinistra."}, {"id": "mephisto-683-690", "brano": "mephisto", "battute": "683-690", "titolo": "2/4: melodia in ottave «ben marcato e pesante», sestine che cambiano registro", "priorita": 1, "famiglia": "mephisto-fam-pesante-2-4", "nodo_motorio": "Sinistra: melodia in ottave nel grave, con salti e ritmo puntato. Destra: a ogni quarto una sestina (pausa più cinque semicrome, con bicordo al vertice) in un registro diverso, grave–acuto–grave. Nelle battute 3-4 di ogni frase: arpeggio con terze che sale per tre ottave e ridiscende, con sfz al vertice.", "andate": {"1": {"rep2": "Destra sola, BLOC: ogni sestina come un accordo, uno per quarto, a tempo dimezzato; la seconda volta CIECO.", "rep3": "Sinistra sola, PESO: ogni ottava dal tasto con rilascio immediato. CIECO shift–touch–play sui salti."}, "2": {"rep2": "CHUNK: una sestina più la prima nota della seguente a tempo pieno, stop con la mano già sulla posizione nuova.", "rep3": "Insieme, DIN: sinistra f, destra pp. Arpeggio 685-686 e 689-690: RIT con fermata sulla 1ª nota di ogni posizione."}}, "rep4_verifica": "Melodia della sinistra sempre in primo piano. Nessuna sestina iniziata in ritardo dopo il cambio di registro. Vertice dell'arpeggio senza allargare il tempo. Ottave gravi senza spinta di spalla.", "note": "Peters p. 86, sistema 1 batt. 5 – sistema 3 batt. 3.\nLa b. 683 è l'ultima battuta del sistema 1 di p. 86, dopo il cambio di tempo in 2/4."}, {"id": "mephisto-691-698", "brano": "mephisto", "battute": "691-698", "titolo": "2/4 pesante: poco a poco crescendo, più crescendo", "priorita": 1, "famiglia": "mephisto-fam-pesante-2-4", "nodo_motorio": "Sinistra: melodia in ottave nel grave, con salti e ritmo puntato. Destra: a ogni quarto una sestina (pausa più cinque semicrome, con bicordo al vertice) in un registro diverso, grave–acuto–grave. Nelle battute 3-4 di ogni frase: arpeggio con terze che sale per tre ottave e ridiscende, con sfz al vertice.", "andate": {"1": {"rep2": "Destra sola, BLOC: ogni sestina come un accordo, uno per quarto, a tempo dimezzato; la seconda volta CIECO.", "rep3": "Sinistra sola, PESO: ogni ottava dal tasto con rilascio immediato. CIECO shift–touch–play sui salti."}, "2": {"rep2": "CHUNK: una sestina più la prima nota della seguente a tempo pieno, stop con la mano già sulla posizione nuova.", "rep3": "Insieme, DIN: sinistra f, destra pp. Arpeggio 693-694 e 697-698: RIT con fermata sulla 1ª nota di ogni posizione. Il crescendo solo in Rep 4."}}, "rep4_verifica": "Melodia della sinistra sempre in primo piano. Nessuna sestina iniziata in ritardo dopo il cambio di registro. Vertice dell'arpeggio senza allargare il tempo. Ottave gravi senza spinta di spalla.", "note": "Peters p. 86, sistema 3 batt. 4 – sistema 5 batt. 3.\nGemello di 683-690 su altre armonie."}, {"id": "mephisto-699-714", "brano": "mephisto", "battute": "699-714", "titolo": "Con fuoco: ottave staccate della destra a salti, basso e accordi", "priorita": 2, "famiglia": "mephisto-fam-con-fuoco", "nodo_motorio": "Destra: ottave staccate che salgono a salti e ricadono in coppie legate, nell'acuto. Sinistra: basso sf nel grave e subito salto agli accordi ribattuti in chiave di violino, tre per battuta.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: solo pollice, poi solo mignolo (4 sui tasti neri); poi ottave a mp con PESO, un impulso per battuta.", "rep3": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; accordi ribattuti di rimbalzo."}, "2": {"rep2": "Insieme a mp, sinistra MUTA per due battute e suonata per due.", "rep3": "CHUNK: due battute più il battere seguente a tempo pieno; durante lo stop polsi e spalle rilasciati, mani già sulla posizione seguente."}}, "rep4_verifica": "Ottave complete e leggere di polso. Nessun ritardo della sinistra dopo il basso. Sf solo sul basso. A b. 714 l'avambraccio non si è indurito.", "note": "Peters p. 87, sistema 1 batt. 1 – sistema 3 batt. 2."}, {"id": "mephisto-715-722", "brano": "mephisto", "battute": "715-722", "titolo": "Con fuoco, ff: ottave a salti, basso e accordi", "priorita": 2, "famiglia": "mephisto-fam-con-fuoco", "nodo_motorio": "Destra: ottave staccate che salgono a salti e ricadono in coppie legate, nell'acuto. Sinistra: basso sf nel grave e subito salto agli accordi ribattuti in chiave di violino, tre per battuta.", "andate": {"1": {"rep2": "Destra sola, DIN dentro la mano: solo pollice, poi solo mignolo (4 sui tasti neri); poi ottave a mp con PESO, un impulso per battuta.", "rep3": "Sinistra sola, CIECO shift–touch–play dal basso all'accordo; accordi ribattuti di rimbalzo."}, "2": {"rep2": "Insieme a mp, sinistra MUTA per due battute e suonata per due.", "rep3": "CHUNK: due battute più il battere seguente a tempo pieno; durante lo stop polsi e spalle rilasciati, mani già sulla posizione seguente."}}, "rep4_verifica": "Ottave complete e leggere di polso. Nessun ritardo della sinistra dopo il basso. Sf solo dove è scritto. A b. 722 l'avambraccio non si è indurito.", "note": "Peters p. 87, sistema 3 batt. 3 – sistema 4 batt. 2.\nContinuazione di 699-714 in ff su un altro basso."}, {"id": "mephisto-723-734", "brano": "mephisto", "battute": "723-734", "titolo": "Stringendo: ottava e accordi a salti in tutte e due le mani", "priorita": 2, "famiglia": "mephisto-fam-stringendo", "nodo_motorio": "Ogni battuta: la destra suona un'ottava sf e due accordi più in basso, la sinistra un basso e due accordi più in alto. Un salto per mano a ogni battuta, in stringendo, salendo di posizione ogni due battute.", "andate": {"1": {"rep2": "BLOC: per ogni battuta due soli eventi (ottava e accordo nella destra, basso e accordo nella sinistra), a tempo dimezzato e senza guardare; la seconda volta CIECO.", "rep3": "PESO a mp: un impulso sul battere, i due accordi di rimbalzo. Ogni quattro battute stop sull'accordo con il polso che si muove."}, "2": {"rep2": "MUTA: una mano suona, l'altra fantasma; poi si scambia.", "rep3": "Stringendo a gradini: 8-10 clic in più ogni quattro battute. Lo stringendo continuo solo in Rep 4."}}, "rep4_verifica": "Accordi completi fino all'ultima battuta. Lo stringendo non accorcia la 3ª croma. Nessuna spinta di spalla. Il suono cresce per caduta, non per pressione.", "note": "Peters p. 87, sistema 4 batt. 3 – sistema 5 batt. 6.\nSe senti bruciore o indurimento nell'avambraccio, fermati: non completare la Rep."}, {"id": "mephisto-735-744", "brano": "mephisto", "battute": "735-744", "titolo": "Stringendo: culmine, sei battute sullo stesso accordo, pausa", "priorita": 2, "famiglia": "mephisto-fam-stringendo", "nodo_motorio": "Come 723-734 per due battute; poi sei battute (737-742) sulla stessa ottava con accordi ribattuti, al culmine dello stringendo. 743 pausa in 2/4, 744 anacrusi in terzina verso il Presto.", "andate": {"1": {"rep2": "BLOC: per ogni battuta due soli eventi (ottava e accordo nella destra, basso e accordo nella sinistra), a tempo dimezzato e senza guardare; la seconda volta CIECO.", "rep3": "PESO a mp: un impulso sul battere, i due accordi di rimbalzo. Ogni quattro battute stop sull'accordo con il polso che si muove."}, "2": {"rep2": "MUTA: una mano suona, l'altra fantasma; poi si scambia.", "rep3": "CHUNK a ritroso: 741-742 più la pausa e l'anacrusi di 744; poi da 739, poi da 737. A mp."}}, "rep4_verifica": "Sei battute uguali senza crescere di tensione. Accordi completi. Pausa di 743 esatta. Anacrusi di 744 a tempo del Presto.", "note": "Peters p. 87, sistema 5 batt. 7 – sistema 6 batt. 8.\nLa b. 743 è vuota (cifra 1), già in 2/4. Se senti bruciore o indurimento nell'avambraccio, fermati."}, {"id": "mephisto-745-754", "brano": "mephisto", "battute": "745-754", "titolo": "Presto strepitoso: ottave in terzina, sinistra ottava grave e accordo", "priorita": 2, "famiglia": "mephisto-fam-ottave-terzinate", "nodo_motorio": "Destra: a ogni quarto terzina «pausa, ottava, ottava», con la seconda più bassa (4 sui tasti neri), in sequenza discendente. Sinistra: ottava nel grave sul primo quarto e accordo sul secondo, con un salto a ogni quarto.", "andate": {"1": {"rep2": "Destra sola a mp, PESO: le due ottave di ogni terzina sono un solo gesto caduta–risalita. Pollice solo, poi ottava intera.", "rep3": "Sinistra sola, CIECO shift–touch–play dall'ottava grave all'accordo."}, "2": {"rep2": "Insieme a mp, RIT: fermata sulla 1ª ottava della terzina, la 2ª e l'attacco seguente di scatto; poi fermata sulla 2ª.", "rep3": "CHUNK: una battuta più il battere seguente a tempo pieno, stop con le mani già sulla battuta dopo."}}, "rep4_verifica": "Tutte e due le ottave di ogni coppia complete. La pausa della terzina è reale: la mano si richiude. Sinistra precisa sul basso senza guardarlo. ff di caduta, non di pressione.", "note": "Peters p. 88, sistema 1 batt. 1 – sistema 2 batt. 5."}, {"id": "mephisto-755-770", "brano": "mephisto", "battute": "755-770", "titolo": "Ottave cromatiche in terzina, figure puntate scambiate, accordi legati a due", "priorita": 2, "famiglia": "mephisto-fam-ottave-terzinate", "nodo_motorio": "Battute alterne: ottave della destra che salgono cromaticamente in terzina e figura puntata di due ottave scambiata tra destra e sinistra; in mezzo torna il disegno di 745. 768-770: accordi ff legati a due che saltano di registro, sf finale.", "andate": {"1": {"rep2": "Destra sola, salite cromatiche: PESO, un impulso per terzina. Pollice solo, poi mignoli (4 sui neri), poi ottave a mp.", "rep3": "Figure puntate (756, 760, 764, 766): MUTA, una mano suona e l'altra tocca; poi insieme, con la nota corta di rimbalzo."}, "2": {"rep2": "768-770: CIECO shift–touch–play sugli accordi a coppie, a mani unite.", "rep3": "CHUNK: una battuta di salita più la figura puntata a tempo pieno, stop."}}, "rep4_verifica": "Salite cromatiche pulite tra tasti bianchi e neri. Scambio destra–sinistra a tempo. Accordi 768-770 completi. Sf finale dal tasto.", "note": "Peters p. 88, sistema 3 batt. 1 – sistema 6 batt. 1."}, {"id": "mephisto-771-778", "brano": "mephisto", "battute": "771-778", "titolo": "Leggiero, p staccatissimo: salto dalla nota singola all'ottava acuta", "priorita": 1, "famiglia": "mephisto-fam-salti-leggiero", "nodo_motorio": "A ogni quarto la destra suona una nota singola col 2 e salta all'ottava circa due ottave più su; la sinistra suona il basso e salta all'accordo. L'ottava della destra e l'accordo della sinistra cadono insieme. Ogni quarta battuta: accordi pieni rinforzando.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play: nota singola, spostamento rapido, ottava toccata muta, controllo, suono. Lo sguardo va sull'ottava d'arrivo prima che la mano parta.", "rep3": "Sinistra sola allo stesso modo (basso → accordo). Poi solo gli arrivi: BLOC di ottava destra più accordo sinistro, uno per quarto, senza guardare."}, "2": {"rep2": "MENT: due battute mentali a tempo con le distanze immaginate, poi reali.", "rep3": "RIT: fermata sulla nota singola e sul basso, salto e arrivo di scatto; poi fermata sull'arrivo, ritorno di scatto."}}, "rep4_verifica": "Ottava d'arrivo presa dal tasto, p e staccatissimo. Nessun arrivo corto. Mani insieme sull'arrivo. Il braccio descrive un arco basso, non un salto in alto. Rinforzando solo negli accordi.", "note": "Peters p. 88 sistema 6 batt. 2 – p. 89 sistema 1 batt. 4."}, {"id": "mephisto-779-786", "brano": "mephisto", "battute": "779-786", "titolo": "Leggiero staccatissimo: salti su altre armonie", "priorita": 1, "famiglia": "mephisto-fam-salti-leggiero", "nodo_motorio": "A ogni quarto la destra suona una nota singola col 2 e salta all'ottava circa due ottave più su; la sinistra suona il basso e salta all'accordo. L'ottava della destra e l'accordo della sinistra cadono insieme. Ogni quarta battuta: accordi pieni rinforzando.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play: nota singola, spostamento rapido, ottava toccata muta, controllo, suono. Lo sguardo va sull'ottava d'arrivo prima che la mano parta.", "rep3": "Sinistra sola allo stesso modo (basso → accordo). Poi solo gli arrivi: BLOC di ottava destra più accordo sinistro, uno per quarto, senza guardare."}, "2": {"rep2": "MENT: due battute mentali a tempo con le distanze immaginate, poi reali.", "rep3": "RIT: fermata sulla nota singola e sul basso, salto e arrivo di scatto; poi fermata sull'arrivo, ritorno di scatto."}}, "rep4_verifica": "Ottava d'arrivo presa dal tasto, p e staccatissimo. Nessun arrivo corto. Mani insieme sull'arrivo. Il braccio descrive un arco basso, non un salto in alto. Rinforzando solo negli accordi.", "note": "Peters p. 89, sistema 1 batt. 5 – sistema 3 batt. 2.\nGemello di 771-778: stesse distanze su tasti diversi. Lavorali in circuiti diversi finché uno dei due non è in drop-out."}, {"id": "mephisto-787-798", "brano": "mephisto", "battute": "787-798", "titolo": "Salti in crescendo, poi accordi ribattuti leggiero e salto all'ottava", "priorita": 1, "famiglia": null, "nodo_motorio": "787-790: salti come a 771, in crescendo, con la sinistra che alterna basso, accordo acuto e nota grave. 791-798: dopo il basso, tre accordi ribattuti (due semicrome e una croma) a mani unite e salto all'ottava acuta, a ogni battuta su un'armonia diversa.", "andate": {"1": {"rep2": "BLOC muto: tocca in silenzio basso, accordo e ottava di ogni battuta a mani unite, a tempo dimezzato; poi suona.", "rep3": "PESO: i tre accordi ribattuti sono un impulso e due rimbalzi dal tasto. CIECO sul salto all'ottava."}, "2": {"rep2": "MENT: due battute mentali a tempo, poi reali.", "rep3": "CHUNK: una battuta più il basso seguente a tempo pieno, stop con le mani già sul basso."}}, "rep4_verifica": "Accordi ribattuti tutti e tre udibili e leggeri. Ottava d'arrivo presa dal tasto. Nessun ritardo dopo il basso. Crescendo di 787-790 senza indurire.", "note": "Peters p. 89, sistema 3 batt. 3 – sistema 6 batt. 1."}, {"id": "mephisto-799-812", "brano": "mephisto", "battute": "799-812", "titolo": "Tutta forza: volate di biscrome su e giù, ottave gravi e accordi", "priorita": 5, "famiglia": null, "nodo_motorio": "Sette volte: la destra sale in una battuta per più di due ottave (diteggiatura 1-2-3-5 ripetuta) e ridiscende nella successiva. La sinistra attacca con due ottave rapide nel grave, salta agli accordi in terzina e poi tiene l'accordo.", "andate": {"1": {"rep2": "Destra sola, BLOC: ogni posizione 1-2-3-5 come accordo, in su e in giù, senza guardare.", "rep3": "RIT a gruppi di 4: fermata sulla 1ª nota, poi sulla 4ª (prima del pollice)."}, "2": {"rep2": "Sinistra sola: CIECO shift–touch–play dalle ottave gravi agli accordi; PESO sull'accordo tenuto.", "rep3": "CHUNK: una posizione più una nota a tempo pieno; poi la salita intera più il vertice; poi salita e discesa."}}, "rep4_verifica": "Volata uguale ai passaggi del pollice. Vertice a tempo. Accordi della sinistra insieme e non in ritardo. fff di braccio, dita vicine al tasto.", "note": "Peters p. 89 sistema 6 batt. 2 – p. 90 sistema 6 batt. 2.\nNon ho verificato nota per nota le sette volate: la descrizione viene dalle diteggiature e dal profilo."}, {"id": "mephisto-813", "brano": "mephisto", "battute": "813", "titolo": "Cadenza: note doppie a mani alternate in salita, discesa a terze spezzate", "priorita": 5, "famiglia": null, "nodo_motorio": "Senza misura. Salita ff: le mani si alternano a coppie di note doppie in biscrome (sinistra 2-3-4 e 1, destra 4-2 e 3-1) per circa tre ottave, con pedale tenuto; in cima la figura si ripete rinforzando molto. Poi discesa diminuendo della destra, cromatica a terze spezzate, diteggiata 4-2-3-1.", "andate": {"1": {"rep2": "Salita: togli l'alternanza. Le due mani insieme a blocchi (BLOC), una posizione dopo l'altra, senza guardare.", "rep3": "Discesa: RIT a gruppi di 4 (fermata sulla 1ª nota, poi sulla 3ª) con la diteggiatura 4-2-3-1."}, "2": {"rep2": "Salita come scritta, MUTA: una mano suona e l'altra fantasma; poi si scambia.", "rep3": "CHUNK: quattro gruppi più uno a tempo pieno. Discesa a ritroso: ultima ottava, ultime due."}}, "rep4_verifica": "Alternanza senza galoppo e senza che le mani si urtino. Crescendo di peso. Discesa uguale fino in fondo, diminuendo vero. Attacco del Presto pp a tempo.", "note": "Peters p. 91, sistema 1 batt. 1.\nOccupa i sistemi 1-3 di p. 91 senza stanghette: la conto come una battuta. Non ho potuto verificare le singole note."}, {"id": "mephisto-814-829", "brano": "mephisto", "battute": "814-829", "titolo": "Presto pp sempre, una corda: sinistra in semicrome alternate, bicordi staccati", "priorita": 6, "famiglia": "mephisto-fam-presto-pp", "nodo_motorio": "Sinistra: sedici battute di semicrome alternate su due note vicine (3-1, 2-1), una sorta di trillo misurato. Destra da b. 818: unità di quattro battute come a 457 (una di terze con nota oscillante, tre di bicordi staccati).", "andate": {"1": {"rep2": "Sinistra sola, TRILL misurato a sei note per battuta, dita vicine al tasto. ROT: due battute di sola rotazione, due di sole dita.", "rep3": "Destra STAC pp sui bicordi, sinistra MUTA."}, "2": {"rep2": "ACC nella sinistra ogni 3 note, poi ogni 2.", "rep3": "CLIC sul levare (2ª croma)."}}, "rep4_verifica": "Sinistra uguale per tutte le sedici battute, senza accento ai cambi di nota. Bicordi simultanei. pp senza trattenere.", "note": "Peters p. 91 sistema 4 batt. 1 – p. 92 sistema 1 batt. 1."}, {"id": "mephisto-830-845", "brano": "mephisto", "battute": "830-845", "titolo": "Presto ppp: terze oscillanti, poi ritenuto con la sinistra sola", "priorita": 6, "famiglia": "mephisto-fam-presto-pp", "nodo_motorio": "830-833 come prima. 834-841 ppp: terze oscillanti della destra in semicrome su gruppi di quattro semicrome della sinistra, poi destra sola. 842-845: ritenuto il tempo, una nota lunga per battuta nella sinistra.", "andate": {"1": {"rep2": "ROT sulle terze oscillanti della destra: sola rotazione, poi sole dita, poi miscela minima.", "rep3": "Sinistra sola 834-838: BLOC (ogni gruppo come accordo), poi legato."}, "2": {"rep2": "ACC nella destra ogni 3 note, poi ogni 2; sinistra MUTA.", "rep3": "MENT su 839-845 (ritenuto e durate), poi reale."}}, "rep4_verifica": "Terze a due suoni sempre simultanei. ppp senza note mute. Ritenuto graduale, quattro note lunghe uguali.", "note": "Peters p. 92, sistema 1 batt. 2 – sistema 3 batt. 7."}, {"id": "mephisto-846-861", "brano": "mephisto", "battute": "846-861", "titolo": "2/4, dolce espressivo: recitativo, note ribattute e trilli con corona", "priorita": 7, "famiglia": null, "nodo_motorio": "Frasi libere a una voce con accordi arpeggiati pp, una corda. Nelle due cadenze (858 e 860): note ribattute portate, trillo con corona, terzine e semicrome ad libitum. 861: accordo arpeggiato, smorzando.", "andate": {"1": {"rep2": "Note ribattute delle cadenze: STAC pp con cambio di dito, da metà corsa del tasto.", "rep3": "TRILL a 4 e poi a 6 note sui due trilli, con la chiusa scritta."}, "2": {"rep2": "PESO a pp sugli accordi arpeggiati: tutte le note parlano, rilascio immediato.", "rep3": "MENT su tutto il frammento a tempo libero, poi reale."}}, "rep4_verifica": "Ribattute tutte udibili e in crescendo. Trillo regolare che non si blocca prima della corona. Accordi arpeggiati morbidi. Smorzando fino al silenzio.", "note": "Peters p. 92, sistema 4 batt. 1 – sistema 6 batt. 2.\nLe due cadenze (858 e 860) e la b. 861 sono battute lunghe senza misura: le conto come una battuta ciascuna."}, {"id": "mephisto-862-877", "brano": "mephisto", "battute": "862-877", "titolo": "Presto: ottave gravi della sinistra e accordi in levare della destra, crescendo", "priorita": 4, "famiglia": null, "nodo_motorio": "Sinistra: ottave nel registro più grave, lunghe e brevi. Destra: due accordi in levare per battuta, che salgono di posizione a ogni battuta, da p in crescendo per quindici battute. Tre corde.", "andate": {"1": {"rep2": "Destra sola, BLOC muto e poi suonato: una forma d'accordo per battuta, senza guardare.", "rep3": "PESO: i due accordi in levare sono un impulso e un rimbalzo. Sinistra: pollice solo, poi ottava."}, "2": {"rep2": "CLIC: un solo clic per battuta; destra sola, poi insieme.", "rep3": "DIN: sinistra mf, destra pp. Il crescendo solo in Rep 4."}}, "rep4_verifica": "Accordi in levare esatti (non anticipati) e completi. Crescendo graduale. Ottave gravi senza durezza. Arrivo al ff di 878 senza tensione accumulata.", "note": "Peters p. 92 sistema 6 batt. 3 – p. 93 sistema 2 batt. 6.\nLa b. 862 è vuota (cifra 1)."}, {"id": "mephisto-878-887", "brano": "mephisto", "battute": "878-887", "titolo": "ff: coppie di accordi a ritmo puntato che saltano di registro", "priorita": 1, "famiglia": null, "nodo_motorio": "Coppie di accordi semicroma–croma a mani unite. Ogni coppia è in un registro diverso da quella prima, quindi tutte e due le mani saltano tra una coppia e l'altra, per dieci battute.", "andate": {"1": {"rep2": "BLOC: ogni coppia ridotta a un solo accordo, a mani unite, in crome; la seconda volta CIECO.", "rep3": "CIECO shift–touch–play tra una coppia e la successiva."}, "2": {"rep2": "MENT: quattro battute mentali a tempo con le distanze immaginate, poi reali.", "rep3": "RIT: fermata sul secondo accordo della coppia, salto e coppia seguente di scatto. PESO: un impulso per coppia, il secondo accordo di rimbalzo."}}, "rep4_verifica": "Tutti e due gli accordi di ogni coppia completi. Il salto non accorcia la croma. ff di caduta, con rilascio tra le coppie. Mani insieme.", "note": "Peters p. 93, sistema 2 batt. 7 – sistema 3 batt. 8."}, {"id": "mephisto-888-897", "brano": "mephisto", "battute": "888-897", "titolo": "2/4: accordi in crome, volata su e giù, accordi staccati", "priorita": 5, "famiglia": null, "nodo_motorio": "Due battute di accordi pieni in crome a due mani nell'acuto e due accordi isolati; poi volata della destra che sale da p in crescendo e ridiscende rinforzando sopra accordi ribattuti della sinistra; due accordi staccati.", "andate": {"1": {"rep2": "Volata 892-895: BLOC sulle posizioni, poi RIT con fermata prima di ogni cambio di posizione.", "rep3": "Accordi 888-891: PESO a mp, un impulso ogni due accordi. CIECO sui due accordi isolati."}, "2": {"rep2": "CHUNK a ritroso sulla discesa fino all'accordo di 896.", "rep3": "DIN: destra mp, sinistra pp di rimbalzo."}}, "rep4_verifica": "Accordi in crome completi e uguali. Volata regolare al cambio di direzione. Accordi di 896-897 dal tasto e a tempo.", "note": "Peters p. 93, sistema 4 batt. 1 – sistema 5 batt. 3."}, {"id": "mephisto-898-909", "brano": "mephisto", "battute": "898-909", "titolo": "Ottave alternate tra le mani ff e accordi finali", "priorita": 2, "famiglia": "mephisto-fam-martellato", "nodo_motorio": "Ottave in semicrome alternate tra sinistra e destra, che salgono cromaticamente per otto battute fino all'acuto; poi tre colpi finali con salto al grave e corona sulla pausa.", "andate": {"1": {"rep2": "Togli lo sfasamento: ottave delle due mani insieme, in crome, a mp; la seconda volta CIECO.", "rep3": "DIN dentro la mano: solo pollici alternati, poi solo mignoli; polsi bassi."}, "2": {"rep2": "Come scritto a mp, con CLIC sulla 2ª semicroma: senti la destra come battere.", "rep3": "PESO: un impulso per battuta e gli altri colpi di rimbalzo. CIECO shift–touch–play sui tre accordi finali."}}, "rep4_verifica": "Semicrome composte uguali, senza galoppo. Ottave complete. Crescendo di peso. Avambracci liberi all'arrivo. Accordi finali presi dal tasto.", "note": "Peters p. 93, sistema 5 batt. 4 – sistema 6 batt. 8.\nSe senti bruciore o indurimento nell'avambraccio, fermati: non completare la Rep."}, {"id": "scriabin fantasie-1-4", "brano": "scriabin28", "battute": "1-4", "titolo": "Tema iniziale, p", "priorita": 1, "famiglia": "fam-scriabin-tema-iniziale", "nodo_motorio": "Accordi di 3-4 note della destra a p con la voce superiore che canta e le note interne che restano sotto; terzine di crome ad accordi ribattuti legati al canto (b. 1). Sinistra: terzine con basso grave e accordo nel medio, piccolo salto a ogni quarto.", "andate": {"1": {"rep2": "DIN dentro la mano (destra): voce superiore suonata mp, resto dell'accordo muto; poi il contrario, interne pp e voce muta.", "rep3": "Scheletro: basso della sinistra e voce superiore della destra, legati senza pedale; poi rimetti le parti interne pp."}, "2": {"rep2": "DIN dentro la mano con le dita invertite di ruolo: interne suonate e uguali tra loro, voce superiore muta; poi tutto, voce mp e interne pp.", "rep3": "Sinistra sola: PESO sul basso di ogni terzina, accordo di rimbalzo leggero. Poi insieme, destra pp."}}, "rep4_verifica": "La voce superiore si sente sopra l'accordo senza spinta; nelle terzine di b. 1 l'accordo ribattuto non ripete anche il canto più forte; le terzine della sinistra sono un fondo, basso presente e accordo più leggero, che nel pedale non impasta.", "note": "A b. 2 c'è un tuo segno a matita vicino al pedale (lo leggo «tutto», con incertezza)."}, {"id": "scriabin fantasie-5-12", "brano": "scriabin28", "battute": "5-12", "titolo": "Accordi f, quintine della destra, ridistribuzioni m.g./m.d.", "priorita": 7, "famiglia": "fam-scriabin-quintine-moderato", "nodo_motorio": "Quintine discendenti di semicrome della destra con accordo sulla prima nota; ridistribuzioni in cui una mano prende note dell'altra a metà gesto (m.g. a b. 5, m.d. a bb. 7, 9, 10, 11); terzine larghe della sinistra dal basso grave. A b. 12 (cerchiata) salto della sinistra in terzina dal basso all'accordo.", "andate": {"1": {"rep2": "ACC sulle quintine: raggruppa 2+3, poi 3+2.", "rep3": "NODO sulle ridistribuzioni: fermati sulla nota presa dall'altra mano, verifica che scenda insieme a quella della mano titolare, poi suona da nodo a nodo."}, "2": {"rep2": "STAC pp sulle quintine, poi legato; la seconda volta CIECO.", "rep3": "Scheletro: basso della sinistra e voce superiore della destra; poi le quintine pp sopra. Se b. 12 si sporca, CIECO shift–touch–play sul solo salto della sinistra."}}, "rep4_verifica": "Quintine uguali e senza accento nel punto in cui cambia la mano; la ridistribuzione non si sente; il f è pieno sul basso e sugli accordi, non sulle quintine, che restano leggere."}, {"id": "scriabin fantasie-13-16", "brano": "scriabin28", "battute": "13-16", "titolo": "Tema iniziale, ripresa con voce di tenore", "priorita": 1, "famiglia": "fam-scriabin-tema-iniziale", "nodo_motorio": "Come 1-4; in più, a bb. 15-16, la sinistra ha note accentate (>) legate di valore che formano una voce di tenore dentro le terzine.", "andate": {"1": {"rep2": "DIN dentro la mano (destra): voce superiore suonata mp, resto muto; poi il contrario.", "rep3": "Sinistra sola: le note accentate di 15-16 tenute e cantate, il resto delle terzine pp."}, "2": {"rep2": "Scheletro: basso, tenore e voce superiore della destra; poi le parti interne pp.", "rep3": "DIN: sinistra mp, destra pp; poi il contrario. Il tenore deve restare udibile in entrambi i casi."}}, "rep4_verifica": "Il tenore di 15-16 emerge come seconda voce senza rompere il p; la voce superiore della destra resta la prima; nel pedale (tua matita a b. 15) il tenore non si confonde con il basso."}, {"id": "scriabin fantasie-17-23", "brano": "scriabin28", "battute": "17-23", "titolo": "Ripresa delle quintine, poi mp cresc. e f", "priorita": 7, "famiglia": "fam-scriabin-quintine-moderato", "nodo_motorio": "bb. 17-18 come 5-6, con m.g.; b. 19 m.d. sugli accordi della sinistra; da b. 20 crescendo con accordi della destra che cambiano forma a ogni quarto e terzine della sinistra.", "andate": {"1": {"rep2": "ACC sulle quintine: 2+3, poi 3+2.", "rep3": "NODO sulle ridistribuzioni di b. 17 (m.g.) e b. 19 (m.d.)."}, "2": {"rep2": "BLOC sulle bb. 20-23: ogni forma della destra come accordo a tempo di quarti, con la sinistra; la seconda volta CIECO.", "rep3": "DIN: sinistra f, destra pp; poi il contrario."}}, "rep4_verifica": "Il crescendo di 20-22 è costruito sul basso, non sugli accordi della destra; le quintine restano leggere anche nel f; nessun vuoto quando la mano destra prende gli accordi della sinistra a b. 19."}, {"id": "scriabin fantasie-24-29", "brano": "scriabin28", "battute": "24-29", "titolo": "Accordi ff a due mani, poi diminuendo con quintine", "priorita": 5, "famiglia": null, "nodo_motorio": "Accordi pieni ff in entrambe le mani con cambio di forma a ogni quarto e terzine (24-26); poi diminuendo rapido fino al p (26-29) con quintine discendenti della destra.", "andate": {"1": {"rep2": "PESO a mp: un impulso per accordo, rilascio subito; mentre tieni l'accordo il polso deve potersi muovere.", "rep3": "BLOC sui cambi di forma di 24-26, CIECO."}, "2": {"rep2": "DIN dentro le mani: voce superiore della destra e basso della sinistra suonati, il resto pp.", "rep3": "ACC sulle quintine di 27-29: 2+3, poi 3+2."}}, "rep4_verifica": "ff pieno ma non percosso, senza rumore di tasto sul fondo; il diminuendo 26-29 arriva al p senza rallentare; quintine finali leggere."}, {"id": "scriabin fantasie-30-38", "brano": "scriabin28", "battute": "30-38", "titolo": "Più vivo: secondo tema sopra gli arpeggi della sinistra", "priorita": 3, "famiglia": "fam-scriabin-secondo-tema", "nodo_motorio": "Sinistra in crome su circa due ottave per battuta: basso da tenere col pedale, culmine nell'acuto, voce di tenore da far emergere (tua matita «Tenore ↑»). Destra: canto legato; da b. 34 canto più voce interna nella stessa mano (diteggiature 5-3, 4-2).", "andate": {"1": {"rep2": "Sinistra sola, scheletro: il basso di ogni battuta, tenuto col dito, e la voce di tenore; poi tutte le crome pp sotto.", "rep3": "Destra sola da b. 34: DIN dentro la mano, canto suonato e voce interna muta; poi il contrario."}, "2": {"rep2": "Sinistra sola: RIT a coppie, lungo-corto e poi corto-lungo, pp, con il polso che segue la curva dell'arpeggio.", "rep3": "Insieme: destra suona, sinistra MUTA, la curva fatta sulla superficie dei tasti; poi si scambia."}}, "rep4_verifica": "Il basso dura nel pedale per tutta la battuta e le crome si spengono salendo; al culmine dell'arpeggio la sinistra non copre il canto; la voce interna di 35-37 si sente, ma sotto il canto.", "note": "In queste battute hai molte annotazioni a matita sul suono; ne leggo con sicurezza solo alcune (vedi «Cosa non ho potuto verificare»)."}, {"id": "scriabin fantasie-39-47", "brano": "scriabin28", "battute": "39-47", "titolo": "Secondo tema, crescendo fino al f", "priorita": 3, "famiglia": "fam-scriabin-secondo-tema", "nodo_motorio": "Come 30-38, con la destra spesso a doppie note (terze e seste) legate; crescendo da b. 40 a b. 45; a b. 44 tre pollici consecutivi nella sinistra (1-1-1 stampato).", "andate": {"1": {"rep2": "Sinistra sola: ACC pp, accento sulla 2ª croma di ogni gruppo di tre, poi sulla 3ª.", "rep3": "Destra sola: doppie note con voce superiore legata e inferiore staccata pp; poi il contrario."}, "2": {"rep2": "Scheletro: basso e canto; poi le crome pp.", "rep3": "CLIC, un solo clic per battuta, tutto il frammento: l'onda della sinistra senza appoggio sul battere."}}, "rep4_verifica": "Il crescendo 40-45 viene dal basso e dal canto, non dalle crome interne; a b. 44 i pollici ripetuti non battono; il legato delle doppie note della destra regge senza pedale in Rep 2-3 e non si impasta in Rep 4.", "note": "Sopra le bb. 39 e 41 c'è una parola a matita che leggo «legg.» (leggero?), con incertezza."}, {"id": "scriabin fantasie-48-54", "brano": "scriabin28", "battute": "48-54", "titolo": "Crescendo e ff appassionato ad accordi ribattuti", "priorita": 2, "famiglia": "fam-scriabin-ribattuti-due-mani", "parti": ["48-50", "51-54"], "nodo_motorio": "bb. 48-50: la destra tiene il canto e ribatte accordi in crome nella stessa mano (m.d.), poi crescendo verso b. 51.\nbb. 51-54: accordi ribattuti in crome a due mani, ff appassionato, canto sulla nota superiore della destra; il basso della sinistra cambia registro.", "andate": {"1": {"rep2": "bb. 48-50: DIN dentro la mano: canto tenuto e suonato, accordi ribattuti muti; poi ribattuti pp e canto muto.\nbb. 51-54: PESO a mp, un impulso per battuta e gli altri accordi di rimbalzo.", "rep3": "bb. 51-54: DIN dentro la mano destra: voce superiore f, resto dell'accordo pp."}, "2": {"rep2": "BLOC sui cambi di accordo: solo il primo accordo di ogni forma, a tempo di quarti, CIECO.", "rep3": "Ribattuti dalla metà corsa del tasto, senza staccare le dita, pp; canto f."}, "3": {"rep2": "Sinistra sola: basso e accordo come un'unica caduta del braccio; CIECO sul basso.", "rep3": "CHUNK a tempo: un quarto più il primo accordo del seguente, stop con la mano già sulla forma seguente."}, "4": {"rep2": "MENT del crescendo 49-51: dove culmina e con che suono. Subito dopo la ripetizione reale.", "rep3": "CLIC sul levare (2ª croma), 51-54 di fila."}}, "rep4_verifica": "Il ff appassionato ha profondità senza colpi: canto della destra sopra, accordi interni come massa e non come colpi; il crescendo 49-51 arriva al ff senza accelerare; dopo b. 54 l'avambraccio è morbido.", "note": "Sopra b. 49 leggo a matita, con incertezza: «cresci con destra quasi violenta così esce il ff appassionato». Va nella stessa direzione della DIN: il crescendo lo guida la destra. Carico tra i più alti del brano: Rep 2-3 a mp come da regola."}, {"id": "scriabin fantasie-55-63", "brano": "scriabin28", "battute": "55-63", "titolo": "Più vivo ♩ = 126: marcia ad accordi puntati", "priorita": 6, "famiglia": "fam-scriabin-marcia", "nodo_motorio": "Accordi puntati (croma puntata–semicroma) a due mani; accordi della destra che cambiano forma a ogni quarto; salti della sinistra dal basso agli accordi in semicroma (bb. 57, 61-62); accel. da b. 59.", "andate": {"1": {"rep2": "BLOC: ogni forma della destra come accordo a tempo di quarti, CIECO.", "rep3": "Sinistra sola: CIECO shift–touch–play sui salti di 57 e 61-62: atterra muta sull'accordo, controlla al tatto, suona."}, "2": {"rep2": "RIT: fermata sulla croma puntata, semicroma di scatto e vicina al tasto.", "rep3": "MENT, poi la ripetizione reale."}}, "rep4_verifica": "La semicroma del puntato non diventa terzina né acciaccatura; i salti della sinistra atterrano dal tasto; il f resta compatto anche nell'accel. di b. 59."}, {"id": "scriabin fantasie-64-72", "brano": "scriabin28", "battute": "64-72", "titolo": "Presto cromatico, allarg. e cadenza", "priorita": 6, "famiglia": "fam-scriabin-presto-cromatico", "parti": ["64-67", "68-72"], "nodo_motorio": "bb. 64-67: accordi di quattro note della destra con moto cromatico interno, sinistra in crome cromatiche discendenti (forcelle a matita).\nbb. 68-72: corsa di semicrome della destra, poi accordi puntati sopra il basso fermo.", "andate": {"1": {"rep2": "bb. 64-67: NODO sui cambi di posizione, dove una mano cambia forma e l'altra no.\nbb. 68-72: PESO, un impulso per battuta.", "rep3": "bb. 64-67: BLOC in crome, CIECO.\nbb. 68-72: DIN dentro la mano destra: voce superiore f, resto pp."}, "2": {"rep2": "bb. 64-67: CHUNK a tempo, mezza battuta più un accordo.\nbb. 68-72: come in andata 1.", "rep3": "CLIC, un clic per battuta, tutto il frammento di fila."}}, "rep4_verifica": "A tempo di Presto gli accordi restano completi, nessuna nota che non parla; le forcelle di 65-67 vengono dal basso della sinistra; in 69-72 il canto della destra sta sopra gli accordi e il basso è pieno senza colpo."}, {"id": "scriabin fantasie-73-80", "brano": "scriabin28", "battute": "73-80", "titolo": "Tempo I accel.: discese della sinistra sotto accordi puntati", "priorita": 4, "famiglia": null, "nodo_motorio": "Sinistra: salto dal basso grave accentato a una discesa di semicrome in quintina o sestina (73, 75, 77, 79-80); risalite in arpeggio (74, 78, con 5-4 stampati a b. 78). Destra: accordi puntati p nell'acuto, poi terzine a b. 78.", "andate": {"1": {"rep2": "Sinistra sola: ACC sulle quintine 2+3, poi 3+2; sulle sestine 3+3, poi 2+2+2.", "rep3": "Sinistra sola: CIECO shift–touch–play dal basso accentato alla prima nota della discesa."}, "2": {"rep2": "Sinistra sola: CHUNK a tempo, basso più gruppo, stop sulla prima nota del gruppo seguente.", "rep3": "Insieme: destra MUTA; poi destra suona e sinistra MUTA."}}, "rep4_verifica": "Il basso accentato risuona nel pedale e la discesa è più leggera del basso; gli accordi puntati della destra restano p e sopra; l'accel. poco a poco è distribuito su tutte le battute."}, {"id": "scriabin fantasie-81-84", "brano": "scriabin28", "battute": "81-84", "titolo": "ff: salti della sinistra verso la chiave di violino", "priorita": 5, "famiglia": null, "nodo_motorio": "Sinistra: dal basso grave agli accordi in chiave di violino a ogni quarto. Destra: ottave e accordi nell'acuto, con terzine (82-84).", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play: basso, salto, atterraggio muto sull'accordo, poi suona.", "rep3": "Destra sola: PESO, un impulso per gruppo, ottave e accordi seguenti di rimbalzo."}, "2": {"rep2": "MENT, poi la ripetizione reale.", "rep3": "DIN: destra f, sinistra pp; poi il contrario."}}, "rep4_verifica": "Basso e accordo della sinistra suonano come un'unica armonia nel pedale; il ff di 81 è pieno senza durezza; a b. 83 il peso viene dal braccio sopra il tasto.", "note": "Sopra b. 83 leggo a matita, con incertezza: «usalo come peso, dall'esterno del tasto»."}, {"id": "scriabin fantasie-85-90", "brano": "scriabin28", "battute": "85-90", "titolo": "Accel.: canto sopra accordi ribattuti, sfff", "priorita": 2, "famiglia": "fam-scriabin-canto-su-ribattuti", "nodo_motorio": "Destra: canto tenuto e accordi ribattuti in crome nella stessa mano. Sinistra: salti dal basso grave agli accordi, con una voce di tenore (tua matita «canto» a b. 88). sfff a b. 89, dim. a b. 90.", "andate": {"1": {"rep2": "DIN dentro la mano destra: canto tenuto e suonato, accordi ribattuti pp dalla metà corsa del tasto.", "rep3": "Sinistra sola: CIECO shift–touch–play sul salto basso–accordo; tenore f, resto pp."}, "2": {"rep2": "Scheletro: basso e canto, senza ribattuti; poi ribattuti pp.", "rep3": "CHUNK a tempo, un quarto più un accordo; lo sfff di 89 a mp."}}, "rep4_verifica": "Nell'accel. il canto resta sopra i ribattuti; lo sfff di 89 è una caduta del braccio, non una spinta; dopo lo sfff i ribattuti tornano subito più leggeri (dim. di 90).", "note": "A matita leggo «mp» a b. 85, «poco» a b. 87, «canto» a b. 88 (sinistra)."}, {"id": "scriabin fantasie-91-96", "brano": "scriabin28", "battute": "91-96", "titolo": "Allarg., poi Tempo I pp sugli arpeggi della sinistra", "priorita": 3, "famiglia": "fam-scriabin-arpeggi-sx-semicrome", "parti": ["91-92", "93-96"], "nodo_motorio": "bb. 91-92: arpeggi di semicrome della sinistra larghi circa due ottave sotto accordi della destra.\nbb. 93-96: pp, arpeggio della sinistra che scende al basso grave (cerchiato) e risale; a 94 e 96 arpeggio della destra e quintine della sinistra insieme.", "andate": {"1": {"rep2": "Sinistra sola: BLOC, ogni posizione dell'arpeggio come accordo, poi lo spostamento CIECO.", "rep3": "bb. 93-96: sinistra sola, ACC pp sulle quintine, 2+3 e poi 3+2."}, "2": {"rep2": "Scheletro: basso cerchiato e voce superiore della destra; poi gli arpeggi pp.", "rep3": "bb. 94 e 96: destra suona, sinistra MUTA; poi si scambia."}}, "rep4_verifica": "Nel pp il basso grave cerchiato risuona per tutta la battuta e gli arpeggi non hanno culmini; a 94 e 96 i due arpeggi si incontrano senza accenti; l'allarg. di 91-92 si chiude dentro il pp di 93, senza buco."}, {"id": "scriabin fantasie-97-103", "brano": "scriabin28", "battute": "97-103", "titolo": "Arpeggi di biscrome e semicrome a due mani", "priorita": 4, "famiglia": "fam-scriabin-figurazioni-rapide", "parti": ["97-98", "99-103"], "nodo_motorio": "bb. 97-98: arpeggio di biscrome della sinistra su tre ottave dal basso grave (cerchiato); destra ad accordi con quintine discendenti.\nbb. 99-103: semicrome continue nelle due mani; figure spezzate della destra con cambi di posizione, sinistra in arpeggi larghi; accel. e cresc. poco a poco da b. 101.", "andate": {"1": {"rep2": "bb. 97-98: sinistra sola, BLOC per posizioni, poi CIECO.\nbb. 99-103: BLOC, ogni posizione della destra come accordo, mani unite a tempo di quarti.", "rep3": "RIT con fermata sulla 1ª nota di ogni gruppo di quattro, le tre seguenti di scatto: destra sola, poi sinistra sola."}, "2": {"rep2": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione.", "rep3": "STAC pp a mani unite."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, mani unite, con DIN (sinistra p, destra pp).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota."}, "4": {"rep2": "MUTA: destra suona, sinistra fantasma; poi si scambia.", "rep3": "CLIC sul levare, tutto il frammento."}}, "rep4_verifica": "Semicrome uguali e leggere; il cresc. poco a poco di 101-103 viene dall'ampiezza del gesto, non dalla pressione; nessuna nota della destra accentata dal cambio di posizione.", "note": "Sopra 99-100 leggo a matita «molto scorrevole e leggero», con discreta sicurezza."}, {"id": "scriabin fantasie-104-108", "brano": "scriabin28", "battute": "104-108", "titolo": "Presto, poi allargando verso il ff", "priorita": 4, "famiglia": "fam-scriabin-figurazioni-rapide", "nodo_motorio": "Presto in semicrome a due mani, con figure quasi uguali a 105-106; da b. 107 allargando, con la sinistra che passa ad accordi e salti verso il basso grave.", "andate": {"1": {"rep2": "Destra sola: BLOC per posizioni, CIECO.", "rep3": "RIT con fermata sulla 1ª nota di ogni gruppo, mani unite."}, "2": {"rep2": "CHUNK a tempo: un quarto più una nota.", "rep3": "bb. 107-108: sinistra sola, CIECO shift–touch–play sui salti; destra MUTA."}}, "rep4_verifica": "Presto senza durezza; l'allargando è distribuito su 107-108 e l'arrivo al ff di 109 è pronto, senza tensione nell'avambraccio.", "note": "Sotto b. 104 leggo a matita, con incertezza, «non forzare»; la riga sopra non la leggo."}, {"id": "scriabin fantasie-109-116", "brano": "scriabin28", "battute": "109-116", "titolo": "Più vivo ♩ = 76, ff: canto sopra accordi ribattuti", "priorita": 2, "famiglia": "fam-scriabin-canto-su-ribattuti", "nodo_motorio": "Destra: canto in cima ad accordi ribattuti di 3-4 note, con ritmi puntati. Sinistra: basso grave tenuto col pedale e salti verso accordi nel medio. È il primo grande culmine della ripresa.", "andate": {"1": {"rep2": "DIN dentro la mano destra: canto suonato, resto dell'accordo muto; poi il contrario pp.", "rep3": "Sinistra sola: CIECO shift–touch–play dal basso grave al primo accordo; poi PESO, un impulso per battuta."}, "2": {"rep2": "Scheletro: basso e canto; poi accordi pp.", "rep3": "Ribattuti dalla metà corsa del tasto; nota corta del puntato di scatto, vicina al tasto."}}, "rep4_verifica": "ff pieno e profondo: il basso nel pedale regge la massa, il canto sta sopra, gli accordi interni non coprono; nessuna tensione tenuta tra un accordo e l'altro.", "note": "Accanto a ♩ = 76 hai scritto «65» e una parola che leggo «rilassato» (incerto): se 65 è il tuo tempo, le percentuali si riferiscono a quello. Le note della Peters a bb. 110 e 115 (h'' omissibile, accordo della sinistra forse inteso diversamente) sono scelte di edizione: usa in Rep 2-3 la versione che suoni."}, {"id": "scriabin fantasie-117-122", "brano": "scriabin28", "battute": "117-122", "titolo": "Arpeggi della sinistra su tre ottave", "priorita": 3, "famiglia": "fam-scriabin-arpeggi-sx-semicrome", "nodo_motorio": "Arpeggio di semicrome della sinistra su circa tre ottave per battuta, con cambi di chiave e diteggiature non regolari (stampate e a matita). Destra: accordi legati con canto, mf, cresc. a b. 118.", "andate": {"1": {"rep2": "Sinistra sola: BLOC per posizioni, ogni gruppo di note sotto la mano come accordo; CIECO sui cambi.", "rep3": "Sinistra sola: CHUNK, una posizione più la prima nota della seguente, stop con la mano già sopra."}, "2": {"rep2": "Sinistra sola: ACC pp sulla nota d'arrivo di ogni posizione.", "rep3": "Scheletro: basso della sinistra e canto della destra; poi gli arpeggi pp."}}, "rep4_verifica": "L'arpeggio è un'onda unica dal basso al culmine e ritorno, senza scalini al cambio di posizione; il canto della destra non viene coperto quando la sinistra sale nel suo registro.", "note": "Sopra b. 121 leggo a matita, con incertezza, qualcosa come «uso movimenti e “spinte” della sinistra a gruppi»: è coerente con il CHUNK per posizione."}, {"id": "scriabin fantasie-123-128", "brano": "scriabin28", "battute": "123-128", "titolo": "f-ff sugli arpeggi, poi ottave ribattute e semicrome della destra", "priorita": 3, "famiglia": "fam-scriabin-arpeggi-sx-semicrome", "parti": ["123-125", "126-128"], "nodo_motorio": "bb. 123-125: come 117-122, f e poi ff, con la sinistra che copre più spazio.\nbb. 126-128: destra in semicrome spezzate sopra ottave ribattute della sinistra (126); poi arpeggi della sinistra mp, cresc. (127-128).", "andate": {"1": {"rep2": "bb. 123-125: sinistra sola, BLOC per posizioni, CIECO.\nbb. 126-128: destra sola, ROT tra pollice e nota superiore.", "rep3": "bb. 123-125: PESO sui bassi, un impulso per gruppo, arpeggio di rimbalzo.\nbb. 126-128: sinistra sola, ACC pp sulla 2ª e sulla 4ª semicroma."}, "2": {"rep2": "bb. 123-125: CHUNK per posizione.\nbb. 126-128: DIN, sinistra pp e destra p.", "rep3": "Scheletro di tutto il frammento; poi completo pp."}}, "rep4_verifica": "Il ff di 125 nasce dal basso della sinistra, non dagli accordi della destra; a 126 le semicrome della destra sono uguali sopra ottave che non battono; il mp di 127 arriva subito, senza coda del ff.", "note": "A matita leggo, con incertezza, «prendi con polso» a b. 124 e «più lente…» sotto b. 126."}, {"id": "scriabin fantasie-129-132", "brano": "scriabin28", "battute": "129-132", "titolo": "fff appassionato: ottave e accordi ribattuti della sinistra", "priorita": 2, "famiglia": "fam-scriabin-ribattuti-due-mani", "nodo_motorio": "Sinistra: ottava grave più accordi ribattuti in semicrome, con cambi di basso (tua matita «cambio di basso»). Destra: accordi con canto e salti verso l'acuto. È il carico più alto del brano.", "andate": {"1": {"rep2": "Sinistra sola: PESO a mp, un impulso per gruppo, accordi ribattuti di rimbalzo dalla metà corsa del tasto.", "rep3": "DIN dentro la mano destra: canto f, resto dell'accordo pp."}, "2": {"rep2": "Sinistra sola: BLOC, solo il primo accordo di ogni gruppo, CIECO sui cambi di basso.", "rep3": "Destra sola: CIECO shift–touch–play sui salti verso l'acuto."}, "3": {"rep2": "Scheletro: ottava grave e canto, senza ribattuti.", "rep3": "CHUNK a tempo: un quarto più il primo accordo del seguente."}, "4": {"rep2": "MENT del fff: dove sta il culmine e che suono ha. Poi la ripetizione reale.", "rep3": "CLIC, un clic per battuta."}}, "rep4_verifica": "fff con il suono più grande del brano ma senza rumore di tasto; i ribattuti della sinistra sono un fondo che vibra, non colpi; a b. 131 il canto della destra domina sopra i ribattuti.", "note": "A b. 131 la Peters stampa il ritmo della prima edizione e in nota propone una lettura analoga a b. 53. Usa in Rep 2-3 la versione che suoni in Rep 4."}, {"id": "scriabin fantasie-133-140", "brano": "scriabin28", "battute": "133-140", "titolo": "Più vivo ♩ = 126: marcia, ritorno", "priorita": 6, "famiglia": "fam-scriabin-marcia", "nodo_motorio": "Come 55-63, ff, in un'altra tonalità; accelerando poco a poco da b. 137.", "andate": {"1": {"rep2": "BLOC: ogni forma della destra come accordo a tempo di quarti, CIECO.", "rep3": "Sinistra sola: CIECO shift–touch–play sui salti dal basso agli accordi in semicroma."}, "2": {"rep2": "RIT: fermata sulla croma puntata, semicroma di scatto e vicina al tasto.", "rep3": "MENT, poi la ripetizione reale."}}, "rep4_verifica": "Come 55-63: semicroma del puntato netta, salti che atterrano dal tasto, ff compatto anche nell'accelerando.", "note": "Non metterla nello stesso circuito di 55-63 finché una delle due non è in drop-out. Dopo, mettile apposta una dopo l'altra, per verificare che le due versioni non si confondano."}, {"id": "scriabin fantasie-141-149", "brano": "scriabin28", "battute": "141-149", "titolo": "Ritorno del passaggio cromatico, allarg. e cadenza", "priorita": 6, "famiglia": "fam-scriabin-presto-cromatico", "parti": ["141-144", "145-149"], "nodo_motorio": "bb. 141-144: come 64-67, dentro l'accelerando.\nbb. 145-149: allarg., corsa di semicrome della destra, poi accordi con dim. sopra il basso.", "andate": {"1": {"rep2": "bb. 141-144: NODO sui cambi di posizione.\nbb. 145-149: PESO, un impulso per battuta.", "rep3": "bb. 141-144: BLOC in crome, CIECO.\nbb. 145-149: DIN dentro la mano destra: voce superiore f, resto pp."}, "2": {"rep2": "bb. 141-144: CHUNK a tempo, mezza battuta più un accordo.\nbb. 145-149: come in andata 1.", "rep3": "CLIC, un clic per battuta, tutto di fila."}}, "rep4_verifica": "Accordi completi a tempo; il dim. di 146-149 si ottiene riducendo la caduta, non trattenendo il braccio; il canto della destra resta sopra fino all'ultimo accordo.", "note": "Stessa regola di 133-140: in circuiti diversi da 64-72 finché una non è in drop-out."}, {"id": "scriabin fantasie-150-156", "brano": "scriabin28", "battute": "150-156", "titolo": "♩ = 76: tema con canto e semicrome nella destra", "priorita": 1, "famiglia": "fam-scriabin-due-voci-dx", "parti": ["150-153", "154-156"], "nodo_motorio": "bb. 150-153: accordi della destra sopra bassi e accordi staccati della sinistra; a b. 153 arpeggio della sinistra verso il f.\nbb. 154-156: pp; la destra porta il canto sopra e una linea di semicrome sotto, nella stessa mano.", "andate": {"1": {"rep2": "bb. 150-153: scheletro, basso e canto.\nbb. 154-156: DIN dentro la mano: canto suonato e semicrome mute; poi semicrome pp e canto muto.", "rep3": "bb. 153: CHUNK sull'arpeggio della sinistra.\nbb. 154-156: STAC pp sulle semicrome, canto tenuto legato."}, "2": {"rep2": "bb. 154-156: ACC pp sulle semicrome (2ª, poi 3ª, poi 4ª), canto tenuto.", "rep3": "Insieme: destra suona, sinistra MUTA."}}, "rep4_verifica": "Il canto lega sopra le semicrome come se lo suonasse un'altra mano; le semicrome sono tutte allo stesso livello, sotto; il f di 153 nasce dal basso e si spegne subito nel pp di 154.", "note": "In cima alla p. 12 c'è una parola a matita che leggo «con espressione» (incerto)."}, {"id": "scriabin fantasie-157-164", "brano": "scriabin28", "battute": "157-164", "titolo": "Canto e semicrome nella destra, crescendo, m.g.", "priorita": 1, "famiglia": "fam-scriabin-due-voci-dx", "nodo_motorio": "Come 154-156 su quattro battute in progressione (mf, cresc., f), con note della destra prese dalla sinistra (m.g., bb. 160 e 162). bb. 163-164: accel. e arpeggio della sinistra in salita su tre chiavi.", "andate": {"1": {"rep2": "DIN dentro la mano destra: canto suonato e semicrome mute; poi il contrario pp.", "rep3": "NODO sulle note prese dalla sinistra (bb. 160 e 162): fermati, verifica che scendano insieme a quelle della destra, poi da nodo a nodo."}, "2": {"rep2": "Scheletro: basso e canto; poi le semicrome pp.", "rep3": "bb. 163-164: sinistra sola, CHUNK sull'arpeggio; poi insieme."}}, "rep4_verifica": "Il crescendo 157-159 viene dal canto e dal basso, le semicrome restano un passo sotto; lo scambio m.g. di 160 e 162 non si sente; a b. 164 la destra cresce sopra la sinistra senza che l'arpeggio la copra.", "note": "A b. 164 leggo a matita, con incertezza, «cresc. dx» e «diminuisci sx»: se è così, la verifica di Rep 4 è proprio quella."}, {"id": "scriabin fantasie-165-172", "brano": "scriabin28", "battute": "165-172", "titolo": "Più vivo ♩ = 88, pp: accordi sopra semicrome continue", "priorita": 3, "famiglia": "fam-scriabin-arpeggi-sx-semicrome", "nodo_motorio": "Sinistra in semicrome continue che scendono al basso grave (cerchiato) col pollice e risalgono. Destra: accordi pp con canto (diteggiature 4-3, 5-4). A b. 172 arpeggio m.d. che continua la linea.", "andate": {"1": {"rep2": "Sinistra sola: CIECO shift–touch–play sul solo basso grave cerchiato.", "rep3": "Sinistra sola: ACC pp, raggruppa ogni 3, poi ogni 4, per togliere l'appoggio sul battere."}, "2": {"rep2": "DIN dentro la mano destra: canto suonato, resto muto; poi il contrario.", "rep3": "CLIC, un clic per battuta, tutto il frammento."}}, "rep4_verifica": "pp senza culmini nell'arpeggio, con il basso grave che risuona e regge la battuta; canto della destra appena sopra; a b. 172 l'arpeggio m.d. continua la sinistra senza giunture.", "note": "A matita leggo «magico» a b. 165 e, con incertezza, «quasi statico» a b. 166: indicazioni di colore coerenti con questa verifica."}, {"id": "scriabin fantasie-173-180", "brano": "scriabin28", "battute": "173-180", "titolo": "pp a due voci nella destra, poi allargando f", "priorita": 1, "famiglia": "fam-scriabin-due-voci-dx", "parti": ["173-178", "179-180"], "nodo_motorio": "bb. 173-178: la destra porta il canto in crome e una linea di semicrome nella stessa mano; alcune note della linea passano alla sinistra (le linee oblique della Peters).\nbb. 179-180: figure spezzate f della destra con l'accordo in cima (5-4), allargando verso il Tempo I.", "andate": {"1": {"rep2": "DIN dentro la mano destra: canto suonato, semicrome mute; poi il contrario pp.", "rep3": "NODO sui passaggi alla sinistra: fermati sulla nota passata e verifica che continui la linea."}, "2": {"rep2": "Scheletro: basso e canto.", "rep3": "bb. 179-180: ROT sulla destra tra l'accordo in cima e le note sotto; poi PESO sull'accordo d'arrivo."}, "3": {"rep2": "STAC pp sulla linea di semicrome, canto tenuto legato.", "rep3": "CHUNK a tempo: mezza battuta più una nota."}, "4": {"rep2": "ACC sulle semicrome (2ª, poi 4ª), canto tenuto.", "rep3": "MENT di tutto il frammento con il suono del pp. Poi la ripetizione reale."}}, "rep4_verifica": "pp con il canto legato sopra una linea interna uniforme; il passaggio di note alla sinistra non si sente; il crescendo poco a poco di 177-180 non accelera, e l'allargando arriva al ff di 181 con la mano libera.", "note": "In cima alla p. 14 hai scritto «60» (tempo?) e una riga lunga sul crescendo che non riesco a leggere."}, {"id": "scriabin fantasie-181-185", "brano": "scriabin28", "battute": "181-185", "titolo": "Tempo I ff: cascate di biscrome a gruppi irregolari", "priorita": 4, "famiglia": "fam-scriabin-cascate", "nodo_motorio": "Cascate di biscrome in entrambe le mani a gruppi di 9 e di 7, su tre-quattro ottave, con incroci di registro tra le mani e la sinistra che attraversa le chiavi.", "andate": {"1": {"rep2": "BLOC: ogni posizione dell'arpeggio come accordo, destra e poi sinistra; CIECO sul cambio.", "rep3": "ACC: le nonuple raggruppate 3+3+3, poi 4+5; le settimine 3+4."}, "2": {"rep2": "CHUNK a tempo: un gruppo irregolare più la prima nota del seguente, stop con la mano già in posizione.", "rep3": "MUTA dove le mani si incrociano di registro: destra suona e sinistra fantasma, poi si scambia."}}, "rep4_verifica": "Le cascate sono onde di suono con il culmine sulla nota più acuta, non file di note uguali; il basso grave del ff risuona sotto; nessun buco nel passaggio tra le mani.", "note": "Sotto b. 183 leggo a matita «stai basso»; sopra 183-184 una riga che leggo, con incertezza, «stringi entrando le mani»."}, {"id": "scriabin fantasie-186-192", "brano": "scriabin28", "battute": "186-192", "titolo": "Ripresa delle cascate, poi accordi ribattuti in cresc.", "priorita": 4, "famiglia": "fam-scriabin-cascate", "parti": ["186-189", "190-192"], "nodo_motorio": "bb. 186-189: come 182-185.\nbb. 190-192: arpeggi più brevi e accordi; a b. 192 accordi ribattuti con accenti (>) in crescendo verso l'ff di 193.", "andate": {"1": {"rep2": "bb. 186-189: BLOC per posizioni, CIECO.\nbb. 190-192: DIN, sinistra f e destra pp.", "rep3": "bb. 186-189: ACC, nonuple 3+3+3 e poi 4+5.\nbb. 190-192: ribattuti di 192 dalla metà corsa del tasto, ogni accento con un impulso del braccio."}, "2": {"rep2": "CHUNK a tempo sui gruppi irregolari.", "rep3": "bb. 190-191: RIT con fermata sulla 1ª nota di ogni gruppo."}}, "rep4_verifica": "Come 181-185; a b. 192 il crescendo degli accenti porta all'ff di 193 senza irrigidire l'avambraccio."}, {"id": "scriabin fantasie-193-196", "brano": "scriabin28", "battute": "193-196", "titolo": "Finale ff: accordi, quintine e terzine gravi", "priorita": 5, "famiglia": null, "nodo_motorio": "Destra: accordi pieni e quintine di semicrome ad accordi in discesa. Sinistra: basso e accordi, con terzine di biscrome ad accordi ribattuti nel grave; poi arpeggio in ottave e accordi finali.", "andate": {"1": {"rep2": "PESO a mp: un impulso per accordo, rilascio completo nelle pause.", "rep3": "Sinistra sola: terzine di biscrome ribattute dalla metà corsa del tasto, pp."}, "2": {"rep2": "BLOC sugli accordi della destra, CIECO.", "rep3": "DIN dentro la mano destra: voce superiore f, resto pp."}}, "rep4_verifica": "Il finale ff si apre invece di chiudersi: rilascio completo dopo ogni accordo; le terzine gravi della sinistra rullano sotto senza coprire; l'ultimo accordo lasciato vibrare.", "note": "A b. 194 la Peters indica in nota cosa suona il curatore: scegli una versione e usala anche in Rep 2-3."}, {"id": "nabucco-sinfonia-1-4", "brano": "nabucco", "battute": "1-4", "titolo": "Sinfonia · Andante, corale p maestoso", "priorita": 7, "famiglia": "nabucco-fam-corale", "nodo_motorio": "Accordi di tre note della destra in chiave di basso, nello stesso registro della sinistra, con ritmo semiminima–due crome–semiminime e punti sotto legatura (portato). Sinistra a note singole staccate con salti di quarta e quinta nel grave. Le mani sono vicine e le forme d'accordo cambiano a ogni quarto.", "andate": {"1": {"rep2": "BLOC: ogni accordo della destra come forma, cambio al quarto seguente CIECO; sinistra assente.", "rep3": "DIN dentro la mano
