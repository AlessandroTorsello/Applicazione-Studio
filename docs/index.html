:root{
  --bg:#0f1216; --bg2:#171b21; --card:#1c2128; --line:#2c333d; --text:#eef1f5; --muted:#9aa4b2;
  --accent:#f2b84b; --accent-ink:#1a1405; --ok:#52c48a; --bad:#ef6b6b; --sig:#7cc4ff; --bb:#f2b84b;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme="chiaro"]{
  --bg:#f6f4ef; --bg2:#ffffff; --card:#ffffff; --line:#d9d4c9; --text:#14161a; --muted:#5d6470;
  --accent:#9a5b00; --accent-ink:#ffffff; --ok:#1d7a4a; --bad:#b42323; --sig:#0b5cad; --bb:#8a4b00;
  --shadow:0 10px 30px rgba(0,0,0,.15);
  color-scheme:light;
}
html{font-size:17px}
html[data-testo="grande"]{font-size:19px}
html[data-testo="molto"]{font-size:21px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.25}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:var(--t-lg);flex:1}
.top .back{background:none;border:0;font-size:var(--t-2xl);padding:4px 10px 4px 0;line-height:1}
.sub{color:var(--muted);font-size:var(--t-sm)}
.muted{color:var(--muted)}
.small{font-size:var(--t-sm)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.label{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:var(--t-3xl);font-weight:700;margin:2px 0 6px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.kv li:first-child{border-top:0}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:var(--t-md);font-weight:600;text-align:center;margin:0 0 10px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.xl{padding:18px 16px;font-size:var(--t-md)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.inline{display:inline-block;width:auto;padding:10px 14px;margin:0 8px 8px 0}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:0}
.link{background:none;border:0;color:var(--sig);padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.pill{font-size:var(--t-xs);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:var(--t-xs);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:middle}
.hint{border-left:3px solid var(--accent);padding:8px 12px;background:var(--bg2);border-radius:6px;margin:0 0 14px;font-size:var(--t-sm)}
/* testo catalogo */
.txt .line{display:block;margin:0 0 .45em}
.txt .line:last-child{margin-bottom:0}
.bb{color:var(--bb);font-weight:700;white-space:nowrap}
.sig{background:none;border:0;padding:0 1px;margin:0;color:var(--sig);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px;font-size:inherit;line-height:inherit}
/* accordion */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;font-weight:700;font-size:var(--t-md)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc>summary .grow{flex:1}
.accbody{padding:0 12px 12px}
.prio{border-top:1px solid var(--line);padding:12px 4px 4px}
.prio h3{font-size:var(--t-md);display:flex;gap:10px;align-items:baseline}
.pn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:var(--t-sm);font-weight:800}
.why{margin:4px 0 8px;color:var(--muted);font-size:var(--t-sm)}
.fam{border:1px dashed var(--line);border-radius:10px;padding:6px 8px;margin:8px 0}
.famh{font-size:var(--t-sm);color:var(--muted);font-weight:600;padding:2px 2px 4px}
.frow{display:flex;align-items:stretch;gap:6px;border-radius:10px}
.frow+.frow{border-top:1px solid var(--line)}
.chk{display:grid;place-items:center;padding:0 6px}
.chk input{width:26px;height:26px;accent-color:var(--accent)}
.fbody{flex:1;text-align:left;background:none;border:0;padding:10px 4px}
.bat{color:var(--bb);margin-right:6px}
.todo{border-top:1px solid var(--line);padding:12px 4px}
details.sub2{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--bg2)}
details.sub2>summary{padding:10px 12px;font-weight:600;cursor:pointer}
details.sub2>div{padding:0 12px 12px}
/* sticky bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:760px;margin:0 auto}
.bar .btn{margin:0}
.row{display:flex;gap:10px}
.row>*{flex:1}
/* compose */
.circ{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px}
.circh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.circh h3{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.slot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.slot .lab{font-weight:800;min-width:2.4em;color:var(--accent)}
.slot .nm{flex:1;min-width:0}
.slot .nm .t{display:block;font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-width:38px;height:38px;font-size:var(--t-md)}
select.sel{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
/* run */
.runh{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.runh .l1{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--t-md)}
.runh .l1 .grow{flex:1}
.runh .l2{font-size:var(--t-sm);color:var(--muted);margin-top:2px}
.runh .l3{font-size:var(--t-md);margin-top:1px}
.pos{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:var(--t-xs);font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.chip.done{background:var(--bg2);color:var(--text)}
.chip.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.drop{text-decoration:line-through;opacity:.5}
.dots{display:inline-flex;gap:5px;margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--muted)}
.dot.cur{background:var(--accent);border-color:var(--accent)}
.timers{display:flex;align-items:center;gap:14px;margin-top:6px;font-variant-numeric:tabular-nums;font-size:var(--t-sm)}
.timers b{font-size:var(--t-md)}
.timers .paused{color:var(--bad)}
.repnum{font-size:var(--t-4xl);font-weight:800;line-height:1;margin:14px 0 4px;color:var(--accent)}
.repnum small{font-size:var(--t-sm);color:var(--muted);font-weight:600;margin-left:8px}
.instr{font-size:var(--t-xl);line-height:1.45;font-weight:500;margin:6px 0 16px}
.instr .vlabel{display:block;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.diag{font-size:var(--t-md);color:var(--muted);margin:0 0 6px}
.toggles{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.tg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg2);font-weight:600}
.tg input{width:22px;height:22px;accent-color:var(--accent)}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:var(--t-md)}
textarea{min-height:80px;resize:vertical}
.fatto{font-size:var(--t-xl);padding:20px;border-radius:16px}
.sec{display:flex;gap:10px;margin-bottom:10px}
.sec .btn{margin:0;padding:10px;font-size:var(--t-sm)}
/* sheet & panel */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg2);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet{visibility:hidden;transition:transform .22s,visibility 0s .22s}
.sheet.on{transform:none;visibility:visible;transition:transform .22s}
.sheet .inner{max-width:760px;margin:0 auto}
.sheet h2{font-size:var(--t-lg);margin-bottom:12px}
.yn{display:flex;gap:10px;margin:8px 0 14px}
.yn button{flex:1;padding:18px;font-size:var(--t-lg);font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.yn button.on.si{border-color:var(--ok);background:var(--ok);color:#fff}
.yn button.on.no{border-color:var(--bad);background:var(--bad);color:#fff}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:22;width:min(92vw,440px);background:var(--bg2);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 18px 24px}
.panel{visibility:hidden;transition:transform .22s,visibility 0s .22s}
.panel.on{transform:none;visibility:visible;transition:transform .22s}
.panel .sg{font-size:var(--t-2xl);font-weight:800;color:var(--sig)}
.panel h3{font-size:var(--t-lg);margin:2px 0 14px}
.panel .lbl{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:14px}
.panel p{margin:4px 0;font-size:var(--t-md)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
table.t th,table.t td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:var(--t-xs)}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.sub td{font-weight:700;background:var(--bg2)}
.tablewrap{overflow-x:auto}
.logi{border-top:1px solid var(--line);padding:8px 0;font-size:var(--t-sm)}
.logi b{color:var(--accent)}
.dayrow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.dayrow .d{display:flex;justify-content:space-between;font-weight:700}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .pt{fill:var(--accent)}
.chart .ax{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px}
.field{margin:0 0 12px}
.field label{display:block;font-weight:600;margin-bottom:4px;font-size:var(--t-sm)}
.sigcard{border-top:1px solid var(--line);padding:12px 0}
.sigcard .sg{font-weight:800;color:var(--sig);font-size:var(--t-lg)}
.sigcard dl{margin:6px 0 0}
.sigcard dt{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.sigcard dd{margin:0}
ol.fable{padding-left:1.2em}
ol.fable li{margin:0 0 8px}
/* lista statistiche (al posto della tabella) */
.st{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.st .m{flex:1;min-width:0}
.st .v{font-weight:700;white-space:nowrap;text-align:right}
.st .d{font-size:var(--t-sm);color:var(--muted);margin-top:2px}
.sth{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding:10px 0 4px;margin-top:6px;border-top:2px solid var(--line)}
.sth:first-child{border-top:0;margin-top:0}
.stt{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:var(--t-lg);padding:12px 0 0;border-top:2px solid var(--line)}
/* scelta tipo sessione */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.choice button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px 12px;text-align:left}
.choice button b{display:block;font-size:var(--t-md)}
.choice button span{font-size:var(--t-sm);color:var(--muted)}
.choice button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}
.blist label{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);font-weight:600}
.blist label:first-child{border-top:0}
.blist input{width:24px;height:24px;accent-color:var(--accent)}
/* sessione libera */
.cur-b{font-size:var(--t-xl);font-weight:800;line-height:1.2;margin:18px 0 4px}
.bigclock{font-size:var(--t-5xl);font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.bgrid{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0}
.bgrid button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px;text-align:left;font-size:var(--t-md);font-weight:700;display:flex;justify-content:space-between;gap:10px}
.bgrid button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.bgrid button small{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.lslot{border-top:1px solid var(--line);padding:10px 0}
.lslot .row{align-items:center}
.kv li b,.sth span:last-child,.st .v{white-space:nowrap;flex:0 0 auto}
.kv li span{min-width:0}

/* ===================== versione 2 ===================== */
:root{--accent-soft:color-mix(in srgb,var(--accent) 14%,var(--card))}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.two{text-align:left;padding:12px 16px}
.btn.two b{display:block}
.btn.two span{display:block;font-size:var(--t-sm);font-weight:500;color:var(--muted);margin-top:2px}
.link.plain{padding:0;text-align:left;text-decoration:none;color:inherit}
.lead{margin:0 0 14px;color:var(--muted);font-size:var(--t-sm)}
.lead .link{padding:0}
.recap{margin:0 0 6px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px dashed var(--line);font-size:var(--t-sm)}
.asktext{font-size:var(--t-md);margin:0 0 16px}
.cardh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin:0 0 14px}
.empty b{display:block;font-size:var(--t-md);margin-bottom:4px}
.empty span{color:var(--muted);font-size:var(--t-sm)}
.fmeta{display:block;font-size:var(--t-sm);color:var(--muted);margin-top:2px}
.bignum{font-size:var(--t-2xl) !important;text-align:center;font-weight:700}
.stepb{flex:0 0 56px !important;height:56px;font-size:var(--t-2xl)}
/* barra delle schede */
.wrap.tabbed{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.tabwrap{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:min(var(--t-xs),13px);font-weight:600;line-height:1.15;min-height:56px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on span{font-weight:800}
.resume{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin:0 auto;background:var(--accent-soft);border:0;border-bottom:1px solid var(--line);padding:10px 16px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.resume .grow{flex:1;min-width:0}
.resume .rgo{color:var(--accent);white-space:nowrap}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.rdot.off{background:var(--bad)}
/* passi della nuova sessione */
.steps{list-style:none;display:flex;gap:6px;margin:0 0 16px;padding:0;font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding-bottom:8px;border-bottom:3px solid var(--line)}
.steps li span{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;border:2px solid currentColor;font-size:var(--t-xs)}
.steps li.cur{color:var(--text);border-color:var(--accent)}
.steps li.cur span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
.barnote{margin:0 0 8px;font-size:var(--t-sm);color:var(--muted);text-align:center}
.seg.wide{display:flex;margin:0 0 14px}
.seg.wide button{flex:1;padding:11px 8px}
.seg.small button{padding:6px 9px;font-size:var(--t-sm)}
/* home */
.card.now{border-color:var(--accent);background:var(--accent-soft)}
.nowpos{margin:4px 0 2px;font-weight:700;font-size:var(--t-md)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.barcol{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.barv{font-size:var(--t-xs);color:var(--muted);height:1.1em;font-variant-numeric:tabular-nums}
.bartrack{width:100%;height:64px;background:var(--bg2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.barfill{display:block;width:100%;background:var(--muted);border-radius:6px 6px 0 0}
.bard{font-size:var(--t-xs);color:var(--muted);text-transform:capitalize}
.barcol.today .barfill{background:var(--accent)}
.barcol.today .bard{color:var(--text);font-weight:800}
.wbar{height:6px;background:var(--bg2);border-radius:3px;margin-top:3px}
.wbar div{height:6px;background:var(--accent);border-radius:3px}
/* esecuzione */
.runh.paused{border-bottom-color:var(--bad)}
.pausebtn{margin-left:auto;padding:0 12px}
.runh.paused .pausebtn{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.runh.paused .timers b{color:var(--bad)}
.pausebar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:12px 0 0;padding:12px 14px;border-radius:12px;border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg));text-align:left}
.pausebar b{color:var(--bad);font-size:var(--t-md);white-space:nowrap}
.pausebar span{font-size:var(--t-sm);text-align:right}
.prog{height:4px;background:var(--bg2);border-radius:2px;margin-top:8px;overflow:hidden}
.prog span{display:block;height:4px;background:var(--accent);border-radius:2px}
.timers{flex-wrap:wrap;row-gap:4px}
.fatto small{display:block;font-size:var(--t-sm);font-weight:600;opacity:.8;margin-top:2px;line-height:1.25}
.fatto{padding:14px 16px}
.tg small{display:block;font-size:var(--t-xs);font-weight:500;color:var(--muted)}
.tgt{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:2px 0 8px;font-size:var(--t-sm);color:var(--muted)}
.tgt b{color:var(--text);font-size:var(--t-md);font-variant-numeric:tabular-nums}
.chart .tg{stroke:var(--sig);stroke-dasharray:4 4;stroke-width:1.5}
.chart text.tglab{fill:var(--sig)}
/* impostazioni */
.brow{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left;font-weight:600}
.brow .grow{flex:1;min-width:0}
.brow .tag{margin-left:0}
.news{padding-left:1.1em;margin:0 0 16px}
.news li{margin:0 0 10px}
.stat3>div{min-width:0}
.statv{font-size:var(--t-lg);font-weight:700}
.hint .link{padding:2px 0}
@media (prefers-reduced-motion:reduce){.sheet,.panel,.ov,.toast{transition:none !important}}

.toast{bottom:auto;top:calc(64px + env(safe-area-inset-top));box-shadow:var(--shadow)}
.progrow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.progrow .prog{flex:1;margin-top:0}
.dayrow .d{gap:10px}
.dayrow .d>span:last-child{white-space:nowrap;flex:0 0 auto}
.dayrow .d>span:first-child{min-width:0}
/* l'impostazione «Dimensione del testo» ingrandisce i contenuti; le parti fisse (intestazioni, barre) crescono poco,
   così su schermi piccoli resta spazio per l'istruzione della Rep */
.bartrack{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.optrow{flex-wrap:wrap}
.optrow>span{flex:1 1 7em;min-width:0}
.optrow .seg{flex:0 0 auto}
.steps{font-size:min(var(--t-sm),14.5px)}
.runh .l1{font-size:min(var(--t-md),18px)}
.runh .l2{font-size:min(var(--t-sm),15px)}
.runh .l3{font-size:min(var(--t-md),18px)}
.timers{font-size:min(var(--t-sm),17px)}
.timers b{font-size:min(var(--t-md),19px)}
.sec .btn{font-size:min(var(--t-sm),17px)}
.fatto{font-size:min(var(--t-xl),28px)}
.fatto small{font-size:min(var(--t-sm),15px)}
.seg.small button{font-size:min(var(--t-sm),14px);white-space:nowrap}
.cardh{flex-wrap:wrap}
.resume{font-size:min(var(--t-md),17px)}
@media (max-height:700px){.repnum{font-size:var(--t-3xl);margin-top:10px}}
.pausebtn{font-size:min(var(--t-md),16px)}

/* ---- metodo v3 ---- */
.choice button{padding:14px 12px}
.avv{margin:0 0 10px}
.vrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--muted);margin:2px 0 6px}
.vrow b{color:var(--text)}
.vrow .link{padding:2px 0;font-size:var(--t-sm)}
.vbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 14px;background:var(--bg2)}
.vbox>div{flex:1;min-width:0}
.vbox b{display:block;font-size:var(--t-md);margin-top:2px}
.vbox small{display:block;font-size:var(--t-sm);color:var(--muted)}
.vbox .btn.inline{margin:0;flex:0 0 auto}
.errs{display:grid;gap:6px;margin:6px 0 4px}
.errs button{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:var(--t-md)}
.errs button small{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:2px;letter-spacing:.03em}
.errs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.livs{display:grid;gap:6px;margin:0 0 12px}
.livs button{display:flex;align-items:baseline;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px}
.livs button b{font-size:var(--t-lg);min-width:1.2em}
.livs button small{font-size:var(--t-sm);color:var(--muted)}
.livs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rrow .m{flex:1;min-width:0;font-size:var(--t-md)}
.seg.voti{flex:0 0 auto}
.seg.voti button{padding:8px 13px;min-width:2.6em}
.instr details.sub2{font-size:var(--t-md);font-weight:400;margin-top:12px}
.card.due{border-color:var(--accent)}
.card.due .link{padding:0;font-size:var(--t-sm)}
.sheet .optrow .seg button{text-transform:capitalize}

/* ---- brani nuovi, editor ---- */
.dots .dot.opt{opacity:.45}
.dots .dot.opt.done,.dots .dot.opt.cur{opacity:1}
.accbody .todo .row .btn{margin-bottom:0}
/* 3.2: voto in decimi */
input.vin{width:5.5em;flex:0 0 auto;font-size:var(--t-lg);text-align:center;font-weight:700;padding:8px 6px}
.row input.vin{flex:1 1 0;min-width:0;width:0;font-size:var(--t-2xl);height:56px}
.famrec{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:1px dashed var(--line);margin:6px 0 2px;padding:6px 2px 2px}
.rif{margin:4px 0 12px}

/* ===================== versione 2.1: dimensioni e stili ===================== */
/* Dimensioni: testo di base più piccolo e titoli meno ingombranti; in più la misura «piccolo». */
html{font-size:16px}
html[data-testo="piccolo"]{font-size:14px}
html[data-testo="grande"]{font-size:18px}
html[data-testo="molto"]{font-size:20px}
:root{
  /* Scala tipografica: tutti i testi dell'app usano uno di questi nove gradini (12, 14, 16, 18, 20, 24, 30, 36, 48 px alla misura normale). */
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.125rem; --t-xl:1.25rem; --t-2xl:1.5rem; --t-3xl:1.875rem; --t-4xl:2.25rem; --t-5xl:3rem;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-head:var(--font); --font-ui:var(--font);
  --r-card:14px; --r-btn:12px; --r-field:10px; --r-sm:8px;
  --w-head:800; --w-btn:600; --w-instr:500; --lh-instr:1.5;
}
body{font-family:var(--font)}
h1,h2,h3,h4,.big,.repnum,.cur-b,.statv,.nowpos,.panel .sg,.sth,.stt{font-family:var(--font-head)}
.btn,.seg button,.tabs button,.ib,select,input,textarea,.label,.pill,.tag,.chip,.steps,.timers,.bigclock,.barv,.bard,.resume,.panel .lbl,.sigcard dt,.instr .vlabel,.link,.barnote,.fmeta,.sub{font-family:var(--font-ui)}
.top h1{font-size:var(--t-lg)}

/* ---------- Essenziale: Inter, bianco e nero, un solo colore per i collegamenti ---------- */
:root[data-stile="essenziale"]{
  --font:"Inter",system-ui,sans-serif; --r-card:10px; --r-btn:10px; --r-field:8px; --r-sm:8px; --w-head:700; --w-instr:450;
  --bg:#0b0c0e; --bg2:#15161a; --card:#131417; --line:#292b31; --text:#f3f4f6; --muted:#9a9ea8;
  --accent:#f3f4f6; --accent-ink:#0b0c0e; --ok:#4cc38a; --bad:#ff6b6b; --sig:#7fb2ff; --bb:#f3f4f6;
}
:root[data-stile="essenziale"][data-theme="chiaro"]{
  --bg:#ffffff; --bg2:#f4f4f6; --card:#ffffff; --line:#e2e3e8; --text:#111214; --muted:#666a74;
  --accent:#111214; --accent-ink:#ffffff; --ok:#18794e; --bad:#c62828; --sig:#1a5fd0; --bb:#111214;
}
[data-stile="essenziale"] .bat,[data-stile="essenziale"] .bb{font-weight:700}
[data-stile="essenziale"] h1,[data-stile="essenziale"] .big,[data-stile="essenziale"] .repnum,[data-stile="essenziale"] .cur-b{letter-spacing:-.015em}
[data-stile="essenziale"] .label{letter-spacing:.05em}

/* ---------- Spartito: carta e inchiostro, testo con le grazie come in un'edizione musicale ---------- */
:root[data-stile="spartito"]{
  --font:"Source Serif 4",Georgia,"Times New Roman",serif; --font-head:var(--font); --font-ui:"Inter",system-ui,sans-serif;
  --r-card:4px; --r-btn:4px; --r-field:4px; --r-sm:4px; --w-head:650; --w-btn:600; --w-instr:400; --lh-instr:1.45;
  --bg:#16130f; --bg2:#1f1b15; --card:#1c1813; --line:#3b342a; --text:#efe7d8; --muted:#a99e8b;
  --accent:#e6d3ad; --accent-ink:#231d14; --ok:#7fc08f; --bad:#ef8a80; --sig:#a3bfee; --bb:#e3a58f;
}
:root[data-stile="spartito"][data-theme="chiaro"]{
  --bg:#f4efe4; --bg2:#fbf8f1; --card:#fbf8f1; --line:#d6ccb9; --text:#221d16; --muted:#6b6254;
  --accent:#7b1e2b; --accent-ink:#fff8ee; --ok:#2f6b3f; --bad:#a32222; --sig:#1d4e89; --bb:#7b1e2b;
}
[data-stile="spartito"] body{font-size:1.04rem}
[data-stile="spartito"] .instr{font-size:calc(var(--t-xl)*1.06)}
[data-stile="spartito"] .label,[data-stile="spartito"] .panel .lbl,[data-stile="spartito"] .sigcard dt{letter-spacing:.09em;font-size:var(--t-xs);font-weight:600}
[data-stile="spartito"] .repnum{font-style:italic}
[data-stile="spartito"] .btn{letter-spacing:.01em}
[data-stile="spartito"] .card,[data-stile="spartito"] details.acc,[data-stile="spartito"] .circ{box-shadow:0 1px 0 var(--line)}

/* ---------- Salvia: morbido e arrotondato, verde, senza bordi duri ---------- */
:root[data-stile="salvia"]{
  --font:"Manrope",system-ui,sans-serif; --r-card:22px; --r-btn:999px; --r-field:14px; --r-sm:999px; --w-head:800; --w-btn:700; --w-instr:500;
  --bg:#0f1512; --bg2:#1c2520; --card:#18201c; --line:#2c3832; --text:#e9f0ec; --muted:#95a59d;
  --accent:#93d6b4; --accent-ink:#0c1a14; --ok:#6fcf97; --bad:#f08a8a; --sig:#93cbe9; --bb:#93d6b4;
}
:root[data-stile="salvia"][data-theme="chiaro"]{
  --bg:#eef3ee; --bg2:#f7faf7; --card:#ffffff; --line:#d3dcd5; --text:#16201b; --muted:#5a6860;
  --accent:#2c6a51; --accent-ink:#ffffff; --ok:#2f7d4f; --bad:#b3362e; --sig:#1f5f8b; --bb:#2c6a51;
}
[data-stile="salvia"] .card,[data-stile="salvia"] details.acc,[data-stile="salvia"] .circ,[data-stile="salvia"] .dayrow{border-color:transparent}
[data-stile="salvia"] .card.now{border-color:var(--accent)}
[data-stile="salvia"] .fatto{border-radius:26px}
[data-stile="salvia"] .ib{min-width:40px;height:40px}
[data-stile="salvia"] .pausebtn,[data-stile="salvia"] .stepb{border-radius:14px}
[data-stile="salvia"] .seg button{padding-left:16px;padding-right:16px}
[data-stile="salvia"] .seg.small button{padding-left:10px;padding-right:10px}
[data-stile="salvia"] .chip,[data-stile="salvia"] .tag{border-radius:999px;padding-left:8px;padding-right:8px}
[data-stile="salvia"] .tabwrap,[data-stile="salvia"] .bar{border-top-color:transparent;box-shadow:0 -6px 20px rgba(0,0,0,.12)}

/* ---------- Inchiostro: titoli grandi con carattere, bottoni pieni, accento vermiglio ---------- */
:root[data-stile="inchiostro"]{
  --font:"Inter",system-ui,sans-serif; --font-head:"Fraunces",Georgia,serif; --font-ui:"Inter",system-ui,sans-serif;
  --r-card:2px; --r-btn:2px; --r-field:2px; --r-sm:2px; --w-head:650; --w-btn:650; --w-instr:450;
  --bg:#111110; --bg2:#1c1b19; --card:#161614; --line:#35332e; --text:#f5f1e8; --muted:#a6a094;
  --accent:#ff7d54; --accent-ink:#1c0d06; --ok:#74c98b; --bad:#ff7b7b; --sig:#9ab6ff; --bb:#ff7d54;
}
:root[data-stile="inchiostro"][data-theme="chiaro"]{
  --bg:#fffdf8; --bg2:#f4f0e7; --card:#fffdf8; --line:#d2ccbe; --text:#151514; --muted:#5f5b53;
  --accent:#c8431e; --accent-ink:#ffffff; --ok:#256b3a; --bad:#b3261e; --sig:#2b50aa; --bb:#c8431e;
}
[data-stile="inchiostro"] .btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
[data-stile="inchiostro"] .top h1{font-size:var(--t-xl)}
[data-stile="inchiostro"] .big{font-size:calc(var(--t-3xl)*1.1)}
[data-stile="inchiostro"] .repnum{font-size:calc(var(--t-4xl)*1.1)}
[data-stile="inchiostro"] .card,[data-stile="inchiostro"] details.acc,[data-stile="inchiostro"] .circ{border-width:0;border-top:2px solid var(--text);background:transparent;padding-left:2px;padding-right:2px}
[data-stile="inchiostro"] details.acc{padding:0}
[data-stile="inchiostro"] .card.now{border:2px solid var(--accent);padding:14px 14px;background:var(--accent-soft)}
[data-stile="inchiostro"] .label{letter-spacing:.07em;font-weight:700;color:var(--text)}
[data-stile="inchiostro"] .dayrow{background:transparent;border-width:0 0 1px;border-radius:0;padding-left:2px;padding-right:2px}
[data-stile="inchiostro"] .top{border-bottom:2px solid var(--text)}

/* scelta dello stile nelle Impostazioni */
.stili{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stile{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;background:none;display:flex;flex-direction:column}
.stile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.stile .sw{display:block;padding:12px 12px 10px}
.stile .sw b{display:block;font-size:var(--t-xl);line-height:1.1}
.stile .sw i{display:block;font-style:normal;font-size:var(--t-xs);margin-top:4px;opacity:.75}
.stile .sw u{display:inline-block;text-decoration:none;margin-top:8px;padding:3px 10px;font-size:var(--t-xs);font-weight:700}
.stile .nm{display:block;padding:8px 12px;font-weight:700;font-size:var(--t-sm);border-top:1px solid var(--line);color:var(--text);font-family:var(--font-ui)}
.stile .nm small{display:block;font-weight:500;color:var(--muted);font-size:var(--t-xs)}

<script>
const CATALOGO = {"versione": 3, "fonte": "Analisi di Fable, «Op. 111, I movimento — lavoro motorio per passaggio» (10/11/2026), Henle", "brani": [{"id": "op111", "nome": "Beethoven, Sonata op. 111, I movimento", "completo": true, "fonte": "Analisi di Fable, «Op. 111, I movimento — lavoro motorio per passaggio» (10/11/2026), Henle", "priorita": [{"n": 1, "nome": "Semicrome parallele a due mani", "perche": "È esattamente il difetto indicato."}, {"n": 2, "nome": "Semicrome contro ottave (2:1)", "perche": "Coordinazione tra le mani."}, {"n": 3, "nome": "Sinistra continua", "perche": "È la mano che rende opaco l'insieme."}, {"n": 4, "nome": "Posizioni collegate da un salto", "perche": "Precisione tattile."}, {"n": 5, "nome": "Due voci e trilli nella stessa mano", "perche": "Indipendenza dentro la mano."}, {"n": 6, "nome": "Salti, ottave, accordi", "perche": "Con la tua apertura è la famiglia meno critica. Carico più alto per mano e avambraccio."}, {"n": 7, "nome": "Gruppi irregolari e passi lenti", "perche": "Non dipendono dalla velocità."}], "definizioni": {"priorita": "Organizzazione dei passaggi: i 7 gruppi di Fable, in ordine di urgenza (1 = più urgente).", "famiglia": "Frammenti con tecniche simili, che si lavorano con lo stesso metodo (es. 56-57 e 132-133). Un frammento con famiglia null non ha frammenti simili."}, "metrica": "tempo"}, {"id": "op111-2", "nome": "Beethoven, Sonata op. 111, II movimento (Arietta)", "completo": true, "fonte": "«Op. 111, II movimento (Arietta) — lavoro motorio per passaggio» (11/11/2026), Henle", "priorita": [{"n": 1, "nome": "Velocità in forte (Var. III e arpeggi col pedale)", "perche": "Tutti e due i tuoi difetti al massimo: è la variazione più veloce e in f il suono tende a indurirsi. I MAX 63-67 a matita dicono che è sotto tempo."}, {"n": 2, "nome": "Biscrome leggere in pp nell'acuto", "perche": "Velocità e suono insieme: nove note per tempo, uguali e udibili, in pp. È il punto in cui una mano irrigidita si sente subito."}, {"n": 3, "nome": "Tremolo grave in pp sotto accordi sincopati", "perche": "Problema soprattutto di suono: tremolo pp nel registro grave senza ronzio, accordi che entrano dopo la pausa con tutte le note insieme."}, {"n": 4, "nome": "Trilli lunghi con melodia nella stessa mano", "perche": "Suono e resistenza: il trillo deve restare pp e continuo sotto il canto. Carico alto sui muscoli piccoli della mano."}, {"n": 5, "nome": "Melodia sopra un accompagnamento continuo", "perche": "Suono: equilibrio tra canto e terzine di biscrome della sinistra, che devono restare uniformi e sotto."}, {"n": 6, "nome": "Figure puntate a mani alternate (Var. II)", "perche": "Precisione ritmica e coordinazione a velocità media. Meno esposta alla velocità finale."}, {"n": 7, "nome": "Canto ad accordi e passi lenti", "perche": "Non dipendono dalla velocità: il lavoro è di suono (voce superiore, simultaneità, legato), meglio fatto in Rep 4 che con vincoli motori."}], "definizioni": {"priorita": "Organizzazione dei passaggi: 7 gruppi in ordine di urgenza (1 = più urgente). Le priorità dell'Arietta sono proprie del II movimento.", "famiglia": "Frammenti con tecniche simili, che si lavorano con lo stesso metodo. Un frammento con famiglia null non ha frammenti simili."}, "metrica": "suono"}, {"id": "mephisto", "nome": "Liszt, Mephisto Valzer n. 1", "completo": true, "fonte": "«Mephisto Valzer n. 1 — lavoro motorio per passaggio» (11/11/2026), Peters (ed. Sauer)", "priorita": [{"n": 1, "nome": "Salti rapidi di accordi e ottave, a due mani", "perche": "È il primo difetto che indichi. Qui il salto è a tempo pieno, spesso in tutte e due le mani insieme e senza una nota d'appoggio: l'atterraggio corto o lungo si sente subito."}, {"n": 2, "nome": "Ottave e accordi ribattuti in f e ff (resistenza)", "perche": "È il secondo difetto. Sono i passi lunghi in cui l'avambraccio non ha pause: la rigidità compare dopo poche battute e si accumula fino alla fine della sezione."}, {"n": 3, "nome": "Salti di una mano mentre l'altra resta regolare", "perche": "Stesso difetto dei salti, ma a carico di una mano sola (di solito la sinistra: basso, accordo, melodia), mentre l'altra ha una figura che non deve risentirne."}, {"n": 4, "nome": "Ribattuti e tremoli a bassa e media dinamica (rilascio)", "perche": "La rigidità di solito nasce qui, a p e mf, prima che nei ff: l'avambraccio resta contratto tra un ribattuto e l'altro. Si lavora il rimbalzo, non la forza."}, {"n": 5, "nome": "Volate, figure spezzate, mani alternate e cadenze", "perche": "Uniformità e chiarezza nelle figure veloci. Non è tra i difetti che hai indicato, quindi viene dopo; alcune (525, 813) restano tra i punti più difficili del brano."}, {"n": 6, "nome": "Passi leggeri a p e pp: Presto, scherzando, staccato", "perche": "Figure piccole e rapide vicino al tasto. Rischio di rigidità basso; il lavoro è sull'uguaglianza e sulla simultaneità dei bicordi."}, {"n": 7, "nome": "Cantabile e passi lenti", "perche": "Non dipendono dalla velocità. Il lavoro motorio riguarda il legato delle ottave a p, i salti lenti della sinistra e il controllo del pp."}], "definizioni": {"priorita": "Organizzazione dei passaggi: 7 gruppi in ordine di urgenza (1 = più urgente).", "famiglia": "Frammenti con tecniche simili, che si lavorano con lo stesso metodo. Un frammento con famiglia null non ha frammenti simili."}, "metrica": "tempo", "resistenza": [2]}, {"id": "scriabin28", "nome": "Scriabin, Fantasia op. 28", "completo": true, "fonte": "Analisi di Claude, «Fantasia op. 28 — lavoro motorio per passaggio» (11/11/2026), Peters (ed. Philipp)", "priorita": [{"n": 1, "nome": "Canto e parti interne nella stessa mano", "perche": "È il tuo difetto nella forma più diretta: il colore nasce da quanto il canto si stacca dalle parti interne suonate dalla stessa mano, e il pedale non lo corregge."}, {"n": 2, "nome": "Canto sopra accordi ribattuti nel ff-fff", "perche": "È dove il suono si indurisce più facilmente: molte note, ripetute, forti. È anche il carico più alto per mano e avambraccio."}, {"n": 3, "nome": "Arpeggi larghi della sinistra sotto il canto", "perche": "Fanno il fondo del colore: basso che risuona, note interne che si spengono. Con la tua decima l'estensione non è il problema; lo è l'uguaglianza a mezza voce."}, {"n": 4, "nome": "Figurazioni rapide e cascate", "perche": "È il materiale che decade per primo se il lavoro tecnico si ferma; e qui la leggerezza è già una questione di suono."}, {"n": 5, "nome": "Accordi f-ff con salti", "perche": "Suono pieno senza durezza e precisione tattile; passaggi brevi e meno frequenti."}, {"n": 6, "nome": "Marcia e passaggio cromatico", "perche": "Ritmo puntato e accordi a tempo veloce: tenuta tecnica più che colore."}, {"n": 7, "nome": "Quintine e terzine del Moderato", "perche": "Gruppi irregolari a tempo lento: uguaglianza e leggerezza, poco rischio."}], "definizioni": {"priorita": "Organizzazione dei passaggi: i 7 gruppi dell'analisi, in ordine di urgenza (1 = più urgente).", "famiglia": "Frammenti con tecniche simili, che si lavorano con lo stesso metodo (es. 55-63 e 133-140). Un frammento con famiglia null non ha frammenti simili."}, "metrica": "suono"}, {"id": "nabucco", "nome": "Verdi, Nabucco: Sinfonia e concertato «S'appressan gl'istanti»", "completo": true, "fonte": "Analisi di Claude, «Nabucco (Sinfonia e «S'appressan gl'istanti») — lavoro motorio per passaggio» (12/11/2026), Ricordi (riduzione per canto e pianoforte, 42312)", "priorita": [{"n": 1, "nome": "Voce sopra le sestine della sinistra", "perche": "È il compito nuovo nella forma più carica: canti, la sinistra non si ferma mai e la destra porta un'altra linea. Se la voce cede, cede tutto."}, {"n": 2, "nome": "Voce sopra accordi ribattuti in terzine e rulli", "perche": "Stesso compito con un accompagnamento più semplice; qui si decide l'indipendenza ritmica della voce (puntati contro terzine, attacchi in levare dopo le pause)."}, {"n": 3, "nome": "Ribattuti leggeri con il canto nella stessa mano", "perche": "È il passo più difficile della Sinfonia: tre strati divisi tra le mani, ribattuti a semicrome pp, canto che deve sentirsi."}, {"n": 4, "nome": "Salti della sinistra tra basso e accordo", "perche": "Dai difetti che mi hai indicato per il Mephisto: salti imprecisi. Qui la sinistra salta a ogni battuta per pagine intere."}, {"n": 5, "nome": "Accordi e ottave ff, resistenza", "perche": "L'altro difetto del Mephisto: accordi e ottave che si irrigidiscono. Più stretto, lettera E e ff dell'Allegro sono il carico più alto per l'avambraccio."}, {"n": 6, "nome": "Volate, arpeggi spezzati e tremoli", "perche": "Uniformità e coordinazione a mani unite (il difetto dell'op. 111). Passaggi brevi, ma decadono per primi."}, {"n": 7, "nome": "Staccato p, corale e canto dell'Andantino", "perche": "Non dipendono dalla velocità: simultaneità degli accordi a p, legato del canto senza pedale."}], "definizioni": {"priorita": "Organizzazione dei passaggi: 7 gruppi in ordine di urgenza (1 = più urgente). Le battute della Sinfonia e del concertato si contano da 1 in ciascun estratto.", "famiglia": "Frammenti con tecniche simili, che si lavorano con lo stesso metodo. Un frammento con famiglia null non ha frammenti simili."}, "metrica": "tempo", "stato": "nuovo"}], "sigle": [{"sigla": "RIT", "nome": "Ritmi", "come_si_fa": "Ritmi puntati. Su coppie: lungo-corto, poi corto-lungo. Su gruppi di 4: fermata sulla 1ª nota e le altre tre di scatto; poi fermata sulla 2ª, 3ª, 4ª. Nota corta scattante e vicina al tasto.", "cosa_allena": "Ogni transizione tra dita a velocità superiore al tempo finale, una alla volta.", "origine": "Tuo"}, {"sigla": "CHUNK", "nome": "Blocchi a tempo", "come_si_fa": "Un quarto più la prima nota del successivo, a tempo pieno, poi stop. Durante lo stop la mano è già a contatto dei tasti del chunk seguente, polso e spalla rilasciati. Poi chunk sfalsati (da 3ª semicroma a 3ª), poi due quarti più una nota. Unico vincolo a metronomo pieno; ogni chunk seguito da una pausa lunga quanto il chunk.", "cosa_allena": "Il gesto alla velocità reale e la preparazione anticipata della posizione.", "origine": "Tuo (arresto con preparazione aggiunto)"}, {"sigla": "ACC", "nome": "Accenti spostati", "come_si_fa": "Accento sulla 2ª semicroma di ogni gruppo, poi sulla 3ª, poi sulla 4ª. Tutto il resto pp. Variante: raggruppa in 3 una figura scritta in 4.", "cosa_allena": "Uniformità: ogni dito sa essere forte e debole. Smaschera il dito che cade o che manca.", "origine": "Aggiunto"}, {"sigla": "BLOC", "nome": "Posizioni a blocco", "come_si_fa": "Tutte le note di una posizione di mano suonate insieme, a tempo di quarti, cambiando posizione senza guardare.", "cosa_allena": "Topografia, ampiezza esatta dello spostamento, precisione tattile.", "origine": "Aggiunto"}, {"sigla": "MUTA", "nome": "Mano fantasma", "come_si_fa": "Una mano suona, l'altra fa gli stessi movimenti sulla superficie dei tasti senza abbassarli. Poi si scambia.", "cosa_allena": "Coordinazione: mostra quale mano trascina l'altra e toglie forza inutile alla mano muta.", "origine": "Aggiunto"}, {"sigla": "DIN", "nome": "Dinamiche divise", "come_si_fa": "Una mano f e l'altra pp, di norma sinistra f. Variante: una legato e l'altra staccato.", "cosa_allena": "Indipendenza e ascolto della mano debole.", "origine": "Tuo"}, {"sigla": "ALT", "nome": "Alternanza", "come_si_fa": "Negli unisoni le mani si alternano un quarto a testa, poi mezzo quarto, senza perdere la pulsazione. La mano che tace segue a contatto dei tasti.", "cosa_allena": "Ogni mano sa entrare a tempo a metà passaggio.", "origine": "Aggiunto"}, {"sigla": "NODO", "nome": "Arresto sui nodi", "come_si_fa": "Fermati, tenendo i tasti, sulle note in cui una mano passa il pollice o cambia posizione e l'altra no. Verifica che i due tasti scendano insieme, poi suona da nodo a nodo.", "cosa_allena": "Sincronia dove le diteggiature delle due mani non sono speculari.", "origine": "Aggiunto"}, {"sigla": "STAC", "nome": "Staccato di dito pp", "come_si_fa": "Ogni nota corta partendo dal tasto, il dito tira verso il palmo, il braccio scorre di lato. Nessun sollevamento alto.", "cosa_allena": "Chiarezza dell'attacco e rilascio attivo di ogni dito.", "origine": "Tuo, precisato"}, {"sigla": "DOPPIE", "nome": "Note doppie", "come_si_fa": "Ogni nota suonata due volte, a pulsazione dimezzata.", "cosa_allena": "Ritorno del tasto e precisione del punto di contatto.", "origine": "Tuo"}, {"sigla": "CIECO", "nome": "Senza guardare", "come_si_fa": "Occhi chiusi o sguardo fuori dalla tastiera. Nei salti, shift–touch–play: sposta rapido, atterra sui tasti senza suonare, controlla al tatto, poi suona.", "cosa_allena": "Mappa propriocettiva delle distanze.", "origine": "Tuo (shift–touch–play aggiunto)"}, {"sigla": "ROT", "nome": "Rotazione isolata", "come_si_fa": "Prima solo forearm rotation (rotazione dell'avambraccio) con dita ferme; poi solo dita con avambraccio fermo; poi la miscela minima che funziona.", "cosa_allena": "Scegliere il motore giusto in tremoli e figure spezzate.", "origine": "Aggiunto"}, {"sigla": "CLIC", "nome": "Clic spostato", "come_si_fa": "Metronomo sul levare (ottavo debole o 2ª semicroma), oppure un solo clic per battuta.", "cosa_allena": "Regolarità senza appoggio esterno sui tempi forti.", "origine": "Aggiunto"}, {"sigla": "MENT", "nome": "Ripetizione mentale", "come_si_fa": "A tempo, con sensazione tattile dei tasti e suono immaginati, mani ferme. Subito dopo, la ripetizione reale.", "cosa_allena": "Programmazione del gesto, memoria dei salti.", "origine": "Tuo (in valutazione)"}, {"sigla": "PESO", "nome": "Caduta e rilascio", "come_si_fa": "Drop–release: accordo o ottava dal tasto con impulso del braccio, poi rilascio immediato della pressione a fondo tasto. Test: mentre tieni l'accordo, il polso deve potersi muovere su e giù. Nei gruppi di ottave: un impulso per gruppo, le altre di rimbalzo.", "cosa_allena": "Suono pieno senza tensione mantenuta.", "origine": "Aggiunto"}, {"sigla": "TRILL", "nome": "Trillo misurato", "come_si_fa": "Numero fisso di note per quarto (4, poi 6, poi 8), inizio dalla nota reale, dita vicine al tasto. Se la stessa mano tiene un'altra voce, prima tieni quella voce e trilla pp.", "cosa_allena": "Trillo che non disturba l'altra voce né l'altra mano.", "origine": "Aggiunto"}], "regole_slot": {"rep1": "Test a freddo all'85-95% + una riga di diagnosi (dove si è sporcato e come).", "rep2_3": "Pulsazione al 70-80%, senza pedale e a mp anche dove è scritto ff. Attenzione sul vincolo. Se Rep 1 ha individuato un quarto preciso, lavora solo da mezza battuta prima a mezza battuta dopo. Con voto del test di oggi da 7 in su la Rep 3 è con dinamica e pedale reali. Nei frammenti di resistenza Rep 2-3 sono sempre nella dinamica scritta.", "rep4": "85-100%, pedale e dinamiche reali, verso il tempo target. Attenzione al suono, non alle dita.", "andate": "In una sessione ogni frammento usa una sola coppia di vincoli (Rep 2 e Rep 3) per tutte le andate, così ogni vincolo si ripete 3-4 volte. La coppia cambia tra i giorni: un giorno quella dell'andata 1 del catalogo, la volta dopo quella dell'andata 2 (poi 3 e 4, se esistono). Andata 4 solo se non in drop-out.", "drop_out": "Se alla terza andata Rep 1 è pulita e fluida, il frammento non fa la quarta. Il drop-out serve solo a risparmiare tempo dentro la sessione: non cambia il voto.", "arresto": "Due errori nello stesso punto con lo stesso vincolo: scendi di 8-10 clic o accorcia il frammento.", "da_annotare": "Il voto del test (prima Rep 1 del giorno), il tempo di Rep 4 e il vincolo usato.", "verifica_2_settimane": "Brani con metrica «tempo»: se dopo due settimane il tempo di Rep 4 non sale, torna a Rep 2-3 al 70-80% uniforme. Brani con metrica «suono»: la verifica scatta se in due settimane il voto del test a freddo non sale."}, "regole_circuito": {"struttura": "3-5 slot per circuito, 3-4 andate.", "nota": "Solo consultazione: il programma non dà avvisi in composizione.", "fable_composizione": ["Un solo passaggio per priorità in ogni circuito: due passaggi dello stesso gruppo di seguito si disturbano a vicenda e caricano gli stessi muscoli.", "Frammenti della stessa famiglia (es. 24-28 e 108-113, 58-68 e 135-145) in circuiti diversi finché uno non è in drop-out; 58-68 e 135-145, dopo il drop-out, apposta uno dopo l'altro.", "Un solo frammento di priorità 6 per circuito, con Rep 2-3 a mp e il ff solo in Rep 4.", "Al massimo due slot con trilli 3-5 per blocco."]}, "frammenti": [{"id": "op111-1-3-5-attacchi", "brano": "op111", "battute": "1, 3, 5", "titolo": "Attacchi (biscroma e accordo sf)", "priorita": 6, "famiglia": null, "nodo_motorio": "Nota corta e accordo lungo in un solo gesto del braccio; salto in ottave della sinistra.", "andate": {"1": {"rep2": "CIECO shift–touch–play: suona la biscroma, sposta di scatto, atterra muto sull'accordo, controlla al tatto, suona.", "rep3": "PESO sugli accordi d'arrivo; durante la legatura muovi il polso su e giù."}, "2": {"rep2": "CIECO shift–touch–play, come in andata 1.", "rep3": "MENT."}}, "rep4_verifica": "Tutte le note dell'accordo scendono insieme; nessuna tensione tenuta sulla nota lunga."}, {"id": "op111-1-3-5-trilli", "brano": "op111", "battute": "1, 3, 5", "titolo": "Trilli con chiusa", "priorita": 6, "famiglia": null, "nodo_motorio": "Trillo breve con altre dita impegnate a tenere; chiusa a tempo.", "andate": {"1": {"rep2": "TRILL a 4 e poi a 6 note, partendo dalla nota reale.", "rep3": "RIT: fermata sull'ultima nota del trillo, poi chiusa e arrivo di scatto."}, "2": {"rep2": "TRILL, come in andata 1.", "rep3": "RIT con ritmo opposto."}}, "rep4_verifica": "Stesso numero di note ogni volta; sf solo sull'attacco.", "note": "Partenza del trillo dalla nota reale: Bülow, Cotta nota c p. 118."}, {"id": "op111-2-4", "brano": "op111", "battute": "2, 4", "titolo": "Arpeggi passati da sinistra a destra", "priorita": 6, "famiglia": null, "nodo_motorio": "Consegna tra le mani senza buco né accento.", "andate": {"1": {"rep2": "BLOC: la porzione della sinistra come accordo, quella della destra come accordo, poi l'accordo d'arrivo, a tempo.", "rep3": "CHUNK con stop sulla prima nota della destra; poi quella nota volutamente pp."}, "2": {"rep2": "BLOC, come in andata 1.", "rep3": "CHUNK sfalsati di una nota."}}, "rep4_verifica": "Il punto di consegna non si sente; l'accordo f arriva senza ritardo."}, {"id": "op111-6-10", "brano": "op111", "battute": "6-10", "titolo": "Accordi doppio puntati", "priorita": 7, "famiglia": null, "nodo_motorio": "Accordi di 3-4 note insieme a pp; biscroma ribattuta con movimento minimo.", "andate": {"1": {"rep2": "Ribatti la biscroma da metà corsa del tasto (doppio scappamento del coda), senza staccare le dita.", "rep3": "DIN dentro la mano: voce superiore suonata, resto dell'accordo muto; poi il contrario."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Nessun accordo arpeggiato, nessuna nota che non parla."}, {"id": "op111-11-15", "brano": "op111", "battute": "11-15", "titolo": "Crome ribattute con sfp, accordi legati", "priorita": 7, "famiglia": null, "nodo_motorio": "Sinistra: ribattute uguali con un'altra voce nella stessa mano. Destra: legato di doppie note con sostituzione di dita.", "andate": {"1": {"rep2": "Sinistra sola: voce ribattuta pp con l'altra voce tenuta; sfp come attacco e scarico immediato del peso.", "rep3": "Destra sola, CIECO: sostituzioni contate, il cambio di dito cade sul levare."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Ribattute senza rimbalzo del braccio; legato vero senza pedale."}, {"id": "op111-16-19", "brano": "op111", "battute": "16-19", "titolo": "Tremolo della sinistra e ingresso della destra con terzina d'anacrusi", "priorita": 4, "famiglia": null, "parti": ["16-18", "18-19"], "nodo_motorio": "bb. 16-18: Trillo misurato lungo nel grave, crescendo senza irrigidire.\nbb. 18-19: Tre note rapide a mani unite partendo da fermo, arrivo sul do.", "andate": {"1": {"rep2": "bb. 16-18: ROT: due quarti di sola rotazione, due di sole dita, alternati.\nbb. 18-19: Tocca i tre tasti in silenzio con entrambe le mani, poi suonali come un unico impulso che finisce sul do con caduta del braccio.", "rep3": "bb. 16-18: ACC ogni 4 note, poi ogni 3.\nbb. 18-19: MUTA a mani scambiate; poi RIT con fermata sulla 1ª e sulla 2ª nota."}, "2": {"rep2": "bb. 16-18: ROT, come in andata 1.\nbb. 18-19: Come in andata 1.", "rep3": "bb. 16-18: CLIC sul levare.\nbb. 18-19: MUTA con l'altra mano in evidenza; RIT con ritmo opposto."}}, "rep4_verifica": "bb. 16-18: Numero di note esatto (b. 16: otto per quarto). Il crescendo viene dall'ampiezza della rotazione, non dalla pressione.\nbb. 18-19: Tre note distinte, mani esattamente insieme."}, {"id": "op111-20-23", "brano": "op111", "battute": "20-23", "titolo": "Do–mi♭–si♮ con corona; crome non legato e gruppetto", "priorita": 5, "famiglia": null, "parti": ["20-21", "22-23"], "nodo_motorio": "bb. 20-21: Note staccate di braccio a mani unite; cambio di dito sulla corona.\nbb. 22-23: Staccato di dito a mani unite; nel gruppetto la destra usa 3-5-3 contro dita forti della sinistra.", "andate": {"1": {"rep2": "bb. 20-21: DIN: sinistra f, destra pp.\nbb. 22-23: STAC pp su tutto.", "rep3": "bb. 20-21: PESO: ogni nota dal tasto, rilascio immediato.\nbb. 22-23: RIT sul solo gruppetto: fermata sulla 1ª, poi sulla 3ª nota."}, "2": {"rep2": "bb. 20-21: DIN invertito: destra f, sinistra pp.\nbb. 22-23: STAC, come in andata 1.", "rep3": "bb. 20-21: PESO, come in andata 1.\nbb. 22-23: RIT con ritmo opposto."}}, "rep4_verifica": "bb. 20-21: Mani insieme su ogni nota, senza acciaccatura tra le due.\nbb. 22-23: Le quattro semicrome uguali; la destra non arriva in ritardo sul 5."}, {"id": "op111-24-28", "brano": "op111", "battute": "24-28", "titolo": "Tema all'unisono, semicrome parallele (zona rossa)", "priorita": 1, "famiglia": "fam-semicrome-parallele", "nodo_motorio": "Tre compiti: cellule a gruppetto con diteggiature non speculari, posizioni per quarto con salto, discesa di tre ottave.", "andate": {"1": {"rep2": "BLOC su 26-27: ogni quarto come accordo a mani unite, la seconda volta CIECO. Poi NODO su 24-25 e su 28.", "rep3": "MUTA: la sinistra suona, la destra fa da fantasma, tutto il passaggio."}, "2": {"rep2": "RIT con fermata sulla 1ª nota di ogni quarto: le tre seguenti e l'arrivo di scatto.", "rep3": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, con DIN (sinistra f, destra p).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota. La b. 28 a ritroso: ultimo quarto, ultimi due, ultimi tre."}, "4": {"rep2": "ALT: un quarto a testa, a tempo.", "rep3": "CLIC sul levare, tutto il passaggio di fila."}}, "rep4_verifica": "La sinistra si sente distinta sotto la destra su ogni semicroma. In 26-27 la quarta semicroma di ogni quarto ha la sua durata piena. Lo sf è un impulso del braccio sulla prima nota e non la allunga.", "note": "Analisi: da 24 a metà 26 cellule a gruppetto in discesa, destra 3-4-5 e sinistra 1-2-3, passaggi del pollice su semicrome diverse (effetto tipico: destra opaca, pollice sinistro che batte, mani sfasate). Da metà 26 a 27 una posizione per quarto con sf (effetto tipico: quarta semicroma accorciata, sf in ritardo o picchiato). 28: discesa di tre ottave, pollici non coincidenti. Come muoversi: l'avambraccio trasporta la mano con moto continuo; chiarezza = rilascio puntuale di ogni tasto; pollice leggero; busto inclinato dalle anche, non i polsi. A matita sopra b. 24: «segui sinistra»."}, {"id": "op111-108-110", "brano": "op111", "battute": "108-110", "titolo": "Semicrome parallele nell'acuto (seconda zona rossa)", "priorita": 1, "famiglia": "fam-semicrome-parallele", "nodo_motorio": "Come 24-25: diteggiature non speculari, mani a seste o decime.", "andate": {"1": {"rep2": "MUTA: sinistra suona, destra fantasma (senza BLOC).", "rep3": "MUTA nell'altra direzione."}, "2": {"rep2": "RIT con fermata sulla 1ª nota di ogni quarto: le tre seguenti e l'arrivo di scatto.", "rep3": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, con DIN (sinistra f, destra p).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota."}, "4": {"rep2": "ALT: un quarto a testa, a tempo.", "rep3": "CLIC sul levare, tutto il passaggio di fila."}}, "rep4_verifica": "Come 24-28 (prima verifica): la sinistra si sente distinta sotto la destra su ogni semicroma. [Il documento non dà verifiche proprie.]", "note": "Stesso compito di 24-25, con mani a seste o decime (sincronia meno controllabile all'orecchio) e sinistra oltre la linea mediana. Posizione: busto inclinato a destra, gomito sinistro avanti e lontano dal fianco, polso sinistro in linea con l'avambraccio. Bülow (Cotta nota a p. 125): a 113-114 la destra può prendere il do della sinistra, solo se la sinistra arriva in ritardo sul tremolo."}, {"id": "op111-111-113", "brano": "op111", "battute": "111-113", "titolo": "Semicrome parallele nell'acuto (seconda zona rossa)", "priorita": 1, "famiglia": "fam-semicrome-parallele", "nodo_motorio": "Come 24-25: diteggiature non speculari, mani a seste o decime.", "andate": {"1": {"rep2": "MUTA: sinistra suona, destra fantasma (senza BLOC).", "rep3": "MUTA nell'altra direzione."}, "2": {"rep2": "RIT con fermata sulla 1ª nota di ogni quarto: le tre seguenti e l'arrivo di scatto.", "rep3": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, con DIN (sinistra f, destra p).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota."}, "4": {"rep2": "ALT: un quarto a testa, a tempo.", "rep3": "CLIC sul levare, tutto il passaggio di fila."}}, "rep4_verifica": "Come 24-28 (prima verifica): la sinistra si sente distinta sotto la destra su ogni semicroma. [Il documento non dà verifiche proprie.]", "note": "Stesso compito di 24-25, con mani a seste o decime (sincronia meno controllabile all'orecchio) e sinistra oltre la linea mediana. Posizione: busto inclinato a destra, gomito sinistro avanti e lontano dal fianco, polso sinistro in linea con l'avambraccio. Bülow (Cotta nota a p. 125): a 113-114 la destra può prendere il do della sinistra, solo se la sinistra arriva in ritardo sul tremolo."}, {"id": "op111-29-31", "brano": "op111", "battute": "29-31", "titolo": "Tema con bicordi ribattuti interni", "priorita": 7, "famiglia": null, "nodo_motorio": "Destra a due strati: voce superiore con 5-4, bicordi ribattuti con le dita basse.", "andate": {"1": {"rep2": "DIN dentro la mano: voce superiore suonata e bicordi muti; poi il contrario.", "rep3": "Bicordi pp da metà corsa del tasto, voce superiore f. Sul gruppetto: RIT."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1, RIT del gruppetto con ritmo opposto."}}, "rep4_verifica": "Ribattuti uguali e sotto la voce; gruppetto regolare."}, {"id": "op111-32-33", "brano": "op111", "battute": "32-33", "titolo": "Semicrome spezzate con voce superiore, ottave della sinistra", "priorita": 7, "famiglia": null, "nodo_motorio": "Rotazione tra dito della melodia e pollice; ottave per grado in crome.", "andate": {"1": {"rep2": "ROT sulla destra, pollice pp.", "rep3": "BLOC: le due note di ogni croma insieme, voce superiore legata. Sinistra: PESO, un impulso ogni quattro ottave."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Ogni ottava della sinistra coincide con la nota superiore della destra; pollice destro quasi inudibile."}, {"id": "op111-34-35", "brano": "op111", "battute": "34-35", "titolo": "Poco ritenente e trillo con 3-5", "priorita": 7, "famiglia": null, "nodo_motorio": "Trillo con voce inferiore nella stessa mano; attacco delle semicrome della sinistra.", "andate": {"1": {"rep2": "TRILL a 4 e poi a  "La prima nota della sinistra non è né anticipata né mangiata."}, {"id": "op111-64-66", "brano": "op111", "battute": "64-66", "titolo": "Tema in ottave con trilli sopra semicrome gravi continue", "priorita": 3, "famiglia": "fam-ottave-trilli-sx-continua", "nodo_motorio": "Uniformità e resistenza della sinistra in posizione stretta; il trillo non deve farla inciampare.", "andate": {"1": {"rep2": "Sinistra RIT o STAC, destra MUTA.", "rep3": "Insieme, con il trillo ridotto alla sola nota reale; poi TRILL misurato, due note per ogni semicroma della sinistra."}, "2": {"rep2": "Sinistra RIT con ritmo opposto (o STAC), destra MUTA.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Sinistra regolare all'attacco e alla chiusa di ogni trillo.", "note": "Il numero di note del trillo a tempo pieno dipende dal tempo finale: otto biscrome per quarto probabilmente troppe sopra ♩ = 120; fissa il numero più alto che resta regolare."}, {"id": "op111-141-143", "brano": "op111", "battute": "141-143", "titolo": "Tema in ottave con trilli sopra semicrome gravi continue", "priorita": 3, "famiglia": "fam-ottave-trilli-sx-continua", "nodo_motorio": "Uniformità e resistenza della sinistra in posizione stretta; il trillo non deve farla inciampare.", "andate": {"1": {"rep2": "Sinistra RIT o STAC, destra MUTA.", "rep3": "Insieme, con il trillo ridotto alla sola nota reale; poi TRILL misurato, due note per ogni semicroma della sinistra."}, "2": {"rep2": "Sinistra RIT con ritmo opposto (o STAC), destra MUTA.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Sinistra regolare all'attacco e alla chiusa di ogni trillo.", "note": "Il numero di note del trillo a tempo pieno dipende dal tempo finale: otto biscrome per quarto probabilmente troppe sopra ♩ = 120; fissa il numero più alto che resta regolare."}, {"id": "op111-67-68", "brano": "op111", "battute": "67-68", "titolo": "Sequenza cromatica all'unisono con sf", "priorita": 1, "famiglia": "fam-sequenza-cromatica", "nodo_motorio": "Una cellula di quattro note per quarto, un semitono più su ogni volta: il profilo tasti bianchi e neri cambia a ogni cellula.", "andate": {"1": {"rep2": "STAC pp senza sf, CIECO.", "rep3": "CHUNK: quattro note più una, sf sull'arrivo."}, "2": {"rep2": "STAC, come in andata 1.", "rep3": "ALT, un quarto a testa."}}, "rep4_verifica": "Lo sf viene dal braccio, non allunga la 1ª nota e non accorcia la 4ª; arrivo a b. 69 a tempo.", "note": "Bülow propone 2-3-4-1 su ogni cellula (Cotta nota a p. 122); Fable non la raccomanda al posto della tua diteggiatura."}, {"id": "op111-144-145", "brano": "op111", "battute": "144-145", "titolo": "Sequenza cromatica all'unisono con sf", "priorita": 1, "famiglia": "fam-sequenza-cromatica", "nodo_motorio": "Una cellula di quattro note per quarto, un semitono più su ogni volta: il profilo tasti bianchi e neri cambia a ogni cellula.", "andate": {"1": {"rep2": "STAC pp senza sf, CIECO.", "rep3": "CHUNK: quattro note più una, sf sull'arrivo."}, "2": {"rep2": "STAC, come in andata 1.", "rep3": "ALT, un quarto a testa."}}, "rep4_verifica": "Lo sf viene dal braccio, non allunga la 1ª nota e non accorcia la 4ª; arrivo a b. 146 a tempo.", "note": "Bülow propone 2-3-4-1 su ogni cellula (Cotta nota a p. 122); Fable non la raccomanda al posto della tua diteggiatura."}, {"id": "op111-69-71", "brano": "op111", "battute": "69-71", "titolo": "Salti ff, terzina d'anacrusi, ottave p", "priorita": 6, "famiglia": null, "nodo_motorio": "Atterraggi precisi a due mani dopo pause.", "andate": {"1": {"rep2": "CIECO shift–touch–play.", "rep3": "MENT."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Atterraggi dal tasto; terzina come a b. 19."}, {"id": "op111-72-75", "brano": "op111", "battute": "72-75", "titolo": "Doppie ottave p", "priorita": 6, "famiglia": null, "nodo_motorio": "Quattro note insieme a p, pollici che non sporgono, salti di settima diminuita.", "andate": {"1": {"rep2": "PESO a pp dal tasto, con DIN tra le dita: mignoli più forti dei pollici, poi il contrario.", "rep3": "CIECO sui salti."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Nessuna acciaccatura tra le mani né dentro l'ottava."}, {"id": "op111-76-79", "brano": "op111", "battute": "76-79", "titolo": "Tema aumentato, trilli a due voci, semicrome di b. 78", "priorita": 5, "famiglia": null, "nodo_motorio": "Trillo di sole dita con il pollice fermo su un'altra voce (destra a b. 77, sinistra a b. 79). Trillo solo di dita, piccolo.", "andate": {"1": {"rep2": "TRILL: voce tenuta giù, trillo pp a 4 note per quarto, poi a 6. Mano leggermente inclinata verso il mignolo.", "rep3": "Una mano con il suo trillo, l'altra MUTA; poi si scambia. Semicrome di b. 78: RIT."}, "2": {"rep2": "TRILL, come in andata 1.", "rep3": "Come in andata 1; RIT di b. 78 con ritmo opposto."}}, "rep4_verifica": "La voce tenuta resta giù per tutta la durata; chiusa del trillo a tempo.", "note": "A b. 77 hai scritto 3-5 sopra il 2-4 stampato: Rep 2-3 usano sempre quella che userai a tempo. Trilli 3-5 molto affaticanti: pp in Rep 2-3.", "trillo_3_5": true}, {"id": "op111-80-83", "brano": "op111", "battute": "80-83", "titolo": "Destra a due voci, trillo sopra crome (b. 81), trilli della sinistra (82-83)", "priorita": 5, "famiglia": null, "nodo_motorio": "Due compiti nella stessa mano; il pollice suona per adduzione, senza far cadere la mano.", "andate": {"1": {"rep2": "Voci separate con la diteggiatura reale: una suonata, l'altra tenuta muta.", "rep3": "Trillo sostituito da un'alternanza misurata in semicrome, due note per ogni croma dell'altra voce; poi in biscrome."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Le crome sotto il trillo restano uguali; il trillo non si ferma quando il pollice suona.", "trillo_3_5": true}, {"id": "op111-84-85", "brano": "op111", "battute": "84-85", "titolo": "Crescendo, poi accordo e pollice alternati nella destra", "priorita": 5, "famiglia": null, "nodo_motorio": "Rotazione con l'accordo dal lato del mignolo; ottave sincopate della sinistra.", "andate": {"1": {"rep2": "Su b. 85: BLOC (accordo e nota singola insieme), poi ROT in rotazione pura.", "rep3": "CLIC sul levare; sinistra con PESO."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Tutte le note dell'accordo parlano a ogni ripercussione; avambraccio morbido a fine crescendo."}, {"id": "op111-86-90", "brano": "op111", "battute": "86-90", "titolo": "Accordi staccati e sf della destra, arpeggi della sinistra dopo pausa", "priorita": 4, "famiglia": null, "nodo_motorio": "La sinistra parte dal basso sulla 2ª semicroma e sale per più posizioni; ogni accordo della destra ha una forma diversa.", "andate": {"1": {"rep2": "BLOC a scheletro: accordo della destra sul battere e, sulla 2ª semicroma, il frammento della sinistra come accordo. La seconda volta CIECO.", "rep3": "Sinistra come scritta, destra MUTA. Ogni frammento è un solo impulso che finisce sulla sua ultima nota."}, "2": {"rep2": "BLOC a scheletro, come in andata 1.", "rep3": "RIT nella sinistra."}}, "rep4_verifica": "Prima nota di ogni frammento udibile; accordi della destra completi; nessuna tensione tenuta sulla minima con sf."}, {"id": "op111-92-95", "brano": "op111", "battute": "92-95", "titolo": "Tema ff in doppie ottave e ritardando", "priorita": 6, "famiglia": null, "parti": ["92-93", "94-95"], "nodo_motorio": "bb. 92-93: Doppie ottave con salti; un impulso del braccio per gruppo.\nbb. 94-95: Voce superiore e ribattuti interni nella stessa mano.", "andate": {"1": {"rep2": "bb. 92-93: PESO a mp, un impulso per ogni gruppo di crome; CIECO sui salti do–mi♭–si♮.\nbb. 94-95: BLOC sulle posizioni.", "rep3": "bb. 92-93: MENT, poi DIN con sinistra f.\nbb. 94-95: DIN dentro la mano, come a 29-31: voce superiore suonata e bicordi muti, poi il contrario."}, "2": {"rep2": "bb. 92-93: Come in andata 1.\nbb. 94-95: Come in andata 1.", "rep3": "bb. 92-93: MENT, poi DIN con destra f.\nbb. 94-95: Come in andata 1."}}, "rep4_verifica": "bb. 92-93: Il ff viene dalla caduta del braccio; la mano si richiude tra un'ottava e l'altra dove c'è tempo.\nbb. 94-95: Ribattuti interni uguali."}, {"id": "op111-96-99", "brano": "op111", "battute": "96-99", "titolo": "Martellato a mani alternate", "priorita": 4, "famiglia": null, "nodo_motorio": "Un flusso di semicrome fatto da due mani sfasate; la destra salta a ogni colpo.", "andate": {"1": {"rep2": "Togli lo sfasamento: le due mani insieme, in crome. Poi le due linee dello zigzag della destra separate: solo le note alte, solo le basse.", "rep3": "Come scritto, con CLIC sulla 2ª semicroma: senti la sinistra come battere."}, "2": {"rep2": "Come in andata 1.", "rep3": "ACC solo nella sinistra."}}, "rep4_verifica": "Semicrome composte uguali, senza galoppo; staccato dal tasto con polsi bassi; crescendo di peso, non di velocità.", "note": "Bülow (Cotta nota b p. 124): cominciare piano e tenere la sinistra più leggera della destra."}, {"id": "op111-104-105", "brano": "op111", "battute": "104-105", "titolo": "Destra a due voci sopra le semicrome della sinistra", "priorita": 5, "famiglia": null, "nodo_motorio": "Semicrome in entrambe le mani mentre il 5 della destra porta un'altra voce.", "andate": {"1": {"rep2": "Solo le due linee di semicrome, senza la voce superiore: NODO.", "rep3": "Completo: semicrome interne della destra STAC pp, sinistra MUTA; poi si scambia."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "La voce superiore non rompe la regolarità delle semicrome sotto."}, {"id": "op111-122-123", "brano": "op111", "battute": "122-123", "titolo": "Doppie note legate, p cresc.", "priorita": 7, "famiglia": null, "nodo_motorio": "Legato di doppie note con sostituzioni e incroci di dita.", "andate": {"1": {"rep2": "Voce superiore legata, inferiore staccata.", "rep3": "Il contrario."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Legato vero senza pedale in entrambe le voci."}, {"id": "op111-124-127", "brano": "op111", "battute": "124-127", "titolo": "Canto in ottave della sinistra, frammenti della destra, sestine, quintine a due voci", "priorita": 7, "famiglia": null, "nodo_motorio": "La destra entra sulla 2ª semicroma con un gruppo lanciato; ottave legate della sinistra con 4-5.", "andate": {"1": {"rep2": "BLOC nella destra: ogni frammento come accordo sulla 2ª semicroma, con la sinistra. La seconda volta CIECO.", "rep3": "CLIC sul levare. Sestine di b. 126: ACC 3+3, poi 2+2+2."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Prima nota di ogni frammento udibile e a tempo; ottave legate dalle dita."}, {"id": "op111-128-131", "brano": "op111", "battute": "128-131", "titolo": "Quintine con croma staccata in alto, sempre più allegro", "priorita": 7, "famiglia": null, "nodo_motorio": "Cinque note uguali, poi salto verso la croma; accelerando controllato su quattro battute.", "andate": {"1": {"rep2": "ACC sulle quintine: 2+3, poi 3+2, poi senza accenti. Poi CHUNK: quintina più nota d'arrivo.", "rep3": "Accelerando a gradini: 8-10 clic in più a ogni battuta."}, "2": {"rep2": "ACC come in andata 1; CHUNK sfalsati di una nota.", "rep3": "Accelerando continuo, senza metronomo."}}, "rep4_verifica": "Quintine senza zoppia; croma alta presa pulita; accordi della sinistra insieme alla destra.", "note": "Bülow (Cotta nota b p. 126): il ritorno al tempo principale va distribuito su tutte e quattro le battute."}, {"id": "op111-146-149", "brano": "op111", "battute": "146-149", "titolo": "Accordi sf sui tempi deboli, ottave di do", "priorita": 6, "famiglia": null, "nodo_motorio": "Ogni accordo ha una forma diversa e arriva dopo una pausa.", "andate": {"1": {"rep2": "Destra: CIECO shift–touch–play sugli accordi.", "rep3": "MENT, poi PESO."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Tutte le note dell'accordo insieme; rilascio completo nelle pause; diminuendo ottenuto riducendo la caduta."}, {"id": "op111-150-155", "brano": "op111", "battute": "150-155", "titolo": "Coda, semicrome legate della sinistra", "priorita": 3, "famiglia": null, "nodo_motorio": "Linea lunga legata e p, con il basso lontano all'inizio di ogni gruppo; pollice che non sporge.", "andate": {"1": {"rep2": "Sinistra sola: STAC pp, poi legato; destra MUTA.", "rep3": "ACC pp su 2ª e 4ª semicroma."}, "2": {"rep2": "Come in andata 1.", "rep3": "Un solo clic per battuta, CIECO."}}, "rep4_verifica": "Senza pedale: nessun buco nel legato, nessun accento su pollice o nota bassa."}, {"id": "op111-156-158", "brano": "op111", "battute": "156-158", "titolo": "Figura spezzata sul do grave, diminuendo", "priorita": 3, "famiglia": null, "nodo_motorio": "Rotazione regolare che si rimpicciolisce fino al pp.", "andate": {"1": {"rep2": "ROT.", "rep3": "BLOC, poi CIECO."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Nessuna nota persa negli ultimi due quarti."}, {"id": "op 111 secondo movimento-1-4", "brano": "op111-2", "battute": "1-4", "titolo": "Arietta · Tema, prima frase: accordi con voce superiore", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-tema-accordi", "nodo_motorio": "Accordi di 3-4 note in p, con la voce superiore che canta sopra le altre; ritmo puntato lento. Sinistra a ottave e accordi gravi. Il legato tra accordi va fatto con le dita, non con il pedale.", "andate": {"1": {"rep2": "DIN dentro la mano: voce superiore suonata, resto dell'accordo muto; poi il contrario.", "rep3": "PESO: ogni accordo dal tasto con un impulso del braccio, rilascio a fondo tasto; sulla nota lunga muovi il polso su e giù."}, "2": {"rep2": "DIN tra le mani: sinistra pp, destra con la sola voce superiore mp e le altre pp.", "rep3": "CIECO: sguardo fuori dalla tastiera; il cambio da un accordo all'altro si controlla al tatto, senza staccare."}}, "rep4_verifica": "La voce superiore sta un livello sopra le altre; tutte le note di ogni accordo scendono insieme; legato udibile anche con pedale solo di risonanza.", "note": "Nel Tema il lavoro è quasi tutto di suono. Se Rep 1 è pulita due andate di fila, va in drop-out."}, {"id": "op 111 secondo movimento-5-8", "brano": "op111-2", "battute": "5-8", "titolo": "Arietta · Tema: forcelle e fine della prima metà (1ª e 2ª volta)", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-tema-accordi", "nodo_motorio": "Forcelle di b. 6 dentro un ritmo che non deve cedere; sinistra con salto d'ottava e voce interna legata (53 a b. 5). Alla 2ª volta di b. 8 il levare porta alla seconda metà.", "andate": {"1": {"rep2": "DIN dentro la mano nella destra, come in 1-4.", "rep3": "Sinistra sola, legato senza pedale; poi PESO sul basso di ogni battuta."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma; poi si scambia.", "rep3": "CHUNK a ritroso: ultimo tempo di b. 8 (2ª volta) più l'attacco di b. 9."}}, "rep4_verifica": "Il crescendo e il diminuendo di b. 6 vengono dal peso, non dall'accelerare; il levare della 2ª volta arriva a tempo."}, {"id": "op 111 secondo movimento-9-12", "brano": "op111-2", "battute": "9-12", "titolo": "Arietta · Tema, seconda metà: melodia su seconda voce", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-tema-accordi", "nodo_motorio": "Voce superiore cantabile con una seconda voce nella stessa mano; sinistra con salti tra basso e accordo (b. 10-11, diteggiature 3 e 4 stampate).", "andate": {"1": {"rep2": "DIN dentro la mano: voce superiore mp, seconda voce pp.", "rep3": "Sinistra sola: CIECO shift–touch–play sui salti dal basso all'accordo."}, "2": {"rep2": "DIN tra le mani: sinistra pp.", "rep3": "PESO sugli accordi della destra di b. 12."}}, "rep4_verifica": "La seconda voce non copre il canto; i bassi della sinistra arrivano insieme alla destra."}, {"id": "op 111 secondo movimento-13-16", "brano": "op111-2", "battute": "13-16", "titolo": "Arietta · Tema: accordi in crescendo e sf>p (1ª e 2ª volta)", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-tema-accordi", "nodo_motorio": "Accordi pieni in crescendo fino allo sf>p di b. 16, che va ripetuto due volte (1ª e 2ª volta); alla 2ª volta dolce e levare della Var. I.", "andate": {"1": {"rep2": "PESO: un impulso per accordo nel crescendo, polso mobile.", "rep3": "DIN dentro la mano sugli accordi di b. 14-15."}, "2": {"rep2": "CIECO sugli accordi di b. 13-14.", "rep3": "CHUNK a ritroso: b. 16 (2ª volta) più l'attacco di b. 17."}}, "rep4_verifica": "Crescendo senza indurire: l'accordo più forte suona ancora pieno, non battuto; lo sf>p è un impulso e il p arriva subito."}, {"id": "op 111 secondo movimento-17-20", "brano": "op111-2", "battute": "17-20", "titolo": "Arietta · Var. I: melodia puntata sopra semicrome legate", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-var1-legato", "nodo_motorio": "Sinistra in semicrome «sempre ligato» con note legate di valore sopra il tempo (sincopi); destra con melodia puntata e accordi.", "andate": {"1": {"rep2": "Sinistra sola, legato senza pedale; la nota che segue ogni legatura di valore pp.", "rep3": "Insieme con DIN: destra (sola voce superiore) mp, sinistra pp."}, "2": {"rep2": "MUTA: destra suona, sinistra fantasma; poi si scambia.", "rep3": "CLIC sul levare (2ª semicroma di ogni tempo)."}}, "rep4_verifica": "La sinistra non accenta la nota dopo la legatura di valore; il puntato della destra resta netto, non terzinato."}, {"id": "op 111 secondo movimento-21-24", "brano": "op111-2", "battute": "21-24", "titolo": "Arietta · Var. I: accordi con sostituzioni e semicrome a due mani (24, 2ª volta)", "priorita": 7, "famiglia": "op 111 secondo movimento-fam-var1-legato", "nodo_motorio": "Accordi della destra con sostituzione 5-4 (b. 22); alla 2ª volta di b. 24 semicrome in entrambe le mani. A matita leggo 3-2 sopra la destra e una diteggiatura sotto la sinistra.", "andate": {"1": {"rep2": "DIN dentro la mano sugli accordi di 21-22.", "rep3": "Solo b. 24 (2ª volt
