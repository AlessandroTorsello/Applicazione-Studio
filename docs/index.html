<!doctype html>
<html lang="it" data-theme="scuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circuiti">
<meta name="description" content="Circuiti di studio: guida e registro dello studio al pianoforte a micro-circuiti.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Circuiti di studio</title>
<style>
:root{
  --bg:#0f1216; --bg2:#171b21; --card:#1c2128; --line:#2c333d; --text:#eef1f5; --muted:#9aa4b2;
  --accent:#f2b84b; --accent-ink:#1a1405; --ok:#52c48a; --bad:#ef6b6b; --sig:#7cc4ff; --bb:#f2b84b;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme="chiaro"]{
  --bg:#f6f4ef; --bg2:#ffffff; --card:#ffffff; --line:#d9d4c9; --text:#14161a; --muted:#5d6470;
  --accent:#9a5b00; --accent-ink:#ffffff; --ok:#1d7a4a; --bad:#b42323; --sig:#0b5cad; --bb:#8a4b00;
  --shadow:0 10px 30px rgba(0,0,0,.15);
  color-scheme:light;
}
html{font-size:17px}
html[data-testo="grande"]{font-size:19px}
html[data-testo="molto"]{font-size:21px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.25}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.2rem;flex:1}
.top .back{background:none;border:0;font-size:1.5rem;padding:4px 10px 4px 0;line-height:1}
.sub{color:var(--muted);font-size:.9rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:2.2rem;font-weight:700;margin:2px 0 6px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.kv li:first-child{border-top:0}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:1rem;font-weight:600;text-align:center;margin:0 0 10px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.xl{padding:18px 16px;font-size:1.15rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.inline{display:inline-block;width:auto;padding:10px 14px;margin:0 8px 8px 0}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:0}
.link{background:none;border:0;color:var(--sig);padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.pill{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:middle}
.hint{border-left:3px solid var(--accent);padding:8px 12px;background:var(--bg2);border-radius:6px;margin:0 0 14px;font-size:.92rem}
/* testo catalogo */
.txt .line{display:block;margin:0 0 .45em}
.txt .line:last-child{margin-bottom:0}
.bb{color:var(--bb);font-weight:700;white-space:nowrap}
.sig{background:none;border:0;padding:0 1px;margin:0;color:var(--sig);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px;font-size:inherit;line-height:inherit}
/* accordion */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;font-weight:700;font-size:1.05rem}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc>summary .grow{flex:1}
.accbody{padding:0 12px 12px}
.prio{border-top:1px solid var(--line);padding:12px 4px 4px}
.prio h3{font-size:1rem;display:flex;gap:10px;align-items:baseline}
.pn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.85rem;font-weight:800}
.why{margin:4px 0 8px;color:var(--muted);font-size:.9rem}
.fam{border:1px dashed var(--line);border-radius:10px;padding:6px 8px;margin:8px 0}
.famh{font-size:.82rem;color:var(--muted);font-weight:600;padding:2px 2px 4px}
.frow{display:flex;align-items:stretch;gap:6px;border-radius:10px}
.frow+.frow{border-top:1px solid var(--line)}
.chk{display:grid;place-items:center;padding:0 6px}
.chk input{width:26px;height:26px;accent-color:var(--accent)}
.fbody{flex:1;text-align:left;background:none;border:0;padding:10px 4px}
.bat{color:var(--bb);margin-right:6px}
.todo{border-top:1px solid var(--line);padding:12px 4px}
details.sub2{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--bg2)}
details.sub2>summary{padding:10px 12px;font-weight:600;cursor:pointer}
details.sub2>div{padding:0 12px 12px}
/* sticky bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:760px;margin:0 auto}
.bar .btn{margin:0}
.row{display:flex;gap:10px}
.row>*{flex:1}
/* compose */
.circ{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px}
.circh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.circh h3{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.slot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.slot .lab{font-weight:800;min-width:2.4em;color:var(--accent)}
.slot .nm{flex:1;min-width:0}
.slot .nm .t{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-width:38px;height:38px;font-size:1rem}
select.sel{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
/* run */
.runh{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.runh .l1{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem}
.runh .l1 .grow{flex:1}
.runh .l2{font-size:.85rem;color:var(--muted);margin-top:2px}
.runh .l3{font-size:1rem;margin-top:1px}
.pos{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.75rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.chip.done{background:var(--bg2);color:var(--text)}
.chip.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.drop{text-decoration:line-through;opacity:.5}
.dots{display:inline-flex;gap:5px;margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--muted)}
.dot.cur{background:var(--accent);border-color:var(--accent)}
.timers{display:flex;align-items:center;gap:14px;margin-top:6px;font-variant-numeric:tabular-nums;font-size:.95rem}
.timers b{font-size:1.05rem}
.timers .paused{color:var(--bad)}
.repnum{font-size:3.4rem;font-weight:800;line-height:1;margin:14px 0 4px;color:var(--accent)}
.repnum small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:8px}
.instr{font-size:1.5rem;line-height:1.45;font-weight:500;margin:6px 0 16px}
.instr .vlabel{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.diag{font-size:.95rem;color:var(--muted);margin:0 0 6px}
.toggles{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.tg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg2);font-weight:600}
.tg input{width:22px;height:22px;accent-color:var(--accent)}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem}
textarea{min-height:80px;resize:vertical}
.fatto{font-size:1.6rem;padding:20px;border-radius:16px}
.sec{display:flex;gap:10px;margin-bottom:10px}
.sec .btn{margin:0;padding:10px;font-size:.95rem}
/* sheet & panel */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg2);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet{visibility:hidden;transition:transform .22s,visibility 0s .22s}
.sheet.on{transform:none;visibility:visible;transition:transform .22s}
.sheet .inner{max-width:760px;margin:0 auto}
.sheet h2{font-size:1.25rem;margin-bottom:12px}
.yn{display:flex;gap:10px;margin:8px 0 14px}
.yn button{flex:1;padding:18px;font-size:1.2rem;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.yn button.on.si{border-color:var(--ok);background:var(--ok);color:#fff}
.yn button.on.no{border-color:var(--bad);background:var(--bad);color:#fff}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:22;width:min(92vw,440px);background:var(--bg2);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 18px 24px}
.panel{visibility:hidden;transition:transform .22s,visibility 0s .22s}
.panel.on{transform:none;visibility:visible;transition:transform .22s}
.panel .sg{font-size:2rem;font-weight:800;color:var(--sig)}
.panel h3{font-size:1.2rem;margin:2px 0 14px}
.panel .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:14px}
.panel p{margin:4px 0;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:.78rem}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.sub td{font-weight:700;background:var(--bg2)}
.tablewrap{overflow-x:auto}
.logi{border-top:1px solid var(--line);padding:8px 0;font-size:.9rem}
.logi b{color:var(--accent)}
.dayrow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.dayrow .d{display:flex;justify-content:space-between;font-weight:700}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .pt{fill:var(--accent)}
.chart .ax{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px}
.field{margin:0 0 12px}
.field label{display:block;font-weight:600;margin-bottom:4px;font-size:.92rem}
.sigcard{border-top:1px solid var(--line);padding:12px 0}
.sigcard .sg{font-weight:800;color:var(--sig);font-size:1.1rem}
.sigcard dl{margin:6px 0 0}
.sigcard dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.sigcard dd{margin:0}
ol.fable{padding-left:1.2em}
ol.fable li{margin:0 0 8px}
/* lista statistiche (al posto della tabella) */
.st{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.st .m{flex:1;min-width:0}
.st .v{font-weight:700;white-space:nowrap;text-align:right}
.st .d{font-size:.85rem;color:var(--muted);margin-top:2px}
.sth{display:flex;justify-content:space-between;font-weight:700;padding:10px 0 4px;margin-top:6px;border-top:2px solid var(--line)}
.sth:first-child{border-top:0;margin-top:0}
.stt{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;padding:12px 0 0;border-top:2px solid var(--line)}
/* scelta tipo sessione */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.choice button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px 12px;text-align:left}
.choice button b{display:block;font-size:1.1rem}
.choice button span{font-size:.85rem;color:var(--muted)}
.choice button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}
.blist label{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);font-weight:600}
.blist label:first-child{border-top:0}
.blist input{width:24px;height:24px;accent-color:var(--accent)}
/* sessione libera */
.cur-b{font-size:1.7rem;font-weight:800;line-height:1.2;margin:18px 0 4px}
.bigclock{font-size:3.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.bgrid{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0}
.bgrid button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px;text-align:left;font-size:1.05rem;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.bgrid button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.bgrid button small{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.lslot{border-top:1px solid var(--line);padding:10px 0}
.lslot .row{align-items:center}
.kv li b,.sth span:last-child,.st .v{white-space:nowrap;flex:0 0 auto}
.kv li span{min-width:0}

/* ===================== versione 2 ===================== */
:root{--accent-soft:color-mix(in srgb,var(--accent) 14%,var(--card))}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.two{text-align:left;padding:12px 16px}
.btn.two b{display:block}
.btn.two span{display:block;font-size:.85rem;font-weight:500;color:var(--muted);margin-top:2px}
.link.plain{padding:0;text-align:left;text-decoration:none;color:inherit}
.lead{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.lead .link{padding:0}
.recap{margin:0 0 6px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px dashed var(--line);font-size:.95rem}
.asktext{font-size:1.05rem;margin:0 0 16px}
.cardh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin:0 0 14px}
.empty b{display:block;font-size:1.05rem;margin-bottom:4px}
.empty span{color:var(--muted);font-size:.92rem}
.fmeta{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.bignum{font-size:1.8rem !important;text-align:center;font-weight:700}
.stepb{flex:0 0 56px !important;height:56px;font-size:1.4rem}
/* barra delle schede */
.wrap.tabbed{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.tabwrap{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:min(.72rem,13px);font-weight:600;line-height:1.15;min-height:56px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on span{font-weight:800}
.resume{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin:0 auto;background:var(--accent-soft);border:0;border-bottom:1px solid var(--line);padding:10px 16px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.resume .grow{flex:1;min-width:0}
.resume .rgo{color:var(--accent);white-space:nowrap}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.rdot.off{background:var(--bad)}
/* passi della nuova sessione */
.steps{list-style:none;display:flex;gap:6px;margin:0 0 16px;padding:0;font-size:.85rem;font-weight:600;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding-bottom:8px;border-bottom:3px solid var(--line)}
.steps li span{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;border:2px solid currentColor;font-size:.8rem}
.steps li.cur{color:var(--text);border-color:var(--accent)}
.steps li.cur span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
.barnote{margin:0 0 8px;font-size:.88rem;color:var(--muted);text-align:center}
.seg.wide{display:flex;margin:0 0 14px}
.seg.wide button{flex:1;padding:11px 8px}
.seg.small button{padding:6px 9px;font-size:.82rem}
/* home */
.card.now{border-color:var(--accent);background:var(--accent-soft)}
.nowpos{margin:4px 0 2px;font-weight:700;font-size:1.05rem}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.barcol{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.barv{font-size:.72rem;color:var(--muted);height:1.1em;font-variant-numeric:tabular-nums}
.bartrack{width:100%;height:64px;background:var(--bg2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.barfill{display:block;width:100%;background:var(--muted);border-radius:6px 6px 0 0}
.bard{font-size:.75rem;color:var(--muted);text-transform:capitalize}
.barcol.today .barfill{background:var(--accent)}
.barcol.today .bard{color:var(--text);font-weight:800}
.wbar{height:6px;background:var(--bg2);border-radius:3px;margin-top:3px}
.wbar div{height:6px;background:var(--accent);border-radius:3px}
/* esecuzione */
.runh.paused{border-bottom-color:var(--bad)}
.pausebtn{margin-left:auto;padding:0 12px}
.runh.paused .pausebtn{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.runh.paused .timers b{color:var(--bad)}
.pausebar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:12px 0 0;padding:12px 14px;border-radius:12px;border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg));text-align:left}
.pausebar b{color:var(--bad);font-size:1.05rem}
.pausebar span{font-size:.9rem}
.prog{height:4px;background:var(--bg2);border-radius:2px;margin-top:8px;overflow:hidden}
.prog span{display:block;height:4px;background:var(--accent);border-radius:2px}
.timers{flex-wrap:wrap;row-gap:4px}
.fatto small{display:block;font-size:.82rem;font-weight:600;opacity:.8;margin-top:2px;line-height:1.25}
.fatto{padding:14px 16px}
.tg small{display:block;font-size:.78rem;font-weight:500;color:var(--muted)}
.tgt{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:2px 0 8px;font-size:.92rem;color:var(--muted)}
.tgt b{color:var(--text);font-size:1.05rem;font-variant-numeric:tabular-nums}
.chart .tg{stroke:var(--sig);stroke-dasharray:4 4;stroke-width:1.5}
.chart text.tglab{fill:var(--sig)}
/* impostazioni */
.brow{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left;font-weight:600}
.brow .grow{flex:1;min-width:0}
.brow .tag{margin-left:0}
.news{padding-left:1.1em;margin:0 0 16px}
.news li{margin:0 0 10px}
.stat3>div{min-width:0}
.statv{font-size:1.25rem;font-weight:700}
.hint .link{padding:2px 0}
@media (prefers-reduced-motion:reduce){.sheet,.panel,.ov,.toast{transition:none !important}}

.toast{bottom:auto;top:calc(64px + env(safe-area-inset-top));box-shadow:var(--shadow)}
.progrow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.progrow .prog{flex:1;margin-top:0}
.dayrow .d{gap:10px}
.dayrow .d>span:last-child{white-space:nowrap;flex:0 0 auto}
.dayrow .d>span:first-child{min-width:0}
/* l'impostazione «Dimensione del testo» ingrandisce i contenuti; le parti fisse (intestazioni, barre) crescono poco,
   così su schermi piccoli resta spazio per l'istruzione della Rep */
.bartrack{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.optrow{flex-wrap:wrap}
.optrow>span{flex:1 1 7em;min-width:0}
.optrow .seg{flex:0 0 auto}
.steps{font-size:min(.85rem,14.5px)}
.runh .l1{font-size:min(1rem,18px)}
.runh .l2{font-size:min(.85rem,15px)}
.runh .l3{font-size:min(1rem,18px)}
.timers{font-size:min(.95rem,17px)}
.timers b{font-size:min(1.05rem,19px)}
.sec .btn{font-size:min(.95rem,17px)}
.fatto{font-size:min(1.6rem,28px)}
.fatto small{font-size:min(.82rem,15px)}
.seg.small button{font-size:min(.82rem,14px);white-space:nowrap}
.cardh{flex-wrap:wrap}
.resume{font-size:min(1rem,17px)}
@media (max-height:700px){.repnum{font-size:2.6rem;margin-top:10px}}
.pausebtn{font-size:min(1rem,16px)}

</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="ov"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
<aside id="panel" class="panel" role="dialog" aria-label="Sigla"></aside>
<div id="toast" class="toast" role="status"></div>
<script>
const CATALOGO = {"versione": 2, "fonte": "Analisi di Fable, «Op. 111, I movimento — lavoro motorio per passaggio» (10/11/2026), Henle", "brani": [{"id": "op111", "nome": "Beethoven, Sonata op. 111, I movimento", "completo": true}, {"id": "mephisto", "nome": "Liszt, Mephisto Valzer n. 1", "completo": false}, {"id": "scriabin28", "nome": "Scriabin, Fantasia op. 28", "completo": false}], "sigle": [{"sigla": "RIT", "nome": "Ritmi", "come_si_fa": "Ritmi puntati. Su coppie: lungo-corto, poi corto-lungo. Su gruppi di 4: fermata sulla 1ª nota e le altre tre di scatto; poi fermata sulla 2ª, 3ª, 4ª. Nota corta scattante e vicina al tasto.", "cosa_allena": "Ogni transizione tra dita a velocità superiore al tempo finale, una alla volta.", "origine": "Tuo"}, {"sigla": "CHUNK", "nome": "Blocchi a tempo", "come_si_fa": "Un quarto più la prima nota del successivo, a tempo pieno, poi stop. Durante lo stop la mano è già a contatto dei tasti del chunk seguente, polso e spalla rilasciati. Poi chunk sfalsati (da 3ª semicroma a 3ª), poi due quarti più una nota. Unico vincolo a metronomo pieno; ogni chunk seguito da una pausa lunga quanto il chunk.", "cosa_allena": "Il gesto alla velocità reale e la preparazione anticipata della posizione.", "origine": "Tuo (arresto con preparazione aggiunto)"}, {"sigla": "ACC", "nome": "Accenti spostati", "come_si_fa": "Accento sulla 2ª semicroma di ogni gruppo, poi sulla 3ª, poi sulla 4ª. Tutto il resto pp. Variante: raggruppa in 3 una figura scritta in 4.", "cosa_allena": "Uniformità: ogni dito sa essere forte e debole. Smaschera il dito che cade o che manca.", "origine": "Aggiunto"}, {"sigla": "BLOC", "nome": "Posizioni a blocco", "come_si_fa": "Tutte le note di una posizione di mano suonate insieme, a tempo di quarti, cambiando posizione senza guardare.", "cosa_allena": "Topografia, ampiezza esatta dello spostamento, precisione tattile.", "origine": "Aggiunto"}, {"sigla": "MUTA", "nome": "Mano fantasma", "come_si_fa": "Una mano suona, l'altra fa gli stessi movimenti sulla superficie dei tasti senza abbassarli. Poi si scambia.", "cosa_allena": "Coordinazione: mostra quale mano trascina l'altra e toglie forza inutile alla mano muta.", "origine": "Aggiunto"}, {"sigla": "DIN", "nome": "Dinamiche divise", "come_si_fa": "Una mano f e l'altra pp, di norma sinistra f. Variante: una legato e l'altra staccato.", "cosa_allena": "Indipendenza e ascolto della mano debole.", "origine": "Tuo"}, {"sigla": "ALT", "nome": "Alternanza", "come_si_fa": "Negli unisoni le mani si alternano un quarto a testa, poi mezzo quarto, senza perdere la pulsazione. La mano che tace segue a contatto dei tasti.", "cosa_allena": "Ogni mano sa entrare a tempo a metà passaggio.", "origine": "Aggiunto"}, {"sigla": "NODO", "nome": "Arresto sui nodi", "come_si_fa": "Fermati, tenendo i tasti, sulle note in cui una mano passa il pollice o cambia posizione e l'altra no. Verifica che i due tasti scendano insieme, poi suona da nodo a nodo.", "cosa_allena": "Sincronia dove le diteggiature delle due mani non sono speculari.", "origine": "Aggiunto"}, {"sigla": "STAC", "nome": "Staccato di dito pp", "come_si_fa": "Ogni nota corta partendo dal tasto, il dito tira verso il palmo, il braccio scorre di lato. Nessun sollevamento alto.", "cosa_allena": "Chiarezza dell'attacco e rilascio attivo di ogni dito.", "origine": "Tuo, precisato"}, {"sigla": "DOPPIE", "nome": "Note doppie", "come_si_fa": "Ogni nota suonata due volte, a pulsazione dimezzata.", "cosa_allena": "Ritorno del tasto e precisione del punto di contatto.", "origine": "Tuo"}, {"sigla": "CIECO", "nome": "Senza guardare", "come_si_fa": "Occhi chiusi o sguardo fuori dalla tastiera. Nei salti, shift–touch–play: sposta rapido, atterra sui tasti senza suonare, controlla al tatto, poi suona.", "cosa_allena": "Mappa propriocettiva delle distanze.", "origine": "Tuo (shift–touch–play aggiunto)"}, {"sigla": "ROT", "nome": "Rotazione isolata", "come_si_fa": "Prima solo forearm rotation (rotazione dell'avambraccio) con dita ferme; poi solo dita con avambraccio fermo; poi la miscela minima che funziona.", "cosa_allena": "Scegliere il motore giusto in tremoli e figure spezzate.", "origine": "Aggiunto"}, {"sigla": "CLIC", "nome": "Clic spostato", "come_si_fa": "Metronomo sul levare (ottavo debole o 2ª semicroma), oppure un solo clic per battuta.", "cosa_allena": "Regolarità senza appoggio esterno sui tempi forti.", "origine": "Aggiunto"}, {"sigla": "MENT", "nome": "Ripetizione mentale", "come_si_fa": "A tempo, con sensazione tattile dei tasti e suono immaginati, mani ferme. Subito dopo, la ripetizione reale.", "cosa_allena": "Programmazione del gesto, memoria dei salti.", "origine": "Tuo (in valutazione)"}, {"sigla": "PESO", "nome": "Caduta e rilascio", "come_si_fa": "Drop–release: accordo o ottava dal tasto con impulso del braccio, poi rilascio immediato della pressione a fondo tasto. Test: mentre tieni l'accordo, il polso deve potersi muovere su e giù. Nei gruppi di ottave: un impulso per gruppo, le altre di rimbalzo.", "cosa_allena": "Suono pieno senza tensione mantenuta.", "origine": "Aggiunto"}, {"sigla": "TRILL", "nome": "Trillo misurato", "come_si_fa": "Numero fisso di note per quarto (4, poi 6, poi 8), inizio dalla nota reale, dita vicine al tasto. Se la stessa mano tiene un'altra voce, prima tieni quella voce e trilla pp.", "cosa_allena": "Trillo che non disturba l'altra voce né l'altra mano.", "origine": "Aggiunto"}], "regole_slot": {"rep1": "Test a freddo all'85-95% + una riga di diagnosi (dove si è sporcato e come).", "rep2_3": "Pulsazione al 70-80%, sempre senza pedale e a mp anche dove è scritto ff. Attenzione sul vincolo. Se Rep 1 ha individuato un quarto preciso, lavora solo da mezza battuta prima a mezza battuta dopo.", "rep4": "85-100%, pedale e dinamiche reali, verso il tempo target. Attenzione al suono, non alle dita.", "andate": "Andata 3 = andata 1, andata 4 = andata 2, salvo frammenti con andate 3-4 proprie. Andata 4 solo se non in drop-out.", "drop_out": "Se alla terza andata Rep 1 è pulita e fluida, il frammento non fa la quarta.", "arresto": "Due errori nello stesso punto con lo stesso vincolo: scendi di 8-10 clic o accorcia il frammento.", "da_annotare": "Tempo di Rep 4 e se Rep 1 era pulita. Una volta a settimana registra Rep 4 e riascoltala a metà velocità.", "verifica_2_settimane": "Se dopo due settimane il tempo di Rep 4 non sale, torna a Rep 2-3 al 70-80% uniforme."}, "regole_circuito": {"struttura": "3-5 slot per circuito, 3-4 andate.", "nota": "Solo consultazione: il programma non dà avvisi in composizione.", "fable_composizione": ["Un solo passaggio per priorità in ogni circuito: due passaggi dello stesso gruppo di seguito si disturbano a vicenda e caricano gli stessi muscoli.", "Frammenti della stessa famiglia (es. 24-28 e 108-113, 58-68 e 135-145) in circuiti diversi finché uno non è in drop-out; 58-68 e 135-145, dopo il drop-out, apposta uno dopo l'altro.", "Un solo frammento di priorità 6 per circuito, con Rep 2-3 a mp e il ff solo in Rep 4.", "Al massimo due slot con trilli 3-5 per blocco."]}, "frammenti": [{"id": "op111-1-3-5-attacchi", "brano": "op111", "battute": "1, 3, 5", "titolo": "Attacchi (biscroma e accordo sf)", "priorita": 6, "famiglia": null, "nodo_motorio": "Nota corta e accordo lungo in un solo gesto del braccio; salto in ottave della sinistra.", "andate": {"1": {"rep2": "CIECO shift–touch–play: suona la biscroma, sposta di scatto, atterra muto sull'accordo, controlla al tatto, suona.", "rep3": "PESO sugli accordi d'arrivo; durante la legatura muovi il polso su e giù."}, "2": {"rep2": "CIECO shift–touch–play, come in andata 1.", "rep3": "MENT."}}, "rep4_verifica": "Tutte le note dell'accordo scendono insieme; nessuna tensione tenuta sulla nota lunga."}, {"id": "op111-1-3-5-trilli", "brano": "op111", "battute": "1, 3, 5", "titolo": "Trilli con chiusa", "priorita": 6, "famiglia": null, "nodo_motorio": "Trillo breve con altre dita impegnate a tenere; chiusa a tempo.", "andate": {"1": {"rep2": "TRILL a 4 e poi a 6 note, partendo dalla nota reale.", "rep3": "RIT: fermata sull'ultima nota del trillo, poi chiusa e arrivo di scatto."}, "2": {"rep2": "TRILL, come in andata 1.", "rep3": "RIT con ritmo opposto."}}, "rep4_verifica": "Stesso numero di note ogni volta; sf solo sull'attacco.", "note": "Partenza del trillo dalla nota reale: Bülow, Cotta nota c p. 118."}, {"id": "op111-2-4", "brano": "op111", "battute": "2, 4", "titolo": "Arpeggi passati da sinistra a destra", "priorita": 6, "famiglia": null, "nodo_motorio": "Consegna tra le mani senza buco né accento.", "andate": {"1": {"rep2": "BLOC: la porzione della sinistra come accordo, quella della destra come accordo, poi l'accordo d'arrivo, a tempo.", "rep3": "CHUNK con stop sulla prima nota della destra; poi quella nota volutamente pp."}, "2": {"rep2": "BLOC, come in andata 1.", "rep3": "CHUNK sfalsati di una nota."}}, "rep4_verifica": "Il punto di consegna non si sente; l'accordo f arriva senza ritardo."}, {"id": "op111-6-10", "brano": "op111", "battute": "6-10", "titolo": "Accordi doppio puntati", "priorita": 7, "famiglia": null, "nodo_motorio": "Accordi di 3-4 note insieme a pp; biscroma ribattuta con movimento minimo.", "andate": {"1": {"rep2": "Ribatti la biscroma da metà corsa del tasto (doppio scappamento del coda), senza staccare le dita.", "rep3": "DIN dentro la mano: voce superiore suonata, resto dell'accordo muto; poi il contrario."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Nessun accordo arpeggiato, nessuna nota che non parla."}, {"id": "op111-11-15", "brano": "op111", "battute": "11-15", "titolo": "Crome ribattute con sfp, accordi legati", "priorita": 7, "famiglia": null, "nodo_motorio": "Sinistra: ribattute uguali con un'altra voce nella stessa mano. Destra: legato di doppie note con sostituzione di dita.", "andate": {"1": {"rep2": "Sinistra sola: voce ribattuta pp con l'altra voce tenuta; sfp come attacco e scarico immediato del peso.", "rep3": "Destra sola, CIECO: sostituzioni contate, il cambio di dito cade sul levare."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Ribattute senza rimbalzo del braccio; legato vero senza pedale."}, {"id": "op111-16-19", "brano": "op111", "battute": "16-19", "titolo": "Tremolo della sinistra e ingresso della destra con terzina d'anacrusi", "priorita": 4, "famiglia": null, "parti": ["16-18", "18-19"], "nodo_motorio": "bb. 16-18: Trillo misurato lungo nel grave, crescendo senza irrigidire.\nbb. 18-19: Tre note rapide a mani unite partendo da fermo, arrivo sul do.", "andate": {"1": {"rep2": "bb. 16-18: ROT: due quarti di sola rotazione, due di sole dita, alternati.\nbb. 18-19: Tocca i tre tasti in silenzio con entrambe le mani, poi suonali come un unico impulso che finisce sul do con caduta del braccio.", "rep3": "bb. 16-18: ACC ogni 4 note, poi ogni 3.\nbb. 18-19: MUTA a mani scambiate; poi RIT con fermata sulla 1ª e sulla 2ª nota."}, "2": {"rep2": "bb. 16-18: ROT, come in andata 1.\nbb. 18-19: Come in andata 1.", "rep3": "bb. 16-18: CLIC sul levare.\nbb. 18-19: MUTA con l'altra mano in evidenza; RIT con ritmo opposto."}}, "rep4_verifica": "bb. 16-18: Numero di note esatto (b. 16: otto per quarto). Il crescendo viene dall'ampiezza della rotazione, non dalla pressione.\nbb. 18-19: Tre note distinte, mani esattamente insieme."}, {"id": "op111-20-23", "brano": "op111", "battute": "20-23", "titolo": "Do–mi♭–si♮ con corona; crome non legato e gruppetto", "priorita": 5, "famiglia": null, "parti": ["20-21", "22-23"], "nodo_motorio": "bb. 20-21: Note staccate di braccio a mani unite; cambio di dito sulla corona.\nbb. 22-23: Staccato di dito a mani unite; nel gruppetto la destra usa 3-5-3 contro dita forti della sinistra.", "andate": {"1": {"rep2": "bb. 20-21: DIN: sinistra f, destra pp.\nbb. 22-23: STAC pp su tutto.", "rep3": "bb. 20-21: PESO: ogni nota dal tasto, rilascio immediato.\nbb. 22-23: RIT sul solo gruppetto: fermata sulla 1ª, poi sulla 3ª nota."}, "2": {"rep2": "bb. 20-21: DIN invertito: destra f, sinistra pp.\nbb. 22-23: STAC, come in andata 1.", "rep3": "bb. 20-21: PESO, come in andata 1.\nbb. 22-23: RIT con ritmo opposto."}}, "rep4_verifica": "bb. 20-21: Mani insieme su ogni nota, senza acciaccatura tra le due.\nbb. 22-23: Le quattro semicrome uguali; la destra non arriva in ritardo sul 5."}, {"id": "op111-24-28", "brano": "op111", "battute": "24-28", "titolo": "Tema all'unisono, semicrome parallele (zona rossa)", "priorita": 1, "famiglia": "fam-semicrome-parallele", "nodo_motorio": "Tre compiti: cellule a gruppetto con diteggiature non speculari, posizioni per quarto con salto, discesa di tre ottave.", "andate": {"1": {"rep2": "BLOC su 26-27: ogni quarto come accordo a mani unite, la seconda volta CIECO. Poi NODO su 24-25 e su 28.", "rep3": "MUTA: la sinistra suona, la destra fa da fantasma, tutto il passaggio."}, "2": {"rep2": "RIT con fermata sulla 1ª nota di ogni quarto: le tre seguenti e l'arrivo di scatto.", "rep3": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, con DIN (sinistra f, destra p).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota. La b. 28 a ritroso: ultimo quarto, ultimi due, ultimi tre."}, "4": {"rep2": "ALT: un quarto a testa, a tempo.", "rep3": "CLIC sul levare, tutto il passaggio di fila."}}, "rep4_verifica": "La sinistra si sente distinta sotto la destra su ogni semicroma. In 26-27 la quarta semicroma di ogni quarto ha la sua durata piena. Lo sf è un impulso del braccio sulla prima nota e non la allunga.", "note": "Analisi: da 24 a metà 26 cellule a gruppetto in discesa, destra 3-4-5 e sinistra 1-2-3, passaggi del pollice su semicrome diverse (effetto tipico: destra opaca, pollice sinistro che batte, mani sfasate). Da metà 26 a 27 una posizione per quarto con sf (effetto tipico: quarta semicroma accorciata, sf in ritardo o picchiato). 28: discesa di tre ottave, pollici non coincidenti. Come muoversi: l'avambraccio trasporta la mano con moto continuo; chiarezza = rilascio puntuale di ogni tasto; pollice leggero; busto inclinato dalle anche, non i polsi. A matita sopra b. 24: «segui sinistra»."}, {"id": "op111-108-110", "brano": "op111", "battute": "108-110", "titolo": "Semicrome parallele nell'acuto (seconda zona rossa)", "priorita": 1, "famiglia": "fam-semicrome-parallele", "nodo_motorio": "Come 24-25: diteggiature non speculari, mani a seste o decime.", "andate": {"1": {"rep2": "MUTA: sinistra suona, destra fantasma (senza BLOC).", "rep3": "MUTA nell'altra direzione."}, "2": {"rep2": "RIT con fermata sulla 1ª nota di ogni quarto: le tre seguenti e l'arrivo di scatto.", "rep3": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, con DIN (sinistra f, destra p).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota."}, "4": {"rep2": "ALT: un quarto a testa, a tempo.", "rep3": "CLIC sul levare, tutto il passaggio di fila."}}, "rep4_verifica": "Come 24-28 (prima verifica): la sinistra si sente distinta sotto la destra su ogni semicroma. [Il documento non dà verifiche proprie.]", "note": "Stesso compito di 24-25, con mani a seste o decime (sincronia meno controllabile all'orecchio) e sinistra oltre la linea mediana. Posizione: busto inclinato a destra, gomito sinistro avanti e lontano dal fianco, polso sinistro in linea con l'avambraccio. Bülow (Cotta nota a p. 125): a 113-114 la destra può prendere il do della sinistra, solo se la sinistra arriva in ritardo sul tremolo."}, {"id": "op111-111-113", "brano": "op111", "battute": "111-113", "titolo": "Semicrome parallele nell'acuto (seconda zona rossa)", "priorita": 1, "famiglia": "fam-semicrome-parallele", "nodo_motorio": "Come 24-25: diteggiature non speculari, mani a seste o decime.", "andate": {"1": {"rep2": "MUTA: sinistra suona, destra fantasma (senza BLOC).", "rep3": "MUTA nell'altra direzione."}, "2": {"rep2": "RIT con fermata sulla 1ª nota di ogni quarto: le tre seguenti e l'arrivo di scatto.", "rep3": "RIT con fermata sulla 3ª nota: lo scatto attraversa il cambio di posizione."}, "3": {"rep2": "ACC sulla 2ª e sulla 4ª semicroma, con DIN (sinistra f, destra p).", "rep3": "CHUNK a tempo pieno: un quarto più una nota, poi mezza battuta più una nota."}, "4": {"rep2": "ALT: un quarto a testa, a tempo.", "rep3": "CLIC sul levare, tutto il passaggio di fila."}}, "rep4_verifica": "Come 24-28 (prima verifica): la sinistra si sente distinta sotto la destra su ogni semicroma. [Il documento non dà verifiche proprie.]", "note": "Stesso compito di 24-25, con mani a seste o decime (sincronia meno controllabile all'orecchio) e sinistra oltre la linea mediana. Posizione: busto inclinato a destra, gomito sinistro avanti e lontano dal fianco, polso sinistro in linea con l'avambraccio. Bülow (Cotta nota a p. 125): a 113-114 la destra può prendere il do della sinistra, solo se la sinistra arriva in ritardo sul tremolo."}, {"id": "op111-29-31", "brano": "op111", "battute": "29-31", "titolo": "Tema con bicordi ribattuti interni", "priorita": 7, "famiglia": null, "nodo_motorio": "Destra a due strati: voce superiore con 5-4, bicordi ribattuti con le dita basse.", "andate": {"1": {"rep2": "DIN dentro la mano: voce superiore suonata e bicordi muti; poi il contrario.", "rep3": "Bicordi pp da metà corsa del tasto, voce superiore f. Sul gruppetto: RIT."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1, RIT del gruppetto con ritmo opposto."}}, "rep4_verifica": "Ribattuti uguali e sotto la voce; gruppetto regolare."}, {"id": "op111-32-33", "brano": "op111", "battute": "32-33", "titolo": "Semicrome spezzate con voce superiore, ottave della sinistra", "priorita": 7, "famiglia": null, "nodo_motorio": "Rotazione tra dito della melodia e pollice; ottave per grado in crome.", "andate": {"1": {"rep2": "ROT sulla destra, pollice pp.", "rep3": "BLOC: le due note di ogni croma insieme, voce superiore legata. Sinistra: PESO, un impulso ogni quattro ottave."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Ogni ottava della sinistra coincide con la nota superiore della destra; pollice destro quasi inudibile."}, {"id": "op111-34-35", "brano": "op111", "battute": "34-35", "titolo": "Poco ritenente e trillo con 3-5", "priorita": 7, "famiglia": null, "nodo_motorio": "Trillo con voce inferiore nella stessa mano; attacco delle semicrome della sinistra.", "andate": {"1": {"rep2": "TRILL a 4 e poi a 6 note, voce inferiore tenuta.", "rep3": "Sinistra sola da b. 35: STAC pp."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Il trillo non blocca il polso; la sinistra parte a tempo.", "trillo_3_5": true}, {"id": "op111-35-39", "brano": "op111", "battute": "35-39", "titolo": "Semicrome della destra contro ottave della sinistra", "priorita": 2, "famiglia": "fam-destra-contro-ottave", "nodo_motorio": "Rapporto 2:1; dita deboli della destra nei gruppetti 3-5-3. L'impulso dell'ottava non deve passare alla mano che corre.", "andate": {"1": {"rep2": "Destra suona, sinistra MUTA: le ottave toccate in silenzio, nel posto giusto.", "rep3": "RIT nella sola destra, sinistra regolare."}, "2": {"rep2": "MUTA scambiata: sinistra suona, destra fantasma.", "rep3": "CHUNK, un quarto più una nota."}}, "rep4_verifica": "Ogni ottava cade con la 1ª e la 3ª semicroma; nessun accento della destra sotto le ottave."}, {"id": "op111-106-107", "brano": "op111", "battute": "106-107", "titolo": "Semicrome della destra contro ottave della sinistra", "priorita": 2, "famiglia": "fam-destra-contro-ottave", "nodo_motorio": "Rapporto 2:1; dita deboli della destra nei gruppetti 3-5-3. L'impulso dell'ottava non deve passare alla mano che corre.", "andate": {"1": {"rep2": "Destra suona, sinistra MUTA: le ottave toccate in silenzio, nel posto giusto.", "rep3": "RIT nella sola destra, sinistra regolare."}, "2": {"rep2": "MUTA scambiata: sinistra suona, destra fantasma.", "rep3": "CHUNK, un quarto più una nota."}}, "rep4_verifica": "Ogni ottava cade con la 1ª e la 3ª semicroma; nessun accento della destra sotto le ottave."}, {"id": "op111-40-43", "brano": "op111", "battute": "40-43", "titolo": "Semicrome della sinistra sotto ottave legate della destra", "priorita": 2, "famiglia": "fam-sinistra-sotto-ottave", "nodo_motorio": "Uniformità della sinistra, con il pollice su molti tempi forti; ottave legate della destra. A b. 43 semicrome in entrambe le mani.", "andate": {"1": {"rep2": "Sinistra STAC pp, destra normale.", "rep3": "ACC nella sinistra su 2ª e 4ª semicroma, pollice pp."}, "2": {"rep2": "Come in andata 1.", "rep3": "DOPPIE, sinistra sola."}}, "rep4_verifica": "Ogni semicroma della sinistra si sente sotto le ottave; il legato delle ottave viene dalle dita, spalla bassa.", "note": "A b. 40, 3-4 a matita sulle ottave della destra: scelta giusta con la tua apertura; vale anche per 101-103."}, {"id": "op111-100-103", "brano": "op111", "battute": "100-103", "titolo": "Semicrome della destra, poi ottave della destra su semicrome della sinistra", "priorita": 2, "famiglia": "fam-sinistra-sotto-ottave", "nodo_motorio": "Come 40-43: uniformità della sinistra sotto le ottave.", "andate": {"1": {"rep2": "b. 100: RIT nella destra. 101-103: sinistra STAC pp, destra normale.", "rep3": "ACC nella sinistra su 2ª e 4ª semicroma."}, "2": {"rep2": "b. 100: RIT con ritmo opposto. 101-103: come in andata 1.", "rep3": "DOPPIE, sinistra sola."}}, "rep4_verifica": "Ogni semicroma della sinistra si sente sotto le ottave."}, {"id": "op111-44-47", "brano": "op111", "battute": "44-47", "titolo": "Come 36-38, in la♭, registro acuto", "priorita": 2, "famiglia": null, "nodo_motorio": "Stesso compito di 35-39 con il busto inclinato a destra e il gomito destro che guida.", "andate": {"1": {"rep2": "CHUNK a tempo, un quarto più una nota, mani unite.", "rep3": "CLIC sul levare."}, "2": {"rep2": "CHUNK sfalsati di una nota.", "rep3": "CLIC sul levare."}}, "rep4_verifica": "Come 35-39; sf solo sulla prima nota del gruppo."}, {"id": "op111-48-49", "brano": "op111", "battute": "48-49", "titolo": "Salti incrociati sopra il tremolo", "priorita": 6, "famiglia": "fam-salti-sul-tremolo", "nodo_motorio": "Salto di più ottave in una minima, atterraggio sf con un dito solo; il tremolo non si interrompe.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play. Lo sguardo va sul tasto d'arrivo prima che la mano parta.", "rep3": "ROT sul tremolo, polso sinistro basso per lasciar passare la destra. Poi insieme: la destra arriva in anticipo e aspetta sul tasto."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Lo sf parte dal tasto, non dall'aria; otto semicrome di tremolo per minima, senza buchi.", "note": "Per gli sf puoi provare il 3 sostenuto dal pollice appoggiato dietro (opzione di Fable; la Henle indica 2 e 3)."}, {"id": "op111-114-115", "brano": "op111", "battute": "114-115", "titolo": "Salti incrociati sopra il tremolo", "priorita": 6, "famiglia": "fam-salti-sul-tremolo", "nodo_motorio": "Salto di più ottave in una minima, atterraggio sf con un dito solo; il tremolo non si interrompe.", "andate": {"1": {"rep2": "Destra sola, CIECO shift–touch–play. Lo sguardo va sul tasto d'arrivo prima che la mano parta.", "rep3": "ROT sul tremolo, polso sinistro basso per lasciar passare la destra. Poi insieme: la destra arriva in anticipo e aspetta sul tasto."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Lo sf parte dal tasto, non dall'aria; otto semicrome di tremolo per minima, senza buchi.", "note": "Per gli sf puoi provare il 3 sostenuto dal pollice appoggiato dietro (opzione di Fable; la Henle indica 2 e 3)."}, {"id": "op111-50-54", "brano": "op111", "battute": "50-54", "titolo": "Secondo tema, fioritura di 12 + 6 note, quintine", "priorita": 7, "famiglia": "fam-secondo-tema", "nodo_motorio": "Gruppi irregolari uguali e leggeri; passaggi del pollice nella fioritura.", "andate": {"1": {"rep2": "ACC: le 12 note raggruppate 4×3, poi 3×4; le quintine 2+3, poi 3+2.", "rep3": "STAC pp, poi legato; la seconda volta CIECO."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Le 12 note non durano più delle 6 che seguono; nessun accento sul pollice.", "note": "Bülow (Cotta nota b p. 121): a b. 52 le dodici note del terzo quarto non devono prendere più tempo delle sei del quarto."}, {"id": "op111-116-121", "brano": "op111", "battute": "116-121", "titolo": "Secondo tema in ripresa, fioritura di 12 + 9 note, quintine con accordi", "priorita": 7, "famiglia": "fam-secondo-tema", "nodo_motorio": "Come 50-54, con il gruppo di nove in più.", "andate": {"1": {"rep2": "ACC: le 12 note 4×3, poi 3×4; le 9 note 5+4, poi 3×3.", "rep3": "STAC pp, poi legato; la seconda volta CIECO."}, "2": {"rep2": "Come in andata 1.", "rep3": "Come in andata 1."}}, "rep4_verifica": "Gruppi uguali; a b. 119 la voce inferiore resta tenuta sotto le quintine.", "note": "Bülow (Cotta nota d p. 125): le nove note di b. 118 si dividono in 5 (2+3) più 4."}, {"id": "op111-56-57", "brano": "op111", "battute": "56-57", "titolo": "Coppie legate in discesa, ff, a due mani", "priorita": 4, "famiglia": "fam-coppie-legate", "nodo_motorio": "Ogni coppia è una posizione; tra una coppia e l'altra c'è un salto; la seconda nota tende a sparire.", "andate": {"1": {"rep2": "BLOC: ogni coppia come bicordo, mani unite, in crome; la seconda volta CIECO.", "rep3": "RIT con fermata sulla 1ª nota della coppia: 2ª nota e salto di scatto."}, "2": {"rep2": "BLOC, come in andata 1.", "rep3": "RIT con fermata sulla 2ª nota della coppia."}}, "rep4_verifica": "Seconda nota di ogni coppia udibile; mani insieme sulla prima; un gesto caduta–risalita del polso per coppia."}, {"id": "op111-132-133", "brano": "op111", "battute": "132-133", "titolo": "Coppie legate in discesa, ff, a due mani", "priorita": 4, "famiglia": "fam-coppie-legate", "nodo_motorio": "Ogni coppia è una posizione; tra una coppia e l'altra c'è un salto; la seconda nota tende a sparire.", "andate": {"1": {"rep2": "BLOC: ogni coppia come bicordo, mani unite, in crome; la seconda volta CIECO.", "rep3": "RIT con fermata sulla 1ª nota della coppia: 2ª nota e salto di scatto."}, "2": {"rep2": "BLOC, come in andata 1.", "rep3": "RIT con fermata sulla 2ª nota della coppia."}}, "rep4_verifica": "Seconda nota di ogni coppia udibile; mani insieme sulla prima."}, {"id": "op111-57", "brano": "op111", "battute": "57", "titolo": "Scala/semicrome all'unisono verso il battere", "priorita": 1, "famiglia": "fam-scale-unisono", "nodo_motorio": "Scala non legato all'unisono: i passaggi del pollice delle due mani non coincidono.", "andate": {"1": {"rep2": "NODO.", "rep3": "CHUNK a ritroso fino al battere di b. 58."}, "2": {"rep2": "NODO, come in andata 1.", "rep3": "CHUNK a ritroso sfalsati di una nota, fino al battere di b. 58."}}, "rep4_verifica": "Crescendo senza accelerare; arrivo ff a tempo."}, {"id": "op111-134", "brano": "op111", "battute": "134", "titolo": "Scala/semicrome all'unisono verso il battere", "priorita": 1, "famiglia": "fam-scale-unisono", "nodo_motorio": "Scala non legato all'unisono: i passaggi del pollice delle due mani non coincidono.", "andate": {"1": {"rep2": "NODO.", "rep3": "CHUNK a ritroso fino al battere di b. 135."}, "2": {"rep2": "NODO, come in andata 1.", "rep3": "CHUNK a ritroso sfalsati di una nota, fino al battere di b. 135."}}, "rep4_verifica": "Arrivo ff a tempo."}, {"id": "op111-91", "brano": "op111", "battute": "91", "titolo": "Scala/semicrome all'unisono verso il battere", "priorita": 1, "famiglia": "fam-scale-unisono", "nodo_motorio": "Semicrome parallele verso la ripresa: aggancio a tempo del ff di b. 92.", "andate": {"1": {"rep2": "NODO.", "rep3": "CHUNK a ritroso fino al battere di b. 92."}, "2": {"rep2": "NODO, come in andata 1.", "rep3": "CHU async function newGo() {
  const B = D.bozza, cfg = B.cfg;
  if (cfg.tipo === 'libera') {
    const brani = B.brani_liberi.filter(id => C.B.has(id));
    if (!brani.length) { toast('Scegli almeno un brano'); return; }
    if (await closeOpenFirst()) startFree(brani);
    return;
  }
  if (cfg.modo === 'scritti') { B.circuiti = []; save(); go('#select'); return; }
  const prev = (B.circuiti_lib[0] && B.circuiti_lib[0].slot) || [], first = (C.braniVis[0] || C.brani[0] || {}).id;
  B.circuiti_lib = [{ andate: cfg.andate, slot: Array.from({ length: cfg.slot }, (_, i) => prev[i] && C.B.has(prev[i].brano) ? { brano: prev[i].brano, battute: prev[i].battute || '' } : { brano: first, battute: '' }) }];
  save(); go('#composelib');
}
const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };

/* Riprende la composizione di una sessione passata. La libera parte subito; i circuiti passano
   dalla schermata di composizione, così si possono ritoccare prima di iniziare. */
async function repeatSession(ses) {
  if (!canRepeat(ses)) { toast('Questa sessione non si può ripetere'); return; }
  const B = D.bozza;
  if (ses.tipo === 'libera') {
    const brani = (ses.brani || []).filter(id => C.B.has(id));
    if (await closeOpenFirst()) startFree(brani);
    return;
  }
  B.cfg.tipo = 'circuito'; B.cfg.modo = ses.modo === 'libero' ? 'libero' : 'scritti';
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  if (ses.modo === 'libero') {
    B.circuiti_lib = ses.circuiti.map(c => ({ andate: clamp(c.andate_previste || 3, 3, 5), slot: c.slot.filter(x => C.B.has(x.brano)).map(x => ({ brano: x.brano, battute: x.battute || '' })) })).filter(c => c.slot.length);
    B.cfg.slot = clamp(B.circuiti_lib[0].slot.length, 2, 5); B.cfg.andate = B.circuiti_lib[0].andate;
    save(); go('#composelib'); return;
  }
  B.circuiti = ses.circuiti.map(c => ({ andate: clamp(c.andate_previste || 3, 3, 5), slot: c.slot.map(x => x.frammento).filter(id => fr(id)) })).filter(c => c.slot.length);
  B.selezionati = [...new Set(B.circuiti.flatMap(c => c.slot))];
  B.cfg.slot = clamp(B.circuiti[0].slot.length, 2, 5); B.cfg.andate = B.circuiti[0].andate;
  save(); go('#compose');
}

function startFree(brani) {

  D.sessione_aperta = { tipo: 'libera', id: 's' + now.toString(36), data: todayStr(), inizio: new Date(now).toISOString(), brani: [...brani], corrente: brani[0],
    circuiti: [], cur: newCur(), log: [], timer: { sess: 0, slot: 0, since: now, seen: now } };
  save(); navDepth = 0; replaceTo('#run');
}
function freeSeg(S) { // chiude il tratto corrente sul brano attivo
  fold(S.timer);
  const sec = Math.round(S.timer.slot);
  if (sec >= 1 || S.cur.note) S.log.push({ circuito: null, andata: null, etichetta: null, frammento: null, brano: S.corrente, secondi: sec, rep_completate: null, rep1_pulita: null, diagnosi: '', tempo_rep4: null, arresto: false, drop_out: false, note: S.cur.note });
  S.timer.slot = 0; S.cur = newCur();
}
function freeSwitch(id) {
  const S = D.sessione_aperta; if (!S || S.tipo !== 'libera') return;
  if (S.corrente === id) { closeSheet(); return; }
  freeSeg(S); S.corrente = id; if (!S.brani.includes(id)) S.brani.push(id);
  if (!S.timer.since) S.timer.since = Date.now();
  save(); render(); toast('Ora: ' + branoNome(id));
}

function prioritaHtml(list, sel) {
  let h = '';
  const prios = [...C.priorita];
  const extra = [...new Set(list.map(f => f.priorita))].filter(n => !prios.some(p => p.n === n));
  extra.forEach(n => prios.push({ n, nome: 'Priorità ' + n, perche: '' }));
  prios.forEach(p => {
    const frs = list.filter(f => f.priorita === p.n); if (!frs.length) return;
    const groups = []; const seen = new Map();
    frs.forEach(f => {
      if (f.famiglia) { if (!seen.has(f.famiglia)) { const g = { fam: f.famiglia, items: [] }; seen.set(f.famiglia, g); groups.push(g); } seen.get(f.famiglia).items.push(f); }
      else groups.push({ fam: null, items: [f] });
    });
    h += `<div class="prio"><h3><span class="pn">${p.n}</span><span>${esc(p.nome)}</span></h3>${p.perche ? `<p class="why">${esc(p.perche)}</p>` : ''}`;
    groups.forEach(g => {
      if (g.fam) h += `<div class="fam"><div class="famh">${esc((C.FAM.get(g.fam) || {}).nome || g.fam)}</div>${g.items.map(f => fragRow(f, sel)).join('')}</div>`;
      else h += fragRow(g.items[0], sel);
    });
    h += '</div>';
  });
  return h;
}

/* ================= SESSIONE ================= */
const newCur = () => ({ rep1_pulita: null, diagnosi: '', tempo_rep4: null, arresto: false, drop_out: false, note: '' });
function startSession(modo) {
  modo = modo === 'libero' ? 'libero' : 'scritti';
  const circ = modo === 'libero'
    ? D.bozza.circuiti_lib.filter(c => c.slot.length).map((c, i) => ({ n: i + 1, andate_previste: c.andate, slot: c.slot.map((s, j) => ({ etichetta: slotLab(j, i), frammento: null, brano: s.brano, battute: (s.battute || '').trim() })) }))
    : D.bozza.circuiti.filter(c => c.slot.length).map((c, i) => ({ n: i + 1, andate_previste: c.andate, slot: c.slot.map((fid, j) => ({ etichetta: slotLab(j, i), frammento: fid })) }));
  if (!circ.length) { toast('Aggiungi almeno uno slot'); return; }
  const now = Date.now(); navDepth = 0;
  D.sessione_aperta = { tipo: 'circuito', modo, id: 's' + now.toString(36), data: todayStr(), inizio: new Date(now).toISOString(), circuiti: circ,
    pos: { c: 0, a: 1, s: 0, r: 1 }, cur: newCur(), dropout: {}, log: [],
    timer: { sess: 0, slot: 0, since: now, seen: now } };
  save(); replaceTo('#run');
}
function fold(T) { if (T.since) { const n = Date.now(), d = (n - T.since) / 1000; T.slot += d; T.sess += d; T.since = n; } }
const tRun = T => T.since ? (Date.now() - T.since) / 1000 : 0;
const slotKey = sl => sl.frammento || ('L|' + sl.brano + '|' + (sl.battute || ''));
function isDropped(S, c, a, sl) { const m = S.dropout[c + '|' + slotKey(sl)]; return m != null && a > m; }
function advance(S, p) {
  const CC = S.circuiti; let c = p.c, a = p.a, s = p.s + 1;
  for (let g = 0; g < 100000; g++) {
    if (c >= CC.length) return null;
    const ci = CC[c];
    if (s >= ci.slot.length) { s = 0; a++; }
    if (a > ci.andate_previste) { c++; a = 1; s = 0; continue; }
    if (!isDropped(S, c, a, ci.slot[s])) return { c, a, s, r: 1 };
    s++;
  }
  return null;
}
function retreat(S, p) {
  const CC = S.circuiti; let c = p.c, a = p.a, s = p.s - 1;
  for (let g = 0; g < 100000; g++) {
    if (s < 0) {
      a--;
      if (a < 1) { c--; if (c < 0) return null; a = CC[c].andate_previste; }
      s = CC[c].slot.length - 1;

    s--;

}
/* A che punto è la sessione: slot già passati e slot totali (esclusi quelli in drop-out). */
function progress(S) {
  let p = { c: 0, a: 1, s: -1 }, i = 0, cur = 0, n;
  while ((n = advance(S, p)) && i < 5000) { if (n.c === S.pos.c && n.a === S.pos.a && n.s === S.pos.s) cur = i; i++; p = n; }
  return { done: cur, tot: Math.max(1, i) };
}
/* Che cosa viene dopo lo slot corrente: lo dice il pulsante «Fatto». */
function nextInfo(S) {
  const n = advance(S, S.pos); if (!n) return 'poi: fine della sessione';
  const circ = S.circuiti[n.c], sl = circ.slot[n.s];
  const what = sl.frammento ? 'bb. ' + frLabel(sl.frammento) : branoCorto(sl.brano) + (sl.battute ? ' bb. ' + sl.battute : '');
  const pre = n.c !== S.pos.c ? `Circuito ${circ.n} · ` : n.a !== S.pos.a ? `Andata ${n.a} · ` : '';
  return `poi: ${pre}${sl.etichetta} · ${what}`;
}
function finalizeSlot(S, rc) {
  fold(S.timer);
  const circ = S.circuiti[S.pos.c], sl = circ.slot[S.pos.s], f = fr(sl.frammento);
  const e = { circuito: circ.n, andata: S.pos.a, etichetta: sl.etichetta, frammento: sl.frammento || null, brano: f ? f.brano : (sl.brano || null),
    secondi: Math.round(S.timer.slot), rep_completate: rc, rep1_pulita: S.cur.rep1_pulita, diagnosi: S.cur.diagnosi,
    tempo_rep4: S.cur.tempo_rep4, arresto: S.cur.arresto, drop_out: S.cur.drop_out, note: S.cur.note };
  if (S.modo === 'libero') { e.battute = sl.battute || ''; e.rep_completate = null; }
  if ((rc != null && rc > 0) || e.secondi >= (S.modo === 'libero' ? 1 : 5)) S.log.push(e);

}
function moveNext(S) {
  const prev = S.pos, n = advance(S, prev);
  if (!n) { S.pos.r = 1; S.timer.slot = 0; closeSession(); return; }
  if (n.c !== prev.c) toast(`Circuito ${S.circuiti[n.c].n} · Andata 1`);
  else if (n.a !== prev.a) toast(`Andata ${n.a} di ${S.circuiti[n.c].andate_previste}`);
  S.pos = n; save(); render();
}
function closeSession(silent) {
  const S = D.sessione_aperta; if (!S) return;
  fold(S.timer);
  if (S.tipo === 'libera') freeSeg(S);
  else if (S.pos.r > 1 || S.timer.slot >= 5) finalizeSlot(S, S.modo === 'libero' ? null : S.pos.r - 1);
  const ses = { id: S.id, tipo: S.tipo || 'circuito', modo: S.modo || null, data: S.data, inizio: S.inizio, fine: new Date().toISOString(), secondi_cronometro: Math.round(S.timer.sess), circuiti: S.circuiti || [], brani: S.brani || undefined, log: S.log };
  D.sessioni.push(ses); D.sessione_aperta = null; save();
  if (!silent) { navDepth = 0; replaceTo('#summary/' + ses.id); }
}
function resumeIfPaused(S) { if (!S.timer.since) { S.timer.since = Date.now(); toast('Cronometro ripreso'); } }

/* ---- schermo acceso ---- */
let wake = null;
const AND = window.AndroidApp || null;
async function requestWake() { if (AND) { try { AND.keepScreenOn(true); } catch (e) { } return; } try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
function releaseWake() { if (AND) { try { AND.keepScreenOn(false); } catch (e) { } return; } try { if (wake) wake.release(); } catch (e) { } wake = null; }

/* ---- cronometro dimenticato acceso ---- */
/* Se l'app resta chiusa o in secondo piano a lungo con il cronometro in funzione, al ritorno chiede
   se quel tempo va contato. Non decide mai da sola. */
const STALE_MS = 15 * 60 * 1000;
function checkStale(from) {
  const S = D.sessione_aperta; if (!S || !S.timer.since || !from) return;
  const gap = Date.now() - Math.max(from, S.timer.since); if (gap < STALE_MS) return;
  const sec = Math.round(gap / 1000), T = S.timer;
  ask({ title: 'Il cronometro è rimasto acceso', text: `L'app è stata chiusa o in secondo piano per ${fmtMinRound(sec)} con il cronometro in funzione. Stavi studiando?`,
    ok: 'Sì, conta tutto il tempo', alt: `No, togli ${fmtMinRound(sec)}`, cancel: 'Decido dopo (per ora resta contato)' }).then(r => {
    if (r !== 'alt' || D.sessione_aperta !== S) return;
    fold(T); T.slot = Math.max(0, T.slot - sec); T.sess = Math.max(0, T.sess - sec); save(); render(); toast(`Tolti ${fmtMinRound(sec)}`);
  });
}
document.addEventListener('visibilitychange', () => {
  const S = D.sessione_aperta;
  if (document.visibilityState === 'hidden') { if (S) S.timer.hid = Date.now(); save(); return; }
  if (!S) return;
  if (location.hash === '#run' && S.timer.since) requestWake();
  const from = S.timer.hid; delete S.timer.hid;
  checkStale(from);
});

/* ---- tempo target: traduce le percentuali delle regole in battiti al minuto ---- */
function pctRange(key) { const m = String((CATALOGO.regole_slot || {})[key] || '').match(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*%/); return m ? [Number(m[1]), Number(m[2])] : null; }
const REP_PCT = { 1: pctRange('rep1'), 2: pctRange('rep2_3'), 3: pctRange('rep2_3'), 4: pctRange('rep4') };

function repBack() {

  if (S.pos.r > 1) { S.pos.r--; save(); render(); return; }
  const p = retreat(S, S.pos); if (!p) return;
  fold(S.timer);
  const circ = S.circuiti[p.c], sl = circ.slot[p.s], last = S.log[S.log.length - 1];
  const cur = S.timer.slot;
  if (last && last.circuito === circ.n && last.andata === p.a && last.etichetta === sl.etichetta) {
    S.log.pop();
    S.cur = { rep1_pulita: last.rep1_pulita, diagnosi: last.diagnosi || '', tempo_rep4: last.tempo_rep4, arresto: !!last.arresto, drop_out: !!last.drop_out, note: last.note || '' };

}

const logKey = l => l.frammento || ('L|' + (l.brano || '') + '|' + (l.battute || '') + '|' + (l.manuale ? 'mano' : l.circuito == null ? 'libera' : 'circ'));

function chartSvg(points, target) {
  if (!points.length) return '';
  const W = 340, H = 150, L = 34, R = 10, T = 12, Bm = 24;
  const xs = points.map(p => dparse(p.d).getTime()), ys = points.map(p => p.v);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...ys, target || Infinity), y1 = Math.max(...ys, target || -Infinity); if (y0 === y1) { y0 -= 4; y1 += 4; } const py = (y1 - y0) * .1; y0 -= py; y1 += py;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - Bm);
  const pts = points.map((p, i) => `${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const hi = Math.max(...ys), lo = Math.min(...ys);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del tempo di Rep 4">
    <line class="ax" x1="${L}" y1="${H - Bm}" x2="${W - R}" y2="${H - Bm}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H - Bm}"/>
    ${target ? `<line class="tg" x1="${L}" y1="${Y(target).toFixed(1)}" x2="${W - R}" y2="${Y(target).toFixed(1)}"/><text class="tglab" x="${W - R}" y="${(Y(target) - 4).toFixed(1)}" text-anchor="end">target ${target}</text>` : ''}
    <text x="${L - 4}" y="${Y(hi) + 4}" text-anchor="end">${hi}</text>${lo !== hi ? `<text x="${L - 4}" y="${Y(lo) + 4}" text-anchor="end">${lo}</text>` : ''}
    <text x="${L}" y="${H - 6}">${esc(fmtDayMonth(points[0].d))}</text>
    ${points.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtDayMonth(points[points.length - 1].d))}</text>` : ''}
    ${points.length > 1 ? `<polyline class="ln" points="${pts}"/>` : ''}${points.map((p, i) => `<circle class="pt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5"/>`).join('')}</svg>`;
}
function twoWeekCheck(points) {
  // points: ultimo valore per giorno, in ordine. Serve un arco di almeno 14 giorni.
  if (points.length < 2) return false;
  const last = points[points.length - 1], lastT = dparse(last.d).getTime();
  if (lastT - dparse(points[0].d).getTime() < 14 * 864e5) return false;
  let ref = null; points.forEach(p => { if (dparse(p.d).getTime() <= lastT - 14 * 864e5) ref = p; });
  return ref != null && last.v <= ref.v;
}

  $('#impdata').addEventListener('change', e => readJsonFile(e.target, importData));

function branoSheet(id) {
  const b = C.B.get(id); if (!b) return;
  const mine = C.braniUtente.has(id), hid = C.hidden.has(id), u = branoUso(id);
  openSheet(`<h2>${esc(b.nome)}</h2>
    <p class="small muted" style="margin-top:-6px">${u.fr} ${u.fr === 1 ? 'frammento' : 'frammenti'} in catalogo · ${fmtMinRound(u.sec)} registrati${mine ? '' : ' · brano del catalogo'}</p>
    ${mine ? `<div class="field"><label for="brn">Nome</label><input type="text" id="brn" value="${esc(b.nome)}"></div><button class="btn primary" id="brsave">Salva il nome</button>` : ''}
    <button class="btn" id="brhide">${hid ? 'Mostra di nuovo negli elenchi' : 'Nascondi dagli elenchi'}</button>
    <p class="small muted">${hid ? 'Ora non compare quando scegli brani e passaggi.' : 'Un brano nascosto non compare quando scegli brani e passaggi; minuti e storico restano.'}</p>
    ${mine && !u.n && !u.fr ? '<button class="btn danger" id="brdel">Elimina il brano</button>' : ''}
    <button class="btn" data-act="closesheet">Chiudi</button>`, sh => {
    if (mine) $('#brsave', sh).addEventListener('click', () => {
      const nome = $('#brn', sh).value.trim(); if (!nome) { toast('Il nome non può essere vuoto'); return; }
      const x = D.brani_utente.find(y => y.id === id); if (x) x.nome = nome; save(); buildCat(); render(); toast('Nome salvato');
    });
    $('#brhide', sh).addEventListener('click', () => {
      D.brani_nascosti = hid ? D.brani_nascosti.filter(x => x !== id) : [...D.brani_nascosti, id];
      save(); buildCat(); render(); toast(hid ? 'Brano di nuovo visibile' : 'Brano nascosto');
    });
    const del = $('#brdel', sh); if (del) del.addEventListener('click', () => {
      D.brani_utente = D.brani_utente.filter(x => x.id !== id); D.brani_nascosti = D.brani_nascosti.filter(x => x !== id);

}
function applyPrefs() {
  document.documentElement.dataset.theme = D.impostazioni.tema === 'chiaro' ? 'chiaro' : 'scuro';
  document.documentElement.dataset.testo = D.impostazioni.testo || 'normale';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = D.impostazioni.tema === 'chiaro' ? '#f6f4ef' : '#0f1216';
}
function readJsonFile(input, cb) {
  const file = input.files && input.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { cb(JSON.parse(rd.result)); } catch (e) { toast('File non valido: non è un JSON leggibile'); } input.value = ''; };
  rd.onerror = () => { toast('Non riesco a leggere il file'); input.value = ''; };
  rd.readAsText(file);
}
async function exportData() {
  const name = `circuiti-backup-${todayStr()}.json`;
  if (window.AndroidApp) {
    window.onAndroidSave = ok => { if (ok) { D.impostazioni.ultimo_export = new Date().toISOString(); save(); render(); } };
    window.AndroidApp.saveFile(name, JSON.stringify(D, null, 2)); return;
  }
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  let done = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); done = true; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!done) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  D.impostazioni.ultimo_export = new Date().toISOString(); save(); toast('Backup salvato'); render();
}
function replaceAll(obj, msg) {
  try { localStorage.setItem(KEY_PREIMP, JSON.stringify(D)); } catch (e) { }
  D = normalize(obj); D.impostazioni.visto_versione = APP_VERSION;
  save(); buildCat(); applyPrefs(); navDepth = 0; toast(msg); replaceTo('#home');
}
async function importData(obj) {
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.sessioni)) { toast('Non è un backup di questa app'); return; }
  const r = await ask({ title: 'Ripristinare da questo backup?', text: `Nel file ci sono ${obj.sessioni.length} sessioni; ora nell'app ce ne sono ${D.sessioni.length}. I dati attuali vengono sostituiti da quelli del file. Ne tengo una copia: potrai annullare da Impostazioni.`, ok: 'Sostituisci con il backup' });
  if (r) replaceAll(obj, 'Dati ripristinati dal backup');
}
async function undoImport() {
  let prev = null; try { prev = JSON.parse(stored(KEY_PREIMP)); } catch (e) { }
  if (!prev || !Array.isArray(prev.sessioni)) { toast('Nessuna copia da ripristinare'); return; }
  const r = await ask({ title: 'Annullare l\'ultimo ripristino?', text: `Tornano i dati di prima (${prev.sessioni.length} sessioni) al posto di quelli attuali (${D.sessioni.length} sessioni).`, ok: 'Sì, torna ai dati di prima' });
  if (!r) return;
  const cur = JSON.stringify(D);
  D = normalize(prev); D.impostazioni.visto_versione = APP_VERSION; save(); buildCat(); applyPrefs();
  try { localStorage.setItem(KEY_PREIMP, cur); } catch (e) { }
  toast('Fatto: dati di prima ripristinati'); render();
}
async function restorePre2() {
  let prev = null; try { prev = JSON.parse(stored(KEY_PRE2)); } catch (e) { }
  if (!prev || !Array.isArray(prev.sessioni)) { toast('Nessuna copia disponibile'); return; }
  const r = await ask({ title: 'Tornare ai dati di prima della 2.0?', text: `La copia fatta al primo avvio della 2.0 contiene ${prev.sessioni.length} sessioni; ora ce ne sono ${D.sessioni.length}. Tutto ciò che hai registrato dopo l'aggiornamento viene sostituito (potrai annullare con «Annulla l'ultimo ripristino»).`, ok: 'Sostituisci con la copia', danger: true });
  if (r) replaceAll(prev, 'Ripristinati i dati di prima dell\'aggiornamento');
}
function importCatalog(obj) {
  if (!obj || !Array.isArray(obj.frammenti)) { toast('Il file non contiene «frammenti»'); return; }
  const imp = D.catalogo_importato; let nuovi = 0, agg = 0;
  const known = new Set(C.frammenti.map(f => f.id));
  const up = (arr, items, key) => (items || []).forEach(x => { if (!x || x[key] == null) return; const i = arr.findIndex(y => y[key] === x[key]); if (i >= 0) arr[i] = x; else arr.push(x); });
  obj.frammenti.forEach(f => { if (f && f.id != null) known.has(f.id) ? agg++ : nuovi++; });
  up(imp.brani, obj.brani, 'id'); up(imp.frammenti, obj.frammenti, 'id'); up(imp.famiglie, obj.famiglie, 'id'); up(imp.sigle, obj.sigle, 'sigla');
  save(); buildCat(); toast(`Catalogo importato: ${nuovi} nuovi, ${agg} aggiornati`); render();
}
function resetSheet() {
  openSheet(`<h2>Azzerare tutti i dati?</h2>
    <p class="asktext">Vengono cancellati sessioni, frammenti e brani aggiunti, tempi target e impostazioni. Non si può annullare. Prima salva un backup, se non l'hai fatto.</p>

    <button class="btn dangerfill xl" id="rzok">Azzera tutto</button><button class="btn" data-act="closesheet">Annulla</button>`, sh => {
    $('#rzok', sh).addEventListener('click', () => {

    });
  });
}

  openSheet(`<h2>Novità della versione 2.0</h2>
    <p class="small muted" style="margin-top:-6px">Tutti i dati della versione precedente sono stati mantenuti. Nessuna opzione è stata tolta.</p>
    <ul class="news">
      <li><b>Barra in basso</b> con Oggi, Storico, Sigle e regole, Impostazioni. «Per frammento» ora è una scheda dello Storico.</li>

/* ================= AZIONI ================= */
const ACT = {
  go: el => go(el.dataset.h),
  back: el => goBack(el.dataset.h || '#home'),
  tab: el => { navDepth = 0; replaceTo(el.dataset.h); },
  closesheet: () => closeSheet(),
  closepanel: () => closePanel(),
  install: async () => { if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { } installEvt = null; render(); } },
  nuova: () => go('#new'),
  repeat: el => { const s = D.sessioni.find(x => x.id === el.dataset.id); if (s) repeatSession(s); },
  manual: el => manualSheet({ date: el.dataset.date }),
  newbrano: el => {
    const then = el.dataset.then;
    newBranoSheet(id => {
      if (then === 'libera') { D.bozza.brani_liberi.push(id); save(); render(); }
      else if (then === 'free') freeSwitch(id);
      else render();
      toast('Brano aggiunto');
    });
  },
  brano: el => branoSheet(el.dataset.id),
  preview: el => openPreview(el.dataset.id),
  presel: el => { const id = el.dataset.id; toggleSel(id, !D.bozza.selezionati.includes(id)); openPreview(id); },
  deselall: async () => {
    if (!D.bozza.selezionati.length) return;
    if (await ask({ title: 'Togliere tutte le spunte?', text: `Hai ${D.bozza.selezionati.length} passaggi scelti.`, ok: 'Togli tutte le spunte' })) { D.bozza.selezionati = []; D.bozza.circuiti = []; save(); render(); }
  },
  delfrag: async el => {
    const id = el.dataset.id, f = fr(id);
    if (!(await ask({ title: 'Eliminare questo frammento?', text: `${f ? 'bb. ' + f.battute + ' · ' + f.titolo + '. ' : ''}Lo storico delle sessioni resta.`, ok: 'Elimina il frammento', danger: true }))) return;
    D.frammenti_utente = D.frammenti_utente.filter(x => x.id !== id); D.bozza.selezionati = D.bozza.selezionati.filter(x => x !== id);
    save(); buildCat(); render();
  },
  savefrag: el => saveFrag(el.dataset.brano, el.dataset.id || null),
  andate: el => { D.bozza.circuiti[+el.dataset.ci].andate = +el.dataset.n; save(); render(); },
  mv: el => { const c = D.bozza.circuiti[+el.dataset.ci].slot, i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= c.length) return; [c[i], c[j]] = [c[j], c[i]]; save(); render(); },
  slotmenu: el => slotMenu(+el.dataset.ci, +el.dataset.i),
  moveto: el => {
    const B = D.bozza, ci = +el.dataset.ci, i = +el.dataset.i, id = B.circuiti[ci].slot.splice(i, 1)[0];
    if (el.dataset.to === 'new') B.circuiti.push({ andate: B.cfg.andate || 3, slot: [id] }); else B.circuiti[+el.dataset.to].slot.push(id);
    B.circuiti = B.circuiti.filter((c, k) => c.slot.length || k === 0); save(); render();
  },
  rmslot: el => { const B = D.bozza; B.circuiti[+el.dataset.ci].slot.splice(+el.dataset.i, 1); B.circuiti = B.circuiti.filter((c, k) => c.slot.length || k === 0); save(); render(); },
  place: el => { D.bozza.circuiti[+el.dataset.ci].slot.push(el.dataset.id); save(); render(); },
  addcirc: () => { D.bozza.circuiti.push({ andate: D.bozza.cfg.andate || 3, slot: [] }); save(); render(); },
  cfg: el => { const k = el.dataset.k, v = el.dataset.v; D.bozza.cfg[k] = /^\d+$/.test(v) ? Number(v) : v; save(); render(); },
  newgo: () => newGo(),
  libandate: el => { D.bozza.circuiti_lib[+el.dataset.ci].andate = +el.dataset.n; save(); render(); },
  librm: el => { const c = D.bozza.circuiti_lib[+el.dataset.ci]; if (c.slot.length <= 1) { toast('Serve almeno uno slot'); return; } c.slot.splice(+el.dataset.i, 1); save(); render(); },
  libadd: el => { const c = D.bozza.circuiti_lib[+el.dataset.ci]; const last = c.slot[c.slot.length - 1]; c.slot.push({ brano: last ? last.brano : (C.braniVis[0] || C.brani[0] || {}).id, battute: '' }); save(); render(); },
  libaddc: () => { const B = D.bozza; B.circuiti_lib.push({ andate: B.cfg.andate, slot: Array.from({ length: B.cfg.slot }, () => ({ brano: (C.braniVis[0] || C.brani[0] || {}).id, battute: '' })) }); save(); render(); },
  libdelc: async el => {

  fswitch: el => freeSwitch(el.dataset.id),

  runmenu: () => runMenu(),

  target: el => targetSheet(el.dataset.id),

  news: () => newsSheet(),
  reset: () => resetSheet()
};
document.addEventListener('click', e => {

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { })); }
const bootFrom = D.sessione_aperta ? (D.sessione_aperta.timer.hid || D.sessione_aperta.timer.seen || 0) : 0;

if (D.impostazioni.visto_versione !== APP_VERSION) {
  D.impostazioni.visto_versione = APP_VERSION; save();
  if (arrivaDaV1) setTimeout(newsSheet, 350); // solo per chi arriva dalla versione 1
